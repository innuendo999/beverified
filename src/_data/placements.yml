# Sponsored slots. The advertising policy (site.json v3.adPolicy) is published on /methodology/,
# /placement-options/ and /terms/ in the same words.
#
# Review pages (owner, 2026-11-10): one sponsor card on the first screen and again after Alternatives.
#   - surface: review
#     slug: 21analytics          # sponsor: published review, ranked in `category`
#     category: travel-rule      # shows on every review of a provider ranked in this list...
#     pages: [notabene]          # ...or only on these reviews (optional, competitor targeting)
#     start: 2026-11-10
#     end: 2026-12-31
#   Never on the sponsor's own review. Rules: reviewPlacementIssues in src/_lib/placements.js.
#
# Homepage first screen (owner, 2026-11-16): one sponsor row in the first-screen card.
#   - surface: hero
#     slug: persona              # published review, ranked in home.yml hero.ranking, not in the rows the card shows
#     start: 2026-12-01
#     end: 2026-12-31
#   Rules: heroPlacementIssues in src/_lib/placements.js.
#
# Provider finder, bottom right (owner, 2026-11-23): one sponsor row per ranking, under the reader's matches.
#   - surface: finder
#     category: kyc              # rankings.yml key the finder shows
#     slug: kycaid               # published review with a score and link.url, ranked in `category`, outside its top 3
#     start: 2026-12-01
#     end: 2026-12-31
#   Shown only when it passes the reader's answers (country ranking, public price, monthly cost) and is not already listed;
#   never on the sponsor's own review. "Visit website" from the record, rel="sponsored". Rules: finderPlacementIssues.
#
# Header menu (owner, 2026-11-24):
#   Rankings preview: add `menu: true` to a surface: ranking entry to show that sponsor under the ranking's top 3 in the
#   header menu too (every page). Off by default: a ranking-page booking never spreads to the menu on its own.
#   Reviews panel, one card after the "Most read" reviews:
#   - surface: menu-reviews
#     slug: persona              # published review with a score and link.url, ranked in `category`, not a "Most read" pick
#     category: kyc              # its rank in this ranking is shown
#     start: 2026-12-01
#     end: 2026-12-31
#   Blog panel, one "Partner content" row under Latest:
#   - surface: menu-blog
#     url: /guide/some-article/  # article whose front matter has sponsored_by: <partner name>; the article page shows the label too
#     start: 2026-12-01
#     end: 2026-12-31
#   One menu-reviews and one menu-blog entry at a time. Rules: menuReviewsPlacementIssues / menuBlogPlacementIssues.
#
# Homepage "Pick by use case" panel:
#
# One entry per slot:
#   - use_case: kyc            # rankings.yml key from home.yml → use_cases
#     slug: persona            # provider with a published review, ranked in that list, not in its top 3
#     start: 2026-12-01        # first day shown (build date)
#     end: 2026-12-31          # last day shown
#
# The slot always carries the "Sponsored" label and shows the provider's real rank and score.
# Rules: src/_lib/placements.js; check: node scripts/checks/placements.mjs (CI).
- surface: review
  slug: 21analytics
  category: travel-rule
  start: 2026-11-10
  end: 2026-12-31   # owner, 2026-11-11: bonus for 21 Analytics, competitor reviews until end of year (end is inclusive)
- surface: ranking
  category: identity-verification
  slug: kycaid
  start: 2026-11-17
  end: 2026-12-31   # owner, 2026-11-17: KYCAID in the slot under the IDV top 3 (end is inclusive)
