# Sponsored slots. The advertising policy (site.json v3.adPolicy) is published on /methodology/,
# /placement-options/ and /terms/ in the same words.
#
# Review pages (owner, 2026-11-10): one sponsor card on the first screen and again after Alternatives.
#   - surface: review
#     slug: 21analytics          # sponsor: published review, ranked in `category`
#     category: travel-rule      # shows on every review of a provider ranked in this list...
#     pages: [notabene]          # ...or only on these reviews (optional, competitor targeting)
#     start: 2026-11-10
#     end: 2026-12-31
#   Never on the sponsor's own review. Rules: reviewPlacementIssues in src/_lib/placements.js.
#
# Homepage "Pick by use case" panel:
#
# One entry per slot:
#   - use_case: kyc            # rankings.yml key from home.yml → use_cases
#     slug: persona            # provider with a published review, ranked in that list, not in its top 3
#     start: 2026-12-01        # first day shown (build date)
#     end: 2026-12-31          # last day shown
#
# The slot always carries the "Sponsored" label and shows the provider's real rank and score.
# Rules: src/_lib/placements.js; check: node scripts/checks/placements.mjs (CI).
- surface: review
  slug: 21analytics
  category: travel-rule
  start: 2026-11-10
  end: 2026-12-31   # owner, 2026-11-11: bonus for 21 Analytics, competitor reviews until end of year (end is inclusive)
