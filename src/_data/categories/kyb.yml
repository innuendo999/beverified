explainer_html:
- '<section class="container-narrow section-border-top" id="methodology-deep-dive" style="padding:28px 0;">

  <h2 style="font-size:19px;margin-bottom:10px;">What KYB verifies</h2>

  <p style="font-size:15px;line-height:1.7;margin-bottom:18px;">Know Your Business confirms the legal entity behind an account: its registration, its ownership structure, and the people who ultimately control it. Where eKYC checks an individual against a document, KYB checks a company against a registry, then keeps peeling back ownership layers until it reaches a real person: the Ultimate Beneficial Owner (UBO). FATF Recommendations 24 and 25 set the global baseline for that beneficial-ownership disclosure.</p>

  <h3 style="font-size:14.5px;margin-bottom:10px;">Core capabilities compliance teams typically require</h3>

  <ul style="margin:0 0 18px;padding-left:20px;font-size:14.5px;line-height:1.75;">

  <li style="list-style:disc;">Live pulls from official company registries (Companies House, Sirene, and equivalents), not cached snapshots</li>

  <li style="list-style:disc;">UBO mapping through layered ownership structures (the "onion peeling" problem)</li>

  <li style="list-style:disc;">Level 1 automation (document checks) vs. Level 2 straight-through processing (STP) that resolves UBOs without a human touch</li>

  <li style="list-style:disc;">Ongoing registry monitoring for changes in directors or ownership</li>

  </ul>

  <h3 style="font-size:14.5px;margin-bottom:8px;">Where the top providers differ</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;"><strong>Veriff</strong> ties the onboarding user biometrically to a company''s listed directors in real time. <strong>KYCAID</strong> pairs automation with a Compliance-as-a-Service team for jurisdictions too messy for pure AI. <strong>Trulioo</strong> covers the broadest set of global business registries in one API.</p>

  <h3 style="font-size:14.5px;margin-bottom:8px;">How this differs from AML and eKYC</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">KYB verifies the business at onboarding; <a href="/providers/aml/">AML software</a> screens that business''s ongoing transactions. <a href="/providers/e-kyc/">eKYC</a> verifies the individual signing up; KYB verifies the entity they''re signing up on behalf of. Most banks run all three, often from different vendors.</p>

  <h3 style="font-size:14.5px;margin-bottom:8px;">Regulatory context</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">Key frameworks: FATF Recommendations 24/25 on beneficial ownership, and the corporate registries (Companies House in the UK, Sirene in France, and similar national systems) that KYB providers query directly or through cached feeds.</p>

  <a class="entity-card__cta" href="/methodology/">See how we evaluate every provider on this list in our full methodology →</a>

  </section>'
faq:
- q: What's the difference between KYB and KYC?
  a: KYC verifies an individual person; KYB verifies the legal business behind an account, including its registration status, ownership structure, and Ultimate Beneficial Owners (UBOs).
- q: How long does UBO verification take?
  a: A clean, single-layer ownership structure can resolve in seconds with live registry data. Layered or offshore structures often require manual analyst review that can take hours to days.
- q: What is UBO mapping and why does it matter?
  a: UBO mapping traces ownership through holding companies and trusts to identify the real person who ultimately controls a business, a requirement under FATF Recommendations 24 and 25.
- q: What's the difference between Level 1 and Level 2 KYB automation?
  a: Level 1 automation runs document and registry checks but still routes UBO resolution to a human. Level 2, or straight-through processing (STP), resolves clean ownership structures without a human touch.
- q: Do KYB providers verify company directors in real time?
  a: Some do. A handful of vendors biometrically match the person onboarding a business against that business's listed directors at the moment of signup, rather than relying on a static registry snapshot.
- q: How often should a business's KYB record be refreshed?
  a: Most compliance programs re-check registry and ownership data at least annually, with higher-risk business customers monitored continuously for ownership or director changes.
