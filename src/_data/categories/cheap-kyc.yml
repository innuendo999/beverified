explainer_html:
- '<h2>What a cheap KYC check really costs</h2>

  <p>A KYC check here means document verification, liveness and face match together. The per-check price on a pricing page is only the start. A monthly minimum raises the real price at low volume: Sumsub''s $149 minimum works out at $1.49 a check if you verify 100 users a month. AML rules also expect you to keep screening customers after onboarding, and ongoing monitoring is priced very differently from one vendor to the next. Some vendors bill a retry as a new check; others charge only for successful verifications.</p>

  <p>The calculator above builds each bill from the vendor''s published list prices. Euro prices are converted at the European Central Bank reference rate on the day we checked them. Discounts you negotiate, VAT and failed attempts are not in the figures.</p>'
- '<h2>Not in this ranking, and why</h2>

  <p>We rank a provider here only when it has a public price for a full check and, if it charges a monthly minimum, says the minimum covers checks.</p>

  <ul>

  <li><a href="/providers/veriff/">Veriff</a>: $0.80 a check on Essential, but the pricing page does not say the $49 minimum covers checks.</li>

  <li><a href="/providers/persona/">Persona</a>: no per-check price; Essential starts at $250 a month on a 12-month term.</li>

  <li><a href="/providers/au10tix/">AU10TIX</a>: a $500 monthly minimum, with the per-check price not published.</li>

  <li><a href="/providers/trulioo/">Trulioo</a>: prices are quoted by sales only.</li>

  <li>Ondato and Didit: not reviewed yet. We rank a provider only after a full review.</li>

  </ul>'
- '<h2>What to ask before you sign</h2>

  <ul>

  <li>Do you charge for a retry, a failed check or a user who drops off?</li>

  <li>Is face match part of the check, and which liveness test has an independent lab letter?</li>

  <li>What does ongoing monitoring cost once we have 10,000 customers on file?</li>

  <li>Does the monthly minimum roll over, and is it credited against every kind of check?</li>

  <li>Which price applies above the published volume, and when does a contract start?</li>

  </ul>'
faq:
- q: What is the cheapest KYC provider?
  a: 'Zyphe publishes the lowest price for a full check among the providers we rank: $0.30 for an ID and liveness check, plus $0.10 a month in storage per user, with no monthly minimum. Socure ($0.80) and KYCAID (€0.75, about $0.84) come next. Prices checked Nov 11, 2026.'
- q: Is there a free KYC option?
  a: Shufti Pro has a free plan with up to 10 verifications a month. Zyphe gives a one-time $25 credit and KYCAID a €50 credit on signup, and Sumsub and ComplyCube offer a 14-day trial with 50 checks. Socure lists $1,000 in monthly credits but does not publish who gets them.
- q: Which budget KYC providers include AML screening?
  a: Shufti Pro includes sanctions and PEP screening in its Essentials price. Socure adds it for $0.10 a check, KYCAID for €0.10 and Zyphe for $0.20. Sumsub offers it only on the Compliance plan ($1.85 a check, $299 minimum), and iDenfy does not publish a screening price.
- q: Do cheap KYC providers have an independent liveness test?
  a: 'Two of the seven do: Sumsub and Shufti Pro hold iBeta ISO/IEC 30107-3 Level 3 letters. On Nov 11, 2026 we found no iBeta letter under the names of Zyphe, KYCAID, Socure, ComplyCube or iDenfy. A vendor may use a tested supplier''s SDK, which we count as vendor-stated.'
- q: How does a monthly minimum change the price?
  a: With a minimum that covers checks, you pay the larger of the minimum and your checks. Sumsub's $149 minimum works out at $1.49 a check at 100 checks a month, against $1.35 at 1,000. We leave out providers that do not say the minimum covers checks, such as Veriff.
- q: How do you rank budget KYC providers?
  a: 'By Budget score: cost per check at 100 and 1,000 checks a month (30%), AML screening cost (10%), quality for the money (35%), entry terms (15%) and price transparency (10%). Only providers with a public price for a full check enter. Payment never changes scores or ranking order.'
