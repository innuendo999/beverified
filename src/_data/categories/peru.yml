explainer_html:
- '<section class="container-narrow section-border-top" id="methodology-deep-dive" style="padding:28px 0;">

  <h2 style="font-size:19px;margin-bottom:10px;">What Peru-ready KYC/AML requires</h2>

  <p style="font-size:15px;line-height:1.7;margin-bottom:18px;">Peru''s financial regulator, the SBS (Superintendencia de Banca, Seguros y AFP), sets customer due diligence rules for banks and fintechs, while suspicious-activity reports route through the UIF, the country''s financial intelligence unit. A provider built for this market reads the Peruvian national ID document (DNI), can check the DNI number against government data, and screens against local and international sanctions and PEP lists.</p>

  <h3 style="font-size:14.5px;margin-bottom:10px;">Core capabilities compliance teams typically require</h3>

  <ul style="margin:0 0 18px;padding-left:20px;font-size:14.5px;line-height:1.75;">

  <li style="list-style:disc;">DNI document reading and DNI number checks against government data</li>

  <li style="list-style:disc;">Sanctions/PEP screening covering both domestic and OFAC/UN lists</li>

  </ul>

  <h3 style="font-size:14.5px;margin-bottom:8px;">Regulatory context</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">Key references: SBS due-diligence resolutions, and UIF suspicious-activity reporting requirements.</p>

