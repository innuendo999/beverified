segments:
- segment: Adult content sites
  slug: verifymy
  reason: Offers email-based and facial age estimation plus credit card, mobile and ID checks, holds ISO/IEC 27566-1 certification and states KJM approval in Germany.
- segment: Social media and user-to-user platforms
  slug: persona
  reason: Supports selfie and email age estimation, phone, credit card, ID and digital ID checks, and keeps a reusable verified age so returning users skip the check.
- segment: Online gambling
  slug: sumsub
  reason: Checks age from ID documents with optional face match, adds AML screening on its Compliance plan at $1.85 per verification, and states KJM approval.
- segment: Age-restricted e-commerce (alcohol, tobacco, vapes)
  slug: shufti-pro
  reason: Its Essentials plan, from $1.50 per verification, includes age verification, with selfie estimation that steps up to an ID check and a reusable token for returning buyers.
- segment: Games and app stores
  slug: incode
  reason: Runs facial age estimation on the device, and also checks email and mobile carrier signals that need no camera, plus digital IDs and wallets.
- segment: Dating
  slug: veriff
  reason: Offers selfie age estimation without a document and ID checks with FIDO-certified face matching, and publishes self-serve plans from a $49 monthly minimum.
- segment: Platforms building their own age check
  slug: paravision
  reason: Sells its Age Estimator as an SDK to build into your own flow, certified by the Age Check Certification Scheme at Level 3 (Highly Effective Compliance).
