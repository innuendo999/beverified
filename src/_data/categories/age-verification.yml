explainer_html:
- '<h2>Age verification or age estimation?</h2>
  <p>Age verification confirms a date of birth from a trusted source, usually an ID document, a bank, a mobile operator or a credit file. Age estimation infers an age range from a signal such as a selfie or an email address, without collecting a document. Most platforms now combine the two: a low-friction estimate first, and a document or database check only when the estimate is close to the threshold.</p>
  <p>If you only need to know someone is over 18, estimation is usually enough. If a regulator requires proof of identity as well as age, as in gambling or financial services, you need full <a href="/providers/identity-verification/">identity verification</a> with <a href="/providers/liveness-detection/">liveness detection</a>.</p>
  <p>Facial estimation still has a margin of error. NIST published the <a href="https://www.nist.gov/news-events/news/2024/05/nist-reports-first-results-age-estimation-software-evaluation">first results of its age estimation evaluation</a> on 30 May 2024. The mean absolute error of the tested algorithms on visa photos was 3.1 years, down from 4.3 years in 2014. NIST found no single standout algorithm, and error rates were almost always higher for female faces. That is why vendors set a buffer above the legal age and send borderline users to a second check.</p>'
- '<h2>What regulators accept</h2>
  <p>The rules below were checked on 23 October 2026. They change often, so confirm the current position with your regulator or counsel before you choose a method.</p>
  <h3>United Kingdom</h3>
  <p><a href="https://ofcom.org.uk/online-safety/illegal-and-harmful-content/age-assurance">Ofcom''s age assurance guidance</a> lists the methods it says can be highly effective under the Online Safety Act: open banking, photo-ID matching, facial age estimation, mobile network operator checks, credit card checks, digital identity services and email-based age estimation. It says self-declaration, debit cards or payment methods that do not require the user to be 18, and contractual restrictions are not highly effective.</p>
  <p>Under Ofcom''s timetable, services that publish their own pornographic content have had to use highly effective age assurance since 17 January 2025. User-to-user and search services likely to be accessed by children had to start acting on their children''s risk assessments from 25 July 2025.</p>
  <h3>European Union</h3>
  <p>On 14 July 2025 the European Commission published its <a href="https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:C_202505519">guidelines on protecting minors under Article 28 of the Digital Services Act</a>. They recommend age verification for adult content such as pornography and gambling, and where national law sets a minimum age, and age estimation in other cases. The same day the Commission released an open-source age verification blueprint that lets users prove they are over 18 without sharing other personal data. Denmark, France, Greece, Italy and Spain piloted it. On 29 April 2026 the Commission adopted a recommendation urging member states to make the app available by the end of 2026, either on its own or inside their European Digital Identity Wallet.</p>
  <h3>Germany</h3>
  <p>The KJM, the commission for the protection of minors in the media, assesses age verification concepts for closed adult user groups on request. The youth media protection treaty (JMStV) has no formal approval procedure, and the content provider stays responsible for compliance. The KJM''s German-language <a href="https://www.kjm-online.de/fileadmin/user_upload/KJM/Themen/Technischer_Jugendmedienschutz/AVS-Raster_ueberarbeitet_gueltig_seit_12.05.2022__004_.pdf">criteria for age verification systems</a> have been in force since 12 May 2022. They require an age check before any access and an authentication step at each use. Several providers on this list state KJM approval, so ask for the KJM assessment that covers the exact method you plan to use.</p>
  <h3>France</h3>
  <p>The law of 21 May 2024 gave Arcom powers to enforce age checks on pornographic sites. Arcom adopted its French-language <a href="https://www.arcom.fr/sites/default/files/2024-10/Arcom-Referentiel-technique-sur-la-verification-de-age-pour-la-protection-des-mineurs-contre-la-pornographie-en-ligne.pdf">technical standard on age verification</a> on 9 October 2024 and published it on 11 October 2024. Sites got three months to comply, and bank card checks were accepted for a further three-month transition. After that, each site must offer at least one method that meets the standard''s double anonymity privacy rules. Self-declaration is not enough, and facial estimation must include liveness detection and be set so that minors are not accepted as adults. Arcom says sites that do not comply face fines, blocking and removal from search results.</p>
  <h3>United States</h3>
  <p>On 27 June 2025 the Supreme Court upheld Texas law HB 1181, which requires adult sites to verify that visitors are 18 or older. Its 6 to 3 decision in <a href="https://www.supremecourt.gov/opinions/24pdf/23-1122_3e04.pdf">Free Speech Coalition v. Paxton</a> reviewed the law under intermediate scrutiny.</p>
  <p>Texas SB 2420, in force from 1 January 2026, requires app stores to verify each user''s age category and get a parent''s consent before a minor downloads or buys an app. A federal judge blocked it in December 2025, but the Fifth Circuit let Texas enforce it while the appeal runs. On 6 July 2026 the Supreme Court denied an application to lift that stay. We found no ruling on the appeal itself as of October 2026. In Utah, HB 498, a 2026 amendment, moved the app store and developer duties to 6 May 2027.</p>
  <h3>Australia</h3>
  <p>From 10 December 2025, age-restricted social media platforms must take reasonable steps to stop Australians under 16 from having accounts, under amendments to the Online Safety Act 2021 overseen by the eSafety Commissioner. The maximum penalty for a company is 150,000 penalty units, which the government''s fact sheet puts at A$49.5 million. The same fact sheet says no Australian can be made to use government ID, including Digital ID, to prove their age, and platforms must offer reasonable alternatives.</p>
  <h3>Online gambling</h3>
  <p>In Great Britain, Gambling Commission rules in force since 7 May 2019 require online operators to verify a customer''s age before the customer can deposit funds, play free-to-play versions of gambling games or gamble. The requirement sits in <a href="https://www.gamblingcommission.gov.uk/licensees-and-businesses/lccp/condition/3-2-11-remote-sr-code">licence code 3.2.11</a>. In the EU, the Digital Services Act guidelines above also recommend age verification for gambling.</p>
  <p>For how platforms are rolling out age checks in practice, see our news on <a href="/news/tiktoks-ai-age-checks/">TikTok''s AI age checks</a> and the <a href="/news/uk-digital-id-proposal-suggests-that-ids-would-be-issued-to-teenagers/">UK digital ID proposal</a>.</p>'
- '<h2>What to ask a vendor</h2>
  <ul>
  <li>Which methods do you support in each country we operate in, and which of them does our regulator accept?</li>
  <li>What happens when the estimate is close to the age threshold: which fallback runs, and can we set the buffer?</li>
  <li>Has the method been tested independently, for example under ISO/IEC 27566-1 or by a national regulator, and can we see the report?</li>
  <li>Is the selfie or document stored, for how long, and where is it processed?</li>
  <li>How are retries, failed checks and returning users billed?</li>
  </ul>
  <p>Our scores are overall provider scores from the same <a href="/methodology/">methodology</a> as every other ranking. The method lists and approvals on this page come from each vendor''s own age verification page, checked in October 2026.</p>'
faq:
- q: What is age verification?
  a: Age verification is a check that a user is over (or under) a set age before they get access to a product or service. It can use an ID document, a bank or credit record, a mobile operator record, a digital ID or an age estimate from a selfie or email address.
- q: What is the difference between age verification and age estimation?
  a: Age verification confirms a date of birth from a trusted record such as an ID document. Age estimation infers an age range from a signal such as a selfie or an email address, without collecting a document. Many platforms estimate first and verify only when the estimate is close to the threshold.
- q: Which age check methods does Ofcom accept?
  a: Ofcom says open banking, photo-ID matching, facial age estimation, mobile network operator checks, credit card checks, digital identity services and email-based age estimation can be highly effective. Self-declaration, debit cards and terms of service that ban children are not.
- q: Can you check age without an ID?
  a: Yes. Facial age estimation, email-based age estimation, mobile operator checks, credit card checks and open banking all check age without an identity document. Most providers fall back to an ID check when the result is close to the age limit.
- q: What does VerifyMy do?
  a: VerifyMy specialises in age assurance and content moderation. Its page lists email address age estimation, mobile number, name and address, facial age estimation, ID document with face match and credit card checks. The Age Check Certification Scheme register lists its platform as certified to ISO/IEC 27566-1, and it states German KJM approval. It does not offer KYC or AML screening.
- q: How does age verification work, step by step?
  a: A user reaches an age gate and chooses a method, a provider checks it and returns a pass or fail, and the platform then grants or blocks access. The platform first decides the age threshold and when to check, such as at sign-up or before restricted content. The user then takes a selfie, enters an email address or phone number, connects a bank, or scans an ID document. The provider usually returns only an over or under result. If an estimate lands close to the threshold, a stricter fallback such as an ID check runs. Some providers store the result so returning users are not checked again.
- q: How accurate is facial age estimation?
  a: Facial age estimation gives an estimate with a margin of error, not an exact age. In the evaluation NIST published on 30 May 2024, the tested algorithms' mean absolute error on visa photos was 3.1 years, down from 4.3 years in 2014. NIST found no single standout algorithm and almost always higher error rates for female faces. Ask a vendor for its error rates by age band, the buffer it sets above the legal age, and any independent result, such as an ACCS or ISO/IEC 27566-1 certificate.
- q: Is age verification required by law in the US, EU and Australia?
  a: 'Yes for some services, but in none of the three does one law cover every website. In the US the rules are set by states: the Supreme Court upheld Texas''s age check law for adult sites on 27 June 2025, and Texas can enforce its app store law while a court challenge continues. In the EU, the Commission''s Digital Services Act guidelines of 14 July 2025 recommend age verification for pornography and gambling and age estimation in other cases. In Australia, age-restricted social media platforms must take reasonable steps to keep out users under 16 from 10 December 2025, with penalties of up to A$49.5 million.'
- q: How much does age verification cost?
  a: Six of the nine ranked providers publish prices, starting at €0.75 per Basic KYC check (document and face) at KYCAID and $0.80 per verification plus a $49 monthly minimum at Veriff. Shufti Pro's Essentials plan, which lists age verification, starts at $1.50 per verification. Sumsub's Basic plan is $1.35 per verification with a $149 monthly minimum, iDenfy's Basic plan is $1.35 with a $135 minimum, and Persona's Essential plan starts at $250 a month. Apart from Shufti Pro, these plans do not name age checks, so confirm the price for the method you need. Incode, VerifyMy and Paravision quote on request.
