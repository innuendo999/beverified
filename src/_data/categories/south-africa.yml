explainer_html:
- '<section class="container-narrow section-border-top" id="methodology-deep-dive" style="padding:28px 0;">

  <h2 style="font-size:19px;margin-bottom:10px;">What South Africa-ready KYC/AML requires</h2>

  <p style="font-size:15px;line-height:1.7;margin-bottom:18px;">The Financial Intelligence Centre Act 38 of 2001 (the FIC Act, often called FICA) sets customer due diligence, record-keeping and reporting duties for the accountable institutions listed in its Schedule 1. The Financial Intelligence Centre (FIC) receives their reports and registrations through its goAML system and publishes guidance. Its Revised Guidance Note 7A, published on 1 September 2025, replaced Guidance Note 7 from 2017. The Prudential Authority, which sits within the South African Reserve Bank, supervises banks and insurers, and the Financial Sector Conduct Authority (FSCA) regulates market conduct. Both were set up on 1 April 2018.</p>

  <h3 style="font-size:14.5px;margin-bottom:10px;">What to check in a vendor</h3>

  <ul style="margin:0 0 18px;padding-left:20px;font-size:14.5px;line-height:1.75;">

  <li style="list-style:disc;">Reading of both the green barcoded ID book and the Smart ID card, which carry the same 13-digit ID number</li>

  <li style="list-style:disc;">ID number and selfie checks against the National Population Register kept by the Department of Home Affairs</li>

  <li style="list-style:disc;">Screening against the FIC targeted financial sanctions list at onboarding and each time the list changes</li>

  <li style="list-style:disc;">KYB checks against CIPC company records, including beneficial ownership</li>

  <li style="list-style:disc;">Where identity and biometric data are stored, since POPIA treats biometric information as special personal information</li>

  </ul>

  <h3 style="font-size:14.5px;margin-bottom:8px;">How the rules have changed since 2017</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">The FIC Amendment Act of 2017 moved the regime to a risk-based approach and full customer due diligence, with provisions in force from 13 June and 2 October 2017. The FSCA declared crypto assets a financial product on 19 October 2022, and crypto asset service providers became accountable institutions on 19 December 2022. The General Laws (Anti-Money Laundering and Combating Terrorism Financing) Amendment Act 22 of 2022 then amended five laws, including the FIC Act, the Companies Act and the Trust Property Control Act, with most changes in force from 31 December 2022 or 1 April 2023. The FATF placed South Africa under increased monitoring (the grey list) in February 2023 and removed it on 24 October 2025.</p>

  <h3 style="font-size:14.5px;margin-bottom:8px;">How this differs from other markets</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">Like <a href="/providers/peru/">Peru</a> with the DNI, South Africa has one national ID number that a provider can check against a government register instead of asking for a document scan. Two ID formats are in use at the same time, so document checks have to handle the older green book as well as the Smart ID card. The FIC keeps its own targeted financial sanctions list, which gives effect to UN Security Council sanctions, and accountable institutions must screen against it. Screening against other lists, such as OFAC, is a risk-based choice.</p>

  <h3 style="font-size:14.5px;margin-bottom:8px;">Regulatory context</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">Key references: the FIC Act and its Schedule 1, the FIC''s Revised Guidance Note 7A and targeted financial sanctions list, the FSCA''s crypto asset declaration, and the Protection of Personal Information Act 4 of 2013 (POPIA), enforced by the Information Regulator.</p>

  <a class="entity-card__cta" href="/methodology/">See how we evaluate every provider on this list in our full methodology →</a>

  </section>'
faq:
- q: Who regulates KYC and AML in South Africa?
  a: The Financial Intelligence Centre (FIC) administers the Financial Intelligence Centre Act 38 of 2001, which sets customer due diligence and reporting duties for accountable institutions. Banks and insurers are supervised by the Prudential Authority, which sits within the South African Reserve Bank, and market conduct by the Financial Sector Conduct Authority (FSCA).
- q: Which identity documents do South African KYC checks use?
  a: South African citizens hold either the green barcoded ID book or the Smart ID card, which was introduced in 2013. Both carry a 13-digit ID number, and many providers check that number, often with a selfie, against the population register kept by the Department of Home Affairs.
- q: Do crypto exchanges in South Africa have to follow FICA?
  a: Yes. The FSCA declared crypto assets a financial product on 19 October 2022, and crypto asset service providers have been accountable institutions under item 22 of Schedule 1 to the FIC Act since 19 December 2022. The FIC published guidance for them in Public Compliance Communication 57.
- q: Is South Africa still on the FATF grey list?
  a: No. The FATF placed South Africa under increased monitoring in February 2023 and announced on 24 October 2025 that it was no longer subject to increased monitoring.
- q: Which sanctions list must South African firms screen against?
  a: The FIC's targeted financial sanctions list, which gives effect to UN Security Council sanctions. Accountable institutions screen against it on an ongoing basis and must freeze the property of designated persons without delay. Screening against other lists, such as OFAC, is a risk-based decision.
- q: How does POPIA affect the choice of a KYC vendor?
  a: The Protection of Personal Information Act 4 of 2013 (POPIA), enforced by the Information Regulator, had most of its provisions in force from 1 July 2020, with compliance expected by 1 July 2021. Section 26 lists biometric information as special personal information, so selfie and face-match data need a lawful basis under section 27. Ask each vendor where it stores the data and which subprocessors it uses.
