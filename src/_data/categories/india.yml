explainer_html:
- '<section class="container-narrow section-border-top" id="methodology-deep-dive" style="padding:28px 0;">

  <h2 style="font-size:19px;margin-bottom:10px;">What India-ready KYC means</h2>

  <p style="font-size:15px;line-height:1.7;margin-bottom:18px;">The RBI issues the KYC Master Direction that regulated entities in India must follow, while FIU-IND, the financial intelligence unit, receives suspicious-transaction reports. A provider built for this market supports Aadhaar-enabled eKYC, cross-checks a customer''s PAN, and integrates with CKYC, the Central KYC Registry that lets a verified record be reused across institutions.</p>

  <h3 style="font-size:14.5px;margin-bottom:10px;">The stacks you''ll find here</h3>

  <ul style="margin:0 0 18px;padding-left:20px;font-size:14.5px;line-height:1.75;">

  <li style="list-style:disc;">Aadhaar-enabled eKYC integration</li>

  <li style="list-style:disc;">PAN cross-checks against tax and financial records</li>

  <li style="list-style:disc;">CKYC registry lookups to avoid re-verifying existing customers</li>

  <li style="list-style:disc;">UPI-speed decisioning to match real-time payment onboarding volume</li>

  </ul>

  <h3 style="font-size:14.5px;margin-bottom:8px;">How this differs from eKYC generally</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">Aadhaar-based eKYC is India''s version of the broader <a href="/providers/e-kyc/">eKYC</a> category, but CKYC adds a shared national registry layer most other markets don''t have.</p>

  <h3 style="font-size:14.5px;margin-bottom:8px;">How we evaluate vendors</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">Key references: the RBI''s KYC Master Direction, FIU-IND reporting requirements, and CKYC registry rules.</p>

  <a class="entity-card__cta" href="/methodology/">See how we evaluate every provider on this list in our full methodology →</a>

  </section>'
faq:
- q: Who regulates KYC/AML in India?
  a: The RBI (Reserve Bank of India) issues the KYC Master Direction that regulated entities must follow, while FIU-IND, the financial intelligence unit, receives suspicious-transaction reports.
- q: What is Aadhaar-enabled eKYC?
  a: Aadhaar-enabled eKYC lets a regulated entity verify identity electronically against India's Aadhaar biometric ID database, one of the largest national ID systems in the world.
- q: What is CKYC?
  a: The Central KYC Registry (CKYC) is a shared national database that stores verified KYC records, so a customer verified once by one institution doesn't need to repeat full KYC at another.
- q: Why does UPI matter for KYC in India?
  a: UPI's real-time payment volume creates onboarding pressure similar to Brazil's Pix, so providers need fast decisioning to keep pace with instant account funding.
- q: What is PAN and why is it used in KYC?
  a: PAN (Permanent Account Number) is India's tax identification number, commonly cross-checked during KYC to link a verified identity to financial and tax records.
- q: How does India's eKYC differ from eKYC elsewhere?
  a: India's Aadhaar-based eKYC is unusually centralized compared to most markets, and the CKYC registry adds a shared-record layer that most other countries don't have.
