faq:
- q: Who regulates KYC/AML in Brazil?
  a: BACEN, the Central Bank of Brazil, sets customer due diligence rules for regulated financial institutions, while COAF, the financial intelligence unit, receives suspicious-activity reports.
- q: What's the difference between CPF and CNPJ?
  a: CPF is Brazil's individual taxpayer ID, used to verify people. CNPJ is the equivalent registration number for businesses, used to verify companies during onboarding.
- q: Why does Pix matter for KYC in Brazil?
  a: Pix, Brazil's instant-payment system, settles transfers in seconds, which pushes KYC decisioning toward near-real-time speed since slow onboarding creates friction against instant payment rails.
- q: Do Brazilian KYC providers verify businesses as well as individuals?
  a: Many do, through CNPJ registry lookups, though verifying a business's beneficial owners is closer to KYB than individual KYC and sometimes requires a separate workflow.
- q: Is Brazil's KYC market growing?
  a: Brazil has one of Latin America's most active fintech and digital-banking markets, and demand for automated KYC has grown alongside Pix-driven account opening volume.
- q: Do global KYC vendors support Brazilian document formats?
  a: Leading vendors read Brazilian national ID (RG), CPF, and CNH driver's licenses natively, though document-fraud detection accuracy varies by provider.
