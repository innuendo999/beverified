explainer_html:
- '<h2>What fraud prevention software does for a bank or fintech</h2>

  <p>Fraud prevention software scores logins, payments and new accounts before they go through, and decides whether to approve, block, hold or ask for more proof. It draws on the payment itself, the device and how the customer behaves in the session, links between accounts, and fraud data shared across the vendor''s customers. Analysts work the alerts it raises in a case manager.</p>

  <p>The losses have moved. A growing share of fraud now passes through a real login, or comes from a customer talked into sending money, so card and password checks alone miss it. In the UK, banks refund most of these scam losses under the <a href="https://www.psr.org.uk/information-for-consumers/app-scams-reimbursement-dashboard/" rel="nofollow">Payment Systems Regulator''s reimbursement rules</a>, and the EU has <a href="https://www.dlapiper.com/en/insights/publications/2026/03/psd3-and-psr" rel="nofollow">agreed similar duties</a> for bank impersonation scams, along with a payee name check on every credit transfer.</p>

  <h2>Vendors we have not reviewed yet</h2>

  <p>Featurespace, BioCatch, Alloy, DataVisor, Oscilar and Verafin also sell fraud prevention to banks and fintechs. They enter this ranking once their reviews are published, and the ranking is then scored again.</p>

  <h2>Fraud prevention, AML monitoring and identity verification</h2>

  <p>AML transaction monitoring looks for money laundering after the fact and leads to suspicious activity reports; fraud prevention tries to stop a loss before it happens. Several vendors here sell both on one platform, which helps when the same mule account shows up in both teams'' queues. Checks on the person at sign-up sit with <a href="/providers/identity-verification/">identity verification providers</a>; for AML tools see <a href="/providers/aml/">AML software</a> and <a href="/providers/aml/banks/">AML software for banks</a>.</p>

  <h2>What to test in a pilot</h2>

  <ul>

  <li>Run the vendor in shadow mode on your own transaction history, including cases you lost money on.</li>

  <li>Measure fraud caught at the alert volume your team can handle, and false positives per thousand transactions.</li>

  <li>Count goodwill credits and scam refunds on the test set, and analyst time per case.</li>

  <li>Time the decision on your own payment rails, from request to answer.</li>

  </ul>

  <p><a href="/methodology/#fraud-prevention">How we score fraud prevention solutions →</a></p>'
faq:
- q: What is the best fraud prevention solution for banks and fintechs?
  a: SEON ranks first on our Fraud score, ahead of Sardine and Unit21. The order comes from public evidence on fraud coverage, signals, decisioning, investigations, fit for banks and fintechs, integration, trust and pricing, set out in our methodology.
- q: Which fraud prevention tools detect scam payments?
  a: Sardine, Unit21, Hawk AI, ComplyAdvantage, NICE Actimize, Feedzai and Quantexa describe detection of scams where the customer is manipulated into paying. Feedzai describes delaying the payment, stepping up authentication or warning the customer in the session when a scam is likely.
- q: Which vendors cover check fraud?
  a: Hawk AI, ComplyAdvantage and NICE Actimize describe check and deposit fraud, including mobile deposits and check image analysis in Hawk AI's case. Sardine and Unit21 list checks among the payment rails they monitor.
- q: Can we test a rule before it blocks real customers?
  a: SEON, Sardine, Unit21 and NICE Actimize describe testing rules on past data or in shadow mode on live traffic, and Sumsub describes a dry-run mode. For the others we found no such feature on their public pages.
- q: Why are vendor detection rates not in the score?
  a: Each vendor measures on different data, so their figures can't be compared, and no independent public test of fraud vendors exists that we could use. Run a pilot on your own history instead.
