explainer_html:
- '<h2>What banks need from AML software</h2>

  <p>Banks run AML at a volume and under a level of supervision that most fintech tools are not built for. The usual shortlist questions are: can it monitor transactions in real time across all payment channels, can it screen payments and customers against sanctions lists without flooding analysts with alerts, can investigators work cases and file suspicious activity reports in one place, and can the bank explain to an examiner why a model raised or cleared an alert.</p>

  <p>Deployment matters more here than in most categories. In the capabilities table, check the deployment column if your data must stay on your own infrastructure, and check the half-filled dots: some features sit in a separate module or a higher plan.</p>

  <h2>Model governance and explainability</h2>

  <p>Machine-learning monitoring models are models in the supervisory sense. In April 2026 the Federal Reserve, OCC and FDIC replaced SR 11-7 with <a href="https://www.federalreserve.gov/supervisionreg/srletters/sr2602.htm">revised guidance on model risk management (SR 26-2)</a>. It asks for a risk-based approach and applies to models bought from vendors as well as models built in-house, so a bank still has to understand and document the models it relies on. Examiners use the FFIEC BSA/AML Examination Manual when they review a bank''s monitoring program. Ask each vendor what documentation and alert-level explanations it provides for validation.</p>

  <h2>Regulatory context</h2>

  <ul>

  <li>EU: the <a href="https://eur-lex.europa.eu/eli/reg/2024/1624/oj">Anti-Money Laundering Regulation</a>, Regulation (EU) 2024/1624, applies from 10 July 2027, and the EU Anti-Money Laundering Authority (AMLA) is due to supervise up to 40 high-risk financial institutions directly from 2028.</li>

  <li>US: the Bank Secrecy Act requires banks to file suspicious activity reports with FinCEN; examiners assess programs against the FFIEC manual.</li>

  <li>UK: the Money Laundering Regulations 2017 apply, and the JMLSG guidance sets out how banks are expected to meet them.</li>

  </ul>

  <p>For AML tools across all company sizes, see the <a href="/providers/aml/">main AML software ranking</a>. <a href="/methodology/">How we evaluate every provider on this list →</a></p>'
faq:
- q: How is AML software for banks different from AML software in general?
  a: Bank deployments need real-time monitoring across all payment channels, sanctions screening on payments as well as customers, case management for investigators, and model documentation an examiner can review. Several tools built for fintechs cover part of this; the providers in this ranking are built for regulated financial institutions.
- q: Which of these AML platforms can run on premises?
  a: NICE Actimize and Napier offer cloud and on-premises deployment, per their own pages. Hawk AI, ComplyAdvantage and Feedzai are cloud services, Quantexa sells its AML product for banks as a cloud service, and Unit21 does not say.
- q: Do these platforms include sanctions screening?
  a: All seven do. ComplyAdvantage, NICE Actimize, Hawk AI, Unit21, Napier and Feedzai include sanctions and PEP screening; for Quantexa it is an add-on.
- q: How do you rank AML software for banks?
  a: By a separate AML for Banks score built for banks, credit unions and building societies. It weighs detection, alert quality and analyst workload, tuning without the vendor, validation and audit for examiners, implementation and data integration, sanctions screening, and vendor risk. Only public evidence counts, so a feature a vendor doesn't document earns no points. The score can't show how much a system detects on your data, so test that in a pilot.
- q: What is model explainability in AML monitoring?
  a: Explainability means the bank can show why a model raised or cleared an alert. In the US, the model risk guidance SR 26-2 (April 2026) covers vendor models as well as in-house ones, so examiners may ask for this evidence during a BSA/AML review.
- q: When does the EU AMLA start supervising banks?
  a: The EU Anti-Money Laundering Authority is due to begin direct supervision of up to 40 high-risk financial institutions in 2028, after a selection process in the second half of 2027. The new EU Anti-Money Laundering Regulation applies from 10 July 2027.
