explainer_html:
- '<h2>What banks need from AML software</h2>

  <p>Banks run AML at a volume and under a level of supervision that most fintech tools are not built for. The usual shortlist questions are: can it monitor transactions in real time across all payment channels, can it screen payments and customers against sanctions lists without flooding analysts with alerts, can investigators work cases and file suspicious activity reports in one place, and can the bank explain to an examiner why a model raised or cleared an alert.</p>

  <p>Deployment matters more here than in most categories. In the capabilities table, check the deployment column if your data must stay on your own infrastructure, and check the half-filled dots: some features sit in a separate module or a higher plan.</p>

  <h2>Model governance and explainability</h2>

  <p>Machine-learning monitoring models are models in the supervisory sense. In the US, the Federal Reserve and OCC guidance <a href="https://www.federalreserve.gov/supervisionreg/srletters/sr1107.htm" rel="noopener">SR 11-7 on model risk management</a> sets the expectation that banks validate and document the models they rely on, and examiners use the <a href="https://bsaaml.ffiec.gov/manual" rel="noopener">FFIEC BSA/AML Examination Manual</a> when they review a bank''s monitoring program. Ask each vendor what documentation and alert-level explanations it provides for validation.</p>

  <h2>Regulatory context</h2>

  <ul>

  <li>EU: the Anti-Money Laundering Regulation, <a href="https://eur-lex.europa.eu/eli/reg/2024/1624/oj" rel="noopener">Regulation (EU) 2024/1624</a>, applies from 10 July 2027, and the <a href="https://www.amla.europa.eu/" rel="noopener">EU Anti-Money Laundering Authority (AMLA)</a> is due to supervise up to 40 high-risk financial institutions directly from 2028 (<a href="https://www.aoshearman.com/en/insights/amlctf-playbook-eu-edition-2-the-eu-antimoney-laundering-authority" rel="noopener">A&amp;O Shearman summary</a>).</li>

  <li>US: the Bank Secrecy Act requires banks to file suspicious activity reports with FinCEN; examiners assess programs against the FFIEC manual.</li>

  <li>UK: the <a href="https://www.legislation.gov.uk/uksi/2017/692/contents" rel="noopener">Money Laundering Regulations 2017</a> apply, and the <a href="https://www.jmlsg.org.uk/guidance/current-guidance/" rel="noopener">JMLSG guidance</a> sets out how banks are expected to meet them.</li>

  </ul>

  <p>For AML tools across all company sizes, see the <a href="/providers/aml/">main AML software ranking</a>. <a href="/methodology/">How we evaluate every provider on this list →</a></p>'
faq:
- q: How is AML software for banks different from AML software in general?
  a: Bank deployments need real-time monitoring across all payment channels, sanctions screening on payments as well as customers, case management for investigators, and model documentation an examiner can review. Several tools built for fintechs cover part of this; the providers in this ranking are built for regulated financial institutions.
- q: Which of these AML platforms can run on premises?
  a: NICE Actimize, Quantexa and Napier offer cloud and on-premises deployment, per their own pages. Feedzai, Hawk AI and ComplyAdvantage are cloud services, and Unit21 does not say.
- q: Do these platforms include sanctions screening?
  a: ComplyAdvantage, NICE Actimize, Feedzai, Hawk AI, Unit21 and Napier include sanctions and PEP screening. Quantexa uses sanctions and adverse-media data inside its entity-resolution platform, but we found no separate screening product on its pages.
- q: What is model explainability in AML monitoring?
  a: Explainability means the bank can show why a model raised or cleared an alert. In the US, SR 11-7 expects banks to validate and document the models they use, so examiners may ask for this evidence during a BSA/AML review.
- q: When does the EU AMLA start supervising banks?
  a: The EU Anti-Money Laundering Authority is due to begin direct supervision of up to 40 high-risk financial institutions in 2028, after a selection process in the second half of 2027. The new EU Anti-Money Laundering Regulation applies from 10 July 2027.
