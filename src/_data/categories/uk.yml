explainer_html:
- '<h2>Who has to use a certified provider, and for which check</h2>

  <p>Four groups of UK buyers meet the digital verification services (DVS) register in their own rules. Employers checking Right to Work, landlords and letting agents checking Right to Rent, and DBS registered bodies checking identity for criminal record checks each have Home Office or DBS guidance that points to registered providers. Firms under the Money Laundering Regulations can use the same register for the identity step of customer due diligence. The register shows which of these schemes each certified service covers, and every provider in this ranking has at least one service on it.</p>

  <h2>Right to Work checks for employers</h2>

  <p>The Home Office <a href="https://www.gov.uk/government/publications/right-to-work-checks-employers-guide" rel="nofollow noopener" target="_blank">employer''s guide to right to work checks</a> in force since 1 October 2026 defines Right to Work digital verification service providers (RtW DVSPs) as registered providers that employers can use for digital checks. The same version follows the Border Security, Asylum and Immigration Act 2025, which extends the duty beyond employees: from 1 October 2026 it also covers workers'' contracts, individual sub-contractors and online matching services. Before you pick a provider, check that its register entry lists Right to Work.</p>

  <h2>Right to Rent checks for landlords and letting agents</h2>

  <p>The <a href="https://www.gov.uk/government/publications/landlords-guide-to-right-to-rent-checks/landlords-guide-to-right-to-rent-checks-1-october-2026-accessible" rel="nofollow noopener" target="_blank">landlord''s guide of 1 October 2026</a> applies to checks made on or after that date and mandates registered providers for digital Right to Rent checks. Responsibility normally rests with the landlord. A letting agent takes on liability for a civil penalty only where that responsibility was transferred to it in writing. Agents that run checks for several landlords should confirm that their provider lists Right to Rent on the register.</p>

  <h2>DBS checks</h2>

  <p>DBS registered bodies and responsible organisations must use a service certified against a current version of both the trust framework and the supplementary code for DBS digital identity checks, according to the <a href="https://www.gov.uk/government/publications/dbs-identity-checking-guidelines/dbs-digital-identity-verification-guidance" rel="nofollow noopener" target="_blank">DBS digital identity verification guidance</a>. A Basic check needs at least a medium level of confidence. Standard, Enhanced and Enhanced with Barred Lists checks need a high level. Four providers in this ranking list DBS on their register entry, and SmartSearch reaches it through Credas Connect. Ask the provider which level of confidence its service reaches for the documents your applicants hold.</p>

  <h2>The register and the trust framework behind it</h2>

  <p>Most of Part 2 of the Data (Use and Access) Act 2025 came into force on 1 December 2025. That put the DVS scheme on a <a href="https://enablingdigitalidentity.blog.gov.uk/2025/12/01/dvs-measures-in-the-data-act-have-come-into-force/" rel="nofollow noopener" target="_blank">statutory footing</a>, and the statutory register replaced the earlier non-statutory one the same day. Certification is optional for providers, but only certified services appear on the register. The Office for Digital Identities and Attributes runs it.</p>

  <p>Providers are certified against the UK digital verification services trust framework, which was called the <a href="/glossary/uk-diatf/">UK digital identity and attributes trust framework (DIATF)</a> before version 1.0 was published in June 2026. From 1 September 2026, new certifications are issued only against version 1.0. Supplementary codes add the rules for Right to Work, Right to Rent and DBS checks.</p>

  <h2>Money Laundering Regulations and FCA-regulated firms</h2>

  <p>Since 26 February 2026, firms covered by the Money Laundering Regulations 2017 can meet the identity verification step of regulation 28 with a certified service listed on the register. HM Treasury''s <a href="https://www.gov.uk/government/publications/using-digital-identities-with-the-money-laundering-regulations/using-digital-identities-with-the-money-laundering-regulations" rel="nofollow noopener" target="_blank">guidance</a> adds that services not on the register cannot reliably be deemed suitable. A register entry covers identity verification only. The firm still owns the risk assessment, enhanced due diligence where it applies, record keeping and liability for customer due diligence. Attributes such as PEP or sanctions data are outside the register guidance, so screening is a separate choice.</p>

  <ul>

  <li><a href="/glossary/uk-money-laundering-regulations/">Money Laundering Regulations 2017</a>, amended by SI 2026/621 (made 9 June 2026), which moves customer due diligence thresholds from euros to sterling.</li>

  <li>The UK Sanctions List, the single official source of UK sanctions designations since 28 January 2026. The OFSI Consolidated List is no longer updated, so screening tools should use the UK Sanctions List.</li>

  <li>The FCA supervises anti-money laundering compliance for the firms it authorises and for registered cryptoasset businesses.</li>

  </ul>

  <h2>How to choose a UK provider</h2>

  <ul>

  <li>Open the provider''s entry on the register yourself: the service name, the schemes it covers and the certificate expiry date.</li>

  <li>Match the schemes to your job: Right to Work for hiring, Right to Rent for lettings, DBS for criminal record checks, plain identity checks for onboarding under the Money Laundering Regulations.</li>

  <li>For DBS, ask which level of confidence the service reaches; Standard and Enhanced checks need a high level.</li>

  <li>Ask whether sanctions screening runs against the UK Sanctions List and how quickly list changes reach you.</li>

  <li>Compare pricing models. Five of the nine providers publish a starting price; the others quote on request.</li>

  </ul>

  <p><a href="/methodology/">How we evaluate every provider on this list →</a></p>'
faq:
- q: Do employers have to use a certified provider for digital Right to Work checks?
  a: For a digital check through a provider, yes. The Home Office employer's guide in force since 1 October 2026 describes Right to Work digital verification service providers as registered providers that employers can use for digital checks. Pick a provider whose entry on the DVS register lists Right to Work.
- q: Can letting agents use any identity app for Right to Rent?
  a: No. The landlord's guide for checks made on or after 1 October 2026 mandates registered providers for digital Right to Rent checks. Responsibility normally rests with the landlord, and moves to the letting agent only where it was transferred in writing.
- q: Which level of check does a DBS application need?
  a: DBS guidance says a Basic check needs at least a medium level of confidence, and Standard, Enhanced and Enhanced with Barred Lists checks need a high level. The service must be certified against both the trust framework and the DBS supplementary code.
- q: Can a UK firm use a digital identity provider to meet the Money Laundering Regulations?
  a: Yes. HM Treasury guidance of 26 February 2026 says firms can meet the identity verification step of regulation 28 with a certified service listed on the DVS register. The firm keeps responsibility for the rest of customer due diligence, including the risk assessment and enhanced due diligence.
- q: Which KYC providers are on the UK DVS register?
  a: All 9 providers in this ranking have at least one service on the register, checked against the register download on 22 November 2026 and, for Yoti, on 24 November 2026. Yoti, Veriff, Persona, ComplyCube, SmartSearch, Onfido (Entrust), Signicat, GBG and AU10TIX each list a certified service. Sumsub, Shufti Pro, Veridas, Trulioo and Socure were not on the register that day.
- q: Do these providers support Right to Work, Right to Rent and DBS checks?
  a: Yoti, Veriff, Persona, ComplyCube, Onfido (Entrust), GBG and AU10TIX list Right to Work and Right to Rent on their register entries, and Yoti, ComplyCube, Onfido, GBG and AU10TIX also list DBS. SmartSearch covers these schemes through Credas Connect. Signicat's ReadID lists no supplementary scheme.
- q: What is the difference between DIATF and the DVS trust framework?
  a: DIATF and the DVS trust framework are the same framework under two names. Versions before 1.0 were called the UK digital identity and attributes trust framework (DIATF); version 1.0, published in June 2026, is called the UK digital verification services trust framework.
- q: Does a DVS certificate expire?
  a: Yes. Each service on the register shows a certificate issue date and an expiry date; the certificates in this ranking run to between September 2028 and September 2029. Check the register before you rely on a provider, because services without a valid certificate are removed.
