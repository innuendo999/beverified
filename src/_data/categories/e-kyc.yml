  slug: signzy
  reason: 'Signzy offers RBI-compliant V-CIP video verification with face match against PAN and Aadhaar, plus CKYC search and upload, in a no-code journey builder.'
- segment: 'EU neobanks'
  slug: fourthline
  reason: 'Fourthline''s clients include Revolut, N26, Trade Republic and Qonto, and one platform covers NFC onboarding, AML screening and re-KYC.'
