explainer_html:
- '<section class="container-narrow section-border-top" id="methodology-deep-dive" style="padding:28px 0;">

  <h2 style="font-size:19px;margin-bottom:10px;">What eKYC Actually Verifies</h2>

  <p style="font-size:15px;line-height:1.7;margin-bottom:18px;">Electronic KYC confirms that the person opening an account is who they claim to be, using a government-issued document and a live selfie, before any money moves. In the EU, the legal basis usually traces back to eIDAS, the electronic-identification regulation; most eKYC vendors read a document''s MRZ line or NFC chip and match it against a biometric selfie in under a minute.</p>

  <h3 style="font-size:14.5px;margin-bottom:10px;">Core capabilities compliance teams typically require</h3>

  <ul style="margin:0 0 18px;padding-left:20px;font-size:14.5px;line-height:1.75;">

  <li style="list-style:disc;">Optical and NFC-chip document reading across 190+ country formats</li>

  <li style="list-style:disc;">Liveness-checked selfie match against the document photo</li>

  <li style="list-style:disc;">Sub-60-second decisioning for straight-through onboarding</li>

  <li style="list-style:disc;">Audit trail meeting AMLD6 customer due diligence requirements</li>

  </ul>

  <h3 style="font-size:14.5px;margin-bottom:8px;">How this differs from Identity Verification</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">eKYC is the one-time gate at account opening. Broader <a href="/providers/identity-verification/">identity verification</a> tools keep checking a user''s identity at login, high-risk transactions, and password resets — often reusing the same biometric engine.</p>

  <h3 style="font-size:14.5px;margin-bottom:8px;">Regulatory context</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">Key references for this category: eIDAS (EU electronic identification), AMLD6 customer due diligence obligations, and the document-authenticity standards border-control agencies use to validate MRZ and chip data.</p>

  <a class="entity-card__cta" href="/methodology/">See how we evaluate every provider on this list in our full methodology →</a>

  </section>'
