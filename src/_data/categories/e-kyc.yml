  slug: verified
  reason: 'Verified integrates Nordic and Baltic eIDs such as BankID, MitID and Smart-ID, and screens every customer daily against PEP, sanctions and adverse-media lists.'
- segment: 'UK regulated firms (DIATF)'
  slug: onfido
  reason: 'Onfido is certified by Kantara under the UK digital verification services trust framework until March 2029, with automated document, NFC and selfie checks.'
