explainer_html:
- '<h2>What eKYC is</h2>

  <p>eKYC (electronic know your customer) is remote customer onboarding that meets anti-money laundering rules. A bank, payment firm or other regulated business identifies a new customer and verifies their identity online instead of in a branch. The usual methods are an ID document scan with a selfie and liveness check, a read of the document''s NFC chip, a national or bank eID, or a video call with a trained agent. Which of these a firm may rely on depends on its country and its regulator.</p>

  <h2>EU rules on remote customer due diligence</h2>

  <ul>

  <li>Today, Article 13(1)(a) of the EU AML Directive, as amended by <a href="https://eur-lex.europa.eu/eli/dir/2018/843/oj" rel="noopener">Directive (EU) 2018/843</a>, lets firms verify identity with electronic identification means, eIDAS trust services or any other secure remote process that national authorities regulate, recognise, approve or accept. The <a href="https://www.eba.europa.eu/node/166" rel="noopener">EBA Guidelines on remote customer onboarding</a> (EBA/GL/2022/15) have applied since 2 October 2023 (<a href="https://finanssivalvonta.fi/en/publications-and-press-releases/supervision-releases/2023/european-banking-authority-eba-guidelines-on-the-use-of-remote-customer-onboarding-solutions--application-begins-on-2-october-2023" rel="noopener">FIN-FSA notice</a>).</li>

  <li>From 10 July 2027, customer due diligence rules move into the Anti-Money Laundering Regulation, <a href="https://eur-lex.europa.eu/eli/reg/2024/1624/oj" rel="noopener">Regulation (EU) 2024/1624</a>, which applies directly in every member state. Its Article 22(6) covers identification through eIDAS electronic identification means and qualified trust services. On 1 October 2026 the <a href="https://www.amla.europa.eu/press-release-amla-finalises-key-standards-private-sector_en" rel="noopener">EU Anti-Money Laundering Authority</a> sent the Commission its final draft standards on customer due diligence, which cover non-face-to-face verification and electronic identification.</li>

  </ul>

  <h2>eIDs and the EU Digital Identity Wallet</h2>

  <p>eIDAS, <a href="https://eur-lex.europa.eu/eli/reg/2014/910/oj" rel="noopener">Regulation (EU) No 910/2014</a>, sets the EU rules for electronic identification and trust services. Its amendment, <a href="https://eur-lex.europa.eu/eli/reg/2024/1183/oj" rel="noopener">Regulation (EU) 2024/1183</a> (eIDAS 2, in force since 20 May 2024), requires each member state to provide at least one EU Digital Identity Wallet within 24 months of the implementing acts. The <a href="https://commission.europa.eu/topics/digital-economy-and-society/european-digital-identity_en" rel="noopener">European Commission</a> says wallets will be available to every citizen, resident and business by the end of 2026. Private services that must use strong user authentication, such as banks, have to accept the wallet no later than 36 months after the implementing acts (Article 5f(2)). Many markets already onboard with bank and national eIDs, such as BankID, MitID and Smart-ID in the Nordics and Baltics.</p>

  <h2>Video identification and NFC chip reading</h2>

  <ul>

  <li>Germany: <a href="https://www.bafin.de/ref/19621456" rel="noopener">BaFin Circular 3/2017 (GW)</a> sets the conditions for agent-led video identification under the German Money Laundering Act.</li>

  <li>India: the Reserve Bank of India''s <a href="https://www.rbi.org.in/scripts/BS_ViewMasDirections.aspx?id=13141" rel="noopener">Know Your Customer Directions, 2025</a> for commercial banks allow V-CIP, a live, consent-based audio-visual interaction run by specially trained bank officials, with face liveness or spoof detection and GPS geo-tagging of the customer.</li>

  <li>NFC: ePassports carry a chip specified in <a href="https://www.icao.int/publications/pages/publication.aspx?docnum=9303" rel="noopener">ICAO Doc 9303</a>. Reading it lets the app check the issuing state''s signature on the stored data (passive authentication), which a photo of the document cannot prove.</li>

  </ul>

  <h2>eKYC and identity verification</h2>

  <p>eKYC is the onboarding check a regulated firm runs to meet customer due diligence rules. <a href="/providers/identity-verification/">Identity verification</a> is the wider use of the same document and face checks at login, account recovery and other moments after onboarding, including in businesses with no AML duty. For eKYC, compare what your regulators accept: eIDs, video ident and NFC. For checks after onboarding, compare liveness testing and reuse.</p>

  <p><a href="/methodology/">How we evaluate every provider on this list →</a></p>'
faq:
- q: 'What is eKYC?'
  a: 'eKYC (electronic know your customer) is remote onboarding that meets anti-money laundering rules: a regulated firm verifies a new customer''s identity online with an ID document and selfie, an eID, an NFC chip read or a video call. Which methods count depends on the country and the regulator.'
- q: 'What is the difference between eKYC and KYC?'
  a: 'eKYC is KYC done remotely with digital checks instead of a document seen in person. The legal duty is the same: identify the customer, verify their identity from a reliable source and keep records. Only the method of collecting and checking the evidence changes.'
- q: 'Is video identification required for eKYC?'
  a: 'No EU-wide rule requires video identification. EU AML law accepts electronic identification means, eIDAS trust services and other secure remote processes that national authorities accept, and video ident is one such process in some countries. Germany sets its conditions in BaFin Circular 3/2017 (GW), and India''s RBI treats V-CIP as an alternative method. On this page, IDnow, Signicat and Signzy include live-agent video; Sumsub, KYCAID and Jumio sell it as an add-on.'
- q: 'Which eKYC providers support NFC chip reading?'
  a: 'Sumsub, Veriff, Onfido, Jumio and Fourthline read ePassport or eID chips in their core product; Sumsub and Veriff enable it on request. Signicat (ReadID), IDnow and Verified offer it as a separate module or product. We found no NFC chip reading for KYCAID or Signzy.'
- q: 'What documents does eKYC accept?'
  a: 'Passports, national ID cards and driving licences are the usual documents, read from the printed page and machine-readable zone or from the chip where there is one. National rules decide which documents count for AML purposes, and some regulators also accept national or bank eIDs instead of a document.'
- q: 'Does eKYC replace AML screening?'
  a: 'No. eKYC confirms who someone is; AML screening separately checks that person against sanctions, PEP and adverse-media lists. Most compliance programs run both, and several providers on this page sell them in one flow.'
- q: 'What changes for eKYC under the EU AMLR in 2027?'
  a: 'From 10 July 2027, EU customer due diligence rules come from the Anti-Money Laundering Regulation, Regulation (EU) 2024/1624, which applies directly in every member state. On 1 October 2026 AMLA sent the Commission its final draft standards on customer due diligence, covering non-face-to-face verification and electronic identification; they still need Commission adoption.'
- q: 'Can banks use the EU Digital Identity Wallet for eKYC?'
  a: 'Not everywhere yet. eIDAS 2 requires each member state to offer at least one wallet within 24 months of the implementing acts, and the Commission says wallets will be available by the end of 2026. Banks and other services that must use strong user authentication have to accept it within 36 months of those acts.'
