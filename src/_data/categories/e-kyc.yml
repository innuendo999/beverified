faq:
- q: What is eKYC?
  a: Electronic KYC (eKYC) is the digital process of verifying a new customer's identity using a government-issued document and a live selfie, typically completed in under a minute during account opening.
- q: What documents does eKYC accept?
  a: Most eKYC platforms read passports, national ID cards, and driver's licenses, using either optical character recognition on the printed data or the document's NFC chip where one is present.
- q: How long does eKYC onboarding take?
  a: Straight-through eKYC decisions typically complete in under 60 seconds. Cases flagged for manual review can take longer depending on the provider's escalation process.
- q: Is eKYC the same as KYC?
  a: eKYC is the electronic, remote version of traditional KYC. Where paper-based KYC required an in-person document check, eKYC verifies the same information through a phone or webcam.
- q: Does eKYC replace AML screening?
  a: No. eKYC confirms who someone is; AML software separately screens that person against sanctions, PEP, and adverse-media lists. Most compliance programs run both.
- q: What happens if a document fails an eKYC check?
  a: Failed or low-confidence checks are usually routed to a human reviewer rather than rejected outright, since glare, damaged IDs, or poor lighting can cause false rejections.
