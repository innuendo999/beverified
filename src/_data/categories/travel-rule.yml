explainer_html:
- '<section class="container-narrow section-border-top" id="methodology-deep-dive" style="padding:28px 0;">

  <h2 style="font-size:19px;margin-bottom:10px;">What the Crypto Travel Rule Actually Requires</h2>

  <p style="font-size:15px;line-height:1.7;margin-bottom:18px;">FATF Recommendation 16, the Travel Rule, requires a sending VASP to pass originator and beneficiary information to the receiving VASP before or during a virtual-asset transfer above the relevant threshold — not to screen the wallet itself, which is a separate crypto KYC function.</p>

  <h3 style="font-size:14.5px;margin-bottom:10px;">Core capabilities compliance teams typically require</h3>

  <ul style="margin:0 0 18px;padding-left:20px;font-size:14.5px;line-height:1.75;">

  <li style="list-style:disc;">IVMS101-formatted counterparty data exchange</li>

  <li style="list-style:disc;">VASP-to-VASP message routing without exposing data to non-VASP intermediaries</li>

  <li style="list-style:disc;">Counterparty due diligence before a transfer completes</li>

  <li style="list-style:disc;">Handling the "Sunrise Issue" — the gap where the receiving jurisdiction hasn''t yet adopted equivalent rules</li>

  </ul>

  <h3 style="font-size:14.5px;margin-bottom:8px;">How this differs from Crypto KYC</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">Travel Rule software exchanges identity data between VASPs at transfer time; <a href="/providers/crypto/">crypto KYC</a> screens the wallet''s own risk and onboarding history. Most platforms in this list also appear in Crypto KYC, since the same VASP often runs both.</p>

  <h3 style="font-size:14.5px;margin-bottom:8px;">Regulatory context</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">Key references: FATF Recommendation 16, the VASP (Virtual Asset Service Provider) designation, and the IVMS101 messaging standard used to format Travel Rule data.</p>

  <h3 id="protocols" style="font-size:14.5px;margin-bottom:8px;">Travel Rule networks and protocols, explained</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:10px;">A provider is only as useful as the networks it reaches. These are the ones that come up most often when VASPs compare tools:</p>

  <ul style="margin:0 0 18px;padding-left:20px;font-size:14.5px;line-height:1.75;">

  <li id="protocol-trust" style="list-style:disc;"><strong>TRUST</strong> — a Travel Rule network used by many regulated US exchanges to exchange originator and beneficiary data.</li>

  <li id="protocol-trp" style="list-style:disc;"><strong>TRP (Travel Rule Protocol)</strong> — an open, vendor-neutral standard for VASP-to-VASP messaging, designed to reduce lock-in.</li>

  <li id="protocol-tap" style="list-style:disc;"><strong>TAP</strong> — Notabene''s own protocol; it works alongside VODE and does not bridge to TRP, OpenVASP or Shyft.</li>

  <li id="protocol-aopp" style="list-style:disc;"><strong>AOPP (Address Ownership Proof Protocol)</strong> — a one-step method to prove a customer controls a self-hosted wallet, used by 21 Analytics.</li>

  <li id="protocol-ivms101" style="list-style:disc;"><strong>IVMS101</strong> — the shared data model that defines how identity data is formatted so different systems can read it.</li>

  </ul>

  <h3 id="us-context" style="font-size:14.5px;margin-bottom:8px;">Travel Rule in the United States</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">In the US, Travel Rule obligations trace back to FinCEN and the Bank Secrecy Act, which apply a recordkeeping and transmittal requirement to qualifying transfers. Many regulated US exchanges exchange this data over the TRUST network, which is why network reach — not just protocol support — matters when a provider serves the US market.</p>

  <a class="entity-card__cta" href="/methodology/">See how we evaluate every provider on this list in our full methodology →</a>

  </section>'
