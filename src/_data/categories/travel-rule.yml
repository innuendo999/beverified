faq:
- q: What is the crypto Travel Rule?
  a: The Travel Rule, FATF Recommendation 16, requires a sending Virtual Asset Service Provider (VASP) to pass originator and beneficiary information to the receiving VASP before or during a transfer above the relevant threshold.
- q: What's the difference between Travel Rule compliance and crypto KYC?
  a: Travel Rule software exchanges identity data between VASPs at transfer time. Crypto KYC screens the wallet's own risk and onboarding history. Most VASPs run both, often from different vendors.
- q: What is IVMS101?
  a: IVMS101 is the data-model standard that defines how originator and beneficiary information is formatted for Travel Rule message exchange between VASPs.
- q: What is the "Sunrise Issue"?
  a: The Sunrise Issue refers to the compliance gap that arises when a sending VASP's jurisdiction has implemented Travel Rule requirements but the receiving jurisdiction has not yet adopted equivalent rules.
- q: Do all crypto transfers require Travel Rule data?
  a: No — most jurisdictions apply a minimum transfer threshold below which Travel Rule data exchange isn't required, though thresholds vary by country.
- q: Can different Travel Rule protocols talk to each other?
  a: Interoperability varies by provider. Some connect to shared networks such as TRUST and TRP, while others run their own protocol — for example, Notabene uses TAP and VODE and does not connect to TRP, OpenVASP or Shyft. Check a provider's networks against your counterparties before you commit.
- q: Which Travel Rule provider works with self-hosted wallets?
  a: 21 Analytics verifies self-hosted (non-custodial) wallet ownership in one step using AOPP, the Address Ownership Proof Protocol — useful when a VASP needs to prove who controls an external wallet before releasing funds.
