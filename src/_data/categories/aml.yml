explainer_html:
- '<h2>What AML software does</h2>

  <p>AML software helps a regulated business spot money laundering and sanctions breaches across the customer lifecycle. Most products cover some mix of four jobs: screening customers against sanctions, politically exposed person (PEP) and adverse-media data; monitoring transactions for unusual patterns; managing alerts and cases; and preparing regulatory reports such as suspicious activity reports.</p>

  <p>Few vendors include all four in every plan. In the capabilities table, a half-filled dot marks a feature that needs a separate module or a higher plan, and the note under it says which. Several providers in this ranking keep part of their AML features on higher tiers, so check what each plan includes before you compare entry prices.</p>

  <h2>AML software, KYC and KYB</h2>

  <p>KYC confirms who a customer is at onboarding; AML software keeps watching after that. Several tools in this ranking do not verify identity documents themselves, so check the identity verification column and pair them with an <a href="/providers/identity-verification/">identity verification provider</a> if needed. For business customers see <a href="/providers/kyb/">KYB providers</a>; for virtual asset firms see <a href="/providers/crypto/">crypto KYC</a> and the <a href="/providers/travel-rule/">Travel Rule</a>.</p>

  <h2>Regulatory context</h2>

  <ul>

  <li><a href="https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html" rel="noopener">FATF Recommendations</a> set the global baseline, including customer due diligence (Recommendation 10), suspicious transaction reporting (Recommendation 20) and targeted financial sanctions (Recommendation 6).</li>

  <li>EU: the Anti-Money Laundering Regulation, <a href="https://eur-lex.europa.eu/eli/reg/2024/1624/oj" rel="noopener">Regulation (EU) 2024/1624</a>, applies from 10 July 2027. The <a href="https://www.amla.europa.eu/" rel="noopener">EU Anti-Money Laundering Authority (AMLA)</a> in Frankfurt started work in 2025 and is due to supervise up to 40 high-risk financial institutions directly from 2028 (<a href="https://www.aoshearman.com/en/insights/amlctf-playbook-eu-edition-2-the-eu-antimoney-laundering-authority" rel="noopener">A&amp;O Shearman summary</a>).</li>

  <li>US: the Bank Secrecy Act requires covered firms to file suspicious activity reports with FinCEN, and sanctions screening checks names against OFAC''s <a href="https://sanctionslist.ofac.treas.gov/Home/SdnList" rel="noopener">Specially Designated Nationals list</a>.</li>

  <li>UK: the <a href="https://www.legislation.gov.uk/uksi/2017/692/contents" rel="noopener">Money Laundering Regulations 2017</a> set due-diligence, monitoring and record-keeping duties for regulated firms.</li>

  </ul>

  <p><a href="/methodology/">How we evaluate every provider on this list →</a></p>'
faq:
- q: What is AML software?
  a: AML software screens customers against sanctions, PEP and adverse-media data, monitors transactions for unusual activity, and gives compliance teams a place to review alerts and file reports. Products differ in which of these they include and on which plan.
- q: Which AML software also verifies identity?
  a: Sumsub, KYC Hub, SmartSearch and RelyComply include identity verification; Unit21 and KYC360 offer it through partners. ComplyAdvantage, Hawk AI and Napier do not, so they are usually paired with a separate identity verification provider. The capabilities table shows the source for each.
- q: How much does AML software cost?
  a: ComplyAdvantage, KYC360 and Sumsub publish entry prices; most enterprise platforms in this ranking quote on request. Entry plans often leave out transaction monitoring or ongoing monitoring, so check what each plan includes on the provider's review.
- q: Can AML software run on premises?
  a: Napier and KYC360 offer cloud and on-premises deployment, per their own pages. The other providers in this ranking are cloud-based or do not say.
- q: Is AML software legally required?
  a: Banks, payment firms, crypto businesses and other regulated sectors must run AML checks under laws such as the US Bank Secrecy Act, the EU anti-money laundering rules and the UK Money Laundering Regulations 2017. The law rarely names software, but it is how most firms meet the duty at scale.
- q: What is the difference between KYC and AML?
  a: 'KYC verifies who a customer is at onboarding. AML is the wider program: it includes KYC and adds sanctions and PEP screening, transaction monitoring and suspicious activity reporting for as long as the customer relationship lasts.'
