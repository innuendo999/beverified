explainer_html:
- '<section class="container-narrow section-border-top" id="methodology-deep-dive" style="padding:28px 0;">

  <h2 style="font-size:19px;margin-bottom:10px;">What AML Software Actually Checks</h2>

  <p style="font-size:15px;line-height:1.7;margin-bottom:18px;">Anti-money laundering software screens customers and transactions against sanctions lists, politically exposed persons (PEP) databases, and adverse media, then routes anything unusual to a human reviewer. In the US, that screening typically maps to OFAC''s Specially Designated Nationals List and FinCEN''s suspicious activity reporting rules. Providers serving banks in the EU operate under the sixth Anti-Money Laundering Directive (AMLD6).</p>

  <h3 style="font-size:14.5px;margin-bottom:10px;">Core capabilities compliance teams typically require</h3>

  <ul style="margin:0 0 18px;padding-left:20px;font-size:14.5px;line-height:1.75;">

  <li style="list-style:disc;">Sanctions and PEP screening against updated watchlists</li>

  <li style="list-style:disc;">Transaction monitoring with configurable rule sets</li>

  <li style="list-style:disc;">Adverse media screening</li>

  <li style="list-style:disc;">Case management workflow for investigators</li>

  <li style="list-style:disc;">Audit trail suitable for regulator review</li>

  </ul>

  <h3 style="font-size:14.5px;margin-bottom:8px;">How this differs from KYB and Crypto KYC</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">AML software screens ongoing customer activity; <a href="/providers/kyb/">KYB</a> verifies a business''s legal existence and beneficial owners at onboarding. <a href="/providers/crypto/">Crypto KYC</a> applies the same screening discipline to wallets and on-chain flows. Most banks run several of these, often from different vendors.</p>

  <h3 style="font-size:14.5px;margin-bottom:8px;">Regulatory context</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">Key frameworks referenced across this category: FATF Recommendation 10 on customer due diligence, the EU''s AMLD6, and the US Bank Secrecy Act''s SAR filing requirement.</p>

  <a class="entity-card__cta" href="/methodology/">See how we evaluate every provider on this list in our full methodology →</a>

  </section>'
faq:
- q: What is AML software?
  a: AML (Anti-Money Laundering) software helps businesses detect, prevent, and report suspicious financial activity, combining identity verification, watchlist screening, and transaction monitoring in one platform.
- q: How much does AML compliance software cost?
  a: Pricing ranges from under $1 per identity check for pay-as-you-go tools to custom enterprise contracts, often $1,000+ per month, depending on volume, screening depth, and support level.
- q: Is AML software legally required?
  a: Regulated industries such as banking, payments, and crypto are generally required by law to run AML checks. Dedicated software is not always mandated by name, but it is the practical way most firms meet the requirement.
- q: What is the difference between KYC and AML?
  a: KYC (Know Your Customer) verifies who a customer is at onboarding. AML is the broader program, including KYC, that also monitors transactions and screens against sanctions and PEP lists on an ongoing basis.
- q: Can small businesses use enterprise-grade AML tools?
  a: Yes. Many providers on this list offer pay-as-you-go or tiered pricing, so a startup can start with per-check pricing and upgrade as transaction volume grows.
- q: How often are sanctions and PEP lists updated?
  a: Reputable AML providers refresh sanctions, PEP, and adverse-media data daily or in near real time, since regulators can add or remove names at any time.
