explainer_html:
- '<section class="container-narrow section-border-top" id="methodology-deep-dive" style="padding:28px 0;">

  <h2 style="font-size:19px;margin-bottom:10px;">What Crypto KYC Verifies — On-Chain and Off-Chain</h2>

  <p style="font-size:15px;line-height:1.7;margin-bottom:18px;">Crypto KYC does two jobs traditional KYC doesn''t: it verifies the person behind a wallet, and it screens the wallet''s on-chain history for exposure to sanctioned addresses, mixers, and darknet markets. The obligation to share that verification data between exchanges — not just check it internally — comes from FATF Recommendation 16, the Travel Rule.</p>

  <h3 style="font-size:14.5px;margin-bottom:10px;">Core capabilities compliance teams typically require</h3>

  <ul style="margin:0 0 18px;padding-left:20px;font-size:14.5px;line-height:1.75;">

  <li style="list-style:disc;">Wallet risk scoring against known illicit-activity clusters</li>

  <li style="list-style:disc;">Real-time sanctioned-address screening (OFAC SDN and equivalent lists)</li>

  <li style="list-style:disc;">Travel Rule message exchange between VASPs, typically over IVMS101-based protocols such as TRP, OpenVASP, Shyft, or VerifyVASP</li>

  <li style="list-style:disc;">Ongoing on-chain transaction monitoring (KYT) as a wallet''s risk profile changes after onboarding</li>

  </ul>

  <h3 style="font-size:14.5px;margin-bottom:8px;">How this differs from AML</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">Crypto KYC screens wallets and on-chain flows specifically; general <a href="/providers/aml/">AML software</a> screens traditional banking transactions and PEP/sanctions lists. The screening engines often overlap — several platforms in this list also appear in our AML category — but a crypto-specific vendor is built to read blockchain data natively.</p>

  <h3 style="font-size:14.5px;margin-bottom:8px;">Regulatory context</h3>

  <p style="font-size:14.5px;line-height:1.65;margin-bottom:18px;">Key references: FATF Recommendation 16 (the Travel Rule), the EU''s MiCA framework, and the VASP (Virtual Asset Service Provider) designation that determines which Travel Rule obligations apply to a given business.</p>

  <a class="entity-card__cta" href="/methodology/">See how we evaluate every provider on this list in our full methodology →</a>

  </section>'
