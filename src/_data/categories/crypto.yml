faq:
- q: What is crypto KYC?
  a: Crypto KYC verifies the identity of a person opening an exchange or wallet account, and pairs that with wallet-risk screening so the exchange knows whether the funds are tied to sanctioned or illicit addresses.
- q: What's the difference between KYT and KYC?
  a: KYC verifies who a person is at signup. Know Your Transaction (KYT) monitors on-chain activity afterward, since a wallet that looked clean at onboarding can later interact with a sanctioned address.
- q: Do I need Travel Rule compliance software if I only serve retail crypto users?
  a: Likely yes above the relevant transfer threshold. FATF Recommendation 16 applies to Virtual Asset Service Providers regardless of whether their end users are retail or institutional.
- q: What is a VASP?
  a: A Virtual Asset Service Provider (VASP) is any business that exchanges, transfers, or safekeeps virtual assets on behalf of customers — exchanges, custodians, and many wallet providers all qualify.
- q: How does crypto KYC differ from traditional AML?
  a: Crypto KYC screens wallets and on-chain transaction flows specifically. Traditional AML software screens banking transactions and PEP/sanctions lists; the two disciplines often share the same underlying screening engine.
- q: Does MiCA require Travel Rule compliance?
  a: MiCA governs crypto-asset issuance and service-provider licensing in the EU; the EU's separate Transfer of Funds Regulation (TFR) is what applies the Travel Rule to crypto transfers, and the two frameworks are designed to work together.
