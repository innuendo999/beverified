faq:   # questions from Google Search Console (homepage, last 3 months, Oct 2026)
  - q: Is BeVerified the same as BeenVerified?
    a: No. BeVerified.org is an independent review site for KYC, KYB and AML software used by compliance teams. It is a different organisation from BeenVerified, the US people-search service, and it does not run background checks or sell personal records.
  - q: Can BeVerified verify my identity or my business?
    a: No. We don't perform identity, business or AML checks ourselves. We compare the providers that do, so you can choose one to run checks for your customers. Start with a use case (eKYC, KYB or AML) to see the providers we ranked for it.
  - q: Which trusted KYC platform gets the highest ratings from compliance teams?
    a: "{top}"   # generated from provider scores
  - q: Which beneficial ownership (KYB) check provider is worth the investment?
    a: "{kyb}"   # generated from the KYB ranking
  - q: Is there a free KYC check?
    a: BeVerified doesn't run checks, free or paid. For low-cost options, see our Budget KYC ranking, and check each review for the vendor's published pricing and trial terms.
  - q: What does "verified" mean on a BeVerified AML or KYC review?
    a: It means we re-checked the provider's pricing, coverage and certifications on the date shown. We aim to re-check each review every 90 days, and the "Last verified" date only changes after a real re-check. We may earn a commission from some links. Payment never changes scores or ranking order.
