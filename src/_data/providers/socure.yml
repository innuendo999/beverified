verdict: 'Socure is strongest where it started: US consumer onboarding, where it checks a person''s details, phone and email against identity data before asking anyone for a document. RiskOS puts that next to document checks, watchlist screening, case management and KYB through partners. Startups can sign up without a sales call and pay $0.80 to $1.30 per evaluation, with $1,000 of free credits a month. The weak spot for a liveness-led buyer is evidence: Socure calls its liveness NIST PAD Level 2, but we found no published iBeta letter, so treat that as the vendor''s claim.'
what_is:
- 'Socure is a US identity verification and fraud prevention company founded in 2012 and based in Incline Village, Nevada. Co-founder Johnny Ayers is chief executive. Its platform, RiskOS, grew out of the 2024 purchase of Effectiv and combines Socure''s own models (KYC, fraud and synthetic identity scores, document verification) with partner data in one workflow engine. Socure also bought Berbix in 2023 and the agentic investigations startup Fravity in August 2026, when a round led by Summit Partners valued it at $5.2 billion. In October 2026 Socure said it had more than 6,000 customers and serves customers in 190+ countries.'
features:
- 'KYC on data alone (Socure Verify): checks a person''s details against identity data without a document; Socure says this eKYC covers 160+ countries.'
- 'Predictive DocV: ID document and selfie checks with liveness, 1:1 face match, repeat-fraud face search on the Premier tier, and injection and deepfake detection.'
- 'Mobile driver''s licences from Google Wallet and Samsung Wallet can be verified in DocV (US, launched September 2026).'
- 'Watchlist screening for sanctions, PEP (with relatives and close associates) and adverse media, with continuous monitoring and case management in RiskOS.'
- 'Business onboarding (KYB) with UBO checks, run through partner data such as Middesk and Baselayer inside the same RiskOS workflow.'
- 'Socure Pass reusable identity (passkey sign-in so returning users skip the document scan) and an Age Assurance flow that returns 18+, 21+ or 25+ flags.'
pricing:
  summary: 'Socure publishes prices for its self-serve Socure Launch tier: $0.80 per evaluation for document verification (DocV), $0.90 for DocV with watchlist screening, $1.00 for KYC, fraud and watchlist checks with a DocV step-up, and $1.30 when prefill is added. Each account gets $1,000 of credits a month, and evaluations beyond that are billed at the listed rate. The page states no minimum commitment or contract term. Socure Enterprise, which adds business onboarding, age assurance, bank account verification and custom workflows, is usage-based and quoted.'
