verification_notes:
- 'New review, written 2026-11-09 from public sources. Score computed by scripts/rescore.mjs (v3.1); owner to confirm before merge.'
- 'Liveness: Socure pages say "NIST PAD Level 2"; no Socure, Berbix or DocV row found on iBeta''s confirmation-letter page (source 15, both halves read). Kept vendor_stated; Fraud defense scores 2 under v3.1 until a lab letter is found.'
- 'ISO 27001 and SOC 2 come from Socure''s security page; trust.socure.com (SafeBase) not opened. Kantara IAL2 is a 2022 news report; the Kantara Trust Status List does not render, so current status unconfirmed.'
- 'FedRAMP Marketplace shows "FedRAMP Certified", Moderate, status as of 19 March 2025, no "certified since" date (source 3).'
- 'Socure Launch: pricing page states no minimum or contract term; pricing.model.minimum left null (not credited as "no minimum").'
- 'Coverage counts (6,000 document types, 190 countries, 160+ eKYC countries) are from a July 2025 Socure press release; the DocV product page gives no counts.'
- 'Transaction monitoring rests on one press-release sentence (source 13); the RiskOS docs describe Payment Screening, not a rules-based monitoring engine. Confirm with Socure before relying on it.'
- 'G2 rating 4.5 from 103 reviews taken from owner screenshots of the G2 profile on 2026-11-09 (G2 refuses fetch). The newest review shown (20 Aug 2026) is labelled "G2 invite on behalf of seller" and "Incentivized Review"; no praise or criticism themes added from a single review. Gartner Peer Insights "Socure KYC" showed 1 rating (search snippet only), not added.'
- 'Not on the page: no incidents or regulatory actions found for Socure in the last 24 months (web search 2026-11-09).'
- 'Not in rankings.yml and not in pricing.index (KYC Pricing Index); both are owner decisions.'
