faq:
- q: How much does Socure cost?
  a: 'Socure publishes self-serve prices for Socure Launch: $0.80 per evaluation for document verification, $0.90 with watchlist screening, $1.00 for KYC, fraud and watchlist checks with a document step-up, and $1.30 with prefill. Each account gets $1,000 of credits a month. Enterprise pricing is usage-based and quoted.'
- q: Does Socure have a free trial?
  a: 'Socure Launch includes $1,000 of credits every month, and you can create a sandbox account without a sales call. Evaluations beyond the credits are billed at the listed rate.'
- q: Who owns Socure?
  a: 'Socure is a private, venture-backed company. Co-founder Johnny Ayers is CEO. Its August 2026 round, led by Summit Partners with Goldman Sachs Alternatives, Wells Fargo and Docusign, valued it at $5.2 billion.'
- q: Is Socure's liveness detection certified?
  a: 'Socure describes its liveness as NIST PAD Level 2. We found no Socure or DocV entry on iBeta''s public list of ISO/IEC 30107-3 confirmation letters (checked November 2026), so we treat the level as vendor-stated.'
- q: Does Socure do KYB?
  a: 'Yes, through RiskOS Business Onboarding. It verifies the business and its owners in one workflow, using partner data such as Middesk and Baselayer, and screens business entities with Watchlist Plus.'
- q: Is Socure FedRAMP authorised?
  a: 'Yes. Socure for Government (SocureGov) is listed on the FedRAMP Marketplace at the Moderate impact level as a SaaS offering.'
