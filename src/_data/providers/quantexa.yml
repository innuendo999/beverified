verdict: 'Quantexa''s foundation is entity resolution: stitching fragmented, siloed data into a single graph network to surface hidden relationships. Its AML, fraud and KYC applications build on that rather than on transaction-monitoring rules alone. Valued at about $2.6B after its March 2025 Series F and naming HSBC, Standard Chartered and ING among its users, it is built mainly for enterprise scale, though a separate Cloud AML product now targets US mid-size and community banks.'
what_is:
- Quantexa is a decision-intelligence software company founded in 2016 and headquartered in London, UK, led by co-founder and CEO Vishal Marria. It reports more than 900 employees, 17 offices and activity in 100 countries, and was valued at about $2.6 billion when it raised a $175 million Series F in March 2025. Its Decision Intelligence Platform resolves fragmented data into unified entities and network graphs to power AML, fraud detection, and KYC applications for banks, insurers, telecoms and government agencies. In August 2026 Marria told Reuters the company could list in the UK, the US or both, with no timing set.
features:
- 'Entity resolution: unifying fragmented data into single, resolved entities.'
- Graph analytics to surface hidden relationships.
- Contextual monitoring for AML and financial-crime detection, plus Quantexa Cloud AML for US mid-size and community banks.
- Fraud detection built on the same graph foundation.
- KYC and data-management applications.
- Quantexa AI and Q Assist generative AI tools on top of the platform.
