verdict: 'Quantexa''s foundation is entity resolution: stitching fragmented, siloed data into a single graph network to surface hidden relationships. Its AML, fraud and KYC applications build on that rather than on transaction-monitoring rules alone. Valued at roughly $2.6B in 2025 and serving tier-1 banks and governments, it''s built for enterprise scale, not smaller teams.'
what_is:
- Quantexa is a contextual decision-intelligence company founded in 2016 and headquartered in London, UK, co-founded by CEO Vishal Marria, with more than 800 employees and a valuation of approximately $2.6 billion as of 2025. Its platform resolves fragmented data into unified entities and network graphs to power AML, fraud detection, and KYC applications for tier-1 banks, governments, and large enterprises across 70+ countries.
features:
- 'Entity resolution: unifying fragmented data into single, resolved entities.'
- Network and graph analytics to surface hidden relationships.
- Contextual monitoring for AML and financial-crime detection.
- Fraud detection built on the same graph foundation.
- KYC and data-management applications.
- Enterprise-scale big-data architecture.
