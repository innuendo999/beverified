pros:
- Screening, adverse media, transaction monitoring, fraud, KYB and risk scoring share one customer record and one risk score
- Public ISO/IEC 27001 and ISO 9001 certificates, a vendor-stated SOC 2 Type II report and a choice of EU, UK or Türkiye hosting
- Capterra reviewers regularly praise its support and how easy the API is to integrate
cons:
- No published price for the platform; only the Sanction Scanner screening plan is priced
- No document or biometric identity verification; it relies on partners such as Sumsub, Veriff or Onfido
- Public API documentation covers only the Sanction Scanner screening API, not monitoring, fraud or KYB
