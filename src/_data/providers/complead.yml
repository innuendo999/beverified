verification_notes:
- New record, first review 2026-10-23. Covers Complead as the whole platform; Sanction Scanner keeps its own review at /providers/sanction-scanner/. Owner confirmed it is a rebrand, not an acquisition, which the founder's post (source 2), Paradergi (source 31) and Dünya (source 32) also say. Score and grade are a proposal for the owner to confirm.
- 'Name styling: the company writes its name in lowercase on its own site; G2, Foreks, Paradergi and Dünya write Complead. Owner chose Complead (23 Oct 2026); quotes and article titles keep the original lowercase.'
- 'Rebrand date: announcement post dated 21 Sep 2026 (source 2); Complead''s Deloitte post (source 35) says "On 28 September 2026 we changed our name to complead". Copy says September 2026.'
- 'Founded: 2019 in the founder''s bio on the rebrand post (source 2), the Hepsiburada post (source 38) and CB Insights (source 34); 2020 on complead.ai/company and careers (sources 3, 21), on G2 and in Dünya (source 32), which matches the UK incorporation date of 11 Aug 2020 (source 25). Owner chose 2020 (23 Oct 2026), cited to complead.ai/company (source 3); the Sanction Scanner record uses the same year.'
- 'Legal entity: website terms updated 22 Sep 2026 name Complead Inc., a Delaware corporation, registered agent in Wilmington (source 19); not checked in the Delaware register (no free public lookup opened). The careers page calls the UK entity "Complead Ltd", but Companies House has no company named Complead (search 23 Oct 2026) and SANCTION SCANNER LTD (12804192) shows no previous or new name (source 25). The New York entity is described on sources 2 and 3 but its legal name is not given.'
- Companies House overview (source 25) still shows next confirmation statement date 10 Aug 2026, due 24 Aug 2026, last statement 10 Aug 2025, without an overdue label. Filing history did not load in the fetcher. Re-check whether the 2026 confirmation statement was filed.
- 'Funding: Dünya (source 32, 19 Oct 2026) quotes the founder that the company took no outside investment and that shares belong to founders and employees; Companies House PSC (source 26) shows Coşkun with 75% or more. CB Insights (source 34) still lists TT Ventures and Mastercard Lighthouse Türkiye as investors with the latest round "Incubator/Accelerator"; Mastercard''s release (source 33) describes an acceleration programme only.'
- 'ISO certificates opened 23 Oct 2026 (sources 17, 18): holder SANCTION SCANNER LTD, 27 Old Gloucester Street, London; scope computer programming activities; issued 02.07.2026, valid to 01.07.2027. The certification body and accreditation body are not named in the PDF text and no register link is given. Treated as confirmed because the certificates were opened, per spec; check the issuing body''s logo or register if the owner wants an independent register entry.'
- 'SOC 2 Type II: vendor-stated on the Trust Center (source 15), report under NDA, no report date. Not seen.'
- 'Trust Center details (source 15) partly come from the owner''s screenshot of 23 Oct 2026 because the fetcher returned a shorter page: 99.995% uptime over the last 12 months, annual third-party penetration test, NDA documents within one business day, EU, UK or Türkiye residency, TLS 1.2+ and AES-256, deletion within 30 days, SCCs, customer data not used to train shared models. Only the pen test, residency, SOC 2 status and one-business-day NDA turnaround are used in the record.'
- 'Hosting: data protection page (source 16) says the platform runs on Microsoft Azure; the Trust Center does not name the cloud provider.'
- 'Data counts are inconsistent on Complead''s own pages: 3,000+ lists, sources or data points (sources 1, 5); 3,500+ consolidated lists (source 4) and entries (source 38); 220+ countries for screening but 190+ for adverse media (source 6). Record uses 3,000+ lists and 220+ countries from the screening page.'
- 'Fusion modules: the homepage names SCORE, MONITOR, REACT and FILE; the platform page lists nine modules (case management, regulatory filings, consortium KB, connections graph, dashboard, rules engine, workflow automation, AI copilot, risk scoring). Module names are not used in the record.'
- 'Vendor performance figures not used: 77% of routine cases auto-resolved, up to 97% fewer false positives, sub-200 ms API, 99.995% uptime SLA, customer case-study results (Moldcell, AirHelp, Octet, Ateshgah Life).'
- 'Customers: homepage logos (NN Group, BMW, Unity, Zurich, Stellantis, UNOPS and others) and press lists (Türk Telekom, iyzico, Togg, Hepsiburada) are not used in the record; Hepsiburada has a named quote in a vendor post (source 38).'
- 'API documentation: the only public docs found are developer.sanctionscanner.com (source 24), branded Sanction Scanner, covering six screening services with basic authentication. No Complead API reference, SDK, changelog or transaction monitoring and KYB endpoints are public. Sample endpoints appear only on product and integrations pages (sources 5, 14).'
- 'Pricing: complead.ai/pricing does not load and no pricing appears on Complead pages. Sanction Scanner pricing (source 22) shows €990 with a 100 entities per month limit and monthly or annual billing; it does not mention Complead. No third-party platform price found; Capterra shows no starting price.'
- 'Recognition: Deloitte Technology Fast 50 Türkiye 2022, 2023, 2024 and 2026 per Foreks (source 30) and Complead (source 35); Deloitte''s own page did not yet list 2026 winners. Chartis RiskTech100 2027 Disruptor in Risk Intelligence and Data Management is vendor-stated (source 36); Chartis''s ranking page (source 37, 24 Sep 2026) is paywalled and does not show the name. Neither is used in the rendered copy beyond the Fast 50 note in the track record criterion.'
- 'User ratings: G2 product titled "Complead (formerly Sanction Scanner)" shows 4.8 from 70 reviews (source 28), no review text visible; the Sanction Scanner record still shows 69 for the same G2 listing. Capterra (source 29) is still titled Sanction Scanner, 5.0 from 27, ease of use and customer service 4.9; themes taken from its visible reviews, which concern the screening product. Gartner Peer Insights listing "Complead fusion platform" exists but did not load; Complead shows 5.0 on its homepage and 4.8 on its company page. Complead''s company page shows G2 4.7, its homepage 4.8.'
- 'Support: no support email, hours or SLA published; contact page lists office phone numbers and a form (source 20). Status page at status.sanctionscanner.com not opened.'
- 'Regulatory: no enforcement action, breach disclosure or litigation involving Complead or Sanction Scanner found in searches to 23 Oct 2026.'
- 'Logo: owner supplied src/assets/img/wordmarks/complead.png; brand colour not read (complead.ai blocked to direct download and the fetcher returned no CSS). Wikidata id and kg_mid not found.'
