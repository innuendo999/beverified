faq:
- q: Is Complead the same as Sanction Scanner?
  a: It is the same company under a new name. Sanction Scanner rebranded as Complead in September 2026, and founder and CEO Fatih Coşkun describes it as a rebrand, not an acquisition, with no contract change or migration for existing customers. Sanction Scanner continues as Complead's sanctions and PEP screening product and has its own review on BeVerified; this page covers the whole Complead platform.
- q: What does Complead do?
  a: Complead sells AML and fraud compliance software. Its Fusion platform combines sanctions, PEP and adverse media screening, transaction and payment monitoring, fraud detection, KYB and UBO checks and customer risk assessment on one customer record, with case management, SAR and STR drafting and AI agents that triage alerts.
- q: How much does Complead cost?
  a: 'Complead does not publish platform prices and quotes after a demo. The only published price is for its screening product, Sanction Scanner: the Starter plan costs €990 a month for 100 entities, with two months free on annual billing. Transaction monitoring and customer risk assessment are in the quoted Enterprise plan.'
- q: Does Complead verify identity documents?
  a: No. Complead's KYC page says document and biometric identity verification is handled by your IDV provider, and the verified identity feeds its risk model as an input. Its integrations page lists Sumsub, Veriff, Onfido, Persona, Socure, Jumio and iDenfy.
- q: Where is Complead based?
  a: The founder says the company made London its headquarters when it incorporated in the UK in 2020. Complead lists offices in London, New York and Istanbul, where most of the team works. Its website terms name Complead Inc., a Delaware corporation, and the UK company is still registered at Companies House as Sanction Scanner Ltd.
- q: Is Complead ISO 27001 or SOC 2 certified?
  a: Complead publishes ISO/IEC 27001:2022 and ISO 9001:2015 certificates issued to Sanction Scanner Ltd and valid until 1 July 2027, though the PDFs do not name the certification body. Its Trust Center says it has a SOC 2 Type II report, available under NDA, which we have not seen.
- q: Do Complead's AI agents close alerts on their own?
  a: 'They can, within rules you set. Complead says its AML agent labels each alert as a false positive, a true match or one for human review and routes it by confidence: in its example, cases above 90 close, 70 to 90 go to an analyst with the agent''s note, and lower scores escalate. Rules can run in dry run first, and the Nova AI assistant can draft changes but cannot change live settings without approval.'
- q: What are the best alternatives to Complead?
  a: ComplyAdvantage for deep sanctions and PEP data, Hawk AI for AI transaction monitoring at banks and fintechs, and Unit21 for agentic fraud and AML investigations. If you only need screening, Sanction Scanner, Complead's own screening product, has a published Starter plan.
