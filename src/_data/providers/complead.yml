verdict: 'Complead is Sanction Scanner under a new name. This review covers the whole platform: screening, transaction monitoring, fraud, KYB and risk scoring on one customer record, with AI agents that triage alerts. Its ISO 27001 and ISO 9001 certificates are public. Platform pricing is not published, and identity verification is left to partners.'
what_is:
- 'Complead is the name the business behind Sanction Scanner has used since September 2026. Founder and CEO Fatih Coşkun describes it as a rebrand, not an acquisition: existing customers keep their contracts, and Sanction Scanner continues as Complead''s sanctions and PEP screening product. The wider platform, which Complead calls Fusion, puts screening, adverse media, transaction and payment monitoring, fraud detection, KYB and customer risk assessment on one customer record with one risk score, case management and SAR or STR drafting. Complead says more than 800 companies in over 80 countries use it. Its website terms name Complead Inc., a Delaware corporation, while the UK company, Sanction Scanner Ltd, incorporated in August 2020, still holds the ISO certificates and has not changed its registered name. Companies House lists Coşkun as its only director and as holding 75% or more of its shares, and he told Dünya in October 2026 that the company has taken no outside investment.'
features:
- Sanctions, PEP and watchlist screening with ongoing monitoring, sold as Sanction Scanner. Complead cites 3,000+ lists from 220+ countries refreshed every 15 minutes, with fuzzy, phonetic and transliteration-aware matching.
- Adverse media screening across court and regulatory records, news and social sources in 30+ languages, with each item classified by offence, role and severity, per Complead.
- Transaction monitoring with a sector rule library, custom rules that can be back-tested on past transactions, real-time or batch scoring, and inline screening of SWIFT MT and ISO 20022 payment messages.
- Fraud prevention with device fingerprinting, behavioural signals, real-time payment decisions and merchant monitoring.
- KYB and UBO checks against registers and licensed sources in 160+ countries, with every party in the ownership chain screened, plus a configurable customer risk model with 500+ scoring templates.
- Case management with SAR and STR drafting, an AML agent that closes, routes or escalates alerts by confidence bands you set, and a Nova AI assistant that drafts rule changes but cannot change live settings without approval.
pricing:
