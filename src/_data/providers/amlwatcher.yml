verification_notes:
- 'Context: first review 2026-10-18 at AML Watcher''s request; link.type none (no commercial relationship recorded). Follow-up fact check 2026-10-22.'
- 'Legal entity: terms (Version 4, effective 31 July 2026, re-read 2026-10-22) name Risk Watcher LLC, Delaware, dba AML Watcher, 8 The Green #16077, Dover, DE 19901; Trustpilot shows the same address. The ISO certificate names AML Watcher.com LLC at that address. Delaware registry still not checked (search form only; no OpenCorporates or news hit for Risk Watcher LLC). Open: confirm both entity names in the Delaware registry.'
- 'ISO/IEC 27001 certificate AMER800493: the vendor-hosted PDF is still blocked to our fetcher by robots.txt (2026-10-22); contents as recorded on 2026-10-18. Americo''s register is a pop-up form (client name plus certificate number) we could not submit; no third-party listing found. IAF archive notice (https://iaf.nu/?p=6173): IAF stopped operating on 1 Jan 2026; accreditations issued under the IAF MLA before then stay valid for a transition period and signatories may join the Global Accreditation Cooperation MRA. UAF''s status under the new MRA not checked. Open: Americo register lookup and UAF status at the next re-check.'
- 'SOC 2: still no claim on the homepage, FAQ or in search (2026-10-22). Homepage shows ISO/IEC 27001, a GDPR notice and a Data Privacy Framework mark; DPF list entry not looked up.'
- 'Parent and group (re-checked 2026-10-22): team page heading "Shared Functional Teams • Parent Organisation" and "built and backed by Programmers Force"; about page "Born from" Programmers Force; Sept 2026 award release "backed by". programmersforce.com lists AML Watcher, Transaction Watcher, Media Watcher, Barie, Facia and The KYB, "ESTD 2016", 1000+ team. Ownership share and any registry link not confirmed. Shufti Pro: no page says it is a sister company; Shufti CEO Shahid Hanif says he co-founded Programmers Force before Shufti (https://pulse2.com/shufti-profile-shahid-hanif-interview/). Founder link only; not stated in the record.'
- 'Founded: not stated by AML Watcher. About page timeline starts in 2021; journey page starts in 2019 (2022 heading vs "By 2023" text). Latka shows 2019 with no source (https://getlatka.com/companies/aml-watcher); not used. Shown as Not publicly disclosed.'
- 'Leadership: Khurram Akhtar, Founder (full name in the 28 Sept 2026 award release; team and about pages show "Khurram A."). Oonagh van den Berg appointed Executive Director, Growth and Advisory, per the 17 Jul 2025 release, but she is not listed on the about or team page (2026-10-22); the record states only the appointment. About page now lists Raja Haris as Sales Growth Manager (earlier Head of Growth). No CEO named.'
- 'Funding: none disclosed; no round found in search (2026-10-22); Latka lists funding as not published. Shown as Not publicly disclosed.'
- 'Coverage figures still conflict across vendor pages (re-read 2026-10-22): PEP profiles 2.1M (client onboarding), 2.6M+ (MCP release Sept 2025, Transaction Watcher release), 6M+ (homepage, Travel Rule page); adverse media sources 5,000+ (client onboarding), 50K+ (homepage, FAQ, ABC page), 100,000+ (Sept 2026 award release), plus "100,000+ data sources" on several pages; regimes 200+ and 215+ (both on the sanctions page); watchlists 1,300+ (client onboarding, FAQ) and 3,500+; 236 sanction lists (client onboarding); countries 232+ (founder quote, team page), 235+ (most pages), 325+ (journey page), 240 rows in the API supported-countries table (VA used twice). Sanctions page says "updated every 15 minutes" in the hero and changes detected "in seconds" in the body. OFAC, UN, EU and UK HMT appear in the sanctions page meta description, not its visible body; the vessel page names OFAC, UN and EU. Record keeps 215+ regimes, 3,500+ watchlists and 15-minute updates.'
- 'Data provenance: "proprietary" per the MCP release and "built in house" per the Sept 2026 award release; no external data supplier named. Not independently verified.'
- 'Pricing page re-read 2026-10-22: Basic, Premium, Enterprise with "Starting From" and no figure; yearly toggle "Save 17%"; minimum 100 monitored entities; overage at the agreed per-unit rate; unused credits do not roll over. Prices may be rendered by script; still not checked in a real browser. G2 (vendor-provided, re-checked): Basic from $95 and Premium from $450, both "100 Search Per Month", Enterprise "Contact Us". Capterra (re-checked): from $95 flat rate per month, Basic 100 checks raisable to 500, no Premium price. GetApp not re-opened. Client onboarding page "as low as 1 cent per check" with no conditions; not used.'
