verdict: 'AML Watcher fits small and mid-sized fintechs and payment firms that want sanctions, PEP and adverse media screening by API or dashboard, with on-premises or in-country hosting as an option. Its ISO/IEC 27001:2022 certificate checks out. The weak spots are evidence and price: coverage figures change from page to page, the pricing page shows no prices and there is no SOC 2 report. Ask for a written quote before you sign.'
what_is:
- AML Watcher is a screening and monitoring product sold by Risk Watcher LLC, a Delaware company that does business under the AML Watcher name. It screens people and companies against sanctions lists, watchlists, PEP data, adverse media and leak databases, with ongoing monitoring, batch search, case management, configurable risk scoring and Arabic name matching. Newer products are Transaction Watcher for transaction monitoring (announced in late 2025) and TruRisk, a paid AI add-on that ranks name matches using date of birth, nationality and other identifiers. AML Watcher says final decisions stay with the compliance team. It also offers crypto wallet screening, vessel screening and a Travel Rule module, and it exposes its data to AI agents through an MCP server.
- The company says AML Watcher was "born from" Programmers Force, a software group that lists AML Watcher next to its other products Facia, The KYB, Transaction Watcher and Media Watcher. Programmers Force shows an "ESTD 2016" badge on its site, and AML Watcher's team page calls it the parent organisation, with 1,000+ staff across the group. AML Watcher gives no founding year of its own. Its history page starts the data work in 2019 and dates its Dubai and Singapore offices to 2025. The founder is Khurram Akhtar, and Oonagh van den Berg, founder of Raw Compliance, joined as Executive Director, Growth and Advisory, in July 2025. AML Watcher discloses no funding. Its published case studies cover LaFinteca, a Latin American payments company, and BostonTrading, a crypto fund manager.
features:
- Sanctions screening against lists including OFAC, UN, EU and UK HMT, with AML Watcher stating 215+ regimes, 3,500+ watchlists and sanctions updates every 15 minutes.
- PEP screening to Level 4 with relatives, close associates and aliases, plus adverse media screening with ongoing monitoring.
- Anti-bribery and corruption screening against court and law enforcement records, media and leak databases.
- Transaction Watcher for transaction monitoring, with 150+ typologies and custom rules, per AML Watcher.
- TruRisk, a paid AI add-on that ranks name matches and writes an explanation for the analyst who makes the final decision.
- REST API with webhooks, bulk search and a public change log, an MCP server, and cloud, in-country or on-premises deployment.
