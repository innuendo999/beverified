faq:
- q: How much does AML Watcher cost?
  a: AML Watcher's pricing page lists Basic, Premium and Enterprise plans but shows no prices. Its listings on G2 and Capterra give $95 a month for Basic, and G2 gives $450 a month for Premium, each with 100 searches a month. Annual billing saves 17%, the smallest plan covers 100 monitored entities, and Enterprise is quoted. Get the price in writing, because the vendor's own page does not show it.
- q: Does AML Watcher have a free trial?
  a: Yes. The pricing page offers a free trial with the first five searches free and does not give a time limit. The FAQ page shows a separate "Try 10 searches for free" offer, so check which applies when you sign up.
- q: Which sanctions lists does AML Watcher cover?
  a: Its sanctions page names OFAC, UN, EU and UK HMT and says it covers 215+ sanctions regimes and 3,500+ watchlists, updated every 15 minutes. The same page also says 200+ regimes, and it does not publish the full list. Ask for the source list if you need specific national lists.
- q: Is AML Watcher ISO 27001 or SOC 2 certified?
  a: Yes for ISO/IEC 27001. Certificate AMER800493 to ISO/IEC 27001:2022 was issued on 8 April 2026 by Americo Quality Standards Registech, accredited by the United Accreditation Foundation, and runs to 7 April 2029 subject to yearly surveillance audits. Its scope covers the design, delivery and support of AML Watcher's cloud and API AML and KYC services. We found no SOC 2 claim.
- q: Who owns AML Watcher?
  a: AML Watcher's terms name Risk Watcher LLC, a Delaware company, as the contracting entity. The company calls Programmers Force its parent organisation and says it was built and is backed by that group, which also lists Facia and The KYB among its products.
- q: Can AML Watcher run on-premises?
  a: Yes, per the vendor. AML Watcher offers cloud, in-country hosting and on-premises deployment, where the screening data sits on the customer's own servers and updates arrive automatically. It announced in-Kingdom data residency for Saudi customers in November 2025. It does not publish technical requirements or on-premises pricing.
- q: Does AML Watcher handle the crypto Travel Rule?
  a: It sells a Travel Rule module and presents it as its own product, not a partner's. The page does not name the messaging protocols it supports or the size of its VASP network, so ask how it connects to counterparties before you rely on it.
- q: What is the best alternative to AML Watcher?
  a: ComplyAdvantage is the closest alternative if you want a published starting price and SOC 2 as well as ISO/IEC 27001 claims. Sanction Scanner and NameScan both publish their screening prices on their own sites.
