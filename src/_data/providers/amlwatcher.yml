verification_notes:
- 'New record, first review. AML Watcher asked to be listed; link.type set to none (no commercial relationship recorded).'
- 'Legal entity: terms name Risk Watcher LLC (dba AML Watcher), 8 The Green #16077, Dover, DE 19901, Delaware law. The ISO certificate file name says "AML_Watcher.com_LLC". Trustpilot shows the same Dover address. No registry entry opened; Delaware registry not checked.'
- 'ISO/IEC 27001: FAQ says "ISO/IEC 27001 certified"; footer links a certificate PDF (uploaded 2026-04). The fetcher was blocked by robots.txt and the shell has no internet, so the certificate body, scope, number and expiry were not read. Status vendor_stated. Open the PDF in a browser and check the certification body register at the next review; if it checks out, move to confirmed and raise Compliance to about 4.2.'
- 'SOC 2: no claim found on any page opened or in search. GDPR compliance notice PDF and a Data Privacy Framework logo on the homepage not used.'
- 'Parent and group: Programmers Force named as parent organisation (team page), "born from" (about page) and "backed by" (Sept 2026 press release). programmersforce.com lists AML Watcher, Transaction Watcher, Media Watcher, Facia, The KYB and Barie, with an "ESTD 2016" badge and offices in Singapore, UAE, UK, France, Lithuania, Hong Kong and Pakistan. No registry check of the ownership.'
- 'Shufti Pro: no page we opened says AML Watcher and Shufti are sister companies. Shufti CEO Shahid Hanif says in a Pulse2 interview (https://pulse2.com/shufti-profile-shahid-hanif-interview/) that he co-founded Programmers Force before founding Shufti in 2017. That is a founder link, not a group link; not stated in the record. Shufti Pro has its own record (shufti-pro.yml).'
- 'Founded: not stated. The journey page starts with work before 2019, 2019 "laying the foundation", 2020 testing, 2021 on the about page timeline and 2022 or 2023 scaling (inconsistent). The founder "led an IPO in Sweden in 2019" for a fintech and crypto company (unnamed). Shown as Not publicly disclosed.'
- 'Leadership: Khurram Akhtar, Founder (full name in the Sept 2026 press release; team page shows "Khurram A."). Raja Haris, Head of Growth; Oonagh van den Berg, Executive Director, Growth and Advisory (July 2025). No CEO title found.'
- 'Funding: none disclosed by AML Watcher; no round found in search. Latka profile not opened. Shown as Not publicly disclosed.'
- 'Coverage figures conflict across vendor pages: PEP profiles 2.1M (client onboarding page), 2.6M+ (MCP release Sept 2025, Transaction Watcher release), 6M+ (homepage); adverse media 5,000+ (client onboarding), 50K+ (homepage, ABC page), 100,000+ (Sept 2026 release); regimes 200+ and 215+ (same sanctions page); watchlists 1,300+ and 3,500+; 236 sanction lists (client onboarding); countries 235+ (most pages), 325+ (journey page, 2023), 240 rows in the API supported-countries table (239 unique codes). Record uses 215+ regimes, 3,500+ watchlists and 15-minute updates from the sanctions page and avoids PEP and media totals except to show the conflict.'
- 'Data provenance: "proprietary" and "built in-house" per the MCP release and the Sept 2026 release; no external data supplier named. Not independently verified.'
- 'Pricing: pricing page text shows Basic, Premium, Enterprise with blank "Starting From" fields. The prices may be rendered by script and missed by the fetcher; re-check in a browser. G2 (vendor-provided): Basic from $95/month, Premium from $450/month, 100 searches each. Capterra: Basic from $95/month with 100 checks, up to 500. GetApp: from 95 per month, free trial and free version listed. Client onboarding landing page claims "as low as 1 cent per check" with no conditions; not used as a price.'
- 'Free trial: pricing page "first five searches for free"; FAQ page banner "Try 10 searches for free"; client onboarding page offers a free proof of concept. Record states five and flags the ten in the FAQ.'
- 'API: docs at doc.amlwatcher.com (Docusaurus). Base URL api.amlwatcher.com, bearer token, up to 5 API keys per user with 1 to 365 day expiry. Change log from v1.0 (13 Oct 2023) to 29 Apr 2026 (TruRisk webhook). No SDKs, sandbox or test keys documented. Pricing page rate limits: 1, 3 and up to 5 requests per second by plan.'
- 'TruRisk: paid add-on (Dec 2025 release); release says "Final outcomes remain with compliance teams". Vendor figures conflict (up to 85% and up to 95% false-positive reduction, 90% less review time, 70 to 80% less manual work); none used.'
- 'Transaction monitoring: Transaction Watcher release datelined 13 Oct 2025, published 5 Dec 2025; 150+ typologies and 10,000+ custom rules per vendor. Programmers Force lists Transaction Watcher as a separate product.'
- 'Travel Rule: presented as AML Watcher''s own ("Our system handles the complex data exchange process"); no protocol (TRP, TRISA, IVMS101), network size or partner named. Not enough to add the travel-rule category.'
- 'Aircraft screening (from the listing request): not found. The vessel screening page names OFAC, UN and EU lists and IMO checks only; no aircraft page in the site menus.'
- 'On-premises: on-premise page describes datasets on the customer''s servers with automatic updates; no requirements or pricing. Saudi in-Kingdom hosting and private cloud per the Nov 2025 release; no cloud provider named.'
- 'Crypto wallet screening: no chains, assets or data supplier named. Crypto category not added (the crypto list is for crypto KYC; AML Watcher has no identity verification product of its own).'
- 'Chartis: the journey page says AML Watcher was recognised as a "Market Disruptor in the Chartis RiskTech100 rankings" in the 2024 section; the homepage shows a Chartis badge. The Risk.net RiskTech100 2024 page does not list vendors and Chartis pages found in search do not mention AML Watcher. Not confirmed; not stated in the record.'
- 'Award: "Excellence in RegTech Solutions", Fintech Week Awards and Expo 2026, Singapore (16 to 17 Sept 2026), per AML Watcher''s release. Organiser page not opened; not stated in the record.'
- 'Customers: homepage logos GMoney, Zerocap, Incode, JIF, BIDV, Saif Zone, Deloitte, Euro Exim Bank and Creem are not labelled by role; not used. Case studies: LaFinteca and BostonTrading. "10,000+ businesses" and "25% of global KYC volume" are vendor claims, not used. Partners: Optimiza (REDKEYS AML, MENA, Oct 2026), GAFA (CAML training, July 2026).'
- 'User ratings: G2 4.7 from 12 reviews (no review text visible). Trustpilot TrustScore 4.3 from 8 reviews, all 5 stars, profile claimed Aug 2024, Trustpilot notes the company has not recently invited reviews. Capterra lists the product with 0 reviews; GetApp 0 reviews. Themes taken from visible Trustpilot reviews only.'
- 'Support: FAQ says 24/7 by phone, text and email, response in 1 to 10 minutes; Capterra lists 24/7 live rep and chat. No SLA document found.'
- 'Regulatory: no enforcement action, breach disclosure or litigation involving AML Watcher or Risk Watcher LLC found in searches to Oct 2026.'
- 'Wikidata id not found; kg_mid unknown. LinkedIn pages blocked to the fetcher.'
