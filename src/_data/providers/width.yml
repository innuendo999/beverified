  - Banks, payment firms and VASPs in Singapore or elsewhere in Asia-Pacific that already use WIDTH or Cynopsis for KYC or screening are WIDTH's clearest fit for Travel Rule.
  - VASPs whose counterparties sit on TRUST, TRISA, GTR or CODE should ask how those transfers are handled, since WIDTH names none of these networks.
