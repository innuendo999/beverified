pros:
- Travel Rule records sit in the same platform as KYC, KYB, wallet screening with Chainalysis, Elliptic and TRM Labs data, and case management
- Names a wide set of routes (TRP, Sygna Bridge, Notabene, Veriscope, OpenVASP and direct) with fallback per counterparty, and checks counterparties by LEI and pinned key
- Choice of data region (Singapore, the EU or the UAE) and Satoshi test or signature proofs for self-hosted wallets
cons:
- None of the networks it names lists WIDTH, and there are no public Travel Rule API docs
- No Travel Rule price published, and the ISO/IEC 27001:2022 certificate is shared only under NDA with no certification body named
- WIDTH Pte. Ltd. was registered in January 2026 after Vernal Capital bought Cynopsis, and no Travel Rule customer is named
