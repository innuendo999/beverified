faq:
- q: How much does WIDTH cost?
  a: WIDTH publishes no Travel Rule price and sends a custom quote after a demo. Its pricing page lists Growth at $1,499 a year and Pro at $2,499 a year for its onboarding and screening platform, Enterprise on request, and a full KYC check at $0.50 as a promotional rate until 31 December 2026. It does not say whether Travel Rule is in any of these plans.
- q: Which Travel Rule networks does WIDTH support?
  a: WIDTH says it sends IVMS101 data over TRP, Sygna Bridge, Notabene, Veriscope and OpenVASP, or directly between VASPs, and picks the route per counterparty with fallback. We could not confirm any of these from the other side. The Sygna Alliance page and OpenVASP's TRP page do not list WIDTH, and we found no announcement from Notabene or Veriscope. WIDTH does not name TRUST, TRISA, GTR or CODE.
- q: How does WIDTH handle self-hosted wallets?
  a: WIDTH says it follows each jurisdiction's rule, asking for a self-declaration and, where proof is required, a Satoshi test or a signature, with risk screening on top. A configurable policy can hold the transfer. It does not publish which chains or wallets the proofs work with, and we found no AOPP or screenshot method.
- q: Is WIDTH ISO 27001 certified?
  a: WIDTH says it is ISO/IEC 27001:2022 certified and sends the certificate, a penetration test summary and a DPA to qualifying buyers under NDA. It does not name the certification body, and we found no register entry, so we treat it as vendor-stated. For ISO/IEC 27701, its security and demo pages say certification is in progress, while its October 2026 launch release says it was achieved. We found no SOC 2 claim.
- q: Is WIDTH the same company as Cynopsis Solutions?
  a: WIDTH grew out of Cynopsis Solutions, a Singapore regtech company founded in 2014. WIDTH says Vernal Capital bought Cynopsis in October 2025. The WIDTH brand is run by WIDTH Pte. Ltd., registered in Singapore on 21 January 2026, while Cynopsis Solutions Pte. Ltd. is still live and says it keeps serving its clients. Ask which company you would contract with.
- q: Does WIDTH also do KYC and wallet screening?
  a: Yes. WIDTH sells KYC with face match and passive liveness, KYB, transaction monitoring and case management, plus DART, which screens wallets and transactions with a 0 to 100 risk score. Its KYT page names Chainalysis, Elliptic and TRM Labs as wallet data sources on 30+ networks. The Travel Rule record is kept next to the customer file.
- q: What is the best alternative to WIDTH?
  a: Ospree if you want a hosted Travel Rule API with wallet screening and routes that TRISA and OpenVASP confirm. VerifyVASP if your counterparties are mostly Asia-Pacific exchanges on Sygna Bridge or CODE. 21 Analytics if many transfers go to TRUST members or you want to run the software yourself.
