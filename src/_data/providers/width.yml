verdict: "WIDTH fits a firm in Singapore or elsewhere in Asia-Pacific that wants Travel Rule messaging in the same platform as its KYC, wallet screening and case management. WIDTH says it sends over TRP, Sygna Bridge, Notabene, Veriscope and OpenVASP and checks self-hosted wallets by Satoshi test or signature. The gaps are in the evidence: none of those networks lists WIDTH, there are no public Travel Rule docs or prices, the ISO/IEC 27001 certificate is shared only under NDA, and the company behind it was registered in January 2026."
what_is:
- 'WIDTH is a compliance platform for banks, payment firms and digital asset businesses. Its Travel Rule module exchanges originator and beneficiary data in the IVMS101 format and picks a route for each counterparty: WIDTH names TRP, Sygna Bridge, Notabene, Veriscope, OpenVASP and direct VASP to VASP exchange, with fallback to the next route. It finds counterparties through a directory built on GLEIF and regulator licence registers, checks each one by LEI and a pinned encryption key before any personal data is sent, and keeps a record of each transfer next to the customer file. Around it sit WIDTH''s other modules: KYC with face match and passive liveness, KYB, DART wallet and transaction screening, transaction monitoring and case management.'
- 'WIDTH grew out of Cynopsis Solutions, a Singapore regtech company founded in 2014. WIDTH says Vernal Capital bought Cynopsis in October 2025, without disclosing terms. The company now trading as WIDTH, WIDTH Pte. Ltd., was registered in Singapore on 21 January 2026, and Cynopsis Solutions Pte. Ltd. is still a live company that says it keeps serving its clients. WIDTH announced its new platform in April 2026 and launched it officially in October 2026. Chionh Chye Kit is co-founder and CEO and Du Jun is founder and chairman. WIDTH claims 500+ customers in 180 jurisdictions and shows logos of First Abu Dhabi Bank, NETS, MSIG, Moomoo, Syfe and Green Link Digital Bank; we could not check the count, and none of these is named as a Travel Rule user.'
- 'The Travel Rule claims are WIDTH''s own. We found no WIDTH listing on the Sygna Alliance member page or on OpenVASP''s TRP page, and no announcement from Notabene or Veriscope. WIDTH''s public API reference and product manual cover wallet and transaction screening only, with no Travel Rule endpoints. Prospects get a 30-minute demo with a sandbox VASP, then a 14-day sandbox and a quote.'
features:
- IVMS101 v1.1 originator and beneficiary data for natural and legal persons, including country-specific fields such as Japanese kanji name lines.
- Route chosen per counterparty over TRP, Sygna Bridge, Notabene, Veriscope, OpenVASP or direct VASP to VASP exchange, with fallback to the next route, per WIDTH.
- Counterparty discovery through a directory built on GLEIF, regulator licence registers (MAS, HKSFC, FCA, FINMA, JFSA) and cross-network lookups, with an LEI and pinned key check before personal data is sent.
- Each message encrypted end to end to the counterparty's pinned key; WIDTH says it stores only the encrypted message and an integrity hash for audit.
- Self-hosted wallets handled by jurisdiction rule, with self-declaration plus a Satoshi test or signature where proof is required, risk screening, and a configurable policy that can hold the transfer.
- DART wallet and transaction screening (risk score from 0 to 100, tracing up to 5 hops, 72 built-in rules) and KYT on 30+ networks with Chainalysis, Elliptic and TRM Labs data, plus KYC, KYB, transaction monitoring and case management on the same platform.
