verification_notes:
- 'Record decisions: link.type none (suggested by 21 Analytics, a partner ranked in Travel Rule; no commercial relationship with WIDTH recorded, and the suggestion has no influence on the score). link.url = the Travel Rule page. Categories travel-rule only; crypto KYC, AML and identity verification are suggestions for the owner. Grade "Good" as on the other Travel Rule records (v3.0). Not in src/_data/providers under another slug (no cynopsis record) and not in tracked.yml. Logo: WIDTH wordmark supplied by the owner on 16 Nov 2026 (same blue mark as the media kit at width.com/media, which the session proxy could not download); white made transparent and the tagline line cropped for the wordmark; the square logo tile is the W from the same image, centred on white.'
- 'Travel Rule page (opened 16 Nov 2026): FAQ "IVMS101 as the payload standard, exchanged over the major Travel Rule networks: TRP, Sygna Bridge, Notabene, Veriscope, OpenVASP, and direct VASP-to-VASP"; "Protocol selection is handled per-counterparty with fallback to the next available transport"; directory "backed by GLEIF, regulator-published licensee registries (MAS, HKSFC, FCA, FINMA, JFSA), and cross-network lookups"; "key pinning + LEI"; unhosted wallets "self-declaration + proof-of-ownership (Satoshi test / signature) where required, with risk-based screening"; "85+ jurisdictions"; no API, SDK, email fallback or Sunrise handling described. The page also says it meets "Wolfsberg AML Principles §5" by default; not used. Award footnote: "In collaboration with Cynopsis Solutions".'
- 'Counterparty checks (16 Nov 2026): Sygna Alliance page lists 39 members, no WIDTH or Cynopsis; OpenVASP TRP page names 21 Analytics, Blockchain Intelligence Group and Ospree as vendors, not WIDTH. Notabene and Veriscope sites not searched page by page; web searches found no announcement of a WIDTH connection. TRP and OpenVASP are listed separately by WIDTH; the older OpenVASP protocol and TRP are both OpenVASP Association work, and which versions WIDTH uses is not stated. Sygna Bridge is now owned by VerifyVASP (April 2026); WIDTH does not mention VerifyVASP.'
- 'Docs: width.info/api-reference (readable without login, endpoints need an API key) lists v3 Screening (Chainalysis) and Rulesets endpoints only; hosts api.width.live and backup api.trustin.bond. width.info/docs Product Manual v1.3, updated 2026-09-09, no Travel Rule content. DART homepage: "Accounts are provisioned by our team".'
