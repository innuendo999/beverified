verification_notes:
- 'Founded: old page said 2007; MemberCheck about page says "established in 2008".'
- 'Ownership: about page says MemberCheck operates under Neurocom Group (est. 1992); homepage logo says "a Nexiant brand", and Nexiant (G2 seller page, founded 2024) groups MemberCheck, NameScan, GPayments and FraudShield. Legal relationship between Neurocom and Nexiant AI Pty Ltd (ABN active from 15 Dec 2023) not confirmed.'
- 'HQ: MemberCheck pages give no address. Chatswood is taken from the Nexiant AI Pty Ltd ABR record (NSW 2067) and the shared Railway St address on NameScan and Nexiant G2 pages.'
- 'Four-tier PEP and RCA screening: not found on current MemberCheck pages; removed from tagline, features, pros and FAQ.'
- 'Pricing: old page showed about $90 for 50 scans (third-party, no source recorded). No source found; MemberCheck pricing page is a demo form. Removed.'
- 'EU data storage: old con said data is also held in the EU. Sub-processors page lists AWS and Google (United States) and no hosting region. Removed.'
- 'Face match and liveness: homepage says "biometric checks" only; wording changed.'
- 'ISO 27001:2022 and ISO 27701:2019 are vendor-stated; no certificate or certification body register found.'
- 'User ratings: G2 has a single review dated July 2019; themes removed. The Capterra MemberCheck URL tried resolved to an unrelated product.'
