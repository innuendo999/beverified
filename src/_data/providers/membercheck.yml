verdict: 'MemberCheck runs a four-tier PEP screening process alongside sanctions and adverse-media checks, positioned for managed AML workflows with enhanced due diligence and daily ongoing monitoring. It''s operated by the same owner as NameScan (Neurocom Group) but targets a different use case: managed compliance programs rather than on-demand self-serve checks.'
what_is:
- MemberCheck is an AML/CTF screening company founded in 2007 and headquartered in Chatswood, New South Wales, Australia, operated by the Neurocom Group — the same owner as NameScan. It screens against thousands of sanctions lists with a four-tier PEP and RCA process plus global adverse-media coverage, serving accounting, casino, financial-services, legal, real-estate, and crypto/VASP clients.
features:
- Four-tier PEP and RCA (relatives and close associates) screening.
- Sanctions and global adverse-media screening.
- ID verification with face match and liveness.
- Enhanced due diligence workflows.
- Ongoing daily monitoring and alerts.
- RESTful API, dashboard, and AML consulting services.
