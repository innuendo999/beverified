verdict: 'MemberCheck screens customers against 1,000+ PEP and sanctions watchlists alongside adverse-media checks, positioned for managed AML workflows with enhanced due diligence and ongoing monitoring. It sits in the same group as NameScan (MemberCheck says it operates under Neurocom Group, and both now appear as Nexiant brands) but targets a different use case: sales-led compliance programs rather than on-demand self-serve checks.'
what_is:
- MemberCheck is an AML/CTF screening company established in 2008. It says it operates under Neurocom Group, founded in 1992, which also runs NameScan and GPayments, and its site now presents it as a Nexiant brand. Nexiant AI Pty Ltd is registered in Chatswood, New South Wales, Australia. MemberCheck screens against 1,000+ PEP and sanctions watchlists in 195 countries plus adverse media from thousands of monitored sources, and says it serves 13,000+ customers in accounting, casinos and betting, financial services, legal, real estate and crypto exchanges.
features:
- PEP and sanctions screening against 1,000+ watchlists, with match scoring and an audit trail.
- Adverse-media screening from thousands of monitored sources.
- ID verification with document and biometric checks.
- Know Your Business (KYB) ownership and UBO assessment, enhanced due diligence and risk assessment.
- Ongoing monitoring and transaction monitoring with configurable rules; database updated daily.
- API integration and a web dashboard.
