faq:
- q: How much does MemberCheck cost?
  a: MemberCheck does not publish pricing. Its pricing page is a demo request form that asks for your anticipated annual scan volume, and sales quotes from there.
- q: Is MemberCheck related to NameScan?
  a: Yes. MemberCheck says it operates under Neurocom Group, which also runs NameScan, and both now appear as Nexiant brands. MemberCheck targets sales-led AML workflows while NameScan focuses on pay-as-you-go self-serve screening.
- q: What does MemberCheck screen against?
  a: MemberCheck screens against 1,000+ PEP and sanctions watchlists covering 195 countries, plus adverse media from thousands of monitored sources.
- q: Does MemberCheck offer ongoing monitoring?
  a: Yes. MemberCheck lists ongoing monitoring of screened customers and says its database is updated daily. Transaction monitoring with configurable rules is also offered, but it runs on a separate platform with its own credentials.
- q: Does MemberCheck verify identity documents?
  a: Yes. Its ID verification checks passports, driving licences and national ID cards against government and official sources, with document and data coverage in 60+ countries. Where requested, a live selfie is matched to the document photo, with liveness detection.
- q: What is the best alternative to MemberCheck?
  a: NameScan is the closest alternative for self-serve, on-demand screening. SmartSearch is a strong fit for UK JMLSG compliance specifically.
- q: Who are MemberCheck's main competitors?
  a: MemberCheck competes with SmartSearch and Sanction Scanner, and shares ownership with sister product NameScan.
