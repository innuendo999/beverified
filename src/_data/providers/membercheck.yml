pros:
- Broad screening coverage, with 1,000+ PEP and sanctions watchlists and adverse media
- API integration for building a custom front-end
- Ongoing monitoring, with the screening database updated daily
cons:
- Australian-based group with no published hosting region, a data-residency question for some EU clients
- Smaller brand than enterprise AML platforms, and no published pricing
- Screening-focused rather than a full IDV/lifecycle platform
