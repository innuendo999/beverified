verification_notes:
- 'Ownership: about page says MemberCheck operates under Neurocom Group (est. 1992), which also includes NameScan, GPayments and Creative Digital Technology; the header logo says "a Nexiant brand". nexiant.ai (footer: Nexiant AI PTY LTD) lists MemberCheck, NameScan, GPayments and FraudShield as solutions but does not mention Neurocom. Legal relationship between Neurocom and Nexiant AI Pty Ltd (ABN active from 15 Dec 2023) still not confirmed.'
- 'HQ: MemberCheck pages give no address. Chatswood is taken from the Nexiant AI Pty Ltd ABR record (NSW 2067, rechecked 2026-10) and the shared Railway St address on NameScan and Nexiant G2 pages.'
- 'ISO/IEC 27001:2022 and ISO/IEC 27701:2019 are vendor-stated on the MemberCheck about page and nexiant.ai; no certificate, certification body or register entry found.'
- 'API: the API integration feature and pro were not reconfirmed on a current page (membercheck.com/api/ did not load); kept from the earlier pass.'
- 'ID verification: the page says document and data coverage is 60+ countries, "expanding to 120+"; selfie matching applies "where requested". The 195-country figure is for screening, not IDV.'
- 'User reviews: Capterra reviews (source 10) date from 2016 to 2024; G2 still has a single July 2019 review. Themes come from Capterra only.'
