faq:
- q: How much does MemberCheck cost?
  a: MemberCheck offers pay-as-you-go and subscription pricing; a third-party-reported rate is around $90 for 50 scans — verify current pricing directly with MemberCheck.
- q: Is MemberCheck related to NameScan?
  a: Yes. MemberCheck and NameScan are both operated by the Neurocom Group; MemberCheck targets managed AML workflows while NameScan focuses on on-demand self-serve screening.
- q: What is MemberCheck's PEP screening process?
  a: MemberCheck uses a four-tier PEP and RCA (relatives and close associates) screening process alongside sanctions and adverse-media checks.
- q: Does MemberCheck offer ongoing monitoring?
  a: Yes, MemberCheck provides daily ongoing monitoring with alerts for existing customers.
- q: What is the best alternative to MemberCheck?
  a: NameScan is the closest alternative for self-serve, on-demand screening. SmartSearch is a strong fit for UK JMLSG compliance specifically.
- q: Who are MemberCheck's main competitors?
  a: MemberCheck competes with SmartSearch and Sanction Scanner, and shares ownership with sister product NameScan.
