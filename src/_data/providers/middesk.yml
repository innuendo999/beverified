verdict: 'Middesk is a KYB provider for US fintechs, banks and lenders onboarding US businesses at volume: one call searches every Secretary of State, matches the TIN with the IRS and screens OFAC lists. Prices are quoted by sales. International checks are new and start with 30 countries on the Verify plan only.'
what_is:
- Middesk is a San Francisco and New York business identity company that went through Y Combinator in Winter 2019. Its founders, CEO Kyle Mack and CTO Kurt Ruppel, worked at Checkr before starting it. It raised a $4 million seed round led by Accel with Sequoia and Y Combinator in September 2019, and a $57 million Series B co-led by Insight Partners and Canapi Ventures in June 2022. Its about page reports more than 600 customers and 135 staff.
- Middesk builds one profile per business from more than 400 government and other sources, according to its platform page. Products cover business verification (KYB), fraud models and AI agents for reviews, underwriting searches (liens, UCC, bankruptcies), monitoring, and state tax registration for payroll. Logos on its homepage include Toast, Mercury, Brex, Ramp, Plaid, Rippling, Gusto and Shopify.
features:
- Secretary of State search across all 50 states and DC with every business verification, with registration status summarised in review tasks.
- IRS TIN and name match, plus name and address verification.
- Owners and officers list researched for each business; people you submit are checked against it.
- OFAC screening on eight lists by default, with an enhanced screening option that adds PEP lists and thousands of other watchlists.
- Articles of incorporation, good standing certificates and UCC filings retrieved from government sources.
- Monitoring with webhooks for registration, watchlist, bankruptcy and TIN changes.
- Website analysis and industry classification with NAICS, SIC and MCC codes for merchant onboarding.
- KYC on associated people through Socure, as a separate module.
- International business verification in 30 countries across Canada, Europe and APAC, on the Verify plan.
