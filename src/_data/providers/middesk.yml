  by_profile:
  - US fintechs, banks, lenders and payment platforms onboarding US businesses at volume are Middesk's core fit.
  - Payroll and HR platforms can also use its state tax registration product for their customers.
  - Teams onboarding many businesses outside Canada, Europe and APAC will need a second KYB vendor.
faq:
- q: How much does Middesk cost?
  a: Middesk does not publish prices. Its pricing page asks for your monthly onboarding volume and routes you to sales. Vendr, a third party, reports that buyers with 1,000 to 5,000 requests a month often pay $2 to $5 per verification.
- q: Does Middesk verify businesses outside the US?
  a: Yes, but coverage is new. Middesk's International Business Verification started with 30 countries across Canada, Europe and APAC, on the Verify plan, and returns registrations in the same format as US Secretary of State data. Middesk calls it phase one and does not publish the country list.
- q: Does Middesk provide beneficial ownership (UBO) data?
  a: Partly. Middesk researches an aggregate list of owners, officers and registered agents for each business from multiple sources, and checks the people you submit against it. Its documentation does not describe a separate beneficial owner register output.
- q: Which sanctions lists does Middesk screen?
  a: By default Middesk screens businesses against eight OFAC lists, including the SDN list, and pulls them from government sources daily. Enhanced screening adds PEP lists and 5,704 more sources, such as international sanctions lists, regulatory exclusions and law enforcement lists.
- q: Does Middesk monitor businesses after onboarding?
  a: Yes. Middesk monitoring sends webhook events and email notifications when a business's registrations, watchlist results, bankruptcies or TIN records change. It can be turned on per business, for all businesses or by policy. The documentation does not state how often changes are checked.
- q: Is Middesk SOC 2 certified?
  a: Middesk says it undergoes annual SOC 2 Type II audits by an independent third party and shares the report through its trust center. We have not seen the report, so we list it as vendor-stated.
- q: What is the best alternative to Middesk?
  a: Enigma is the closest alternative for US KYB with a published price list. Trulioo fits teams that need business verification in many countries.
