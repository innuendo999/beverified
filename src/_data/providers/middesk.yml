pros:
- Searches every US Secretary of State (50 states and DC) and matches the TIN with the IRS in one verification
- Pulls formation documents and good standing certificates from government sources, and sends webhooks when registrations, watchlist results, bankruptcies or TINs change
- Covers merchant onboarding checks too, with website analysis and NAICS, SIC and MCC industry codes
cons:
- No published prices; every plan is quoted by sales
- International verification is new, starts with 30 countries on the Verify plan only, and the country list is not published
- KYC on owners runs through Socure as a separate module, so document and selfie checks are not Middesk's own
