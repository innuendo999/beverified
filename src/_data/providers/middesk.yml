verification_notes:
- 'link.type set to none: no commercial relationship with Middesk is recorded.'
- 'Founded: Middesk''s own llms.txt (source 22) and Y Combinator (source 21) say 2019; Crunchbase and some profiles say 2018 (co-founded before the YC W19 batch). 2019 used.'
- 'Funding: vendor blog posts give the $4M seed (Sept 2019, source 20) and $57M Series B (June 2022, source 19). Third-party profiles give $77M total and a $16M Series A (Mar 2021); not used in copy.'
- 'International coverage: the release (source 6) and docs (source 7) say 30 countries in phase one and name only Canada, the UK and Singapore as examples; the homepage teaser mentions 65+ countries including Latin America, which no release or docs page confirms. 30 used. Release has no date; the docs changelog dates the API change 10 Aug 2026 (source 24). Available on the Verify plan; access through sales.'
- 'UBO: docs describe an aggregate list of owners, officers and registered agents "from multiple sources" and validation of submitted beneficial owners; no FinCEN BOI or register source named. kyb_ubo yes with that note, as for Enigma.'
- 'Sanctions: eight OFAC lists by default, pulled daily at 3:00 AM PT (source 9). Enhanced screening adds 5,704 sources incl. PEP; no update schedule stated for those. Docs do not describe periodic re-screening; monitoring docs list watchlist_result.created/updated webhook events (source 11).'
- 'SOC 2 Type II: docs (source 16) say annual audits by an independent third party, report in the trust center; auditor and period not seen. vendor_stated. No ISO/IEC 27001 claim found.'
- 'Sandbox: environments docs say sandbox keys come from the Dashboard; whether a Dashboard account is self-serve is not stated. xpay.sh notes a self-serve dashboard but production through sales; not used.'
- 'Pricing: middesk.com/pricing returned an error; /pricing/business-onboarding shows packages without figures and a contact form. G2 and TrustRadius list no prices. Vendr range (source 25) labelled third-party; Vendr does not say how the range was built.'
- 'User ratings: G2 not readable by our tools; a TrustRadius snippet shows 8.9 out of 10 without a review count. Not recorded.'
- 'Vendor performance figures not used: 7M businesses verified a year, 150K a week, 92% of records updated in under 10 days, 10% of new US businesses verified within 90 days, Rho case study figures.'
- 'Logo tile and wordmark from the owner''s images (2026-11-24).'
- 'Incidents: none found in searches on 2026-11-24.'
