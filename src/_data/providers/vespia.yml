- 'Deal status: Veriff''s 5 Feb 2026 release "announced the acquisition" (terms not disclosed) and said the team "will join" Veriff, but no separate closing notice was found, and on 22 Oct 2026 the vespia.io banner still reads "Veriff is acquiring Vespia". Re-check for a completion statement or a registry ownership change.'
- 'Pricing may be stale: the €99 Starter Package, €35 per KYB report and 7-day trial were still on the vespia.io homepage on 22 Oct 2026, but every sign-up and trial button goes to Veriff''s KYB sign-up, /pricing still redirects to Veriff self-serve IDV plans (no KYB prices), and Capterra lists "Free trial not available". Whether a buyer can still purchase at these prices is unconfirmed.'
- 'Veriff''s KYB sign-up page still says "launching mid-2026" with a limited access program as of 22 Oct 2026; general availability of KYB in Veriff not confirmed.'
