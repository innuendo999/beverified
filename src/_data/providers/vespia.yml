verdict: Vespia built an AI-powered KYB platform covering business registry data across 300+ jurisdictions, founded by former Veriff team members. In February 2026, Veriff acquired Vespia, with its KYB technology being folded into Veriff's platform and commercial availability expected by mid-2026 — so evaluate it today as a business-verification specialist heading toward a larger combined platform.
what_is:
- Vespia is an AI-powered KYB and AML verification company founded in 2021 in Estonia by CEO Julia Ront (formerly Veriff's second employee) and Anton Vedešin. In February 2026, Veriff acquired Vespia; its business-verification technology is being integrated into Veriff's platform, with commercial availability across Veriff expected by mid-2026.
features:
- AI and rule-based KYB company verification.
- Business registry data across 300+ jurisdictions.
- Shareholder and UBO (ultimate beneficial owner) verification for complex structures.
- Sanctions, PEP, and RCA screening plus adverse-media checks.
- AI Compliance Officer feature and risk analysis.
- API, dashboard, and onboarding SDK with ongoing monitoring.
