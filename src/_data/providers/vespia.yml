verdict: 'Vespia built an AI-assisted KYB platform that pulls commercial register data from 300+ jurisdictions; its CEO, Julia Ront, was Veriff''s second employee. Veriff announced the acquisition of Vespia on 5 February 2026 and said the KYB technology would be commercially available across its platform by mid-2026. As of 22 October 2026, vespia.io still loads, but its sign-up, demo and trial links lead to Veriff and vespia.io/pricing redirects to Veriff''s self-serve plans; Veriff''s KYB sign-up page still describes a limited access program. Evaluate it as part of Veriff rather than as a standalone vendor.'
what_is:
- 'Vespia is an Estonia-based KYB and AML company founded in 2021 by Julia Ront, formerly Veriff''s second employee, and Anton Vedešin. Its site names Vespia OÜ in Tallinn.'
- 'Veriff announced the acquisition of Vespia on 5 February 2026 and did not disclose the financial terms. Veriff said the Vespia team would join it and that it would integrate the technology into its platform. The vespia.io site is still online with a banner reading "Veriff is acquiring Vespia" and a customer login, but its pricing and sign-up links now lead to Veriff.'
features:
- KYB company verification using commercial register data from 300+ jurisdictions, in under 30 seconds, per Vespia.
- 1,500+ data points drawn from 5,000+ official sources.
- UBO (ultimate beneficial owner) verification.
- PEP, sanctions and adverse-media screening against 4,000+ lists, with ongoing monitoring.
- Julia AI, an AI compliance officer for AML risk assessment.
- User onboarding with document checks (7,000+ document types from 190+ countries) and transaction monitoring.
