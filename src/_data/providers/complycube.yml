verdict: 'ComplyCube is a UK identity verification and AML provider for small and mid-market teams that want a UK DIATF-certified service and published per-check prices. Self-serve plans start at $99 a month, credited against checks, and on Starter only successful verifications are charged. Its liveness test names no lab, and its other certificates are claims we could not confirm.'
what_is:
- 'ComplyCube checks a person from an ID document and a selfie, screens them against sanctions, PEP and adverse-media lists, and adds KYB, address and eID checks on higher plans, all through one API or a no-code flow. Its identity service is certified under the UK digital identity and attributes trust framework (DIATF) on the government register. In our account in test mode in November 2026 a document check showed a breakdown of what it tested (MRZ, forensic, content and RFID analysis), screening ran under rules that set the match thresholds and exclusions, verification flows kept numbered versions, and country risk scores and a banned-face list could be set by the customer.'
- 'ComplyCube is operated by Teemo Technology Ltd, a UK company incorporated in January 2020 with a registered office in London. It says it supports 220+ countries and territories; its document guide lists 13,000+ identity document types.'
features:
- Document verification with OCR and authenticity checks.
- Biometric face-match and liveness detection.
- 'AML screening: sanctions, PEP, adverse media, watchlists and continuous monitoring.'
- KYB (business verification) alongside individual identity checks.
- eID verification, NFC chip verification and video liveness for higher-assurance onboarding (some on higher plans).
- Web and mobile SDKs, a REST API and a no-code workflow builder.
