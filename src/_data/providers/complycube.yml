verification_notes:
- Founding year still not stated by the vendor (About page gives none). The operating company Teemo Technology Ltd was incorporated on 8 Jan 2020 (Companies House) and the old page said 2016; Founded fact stays removed.
- London address on the DSIT register and Companies House is Crown House, 27 Old Gloucester Street, a registered-office address; actual office footprint not confirmed.
- ISO/IEC 27001:2022, ISO 9001:2015, ISO/IEC 30107-3 Level 2 (lab not named), Cyber Essentials and ACCS 4:2020 are vendor-stated only. trust.complycube.com showed no certificate content, and no certification-body, lab, IASME or ACCS register entry was found.
- The developer docs compliance page also lists SOC 2 Type II as "compliant" (no auditor or report date) and the Security & Compliance Center lists ACCS 2:2021; neither added as a certification.
- G2 and Capterra review text is behind a login, so user review themes are general statements, not counted themes.
