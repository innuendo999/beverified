verdict: ComplyCube is a smaller, API-first challenger in a category dominated by better-funded platforms, pitching itself on straightforward integration for document verification, biometrics, and AML screening. It's a reasonable fit for small and mid-market teams that want a developer-friendly onboarding API. Unlike most vendors in this category it publishes per-check prices and self-serve plans, though it doesn't have the scale or brand recognition of the category's larger players.
what_is:
- ComplyCube is a KYC and AML technology company based in London, UK, operated by Teemo Technology Ltd. It offers an API-first platform for identity verification, biometric authentication, KYB and AML screening, and says it supports 220+ countries and territories. It targets fintechs and regulated businesses that want document verification, liveness checks, and sanctions/PEP screening through a single integration, positioned as a more accessible alternative to enterprise-only IDV platforms. Its identity service is certified under the UK digital identity and attributes trust framework (DIATF).
features:
- Document verification with OCR and authenticity checks.
- Biometric face-match and liveness detection.
- 'AML screening: sanctions, PEP, adverse media, watchlists and continuous monitoring.'
- KYB (business verification) alongside individual identity checks.
- eID verification, NFC chip verification and video liveness for higher-assurance onboarding (some on higher plans).
- Web and mobile SDKs, a REST API and a no-code workflow builder.
pricing:
  summary: ComplyCube publishes self-serve plans and per-check prices. Starter costs $99 a month and Core $299 a month, with the monthly fee used as credit for checks and only successful verifications billed. Growth and Enterprise plans are quoted on request.
