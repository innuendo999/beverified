faq:
- q: How much does ComplyCube cost?
  a: ComplyCube publishes its prices. The Starter plan is $99 a month and Core is $299 a month, with the fee used as credit for checks. A document check costs $1.05 on Starter or $0.75 on Core, and a photo liveness check costs $0.35 or $0.20. Growth and Enterprise plans are quoted on request.
- q: Does ComplyCube support KYB?
  a: Yes. ComplyCube offers business verification (KYB) alongside its individual identity-verification and AML screening tools.
- q: Is ComplyCube good for developers?
  a: ComplyCube offers a REST API with web and mobile SDKs, and a no-code workflow builder for teams that do not want to code the flow. In test mode the sandbox comes preloaded with sample clients and checks, so you can see results before integrating.
- q: Does ComplyCube do AML screening?
  a: Yes. ComplyCube includes sanctions, PEP, watchlist and adverse-media screening with continuous monitoring, alongside its document and biometric verification.
- q: Is ComplyCube certified under the UK trust framework?
  a: Yes. The UK government register lists the ComplyCube Platform (Teemo Technology Ltd) as a certified identity service, certified by Kantara on 30 March 2026 until 30 March 2029.
- q: What is the best alternative to ComplyCube?
  a: It depends on what you need. In the UK, Yoti has liveness with an iBeta Level 3 letter and four services on the DVS register, Veriff adds iBeta and FIDO certification to its UK DIATF service with plans from $0.80 per verification, and SmartSearch is built for JMLSG-regulated professions such as law and accountancy firms.
