verification_notes:
- Founding year not stated by the vendor. Old page said 2016; the operating company Teemo Technology Ltd was incorporated on 8 Jan 2020 (Companies House) and CB Insights also says 2020. Founded fact removed rather than guessed.
- London address on the register and Companies House is Crown House, 27 Old Gloucester Street, a registered-office address; actual office footprint not confirmed.
- ISO/IEC 27001, ISO 9001, ISO/IEC 30107-3 (lab not named), Cyber Essentials and ACCS certifications are vendor-stated only; no certificate or lab letter opened.
- Per-check price column mapping (Starter vs Core) is inferred from the order on the pricing page; the page does not label columns explicitly.
- Video KYC (agent-led video identification) not found on current vendor pages; feature rewritten to video liveness, eID and NFC, which appear on the pricing page.
- G2 rating visible (5.0, 70 reviews) but review text is behind a login, so user review themes are general statements, not counted themes.
