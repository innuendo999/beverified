faq:
- q: How much does ComplyCube cost?
  a: ComplyCube publishes its prices. The Starter plan is $99 a month and Core is $299 a month, with the fee used as credit for checks. Per-check prices start at $0.20 for a photo liveness check on Core; a document check costs $1.05 on Starter. Growth and Enterprise plans are quoted on request.
- q: Does ComplyCube support KYB?
  a: Yes. ComplyCube offers business verification (KYB) alongside its individual identity-verification and AML screening tools.
- q: Is ComplyCube good for developers?
  a: Yes, ComplyCube is built API-first, with web and mobile SDKs and a no-code workflow builder for teams that do not want to code the flow.
- q: Does ComplyCube do AML screening?
  a: Yes. ComplyCube includes sanctions, PEP, watchlist and adverse-media screening with continuous monitoring, alongside its document and biometric verification.
- q: Is ComplyCube certified under the UK trust framework?
  a: Yes. The UK government register lists the ComplyCube Platform (Teemo Technology Ltd) as a certified identity service, certified by Kantara on 30 March 2026 until 30 March 2029.
- q: What is the best alternative to ComplyCube?
  a: Sumsub is the best alternative for a more established, larger-scale platform. Shufti Pro is the closest fit if you want a vendor with a longer enterprise track record.
- q: Who are ComplyCube's main competitors?
  a: ComplyCube competes with Sumsub, Shufti Pro, and Onfido, differentiating through its API-first focus and published pricing.
