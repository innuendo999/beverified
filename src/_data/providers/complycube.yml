verdict: ComplyCube is a smaller, API-first challenger in a category dominated by better-funded platforms, pitching itself on straightforward integration for document verification, biometrics, and AML screening. It's a reasonable fit for mid-market teams that want a developer-friendly onboarding API, though it doesn't have the scale or published pricing transparency of the category's larger players.
what_is:
- ComplyCube is a KYC and AML technology company headquartered in London, UK, offering an API-first platform for identity verification, biometric authentication, and AML screening. It targets fintechs and regulated businesses that want document verification, liveness checks, and sanctions/PEP screening through a single integration, positioned as a more accessible alternative to enterprise-only IDV platforms.
features:
- Document verification with OCR and authenticity checks.
- Biometric face-match and liveness detection.
- AML screening — sanctions, PEP, and adverse media.
- KYB (business verification) alongside individual identity checks.
- Video KYC for enhanced onboarding assurance.
- API and SDK integration aimed at fast developer implementation.
