- API-first design with web and mobile SDKs aimed at fast developer integration
- Published per-check prices and self-serve plans from $99 a month
- Certified UK DIATF identity service, with ISO/IEC 27001 and ISO/IEC 30107-3 claims on its trust page
cons:
- Smaller scale and brand recognition than category leaders
- Growth and Enterprise tiers, and checks such as NFC and video liveness, are quote-only
- Less independent track record and case-study depth than larger competitors
