verification_notes:
- 'Record rewritten 2026-10-19. The earlier draft on this slug reviewed the open OpenVASP Travel Rule Protocol by mistake; link.url https://travel-rule.com belongs to this commercial vendor. Name and score changed from the protocol draft on purpose (validator flags both against HEAD).'
- 'travel-rule.com (homepage, pricing) is robots-blocked for our fetcher. Facts from those pages come from browser screenshots supplied by the editor on 2026-10-19 and are vendor-stated. Docs facts from docs.travel-rule.com via reports/verification/trp-vendor-research.md.'
- 'Open: legal entity. No company name, address, company number or imprint visible in the screenshots. Footer "© 2026 TRP", "Jurisdiction: Germany", links to Terms & Services and Privacy Policy (not opened). Docs OpenAPI info block: publisher "KYCAID TRP Team", support@travel-rule.com, licence "Proprietary"; "KYCAID TRP" in the /identity example and the callbacks guide. kycaid.com does not mention TRP. KYCAID Limited (UK 11670407) and Compligate Ltd (UK 15376538) are candidates only; neither is linked to TRP by any page. Germany jurisdiction does not match either UK company; unexplained.'
- 'Open: protocol message price. The pricing page shows a per-message price for protocol messages, but the amount was not legible in the screenshot. Not stated.'
- 'Open: minimum monthly commitment. Page says "The minimum monthly commitment applies to usage volume"; amount not shown.'
- 'Open: how the homepage "2000 EUR first-year unlimited plan" for the first 100 clients relates to the €2,000 initial deposit on the pricing page (same payment or separate offer). Both shown as stated.'
- 'Open: interoperability. Homepage says "Global, Interoperable". Docs document only TRP''s own registry and the EMAIL flow; no TRISA, TRUST, GTR, Sygna, VerifyVASP, CODE or Notabene. Unknown whether trp.travel-rule.com can exchange messages with standard OpenVASP TRP endpoints (21 Analytics, Notabene). The API uses the TRP name and version 3.2.1 (latest OpenVASP spec version, 29 Jul 2024, per 21 Analytics docs 6.0.0), but authenticates by API key and JWT through a central hub; docs say nothing about mTLS. OpenVASP TRP page lists 21 Analytics, Blockchain Intelligence Group and ospree as vendors, not KYCAID or travel-rule.com.'
- 'Open: "Verified entity, Last verified: 25.05.2026" badge in the footer. Issuer not shown in the screenshot; not treated as a certification.'
- 'Open: certifications. None stated by TRP. KYCAID''s privacy policy claims ISO 27001, SOC 2 Type 2 and PCI DSS for KYCAID (SOC 2 Type 2 corrected by the editor as not yet held); not carried over to TRP.'
- 'Vendor-stated counts not verified: 348+ VASPs in network, 29+ member VASPs, 29 jurisdictions covered, "over 40 other regulators" besides MiCA, FinCEN, FCA, BaFin. 29 jurisdictions and 40+ regulators are hard to reconcile; docs list no jurisdictions. Used only as vendor claims.'
- 'SDKs: homepage claims SDKs for "every popular programming language (Java, Python, JavaScript, and more)". Not found in the docs pages checked for the research report; stated as a TRP claim.'
- 'Docs inconsistency: about page promises "Encrypted, signed callbacks"; callbacks guide describes HMAC-SHA512 signing only. Record says signed. "Encryption and verification" step from the homepage how-it-works not detailed in docs.'
- 'Support: 24/7 technical support, onboarding assistance and dedicated compliance guidance listed as included on the pricing page; support@travel-rule.com in docs. No SLA found.'
- 'Sandbox: docs list only https://trp.travel-rule.com/ and a localhost server. No sandbox or trial documented.'
- 'Track record: domain created 2025-02-07 (Verisign RDAP), registrar GoDaddy, registrant not shown. Example health response build 26.4.0, timestamp 2026-05-11. No customers, funding, G2/Capterra/Trustpilot listings, press or regulatory actions found. Example LEI in the docs (529900T8BM49AURSDO55) belongs to Ubisecure Oy, a placeholder.'
- 'Solutions menu on the homepage: Self-Hosted Wallet Verification; Travel Rule Automation. Not separately priced.'
- 'Disclosure: docs name the KYCAID TRP Team; KYCAID has a paid link arrangement with BeVerified (kycaid.yml link.type paid). TRP link.type stays none (no arrangement recorded for travel-rule.com). Editor to confirm whether the KYCAID arrangement covers TRP.'
