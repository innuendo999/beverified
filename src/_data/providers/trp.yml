verdict: TRP is not a product you buy. It is an open specification for sending FATF Recommendation 16 data from one VASP to another over HTTPS, and the OpenVASP Association, a Swiss non-profit, looks after it. The specification is royalty-free and public, the version history runs from 1.0.0 in August 2020 to 3.2.1 in July 2024, and it bridges to TRISA. Since October 2026 TRISA sits under the same association. The weak points come with being a protocol. Nobody operates TRP, so there is no audited service, no SLA and no directory of who is live on it. The association publishes no adopter list, and Notabene, a competing network, says most early members have left or stopped integrating it. Consider TRP if you have engineers who can build and run an endpoint, or reach it through a vendor that implements it, such as 21 Analytics, Sumsub or Notabene. Before you build, check which of your counterparties actually answer on it.
what_is:
- TRP (Travel Rule Protocol) is a specification for exchanging originator and beneficiary data between virtual asset service providers, as FATF Recommendation 16 requires. The receiving VASP gives its customer a Travel Address, an encoded URL that works a little like an IBAN. The sending VASP posts IVMS101 data to that address, and the receiver approves the transfer and returns a payment address, or rejects it. The sender then reports the transaction hash. Both sides authenticate each other with mutual TLS over TLS 1.3, and assets are identified with ISO 24165 Digital Token Identifiers. Extensions cover requirements beyond the core rule. Data goes peer to peer between the two VASPs, with no central hub in between.
- TRP came out of the Travel Rule Protocol Working Group. Standard Chartered, ING and BitGo started it, and in October 2020 the group had 25 members, was chaired by BC Group and its exchange OSL, and counted Fidelity Digital Assets among its backers. Version 1.0.0 of the specification is dated 19 August 2020. In March 2022 the working group and the OpenVASP Association announced they were combining under OpenVASP, which was launched in November 2019 and is based in Zug. TRP became the association's single protocol. OpenVASP is run by a board chaired by President Andrew Davidson, who also chairs the TRP working group. Since 1 October 2026 the association has also stewarded TRISA, its Global Directory Service and the Envoy software, which Rotational Labs keeps operating.
features:
- Travel Address flow that lets the receiving VASP screen the transfer and accept or reject it before it reveals a payment address.
- IVMS101 data model for originator and beneficiary information, with a free IVMS validator from OpenVASP.
- Mutual TLS 1.3 authentication with X.509 certificates, plus an /identity endpoint that returns the VASP's name, LEI and certificate.
- Asset-agnostic design through ISO 24165 Digital Token Identifiers, added in version 3.2.0.
- Extensions that VASPs can signal per request, which the TRISA bridge uses to add TRISA encryption.
- Interoperability with TRISA since 2023, with bridge code in TRISA's Go package and in the MIT-licensed Envoy node.
pricing:
  summary: TRP itself is free. The specification is public and royalty-free, and anyone can implement it without joining OpenVASP. Membership of the association, which gives a vote in its governance, is optional and has published annual fees from CHF 100 for individuals to CHF 10,000 for large non-VASPs, with a 50% reduction linked to using or offering TRP. Building, hosting and running a TRP endpoint, or licensing a vendor that does it for you, is a separate cost that you carry.
