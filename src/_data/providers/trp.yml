pros:
- Published pricing, with a €2,000 deposit that becomes your message balance, €0.02 per self-hosted wallet message and €0.05 per database screening
- Public API docs covering IVMS101 data, Travel Addresses, a VASP registry and signed callbacks
- Self-hosted wallet checks by email self-attestation, signature challenge or Satoshi Test on Bitcoin, Ethereum and TRON
cons:
- The site names no legal entity and states no certifications; the docs name only the KYCAID TRP Team
- Called interoperable, but the docs show no connection to TRISA, TRUST, GTR, Sygna or any other network
- Domain registered in 2025, easily confused with the open OpenVASP protocol of the same name, and the minimum monthly commitment is not disclosed
