  by_profile:
  - VASPs with their own engineering team that want to exchange Travel Rule data directly with known counterparties, without paying a network or hub, are TRP's clearest fit.
  - Firms that cannot build an endpoint should reach TRP through a vendor that implements it, such as 21 Analytics, Sumsub or Notabene, and treat TRP as one of several routes.
  - VASPs whose main counterparties are US exchanges on TRUST will need more than TRP, since TRP has no TRUST connection of its own.
faq:
- q: Is TRP a company or a product?
  a: Neither. TRP is an open specification for sending Travel Rule data between VASPs. The OpenVASP Association, a non-profit members association in Zug, Switzerland, stewards it, and vendors such as 21 Analytics, Sumsub and Notabene build it into their products. No company operates TRP or sells access to it.
- q: How much does TRP cost?
  a: The specification is free and royalty-free, and you do not need to join OpenVASP to implement it. Membership, which gives a vote in the association, costs CHF 1,000 to 5,000 a year for VASPs, CHF 2,000 to 10,000 for non-VASPs and CHF 100 for individuals, with a 50% reduction linked to TRP. Your real cost is building and running an endpoint, or a vendor licence.
- q: Who uses TRP?
  a: OpenVASP lists 21 Analytics, Blockchain Intelligence Group and ospree as vendors of TRP solutions, and Sumsub and Notabene document TRP support. The association does not publish a list of VASPs that are live on it. Notabene says most early members have left or are not actively integrating TRP, which is a competitor's view we could not test. Ask your counterparties directly.
- q: How does TRP work?
  a: The receiving VASP gives its customer a Travel Address. The sending VASP posts the customer's IVMS101 data to that address over mutual TLS. The receiver checks it and either returns a payment address or rejects the transfer, and the sender then reports the transaction hash. The data goes directly between the two VASPs.
- q: Does TRP work with TRISA or TRUST?
  a: TRISA, yes. A bridge has made the two interoperable since 2023, TRISA's Envoy node speaks both, and OpenVASP took over stewardship of TRISA on 1 October 2026. TRUST, not directly. TRP has no TRUST connection of its own, though 21 Analytics supports both in one product.
- q: Is TRP still maintained?
  a: Yes, but slowly. The latest version we could see is 3.2.1 from July 2024, the working group holds a weekly call, and OpenVASP added TRISA to its remit in October 2026. We could not open the GitLab repository's activity log, so we cannot say how often the specification changes now.
- q: Is TRP certified or audited?
  a: Certifications such as ISO/IEC 27001 or SOC 2 apply to organisations that run systems, and nobody runs TRP. Each implementer is responsible for its own security. The specification requires TLS 1.3 with mutual TLS, but we found no independent security review of the protocol itself. Ask your vendor, or your own team, for the security evidence of the endpoint you will actually use.
