pros:
- Free to implement, with a public specification and no dependence on a central operator
- Run by a non-profit Swiss association with published governance and membership fees
- Bridged to TRISA, and supported by vendors including 21 Analytics, Sumsub and Notabene
cons:
- No public adopter list, and Notabene says most early members have left or stopped integrating it
- You build, host and secure the endpoint yourself, or pay a vendor to do it
- Community support only (weekly call, Telegram, GitLab), with no SLA and no directory for counterparty discovery
