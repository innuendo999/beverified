- 'Correction: con "Launched in 2025" changed to "Domain registered in 2025". The only dated evidence is the domain record (Feb 2025) and a docs example build 26.4.0 with timestamp 2026-05-11; no launch date found.'
- 'Still open, legal entity: no company name, address, company number or imprint seen; terms and privacy policy not opened (robots). KYCAID Limited (UK 11670407) and Compligate Ltd (UK 15376538) are candidates only; neither is linked to TRP by any page, and the footer "Germany" does not match either UK company.'
