verification_notes:
- 'New record, first review. TRP is a protocol, not a vendor; link.type none. link.url set to https://travel-rule.com as instructed by the editor, but travel-rule.com could not be opened (fetcher returned ROBOTS_DISALLOWED for both the apex and www hosts) and no page we opened links to it: the OpenVASP TRP page, 21 Analytics docs and the 21 Analytics TRP pages all link to openvasp.org/trp or gitlab.com/OpenVASP/travel-rule-protocol. Editor should confirm who controls travel-rule.com before publishing; https://www.openvasp.org/trp is the confirmed official page.'
- 'GitLab: project page gave description, CC BY-SA 4.0 licence, 116 commits, 7 branches, 0 tags, created 6 May 2020. Raw files, the GitLab API and the specification blob were blocked (robots) or returned metadata only, so the current version on master and last activity date are unconfirmed. Version history 1.0.0 (19 Aug 2020) to 3.2.1 (29 Jul 2024) taken from the copy of the spec in 21 Analytics docs 6.0.0; 21 Analytics docs 8.2.0 and 8.3.0 trp.html did not load. Note the repo licence (CC BY-SA 4.0) and the spec text ("intended that adoption of the TRP is royalty and license free") are both stated; record uses royalty-free.'
- 'Governance: OpenVASP about page: launched November 2019, non-profit members association, c/o MME Legal AG, Gubelstrasse 22, 6300 Zug; board Andrew Davidson, Lucas Betschart (COO, 21 Analytics), Paolo Guarnerio, Thurstan Felstead, Benjamin Bengfort, Carol Van Cleef; General Assembly at least annually; Articles of Association referenced but not opened. Davidson is "President" in the Oct 2026 release and "Chair, TRP Working Group" on the TRP page. Swiss commercial register entry for OpenVASP not opened (21 Analytics record notes UID CHE-330.545.004 via Moneyhouse; not re-checked here). 21 Analytics glossary says "incorporated as a non-profit in Switzerland" and "formed in 2019".'
- 'Conflict of interest to note in copy if needed: Lucas Betschart of 21 Analytics sits on the OpenVASP board, and 21 Analytics publishes the TRP encoder and LEI tools and much of the TRP explainer material.'
- 'Merger date: CVJ and 21 Analytics blog announce the OpenVASP and TRP working group combination on 22 Mar 2022; 21 Analytics What is TRP says "late 2021", glossary says 2021. Record uses the March 2022 announcement.'
- 'Founders and members: 21 Analytics What is TRP (page metadata) and Sumsub TRP docs: started by Standard Chartered (Zodia), ING and BitGo. SC Ventures (8 Oct 2020): 25 members, chaired by BC Group and OSL, backers ING, Standard Chartered, Fidelity Digital Assets, IVMS-101 project founding member; Pyctor custody consortium (ABN AMRO, BNP Paribas Securities Services, Citi, Invesco, Societe Generale, State Street, UBS) integrating the TRP API. CoinDesk (23 Jun 2020, from URL) names BitGo, Crypto Broker AG, Metaco, 21 Analytics, OSL/BC Group, Notabene as participants. 21 Analytics blog (Mar 2022): 25+ VASPs in 10+ FATF member jurisdictions. No current OpenVASP member list published (about page lists categories only); openvasp.org/membership and /trp-working-group did not load.'
- 'Adoption: OpenVASP TRP page lists vendors 21 Analytics, Blockchain Intelligence Group, ospree. Sumsub TRP docs and Travel Rule FAQ list TRP. Notabene TRP page: "Every Notabene customer has a live TRP 1.0 endpoint" and "Most early members have left the association or are not actively integrating it" (undated page, 2026 footer; competitor source, labelled as Notabene view). Didit blog (21 May 2026) says it negotiates TRP per transfer; not used. No list of live VASPs found. "Growing adoption" not supported.'
- 'Conflict with existing site copy: rankings.yml Notabene card and categories/travel-rule.yml (protocol explainer, FAQ) say Notabene does not connect to TRP. Notabene''s own TRP page says every Notabene customer has a live TRP 1.0 endpoint. Reported in reports/verification/trp.md; other files not edited.'
- 'TRISA: TRISA docs describe the bridge (pkg/openvasp in trisacrypto/trisa, parses LNURL and Travel Address, three crypto levels via TRP extensions), undated. OpenVASP FAQ and the 6 Oct 2026 release: interoperable since 2023; from 1 Oct 2026 TRISA working group, GDS and Envoy under OpenVASP stewardship, Rotational Labs operates infrastructure, Envoy MIT-licensed and speaks TRISA and TRP, membership rates frozen until 1 Jan 2027. Envoy GitHub releases page not opened (permission timeout); API call failed.'
- 'TRUST: no TRP to TRUST link found. 21 Analytics supports both in one product (21 Analytics record and supporting-trp page banner). Coinbase TRUST page not re-opened in this session.'
- 'Technical claims (Travel Address, mTLS on TLS 1.3, /identity with LEI, DTI in 3.2.0, extensions, HTTP flow) from the spec copy in 21 Analytics docs 6.0.0. ISO 24165 from OpenVASP TRP page. "VASP auto-discovery" (21 Analytics) vs "missing an identification function" (Notabene): record says there is no directory for counterparty discovery, which both support.'
- 'Security: no independent security audit of the TRP specification found; not searched exhaustively. No incidents, disputes or regulatory actions involving TRP or OpenVASP found.'
- 'Support: weekly WG call (OpenVASP TRP page; 21 Analytics What is TRP says monthly call, older page), Telegram group, GitLab issues, contact@openvasp.org.'
- 'Not used: Davidson quote (truncated by the fetcher), OpenVASP membership benefits beyond fees, the meaning of the 50% reduction (page text unclear on how it applies).'
