  by_profile:
  - Small and mid-sized VASPs that want a hosted API and a known starting price are TRP's clearest fit.
  - Firms whose main counterparties sit on TRUST, TRISA, GTR or Sygna should check first, since the docs show no connection to those networks.
  - Firms that need vendor due diligence papers, such as the legal entity, certifications or a security report, should ask for them before onboarding, because none are published.
faq:
- q: Who runs TRP?
  a: TRP's developer documentation names the KYCAID TRP Team as its publisher. KYCAID, which BeVerified also reviews, has a paid link arrangement with BeVerified. TRP is reviewed against the same rubric as every other provider. The website itself names no legal entity. Its footer gives Germany as the jurisdiction, and kycaid.com does not mention TRP, so ask which company you would sign with.
- q: Is TRP the same as the Travel Rule Protocol from OpenVASP?
  a: No. The open Travel Rule Protocol is a free specification that VASPs implement peer to peer over mutual TLS. TRP at travel-rule.com is a commercial, hosted service that uses the same name and version number, 3.2.1, but authenticates with API keys and routes messages through its own servers. OpenVASP does not list it among TRP vendors, and we found no evidence either way on whether it can talk to standard TRP endpoints.
- q: How much does TRP cost?
  a: The pricing page shows a one-time €2,000 initial deposit that becomes your operating balance, then €0.02 per self-hosted wallet message and €0.05 per database screening. Protocol messages are priced per message too, but we could not confirm the amount. A minimum monthly commitment applies, with no figure shown, and prices exclude VAT. The homepage also offers a €2,000 first-year unlimited plan to the first 100 clients.
- q: Which networks and protocols can TRP reach?
  a: The docs describe TRP's own registry of VASPs and an email fallback. They do not mention TRISA, TRUST, GTR, Sygna, VerifyVASP, CODE or Notabene, so the homepage's "interoperable" claim has no documented connection behind it. The homepage says 348+ VASPs are in the network. Check that your counterparties are among them before you commit.
- q: How does TRP handle self-hosted wallets?
  a: The beneficiary gets an email with a self-attestation form, with an optional signature challenge. You can also run a Satoshi Test, a small payment from the wallet to a TRP deposit address, on Bitcoin, Ethereum or TRON (USDT TRC-20). Self-hosted wallet messages cost €0.02 each.
- q: Is TRP ISO 27001 or SOC 2 certified?
  a: TRP states no certifications on the pages we saw or in its docs. KYCAID's own certification claims cover KYCAID, and we have no confirmation that they extend to TRP. Ask for certificates and their scope during due diligence.
- q: Is there a sandbox or free trial?
  a: The docs list only a production host, so no sandbox is documented, and we found no free trial. The account starts with the €2,000 deposit.
