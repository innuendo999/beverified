verdict: 'TRP suits smaller VASPs that want a hosted Travel Rule API with prices on the website: a one-time €2,000 deposit, then €0.02 per self-hosted wallet message and €0.05 per database screening. The API docs are public too. The doubts are about who runs it and who it can reach. The site names no legal entity or certifications, and the docs show no connection to other Travel Rule networks. Get the contracting entity and minimum commitment in writing.'
what_is:
- 'TRP is a hosted Travel Rule service sold from travel-rule.com. A VASP connects through one API to send and receive the originator and beneficiary data that FATF Recommendation 16 requires. TRP looks up the counterparty VASP in its own registry, applies a rule engine, and routes IVMS101 data between participating VASPs through its central API at trp.travel-rule.com. When the other side is not a VASP on the network, for example a self-hosted wallet, the beneficiary gets an email with a self-attestation form, and wallet ownership can also be shown with a Satoshi Test on Bitcoin, Ethereum or TRON. The homepage claims 348+ VASPs in the network, 29+ member VASPs and 29 jurisdictions, and says the service supports compliance with MiCA, FinCEN, FCA, BaFin and over 40 other regulators. We could not check those numbers, and the docs list no jurisdictions.'
- 'This TRP is a commercial service. It is not the open Travel Rule Protocol maintained by the OpenVASP Association, although it uses the same name and the same version number, 3.2.1. The open protocol runs peer to peer between VASPs over mutual TLS. TRP at travel-rule.com is a proprietary hub: you authenticate with an API key, and messages pass through TRP''s servers. Its docs never mention OpenVASP, OpenVASP does not list it among TRP vendors, and we found nothing showing whether it can exchange messages with standard TRP endpoints run by other vendors.'
- 'The website does not name a company. The footer reads "© 2026 TRP", gives Germany as the jurisdiction and shows a "Verified entity" badge, last verified 25 May 2026, without saying who issued it. The domain was registered on 7 February 2025. We found no named customers, funding, user ratings or press coverage.'
- TRP's developer documentation names the KYCAID TRP Team as its publisher. KYCAID, which BeVerified also reviews, has a paid link arrangement with BeVerified. TRP is reviewed against the same rubric as every other provider.
features:
- One REST API for VASP-to-VASP Travel Rule messages with IVMS101 originator and beneficiary data, and SDKs that TRP says cover Java, Python, JavaScript and other popular languages.
- Counterparty lookup in TRP's own registry by domain, LEI, name, email or directory ID.
- Travel Addresses that route a transfer to the beneficiary VASP, with inquiry, resolution and confirmation steps.
- Email fallback with a self-attestation form when there is no VASP on the other side, plus an optional signature challenge.
- Satoshi Test for self-hosted wallets on Bitcoin, Ethereum and TRON (USDT TRC-20 by default).
- Callbacks signed with HMAC-SHA512 and retried for up to 24 hours, and a TRP Dashboard where you issue API keys.
pricing:
  summary: TRP publishes its prices. You pay a one-time €2,000 initial deposit, which activates the account and serves as your operating balance for messaging and network use. After that you pay per message, €0.02 per self-hosted wallet message and €0.05 per database screening, plus a per-message price for protocol messages whose amount we could not confirm. A minimum monthly commitment applies to usage volume, but the page does not show the amount. Prices exclude VAT. The homepage also offers a €2,000 first-year unlimited plan to the first 100 clients.
