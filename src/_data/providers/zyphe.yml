verdict: 'Zyphe suits smaller fintech, crypto and iGaming teams that want cheap self-serve KYC, KYB and AML with a public rate card, starting at $0.30 for ID and liveness, plus AI agents that prepare reviews for a human to sign off. It is very young. Its SOC 2 and ISO/IEC 27001 audits are still in progress, its liveness has no published lab test and most claims are vendor-stated. Pilot it before you rely on it.'
what_is:
- Zyphe Inc. sells identity verification and compliance software in two forms. Verify is a self-serve platform for KYC, KYB, AML screening, transaction monitoring, proof of address and reusable KYC (it calls this KYC Passport). Its AI agents, sold as Investigate or as a managed service, work review queues such as sanctions and PEP alerts, adverse media, UBO and enhanced due diligence, transaction alerts and periodic KYC refreshes, and return a case file with cited evidence and a written rationale. By default a person on the customer's team approves each case or sends it back; categories the customer has validated can be switched to auto-pilot.
- The company is small and recent. Its terms name Zyphe Inc. and Delaware law, its about page lists New York, London and Milan, and its co-founders are Michelangelo Frigo, Charlene Wang and Manuel Tumiati. It announced an undisclosed funding round in July 2025 with Altitude Ventures, Azimut Group, Everywhere Ventures and ROI Ventures; PitchBook lists a $2 million early-stage round and 16 employees. Zyphe says Chartis Research named it a Market Disruptor in its Financial Crime and Compliance50 (FCC50) 2026 report, and Chartis lists Zyphe among the organisations on its FCC50 2026 ranking page. Named customers include Azimut, Protocol Labs, Supra, Vesseo and Twotixx.
features:
- AI agent desks for sanctions and PEP alerts, adverse media, UBO and EDD, transaction alerts and periodic KYC refresh, each returning evidence and a written rationale for human approval.
- ID document and liveness checks, with NFC chip reading for ePassports and eID cards; Zyphe says it supports 4,000+ document versions from 190+ countries.
- KYB with register cross-checks in 49 countries and territories plus all 50 US states and DC, UBO discovery at a configurable 25% threshold and linked KYC for each owner and director.
- Sanctions, PEP and adverse media screening with ongoing monitoring, plus wallet screening and rule-based transaction monitoring.
- Encrypted, sharded storage of personal data across distributed nodes instead of one central database, per Zyphe.
- REST API with an OpenAPI reference, Node and browser SDKs, signed webhooks, a sandbox mode and an MCP server for AI agents.
pricing:
