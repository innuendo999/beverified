  by_profile:
  - Small fintech, crypto and iGaming teams that want low published per-check prices and self-serve setup are Zyphe's clearest fit.
  - Compliance teams with large alert backlogs can pilot the AI agents on one queue, since every case still goes to a person for sign-off by default.
  - Banks and firms whose vendor due diligence requires a SOC 2 report or ISO/IEC 27001 certificate today should wait for Zyphe's audits to finish.
faq:
- q: How much does Zyphe cost?
  a: Zyphe publishes its rate card. ID plus liveness costs $0.30 a check, AML screening $0.20, proof of address $0.20 and transaction monitoring $0.02 per transaction. AI agents are priced per task, such as $0.25 per resolved AML false positive and $3.00 per company and UBO review. New self-serve accounts get a one-time $25 credit. KYB prices are not on the rate card.
- q: Is Zyphe SOC 2 or ISO 27001 certified?
  a: Not yet. Zyphe's security page says its SOC 2 Type I audit is targeted for October 2026, with the Type II observation period starting in Q1 2027, and that ISO/IEC 27001 Stage 1 and Stage 2 audits are planned for October to December 2026. No auditor or certification body is named.
- q: Do Zyphe's AI agents make compliance decisions on their own?
  a: Not by default. The agents gather evidence, cite sources and write a rationale, and a person on your team approves the case or sends it back. Zyphe says auto-pilot runs only on categories your organisation has validated and switched on, and decisions such as FIU reporting stay with your firm.
- q: Which countries does Zyphe KYB cover?
  a: Zyphe's documentation lists register cross-checks in 49 countries and territories, mostly in Europe plus offshore centres, China, Hong Kong and Singapore, and all 50 US states and DC. Elsewhere the KYB flow still runs, but company details and owners are declared by the applicant and not checked against a register.
- q: How does Zyphe store personal data?
  a: Zyphe says identity data is encrypted, split into shards and spread across storage nodes run by several providers in several jurisdictions, so it keeps no central database of customer PII. Its security page says rebuilding a record needs 29 of 100 shares. We could not check this independently.
- q: Does Zyphe have a sandbox?
  a: Yes. Sandbox mode is a flag on the same API, dashboard and npm SDK. Tests on members of your own team cost no credits, but sandbox runs on outside addresses are billed like production, and during the trial every sandbox event uses trial credits.
- q: Does Zyphe have native mobile SDKs?
  a: No. Zyphe offers Node and browser SDKs, and its documentation says there is no native iOS or Android SDK. Mobile apps create a session on their backend and load the verification flow in a WebView, with a guide for React Native.
- q: What is the best alternative to Zyphe?
  a: Sumsub is the closest alternative if you need iBeta-tested liveness, ISO/IEC 27001 and SOC 2 claims and a long track record. Unit21 (founded 2018) and Strise (founded 2016) also use AI for AML work and have been operating longer.
