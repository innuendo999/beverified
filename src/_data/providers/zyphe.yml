verification_notes:
- 'New record, first review. Zyphe asked to be listed; link.type set to none (no commercial relationship recorded).'
- 'Founded: not stated on any Zyphe page. Dealroom gives 2021 in its AI summary and a January 2025 launch date; PitchBook preview shows no year. Shown as Not publicly disclosed.'
- 'HQ conflicts: about page says New York, London and Milan; the July 2025 funding release is datelined San Francisco; Dealroom says New York City (header) and San Francisco (summary); PitchBook and The Wealth Mosaic give a Camden, Delaware registered-agent address. Facts show offices from the about page and the legal entity from the terms.'
- 'Funding amount: Zyphe and Dealroom say undisclosed; PitchBook preview says $2M early-stage round dated 1 Apr 2025 and 16 employees. Zyphe release dated 17 Jul 2025 (published 4 Aug 2025). PitchBook figure used only in what_is with attribution.'
- 'Leadership: co-founders Michelangelo Frigo, Charlene Wang and Manuel Tumiati come from Zyphe''s own author page; CEO title not confirmed on any page.'
- 'Chartis FCC50 2026: Chartis''s ranking and award winners page (9 Mar 2026) tags Zyphe among 98 organisations and links an organisation page for Zyphe, but the ranking itself is behind a subscription. The tag list is longer than 50, so the tag alone does not show a top-50 place. The "Market Disruptor" designation comes only from Zyphe''s news post (10 Mar 2026).'
- 'SOC 2 and ISO/IEC 27001: in progress per the security page and KYC product page ("Neither is certified today"). Re-check at the next 90-day review; Type I and ISO Stage 1 were targeted for October 2026.'
- 'Liveness: no iBeta, BixeLab or ISO/IEC 30107-3 claim found. Zyphe says liveness is built in-house.'
- 'Data storage: security page says thousands of nodes and 29 of 100 shares to rebuild a record; the CompanyData case study says tens of thousands of nodes; the decentralization docs give no threshold and say data is hosted across multiple providers and jurisdictions. Storage network not named. Security page cites both AES-GCM-256 and AES-256. All vendor-stated.'
- 'KYB coverage conflict: docs list 49 countries and territories plus 51 US entries (100 jurisdictions); the KYB product page claims 240+ official registries and a "190+ countries" heading. Docs figure used. Lithuania, Maryland, Antigua and Barbuda, British Virgin Islands and Isle of Man return no directors, shareholders or UBOs. Some registers (and China) take 1 to 3 business days or more. KYB register data comes live from CompanyData per its case study.'
- 'ID coverage: 4,000+ document versions from 190+ countries is from the KYC product page; the supported-documents docs give no totals. Accuracy figures (99.8% document matching on live clients, over 99% OCR) not used.'
- 'Sanctions lists: only OFAC, UN and EU are named, in a product graphic; "100K+ lists" is unexplained. List data provider not named.'
- 'Free tier: the pricing page offers a one-time $25 credit after business or payment-method verification, not a standing free tier. Sandbox runs on internal team members are free; outside addresses and all trial-period sandbox events use credits.'
- 'Capterra still shows old pricing (Verify & Scale from $295 a month, free version and trial); the Zyphe pricing page (rates updated 14 Oct 2026) is used.'
- 'User ratings: G2 4.8 from 6 reviews (no review text visible); Capterra Canada 5.0 from 2 reviews. Too few to state themes.'
- 'Customers: Azimut (also an investor), Protocol Labs, Supra, Vesseo and Twotixx have case studies or named quotes. Logo wall items (EBSI, ETHDenver, Pitchdrive VC, Altitude and others) are labelled clients and partners and not used as customers. Azimut figures (1,000 analyst hours, 50,000 false positives closed) not used.'
- 'Support: hello@zyphe.com and a contact form only; no hours, phone or SLA published. Capterra reviewers praise onboarding support (2 reviews).'
- 'Regulatory: no enforcement action, breach disclosure or litigation involving Zyphe found in searches to Oct 2026. Security page states no reported breach of identity data to date.'
- 'Integrations: the homepage shows 31 integration logos and says they do not imply partnership; not used.'
- 'Wikidata id not found; kg_mid unknown. LinkedIn page blocked to the fetcher.'
