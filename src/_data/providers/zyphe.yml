pros:
- Public rate card, with ID and liveness at $0.30 a check and AI agent reviews priced per task
- AI agents prepare alert and case reviews with cited evidence and a written rationale, and a person signs off by default
- KYC, KYB, screening and transaction monitoring in one self-serve platform with a sandbox, SDKs and an MCP server
cons:
- No SOC 2 or ISO/IEC 27001 certificate yet, and no published lab test of its liveness check
- KYB is not on the rate card, and register checks cover 49 countries and territories plus the US
- Young company with a short track record and only a handful of public user reviews
