verification_notes:
- 'New record, first review 2026-10-18. Zyphe asked to be listed; link.type set to none (no commercial relationship recorded).'
- 'Founded: still not stated on any Zyphe page (about page, co-founder author page). Dealroom gives 2021 in its AI summary and a January 2025 launch; PitchBook shows no year; Preqin (source 30) says only "Founded in Delaware, US". Shown as Not publicly disclosed.'
- 'HQ conflicts, re-checked 2026-10-22: about page says New York, London and Milan; Dealroom gives New York City in its header and San Francisco in its summary; PitchBook gives a Camden, Delaware registered-agent address; Preqin lists Delaware, OH. Facts keep offices from the about page and the legal entity from the terms.'
- 'Funding amount: Zyphe, Dealroom and Preqin (source 30) give an undisclosed round dated July 2025 (Preqin: 17 Jul 2025, co-led by Altitude, Azimut, Everywhere Ventures and ROI Ventures). PitchBook says $2M early-stage VC dated 1 Apr 2025, $2M total and 16 employees. PitchBook figures used only in what_is with attribution.'
- 'Chartis FCC50 2026: Chartis''s ranking and award winners page (9 Mar 2026) still tags Zyphe among 98 organisations, and Chartis''s Zyphe organisation page links only the two FCC50 2026 articles. The ranking is paywalled, so Zyphe''s category or place is not visible. "Market Disruptor" comes only from Zyphe''s news post (10 Mar 2026).'
- 'SOC 2 and ISO/IEC 27001: still in progress on 2026-10-22. Security page: SOC 2 Type I targeted for October 2026, Type II observation from Q1 2027; ISO/IEC 27001 Stage 1 October 2026, Stage 2 November to December 2026. KYC page: completion targeted Q4 2026, "Neither is certified today". No auditor or certification body named and no news post. Re-check in January 2027.'
- 'Liveness: no iBeta, BixeLab or ISO/IEC 30107-3 claim found. KYC page describes in-house active liveness with anti-spoof and injection-attack detection.'
- 'Data storage: security page says thousands of nodes and 29 of 100 shares to rebuild a record; the CompanyData case study says tens of thousands of nodes; the decentralization docs give no threshold. Storage network not named. Security page cites both AES-GCM-256 and AES-256. All vendor-stated.'
- 'KYB coverage conflict: country coverage docs list 49 countries and territories plus 50 US states and DC; the KYB product page still claims 240+ registries under a "190+ Countries" heading. Docs figure used. Lithuania, Maryland, Antigua and Barbuda, British Virgin Islands and Isle of Man return no directors, shareholders or UBOs; Croatia, Cyprus, Germany, Portugal, Serbia, Slovakia, Slovenia (UBOs) and China take 1 to 3 business days or more. KYB register data comes from CompanyData per its case study.'
- 'Sanctions lists: only OFAC, UN and EU are named, in an AML page graphic. The AML page says its "100K+ lists" cover sanctions, PEP, watchlist and adverse media but does not itemise them. List data provider not named.'
- 'Transaction alert agent: pricing page lists it at $0.40 per resolved alert, the agents page lists a transaction monitoring triage desk and the TM settings docs describe Disabled, Suggest and AutoPilot modes, but the AML product page says agent triage of TM alerts is "planned and not yet shipped" and "currently fixed to Disabled". Features line carries the caveat; re-check availability.'
- 'Capability check: case_management is not_disclosed with the note "Agents work in your own case tools", but Zyphe''s docs (sources 27, 28) describe built-in case management: KYB case assignment, approval matrix with reason codes, an Inbox with SLA targets, a TM alert queue with statuses and escalation, and an audit trail. The AML page also says agents share case management across KYC, KYB and AML. Suggest yes; capabilities not edited.'
- 'Capterra still shows old pricing (Verify & Scale from $295 a month, free version and free trial); the Zyphe pricing page (rates updated 14 Oct 2026) is used.'
