verdict: AU10TIX runs 100% automated verification in 4–8 seconds, built on forensic document-security roots and a 60+ company consortium that spots organized mass-fraud and deepfake attacks other vendors miss individually. It's enterprise-first with custom pricing — not a self-serve tool for small teams — but the anti-fraud network effect is a genuine differentiator.
what_is:
- AU10TIX is an identity-verification company founded in 2002 and headquartered in Hod Hasharon/Tel Aviv, Israel, by Ron Atzmon and Gil Atzmon, operating as a subsidiary of ICTS International with roughly 205 employees. Built on airport and border-security document-forensics expertise, it runs fully automated onboarding and coordinates a consortium of 60+ companies to detect organized, cross-platform mass-fraud patterns.
features:
- 100% automated identity verification completed in 4–8 seconds.
- Forensic-grade document authentication rooted in border-security technology.
- Cryptographic signature validation against government data sources.
- Facial and data cross-checks against official databases.
- Mass-fraud pattern detection via a 60+ company consortium.
- Reported $24B+ in fraud prevented across billions of verifications.
