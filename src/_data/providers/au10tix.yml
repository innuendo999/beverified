verification_notes:
- 'Founding: vendor boilerplate says founded in 2002 in the Netherlands (source 4). A 2022 CTech report (Algemeiner) says founded in 2010, HQ Hod Hasharon, and names Ron and Gil Atzmon as holders of a 70% stake, not as founders. Founders, HQ and headcount stay off the page.'
- 'Airport and border-security roots (tagline, what_is, pro) are not stated on any AU10TIX page opened. Wikipedia says early work focused on document authentication for border control and aviation security; parent ICTS describes its own focus as aviation security and border control (SEC exhibit, Nov 2019).'
- 'Certifications other than UK DIATF are vendor-stated on the Trust Center with no certificate links ("Request Evidence Pack"). No AU10TIX letter in the readable part of iBeta''s confirmation-letter list; Kantara Trust Status List did not render; the TX-RAMP certified products list is an xlsx we could not open.'
- 'Fraud figures are company-reported and differ by page: "over $33 billion" prevented (source 4) and "$5B saved on average annual fraud" (homepage).'
- 'Pricing page FAQ uses different tier names (Basic, Advanced, Corporate) than the plan cards (Basic KYC, Enhanced KYC, Enterprise). We use the plan card names.'
- 'G2 review text is not visible without login; user themes come from the 3 Capterra reviews (2021 to 2024) only.'
- 'Preferred shareholders gained exit rights from 3 Jul 2026 (FY2025 20-F); no sale announced as of the check date.'
