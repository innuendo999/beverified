verdict: AU10TIX describes its platform as 100% automated identity verification. It is built on document-forensics roots and cross-references data across a consortium of 60+ companies to spot serial and coordinated fraud that single vendors can miss. Entry plans carry a $500 monthly minimum and per-check prices are quoted, so it suits teams with steady volume more than very small ones. The consortium network effect is a genuine differentiator.
what_is:
- AU10TIX is an identity-verification company founded in 2002, according to the company. It is majority owned by ICTS International N.V., with TPG and Oak HC/FT among its preferred shareholders. AU10TIX lists offices in London, New York and Singapore and R&D centres in Israel and Eastern Europe. Its roots are in airport and border-security document forensics. It runs automated onboarding and cross-references data across a consortium of 60+ companies to detect serial, cross-platform fraud patterns.
features:
- Automated document and biometric verification (liveness and face match), which the vendor describes as 100% automated.
- 180+ forgery detection tests, plus deepfake and injection detection on the Enhanced plan.
- Serial Fraud Monitor and consortium verification across 60+ companies.
- Proof of address, AML screening and manual review on the Enhanced plan.
- Business verification (KYB), database verification, age estimation and Reusable Digital ID on the Enterprise plan.
- The vendor reports over $33 billion in identity fraud prevented (company-reported figure).
