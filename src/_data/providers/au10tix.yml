verification_notes:
- 'HQ "Hod Hasharon/Tel Aviv, Israel" not stated on any vendor page opened; vendor boilerplate says founded in 2002 in the Netherlands and lists R&D in Israel. HQ fact replaced with Offices.'
- 'Founders "Ron Atzmon and Gil Atzmon" and "roughly 205 employees" not found in any source opened. Removed.'
- '"4 to 8 seconds" verification time not found on current vendor pages; homepage case study (FXCM) says within 10 seconds. Removed from pros, features, FAQ and user themes.'
- '"$24B+ fraud prevented" replaced with the current vendor figure "over $33 billion" (press release Jul 2026). The homepage also says "$5B saved on average annual fraud". Both are company-reported.'
- 'Ownership percentages are from the June 2021 share sale described in the FY2023 20-F; later changes not checked.'
- 'UK DIATF certification is vendor-stated (press releases name Kantara Initiative UK as certifier); the UK DVS register entry itself could not be opened. Other certifications are listed on the Trust Center without certificate links (evidence pack on request). iBeta letter not found on ibeta.com.'
- 'Pricing page FAQ uses different tier names (Basic, Advanced, Corporate) than the plan cards (Basic KYC, Enhanced KYC, Enterprise). We use the plan card names.'
- 'G2 rating visible (4.5, 43 reviews); review text not read in full, so themes are general statements without counts.'
