faq:
- q: How much does AU10TIX cost?
  a: The Basic KYC and Enhanced KYC plans each have a $500 monthly minimum. Enterprise pricing is quoted, and per-check prices are not published.
- q: How fast is AU10TIX verification?
  a: AU10TIX does not publish a standard verification time. A customer case study on its site says ID document checks moved from hours or days to within 10 seconds.
- q: What is AU10TIX's fraud consortium?
  a: AU10TIX cross-references data across a consortium of more than 60 companies to detect serial, cross-platform fraud and deepfake attack patterns that individual vendors might miss.
- q: Who owns AU10TIX?
  a: ICTS International N.V. holds the majority of AU10TIX's share capital. TPG and Oak HC/FT invested a combined $80M in preferred shares in 2019.
- q: What is the best alternative to AU10TIX?
  a: Incode is the best alternative for the largest proprietary identity dataset. Jumio is the closest fit for enterprise scale.
- q: Who are AU10TIX's main competitors?
  a: AU10TIX competes with Incode, Jumio, and Onfido, differentiating through automated verification and consortium-based mass-fraud detection.
