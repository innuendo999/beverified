faq:
- q: How much does AU10TIX cost?
  a: AU10TIX does not publish pricing; its automated verification platform is licensed to enterprises based on volume.
- q: How fast is AU10TIX verification?
  a: AU10TIX completes fully automated identity verification in 4–8 seconds.
- q: What is AU10TIX's fraud consortium?
  a: AU10TIX coordinates a consortium of more than 60 companies to detect organized, cross-platform mass-fraud and deepfake attack patterns that individual vendors might miss.
- q: Who owns AU10TIX?
  a: AU10TIX operates as a subsidiary of ICTS International and has raised $80M from TPG and Oak HC/FT.
- q: What is the best alternative to AU10TIX?
  a: Incode is the best alternative for the largest proprietary identity dataset. Jumio is the closest fit for enterprise scale.
- q: Who are AU10TIX's main competitors?
  a: AU10TIX competes with Incode, Jumio, and Onfido, differentiating through fully automated verification and consortium-based mass-fraud detection.
