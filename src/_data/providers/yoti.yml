verification_notes:
- 'link.type set to none: no commercial relationship with Yoti is recorded.'
- 'iBeta: Level 3 letter opened (23 Jan 2026, myface12122025, iPhone 16 Pro, 450 attacks, APCER 0%). Older letters on iBeta''s page: Level 1 (Feb 2022), Level 2 (Feb 2023), Levels 1 and 2 partial retest (Oct 2025).'
- 'UK DVS register opened 24 Nov 2026: four services, trust marks 021001 to 021004, certified 6 Oct 2026, expire 4 Nov 2028.'
- 'ISO: Intertek certificate 0170917 (27001:2022 extended by 27701) opened; linked 27001 certificate 0148208; HQ address from the certificate. SOC 2 Type II only from Yoti''s security page (source 10, a ?p= URL returned by search); vendor_stated.'
- 'ACCS: a search snippet of the registry page showed "ACCS 1:2020 ... Level 2, Facial Age Estimation with API model version Aug24, validity 21/10/2026"; our fetch of the page showed no entries. Status vendor_stated (ACCS logo on Yoti''s age page). Validity may have lapsed or been renewed; re-check in a browser.'
- 'AEPD: the resolution (PS-00164-2025, EXP202317887) is on aepd.es but robots blocks our tool; amounts and articles from Biometric Update, PPC Land and MLex: €500,000 (Art. 9), €200,000 (Art. 7), €250,000 (Art. 5.1.e by difference; PPC Land gives the breakdown). Fine suspended pending appeal (MLex, 15 Apr 2026). Added to incidents.yml as type regulatory, counted (within 24 months).'
- 'NFC: chip reading is stated for the Digital ID app in a G-Cloud listing (vendor-supplied); not stated for the IDV SDK.'
- 'Pricing: the public list covers age checks, Yoti Verify (Digital ID sharing), AML checks, Login and Sign; document and selfie IDV has no public price (G-Cloud lists £0.20 to £2.50 a transaction for the wallet service; not used). Free trial: G-Cloud says one is available; not on yoti.com except for Sign; trial set false.'
- 'Customers: age page names Spotify, Lebara, NCR Voyix, Yubo and Kids Web Services. FT figures (23M app downloads, revenue £32M+ in 2025) seen only in a secondary summary; not used.'
- 'User ratings: not checked (G2 not readable).'
