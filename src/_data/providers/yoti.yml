verdict: 'Yoti suits platforms that must check age at scale, and UK employers, landlords and regulated firms that need certified identity checks. It offers ten age check methods behind one integration, from facial age estimation to ID documents and its Digital ID app, and an age check costs £0.15 with a £15 monthly minimum. Its liveness holds an iBeta Level 3 letter and its identity services are on the UK DVS register. Spain''s data protection authority fined it €950,000 in March 2026 over its Digital ID app; Yoti is appealing.'
what_is:
- Yoti is a London digital identity company founded in 2014. It runs the Yoti Digital ID app, sells age verification, identity verification, eSignatures and in-branch checks to businesses, and powers the Post Office EasyID app. Its age check page names Spotify, Lebara, NCR Voyix and Yubo among its customers.
- Yoti's products share one platform. Age checks can use facial age estimation, an ID document, the Digital ID app, eID schemes, a credit card, a mobile number, a database or an email address. Identity verification reads documents, checks a selfie with liveness and can add PEP and sanctions screening, with Yoti's own staff reviewing harder cases. Four Yoti services are certified on the UK DVS register for Right to Work, Right to Rent and DBS checks.
features:
- Ten age check methods in one integration, including facial age estimation, ID document, Digital ID, eID, credit card, mobile, database and email age estimation.
- Yoti Keys let a user keep access on a device without proving their age again.
- Identity verification with document checks, selfie match and passive liveness (MyFace), with human review by Yoti's own team.
- PEP and sanctions screening as an add-on to Yoti Verify and identity verification.
- Reusable Yoti Digital ID app, which can read the chip in ePassports.
- UK DVS certified services for Right to Work, Right to Rent and DBS checks, plus in-branch checks at the Post Office.
- Web SDKs, mobile SDKs for iOS, Android and React Native, a no-code portal, and the Yoti Hub with a sandbox.
- eSignatures (Yoti Sign) with a 30-day free trial.
