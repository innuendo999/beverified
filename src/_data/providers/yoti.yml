faq:
- q: How much does Yoti cost?
  a: Yoti publishes prices in pounds. An age-only check costs £0.15 with a £15 minimum spend a month. Yoti Verify starts at £0.30 per verify and a PEP and sanctions check at £0.15. Document and selfie identity verification is quoted on request.
- q: Which age check methods does Yoti offer?
  a: Yoti lists ten methods. They are facial age estimation, the Yoti Digital ID, an ID document with a selfie, Yoti Keys, a credit card, a mobile number, an eID scheme, an SSN check, a database check and email age estimation.
- q: Is Yoti's liveness independently tested?
  a: Yes. iBeta's letter of 23 January 2026 confirms Yoti's MyFace passive liveness at ISO/IEC 30107-3 Level 3, with no attacks passing in 450 attempts across three attack types. Earlier versions held Level 1 and Level 2 letters.
- q: Is Yoti certified for UK Right to Work checks?
  a: Yes. The UK DVS register lists Yoti IDV, Yoti Digital ID and Post Office EasyID for Right to Work, Right to Rent and DBS checks, certified on 6 October 2026 until 4 November 2028.
- q: Why was Yoti fined in Spain?
  a: Spain's data protection authority, the AEPD, fined Yoti €950,000 in March 2026 over its Digital ID app, citing how it processed biometric data, how it collected consent and how long it kept data. Yoti rejects the decision, is appealing at Spain's National Court, and removed the app from Spanish app stores from 10 September 2026. Yoti says no data breach was involved.
- q: Is Yoti ISO 27001 certified?
  a: Yes. Intertek certifies Yoti Ltd to ISO/IEC 27001:2022, extended by ISO/IEC 27701, for its global ID verification services. The certificate we opened is valid until 29 April 2027. Yoti also says it passes an annual SOC 2 Type II audit.
- q: What is the best alternative to Yoti?
  a: Incode is the closest alternative for liveness with an iBeta Level 3 letter. Persona fits teams that want UK-certified identity checks in a configurable workflow.
