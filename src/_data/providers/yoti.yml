pros:
- Ten age check methods behind one integration, with a published price of £0.15 per age-only check
- Liveness with an iBeta Level 3 letter (January 2026) and four services certified on the UK DVS register
- ISO/IEC 27001 and 27701 certificate opened, issued by Intertek and valid to April 2027
cons:
- Spain's data protection authority fined Yoti €950,000 in March 2026 over biometric data in its Digital ID app; Yoti is appealing and withdrew the app from Spanish app stores
- Document and selfie identity verification is not priced on the public price list
- Age checks carry a £15 minimum spend a month, and support hours are not published
