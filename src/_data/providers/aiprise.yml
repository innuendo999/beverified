verification_notes:
- 'aiprise.com/pricing returned a client error on 2026-10-18 and again on 2026-10-22; the homepage shows no prices. The KYC $1.25 and KYB $3.00 starting prices come from G2''s listing (vendor-supplied, pricing last updated 29 Dec 2025), not from AiPrise''s own site. Confirm with the vendor.'
- 'Free trial conflicts between listings: G2 lists one with no terms, Capterra lists none. Both are shown as third-party.'
- 'Founded 2022 and San Francisco HQ come from the Y Combinator profile (re-checked 2026-10-22; accelerator listing, not a registry). aiprise.com has no About page; trust.aiprise.com and OpenCorporates did not render.'
- 'Total funding not confirmed from a primary source (one article says $2.0M seed plus $12.5M Series A, about $14.5M). Series A coverage (Pulse 2.0, FinTech Global, Axios) gives no total. Only the Series A is shown.'
- 'SOC 2 Type II is vendor-stated (homepage badge; support article says it is audited annually by an unnamed independent firm); no report opened. ISO 27001 not claimed. The homepage shows a GDPR badge but the support article says AiPrise is still working toward full GDPR compliance; GDPR is not listed.'
- 'Alternative Vespia: vespia.io shows a "Veriff is acquiring Vespia" banner and its sign-up buttons go to veriff.com (Oct 2026). The alternatives list is a locked field; editor to review.'
- 'No Gartner Peer Insights page for AiPrise was found.'
