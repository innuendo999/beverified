verification_notes:
- 'Company identity not confirmed by any independent source (2026-10-22). Website, terms, privacy policy, contact page and console sign-in name only the brand "Horus Checks"; no legal entity, registration number, address, founders or founding year. Terms have no governing-law clause. UK Companies House has no company named "Horus Checks" (source 6). No Crunchbase, LinkedIn or press coverage found.'
- 'Trustpilot business profile (claimed June 2025, 0 reviews) lists the country as Mauritius (source 5). This is company-supplied, gives no address and was not matched to a Mauritius company register entry, so HQ stays "Not publicly disclosed".'
- 'Pricing section on horuscheck.io lists what KYC and KYB include under the heading "A flexible pay as you go solution" and shows no figures; the console sign-in page shows no prices either.'
- '14,000+ document templates and 200+ countries are vendor figures (sources 1, 4); the document-verification technology behind them is not named.'
- 'No certifications found beyond a GDPR badge image; no ISO/IEC 27001, SOC 2 or ISO/IEC 30107-3 claims.'
- 'No G2, Capterra or Gartner Peer Insights listing found; Trustpilot profile has 0 reviews, so user_ratings stays empty.'
