verdict: 'HorusCheck, which brands itself Horus Checks, sells a self-service KYC, KYB and AML platform with document checks, liveness, watchlist screening and a no-code flow builder. Caution: we could not confirm who runs it. The website names no company, address, founding year or prices, and we found no matching entry at Companies House and no independent coverage. Confirm the legal entity and contract terms with the vendor before you send it customer data.'
what_is:
- HorusCheck (Horus Checks, horuscheck.io) is a self-service compliance platform for KYC, KYB and AML checks, aimed at both regulated and non-regulated businesses such as banks, crypto exchanges, fintech, gaming, hospitality, insurtech, real estate and travel. It offers ID document verification with OCR and MRZ validation across 14,000+ document templates, one-shot and 3D liveness with face matching, AML watchlist and sanctions screening, KYB with registry and UBO checks, and a no-code verification flow builder. Its website, terms and privacy policy do not name a legal entity, address or founding year.
features:
- ID document verification with OCR and MRZ validation across 14,000+ document templates.
- One-shot and 3D liveness detection with face matching.
- Real-time AML screening against global watchlists and sanctions lists.
- KYB with data collection, registry verification and UBO checks.
- No-code flow builder with routing by risk score, geography or document type.
- Self-service console with pay-as-you-go pricing.
