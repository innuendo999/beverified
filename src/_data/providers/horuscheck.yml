faq:
- q: How much does HorusCheck cost?
  a: Pricing is not published as figures; Horus Checks describes its model as pay as you go and quotes on request.
- q: Who founded HorusCheck and when?
  a: Not publicly disclosed. The website, terms and privacy policy do not name the company, its founders or its founding year.
- q: Where is HorusCheck headquartered?
  a: Not publicly disclosed. The website gives only a contact form and says data is held on GDPR-compliant infrastructure, without naming a country.
- q: What does HorusCheck offer?
  a: ID document verification with OCR and MRZ checks across 14,000+ templates, liveness and face matching, AML watchlist and sanctions screening, KYB with UBO checks and a no-code flow builder.
- q: What is the best alternative to HorusCheck?
  a: ComplyCube is the best-documented alternative with a verified API-first track record. iDenfy is the closest fit for published per-check pricing.
- q: Who are HorusCheck's competitors?
  a: HorusCheck is positioned alongside ComplyCube, iDenfy, and KYCAID in the KYC/AML verification space.
