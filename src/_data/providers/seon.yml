- The IDV product page states no document-type or country counts and no iBeta or other PAD test; none were added.
- alternatives[2] has slug 'aml' for Sardine (should be 'sardine'); not changed because alternatives is a do-not-change field.
- User review themes not visible on G2; kept as general statements. The "document/biometric gap" theme was dropped because SEON now offers IDV.
