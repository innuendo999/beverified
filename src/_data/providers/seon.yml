  by_profile:
  - Fintechs and marketplaces use SEON as a pre-KYC fraud filter ahead of a dedicated IDV step.
  - Teams already using a document-verification platform add SEON specifically for device/digital-footprint signals.
  - Very early-stage teams sometimes find the $699/mo Starter tier a meaningful commitment.
faq:
- q: How much does SEON cost?
  a: SEON's Starter plan is $699 a month for 2,500 fraud checks, 10 users and 50 custom rules, without AML compliance or case management. Premium adds those and is priced on request.
- q: Does SEON verify identity documents?
  a: Yes, since January 2026. SEON launched identity verification with document checks, biometric liveness and proof of address, with the initial rollout focused on Europe. Many teams still pair SEON's fraud signals with an established document-verification provider.
- q: What signals does SEON analyze?
  a: SEON says it analyzes more than 1,100 first-party data signals, including email, phone, IP, device, and browser data, to score fraud risk in real time.
- q: Does SEON do AML screening?
  a: Yes. SEON offers AML screening and AML transaction monitoring alongside fraud scoring. On the pricing page, AML compliance is part of the Premium plan, not Starter.
- q: What is the best alternative to SEON?
  a: ComplyAdvantage is the best alternative if sanctions and PEP watchlist data depth matters more than pre-KYC device signals. Feedzai is the closest fit for enterprise-scale payment-fraud detection.
- q: Who are SEON's main competitors?
  a: SEON competes with ComplyAdvantage and Feedzai on the fraud/AML side, differentiating through its digital-footprint and device-intelligence signals.
