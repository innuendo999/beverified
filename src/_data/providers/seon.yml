verification_notes:
- ISO/IEC 27001, ISO/IEC 27017 and SOC 2 Type 2 are vendor-stated only. The Trust Center (trust.seon.io) lists them with no auditor, date or certificate number; the 2020 announcement names Eurocert as the ISO 27001 auditor, but no certificate or certification-body register entry was found.
- The IDV product page and the January 2026 launch release state no document-type or country counts and no iBeta or other ISO/IEC 30107-3 test; none added. Regions beyond the Europe-first rollout are not stated.
- alternatives[2] has slug 'aml' for Sardine (should be 'sardine'); not changed because alternatives is a do-not-change field.
- G2 and Capterra review text not visible without login; user review themes kept as general statements, not counted themes.
