verdict: 'SEON''s edge is signal, not documents: it scores fraud risk from email, phone, IP, device, and browser data before a user ever submits an ID. That makes it a strong pre-KYC layer and AML complement. SEON added its own document and liveness verification in January 2026, starting with Europe, but that product is new, and many teams will still pair SEON with an established IDV platform.'
what_is:
- SEON is a fraud-prevention and AML platform founded in 2017 in Budapest by Tamás Kádár and Bence Jendruszák, now headquartered in Austin, Texas, with offices in London, Budapest, Jakarta and Singapore. It says it protects more than 5,000 businesses and analyzes more than 1,100 first-party data signals to score fraud risk. The company reports having helped prevent more than $300 billion in fraud losses. In September 2025 it raised an $80 million Series C led by Sixth Street, and in January 2026 it launched identity verification with document, liveness and proof-of-address checks.
features:
- Digital footprint and device intelligence across email, phone, IP, device, and browser signals.
- Real-time fraud scoring at the point of onboarding.
- AI-assisted rule builder that creates rules and filters from a plain-language description.
- Explainable scoring that shows which signals drove the AI score.
- AML screening and AML transaction monitoring alongside fraud prevention (Premium plan).
- Identity verification with document checks (including NFC chip reading), selfie liveness and proof of address (launched January 2026, Europe first).
pricing:
  summary: SEON's Starter plan is $699 a month and includes 2,500 fraud checks, 10 user accounts and 50 custom rules; case management and AML compliance are not included. Premium, which adds AML, case management and unlimited API calls, is priced on request. Both plans offer a free trial; its length is not stated.
