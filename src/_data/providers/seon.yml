faq:
- q: How much does SEON cost?
  a: SEON's Starter plan begins at $699/month for entry-level fraud and AML screening; Premium pricing is custom and scales with usage and feature needs.
- q: Does SEON verify identity documents?
  a: No. SEON is a fraud-prevention and digital-footprint intelligence platform, typically used ahead of or alongside a document-verification provider rather than as a replacement for one.
- q: What signals does SEON analyze?
  a: SEON analyzes more than 900 digital and device signals, including email, phone, IP, device, and browser data, to score fraud risk in real time.
- q: Does SEON do AML screening?
  a: Yes. SEON combines fraud-risk scoring with AML screening in one workflow, in addition to its pre-KYC digital-footprint analysis.
- q: What is the best alternative to SEON?
  a: ComplyAdvantage is the best alternative if sanctions and PEP watchlist data depth matters more than pre-KYC device signals. Feedzai is the closest fit for enterprise-scale payment-fraud detection.
- q: Who are SEON's main competitors?
  a: SEON competes with ComplyAdvantage and Feedzai on the fraud/AML side, differentiating through its digital-footprint and device-intelligence signals.
