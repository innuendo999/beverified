verdict: 'SEON''s edge is signal, not documents: it scores fraud risk from email, phone, IP, device, and browser data before a user ever submits an ID. That makes it a strong pre-KYC layer and AML complement, but it''s not a document or biometric verification tool on its own — most teams pair it with a dedicated IDV platform.'
what_is:
- SEON is a fraud-prevention and AML platform founded in 2017 in Budapest by Tamás Kádár and Bence Jendruszák, now headquartered in Austin, Texas, with offices in Budapest, London, Singapore, and Jakarta. It serves more than 5,000 businesses, analyzing over 900 digital and device signals to score fraud risk — the company reports having helped prevent more than $300 billion in fraud losses.
features:
- Digital footprint and device intelligence across email, phone, IP, device, and browser signals.
- Real-time fraud scoring at the point of onboarding.
- Natural-language rule builder for configuring fraud logic without code.
- Explainable AI scoring for audit and compliance review.
- Unified fraud-prevention and AML screening in one workflow.
- Pre-KYC screening and transaction monitoring.
