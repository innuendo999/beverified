pros:
- Transparent Starter-tier pricing, unlike most AML/fraud-data competitors
- Deep device and digital-footprint enrichment for pre-KYC screening
- Fast to integrate as a fraud-scoring layer ahead of a full KYC flow
cons:
- Its document and liveness verification only launched in January 2026, with a Europe-first rollout
- Premium-tier pricing is not published
- AML screening and case management are not in the Starter plan
