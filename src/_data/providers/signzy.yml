verification_notes:
- The third-party India price figures (Rs 5 to Rs 35 per check, Rs 2 to 15 lakh annual platform fee) had no source and were removed. signzy.com/pricing did not load.
- Funding changed from $38.7M+ to "more than $37 million" (Inc42, Feb 2024). SAP as an investor was not confirmed and was removed. Mastercard took part in the 2020 $5.4M round per People Matters.
- The customer claim "10 Fortune 30 companies" was removed (no source). Mastercard's 2020 release cited the 4 largest Indian banks and a top-3 US acquiring bank; these are 2020 vendor claims and are not repeated as current facts. About page says 1,800+ financial institutions and technology companies; the homepage says 500+ global companies.
- GSTIN lookups and MCA director checks were removed as product claims; Signzy's GSTIN page discusses GSTIN verification generally and mentions MCA records only in an FAQ. Microsoft Azure Marketplace distribution was not confirmed and was removed.
- The "IIT-trained" founders claim was removed (no source opened).
- ISO 27001, SOC 2 Type II and PCI DSS are vendor-stated only.
- G2 page did not load; no user rating recorded. User review themes kept as general statements.
