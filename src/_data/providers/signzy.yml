faq:
- q: How much does Signzy cost?
  a: Signzy's India-market pricing is reported by third parties at roughly ₹5–₹35 per AML/sanctions check plus a ₹2–15 lakh annual platform fee; verify current rates directly with Signzy.
- q: Does Signzy support Aadhaar verification?
  a: Yes. Signzy supports Aadhaar e-KYC and V-CIP (video customer identification process) alongside document OCR and face match.
- q: Does Signzy verify businesses?
  a: Yes, Signzy's KYB tools include GSTIN lookups, MCA director checks, UBO identification, and business address verification.
- q: How does Signzy distribute globally?
  a: Signzy distributes its video-KYC technology globally through a 2020 alliance with Mastercard.
- q: What is the best alternative to Signzy?
  a: IDMERIT is the best alternative for broader, lower-cost multi-country coverage. KYC Hub is the closest fit for no-code AML lifecycle orchestration.
- q: Who are Signzy's main competitors?
  a: Signzy competes with IDMERIT, ComplyCube, and KYC Hub, differentiating through deep India-specific regulatory coverage.
