verdict: Signzy's no-code visual workflow builder is deeply specialized for India — Aadhaar e-KYC, V-CIP video verification, and GSTIN business lookups — while a 2020 Mastercard alliance extends its video-KYC distribution globally. It's the strongest option here for India-specific BFSI compliance, though its depth outside that market requires more configuration.
what_is:
- 'Signzy is a no-code KYC/KYB/AML platform founded in 2015 in Bengaluru, India, by an IIT-trained trio: CEO Ankit Ratan, Arpit Ratan, and Ankur Pandey, having raised more than $38.7M from investors including Kalaari, SAP, and Mastercard. It serves the largest Indian banks, 10 Fortune 30 companies, and a top-3 US acquiring bank, distributing its video-KYC technology globally through a 2020 Mastercard alliance.'
features:
- No-code visual workflow builder for KYC/KYB flows.
- Individual KYC — V-CIP video verification, Aadhaar e-KYC, face match, document OCR.
- Business KYC/KYB — GSTIN lookups, MCA director checks, UBO identification, business address verification.
- AML and sanctions screening.
- Fraud monitoring, expanded after its 2024 acquisition of Difenz.
- Distribution via Microsoft Azure Marketplace and Mastercard's global alliance.
