faq:
- q: How much does Signzy cost?
  a: Signzy does not publish pricing. It describes its pricing as pay-as-you-go and modular, and quotes on request.
- q: Does Signzy support Aadhaar verification?
  a: Yes. Signzy's video KYC supports RBI-compliant V-CIP (video customer identification process) with live face match against PAN, Aadhaar and other IDs, and it also offers CKYC and Aadhaar eSign.
- q: Does Signzy verify businesses?
  a: Yes. Signzy's business verification checks registered documents and government databases and includes UBO checks.
- q: How does Signzy distribute globally?
  a: Mastercard partnered with Signzy in October 2020 for a global rollout of its video-KYC solution. Signzy also lists offices in the US and Dubai.
- q: What is the best alternative to Signzy?
  a: IDMERIT is the best alternative for broader, lower-cost multi-country coverage. KYC Hub is the closest fit for no-code AML lifecycle orchestration.
- q: Who are Signzy's main competitors?
  a: Signzy competes with IDMERIT, ComplyCube, and KYC Hub, differentiating through deep India-specific regulatory coverage.
