verification_notes:
- 'Customer count differs by page: the about page says more than 1,800 financial institutions and technology companies (used in what_is); the homepage says 500+ global companies and 1B+ users verified. Neither is dated.'
- 'ISO 27001, SOC 2 Type II and PCI DSS remain vendor-stated. No certificate, auditor or register entry found. Signzy docs (updated Feb 2024) cite ISO/IEC 27001:2013; the homepage says ISO 27001 and SOC 2 but not PCI DSS.'
- 'Funding kept at more than $37 million (Inc42, Feb 2024). No round after the 2022 Series B was found in reputable press; tracker totals (about $38M) were not used.'
- 'An acquisition of PowerEdge Analytics (Nov 2025) appears only on a startup database; not confirmed by Signzy or press, so not used.'
- 'RBI sandbox: the July 2024 release covers only the test phase; no outcome found for Signzy''s unassisted video KYC.'
- 'G2 product review page and capterra.com did not load; ratings taken from the G2 seller page and Capterra NZ. The homepage badge says "G2 4.7/5", which does not match the 4.4 shown on G2.'
- 'signzy.com/pricing returned an error; pricing confirmed as quote-only from the January 2026 Signzy vs Veriff page and a homepage with no pricing link.'
