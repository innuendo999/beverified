verdict: Signzy's no-code onboarding platform is specialized for India (Aadhaar-based checks, CKYC and RBI-compliant V-CIP video verification), while a 2020 Mastercard partnership set out to roll its video KYC out globally. It's the strongest option here for India-specific BFSI compliance, though its depth outside that market requires more configuration.
what_is:
- 'Signzy is a no-code KYC/KYB/AML platform founded in 2015 in Bengaluru, India, by Ankit Ratan (CEO), Arpit Ratan and Ankur Pandey. It has raised more than $37 million from investors including Gaja Capital, Vertex Ventures, Arkam Ventures, Kalaari and Mastercard. It says more than 1,800 financial institutions and technology companies use it, and it lists offices in India, the US and the UAE. In 2020 Mastercard partnered with Signzy for a global rollout of its video-KYC solution. In July 2024 the Reserve Bank of India selected Signzy''s unassisted video-KYC solution for the test phase of the fifth cohort of its regulatory sandbox.'
features:
- No-code platform for designing onboarding and KYC/KYB journeys.
- 'Individual KYC: RBI-compliant V-CIP video verification, face match against PAN and Aadhaar, CKYC search and upload.'
- 'Business KYC/KYB: business verification against registered documents and government databases, plus UBO checks.'
- Real-time sanctions and PEP screening.
- Transaction monitoring and fraud detection, expanded after its 2024 acquisition of Difenz.
- Bank account verification (penny drop, IFSC check) and Aadhaar eSign.
