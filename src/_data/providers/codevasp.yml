faq:
- q: How much does CODE cost?
  a: CODE does not publish prices. VASPs contact partnership@codevasp.com or book a demo, and CODE says it replies within two business days. It has Travel Rule Members and Associate Members, and LEI issuance through CODE is free.
- q: Who owns CODE?
  a: CODE was set up in September 2021 with a KRW 900 million joint investment by Bithumb, Coinone and Korbit, a third each. Bithumb sold its stake to Bithumb Holdings in July 2025, and Korbit's operator was renamed Digital X after joining Mirae Asset in 2026. CODE does not publish its current shareholders.
- q: Which networks does CODE connect to?
  a: CODE runs its own network and documents links to VerifyVASP, GTR and Sygna. Its docs say VerifyVASP members can only be reached for transfers within South Korea. Sumsub's docs say Sumsub uses CODE as a bridge. CODE's homepage also names Notabene and CryptoSwift, but we found no confirmation from them. It names no TRUST, TRISA or TRP route.
- q: How many VASPs use CODE?
  a: CODE's homepage says it connects 350+ VASPs in 60 jurisdictions. In May 2024 it said it served 83 entities in 35+ countries. Its alliance page lists members such as Bithumb, Coinone, Digital X, Crypto.com Korea, Bybit, Bitget and BingX.
- q: How does CODE handle self-hosted wallets?
  a: CODE offers unhosted wallet verification, in which the user proves ownership of the wallet with a blockchain signature. It does not publish which chains or wallets this works with.
- q: What is the best alternative to CODE?
  a: VerifyVASP if your counterparties are mainly Upbit, other VerifyVASP members or Japanese VASPs on Sygna Bridge. Notabene for a hosted network with more reach outside Asia. 21 Analytics if many transfers go to TRUST members or you want to run the software yourself.
