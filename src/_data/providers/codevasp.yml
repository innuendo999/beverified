pros:
- The main Travel Rule route to Korean exchanges such as Bithumb, Coinone and Digital X, plus global exchanges active in Korea
- Sumsub confirms CODE as a bridge, and CODE documents links to GTR, VerifyVASP and Sygna
- Public developer docs, a sandbox, VASP lookup by transaction ID and free LEI issuance
cons:
- No TRUST, TRISA or TRP route, and the VerifyVASP link covers Korean domestic transfers only
- No published prices and no certificate published for its ISO claims
- Ownership has shifted with its exchange shareholders, and the current split is not disclosed
