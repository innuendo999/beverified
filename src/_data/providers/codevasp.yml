verdict: 'CODE is a Travel Rule network for exchanges and custodians that trade with South Korean VASPs, set up in 2021 by Bithumb, Coinone and Korbit. Its Travel Rule price is not published; LEI issuance through CODE is free. It names no TRUST, TRISA or TRP route, and its ownership has shifted with its exchange shareholders.'
what_is:
- 'CODE (Connect Digital Exchanges), also sold as CodeVASP, is a Travel Rule network for virtual asset service providers. A VASP connects its backend to the CodeVASP gateway, looks up the receiving VASP from a list, a wallet address or a transaction ID, fetches that VASP''s public key, and sends the originator and beneficiary data encrypted end to end before or after the transfer. CODE says it stores no personal data. It vets each VASP before connecting it, using the GDF due diligence questionnaire, and offers free LEI issuance and signature checks for self-hosted wallets. Its developer docs and a sandbox are public.'
- 'CODE was set up in September 2021 as a joint venture of three Korean exchanges, Bithumb, Coinone and Korbit, each holding a third, when Korea''s Travel Rule took effect; Upbit left early to build VerifyVASP. Its network lists Bithumb, Coinone, Digital X (the former Korbit), Crypto.com Korea, Bybit, Bitget and BingX among its members. Bithumb moved its stake to Bithumb Holdings in July 2025, and Korbit''s operator became Digital X under Mirae Asset in August 2026. Its homepage names Hwang Dae-jin as CEO; Lee Sung-mi led it from November 2022.'
features:
- VASP lookup by list, by wallet address and by transaction ID, so a receiving VASP can ask who sent a deposit.
- Originator and beneficiary data encrypted end to end with the counterparty's public key; CODE says it stores no personal data.
- Pre-transaction and post-transaction Travel Rule flows.
- Links to other networks documented by CODE: VerifyVASP (domestic Korean transfers only), GTR and Sygna; Sumsub uses CODE as a bridge.
- Due diligence on each VASP before connection, based on the GDF virtual asset due diligence questionnaire.
- Self-hosted wallet ownership checks with a blockchain signature.
- Free LEI issuance for members, a status dashboard, public developer docs and a sandbox.
