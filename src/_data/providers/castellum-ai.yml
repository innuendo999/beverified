verdict: Castellum.AI runs its own sanctions and risk database, with 1,000+ watchlists updated every 5 minutes, instead of reselling third-party data. Founder Peter Piatetsky previously worked at the US Treasury, including OFAC. The company says its AI agents instantly resolve 83% of L1 and L2 alerts and cut false positives by 94%, with an AI governance layer for audit and oversight.
what_is:
- Castellum.AI is a financial-crimes compliance platform based in New York that combines in-house risk data, AML/KYC screening and AI agents. CEO and co-founder Peter Piatetsky worked at OFAC and other US Treasury offices and later ran US compliance for a major Asian bank. The company raised a $4M seed round led by Spider Capital in 2023 and an $8.5M Series A led by Curql in 2025. It says its data draws on 200,000+ sources, with 1,000+ sanctions and PEP watchlists updated every 5 minutes.
features:
- Sanctions, PEP and AI-powered adverse-media screening.
- KYC/KYB onboarding, real-time monitoring, transaction screening and lookbacks.
- Beneficial ownership and shelf company data.
- 'Arbiter AI agents for alert resolution: the vendor says 83% of L1 and L2 alerts are resolved instantly.'
- The vendor reports 94% fewer false positives (company-reported figure).
- AI Governance Center for oversight and audit of agent decisions.
