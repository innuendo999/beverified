verdict: Castellum.AI runs its own sanctions and risk database — updated every 5 minutes across 1,000+ lists — rather than reselling third-party data, built by founder Peter Piatetsky's direct experience at the US Treasury's OFAC. Its agentic AI reportedly resolves 83% of L1/L2 alerts instantly with a 94% cut in false positives, with explainability built in for audits.
what_is:
- Castellum.AI is a sanctions and risk-data screening company founded in 2019 and headquartered in New York, co-founded by CEO Peter Piatetsky, a former US Treasury/OFAC official, and CTO Julian Vasilkoski. With roughly 26 employees and about $12.6M raised from investors including Spider Capital and NewFund, it maintains an in-house database of 200,000+ sources and 1,000+ sanctions lists (OFAC, UN, UK HMT, EU), refreshed every 5 minutes.
features:
- Real-time sanctions, PEP, and adverse-media screening.
- Beneficial-ownership, forced-labor, and supply-chain risk screening.
- Agentic AI alert resolution — reported 83% of L1/L2 alerts resolved instantly.
- Reported 94% reduction in false positives.
- Explainable, audit-ready decisioning with PDF investigation reports.
- Perpetual KYC (pKYC) support.
