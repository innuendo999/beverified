faq:
- q: How much does Castellum.AI cost?
  a: Castellum.AI does not publish pricing. It quotes on request for its platform, API and bulk data options.
- q: How often is Castellum.AI's data updated?
  a: Castellum.AI says its 1,000+ sanctions and PEP watchlists are updated every 5 minutes.
- q: Who founded Castellum.AI?
  a: Castellum.AI was co-founded by CEO Peter Piatetsky, who previously worked at OFAC and other offices of the US Treasury. Third-party data gives 2019 as the founding year.
- q: What does Castellum.AI's agentic AI do?
  a: Castellum.AI says its Arbiter AI agents instantly resolve 83% of L1 and L2 alerts and cut false positives by 94%, with an AI Governance Center for oversight.
- q: What is the best alternative to Castellum.AI?
  a: ComplyAdvantage is the best alternative for a larger, established financial-crime database. Sanction Scanner is the closest fit for accessible mid-market pricing.
- q: Who are Castellum.AI's main competitors?
  a: Castellum.AI competes with ComplyAdvantage, Sanction Scanner, and NameScan, differentiating through in-house, frequently refreshed risk data and explainable agentic AI.
