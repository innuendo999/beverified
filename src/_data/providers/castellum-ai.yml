verification_notes:
- 'Founded 2019 comes only from CB Insights (third-party aggregator, no evidence label). Vendor pages give no founding year; the seed post says the beta launched in March 2022.'
- 'CTO "Julian Vasilkoski" not confirmed: the about page lists Lee Roggenkamp as CTO and Marissa Venuto as COO, and does not name a second co-founder. Removed.'
- '"Roughly 26 employees" not found. Removed. Funding "~$12.6M" replaced with the two press-released rounds ($4M + $8.5M); CB Insights shows $12.65M total.'
- 'Investor "NewFund" is named in the 2023 seed release; Series A led by Curql with BTech Consortium and Framework Venture Partners.'
- 'List names "OFAC, UN, UK HMT, EU" not checked list by list; dropped from prose. Vendor wording is "1,000+ watchlists", not "1,000+ sanctions lists".'
- 'Features "forced-labor and supply-chain risk screening", "PDF investigation reports" and "Perpetual KYC" not found on current vendor pages. Removed.'
- 'G2 shows no reviews for Castellum.AI, so the old "frequently cited" review themes had no visible basis. Praise and criticism themes removed; by_profile reworded to customer types named in the Series A release.'
- 'SOC 2 Type 2 is a homepage badge only; no report opened.'
- 'Pricing page mentions a money-back guarantee; its terms were not read.'
- '2026-10-22 capabilities pass: the sanctions and PEPs product page now says 1,700+ global watchlists, while the homepage and this record say 1,000+. Not changed.'
- '2026-10-22 capabilities pass: the Transaction Monitoring Agent page does not say whether it runs its own detection or works on alerts from an existing monitoring system. Case management is offered through sales per a support article; no product page found.'
