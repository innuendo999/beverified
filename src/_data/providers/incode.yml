verification_notes:
- SOC 2 Type 2, ISO/IEC 27001:2022, ISO/IEC 42001:2023 and Kantara IAL2 are listed on the trust centre only (source 3); no certificate opened, and the Kantara Trust Status List does not render. Trust centre re-checked from the owner's screenshot 2026-11-20: auditors named as Sensiba (SOC 2, ISO 27001, ISO 42001), A-LIGN, Zygma and iBeta QA; ISO/IEC 27001:2022 and the Kantara IAL2 Trust Mark documents show no lock (public download); no ACCS entry on the trust centre.
- FedRAMP conflict resolved 2026-11-20: the FedRAMP Marketplace lists Incode Platform (FR2510341317) at Class C (Moderate), status Agency Auth In Process as of 25 Sep 2026 (source 35). This matches the trust centre's "FedRAMP Moderate" badge; the Nov 2025 release (source 12) describes the earlier Ready stage at the High baseline. Status confirmed (the in-process stage is on the register); matrices treat the "in progress" name as not held.
- ACCS registry lists "Incode Technologies Inc" (source 15) but the entry shows no certified scope, standard or dates. Incode's July 2024 release says it covers facial age estimation and document-based age verification; not added as scope.
- Gartner Magic Quadrant Leader placements (2024, 2025, 2026) rest on Incode's release and landing page (source 1; Gartner document dated 28 Jul 2026); the Gartner report itself is gated and was not opened.
- Gartner Peer Insights counts differ by view (product page 55 ratings; vendor page 53 Identity Verification reviews, 57 all markets). Product page figure used.
- Nov 2025 Bloomberg report (reprinted by Incode) of talks to raise $150M to $300M at up to $3B valuation; no closed round found, so the page keeps only the 2021 $1.25B figure (sources 8, 11).
- 'Certification re-check 2026-11-20: the ACCS registry pages for Incode Technologies Inc (uncategorized and data-privacy) say no certification is listed. The ACCS entry moved from confirmed to vendor_stated, citing Incode''s June 2024 announcement.'
