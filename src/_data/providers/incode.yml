faq:
- q: How much does Incode cost?
  a: Pricing is not published; Incode quotes on request. Its platform is licensed to enterprises based on volume and deployment scope.
- q: What is the Incode Platform?
  a: The Incode Platform combines identity onboarding, ongoing biometric authentication and fraud investigation in one system. Earlier versions were sold as Incode Omni.
- q: Has Incode made any acquisitions?
  a: Yes. Incode acquired MetaMap in 2024, AuthenticID in August 2025 and Identiq in June 2026.
- q: Is Incode recognized by analysts?
  a: Yes. Incode has been named a Leader in the Gartner Magic Quadrant for Identity Verification in 2024, 2025 and 2026.
- q: What is the best alternative to Incode?
  a: Jumio is the best alternative for a long-established enterprise IDV vendor. AU10TIX is the closest fit for fully automated, consortium-based fraud detection.
- q: Who are Incode's main competitors?
  a: Incode competes with Jumio, AU10TIX, and Onfido, differentiating through its large proprietary dataset and single-platform approach.
