verdict: Incode's platform handles onboarding and ongoing authentication in one system. Its models are trained on more than 7 billion trust checks and 400 million identity profiles, by the company's own count, and it has been named a Leader in the Gartner Magic Quadrant for Identity Verification in 2024, 2025 and 2026. Its 2025 acquisition of AuthenticID adds further consolidation, though pricing remains enterprise-only.
what_is:
- Incode is an identity-verification company founded in 2015 in San Francisco by CEO Ricardo Amper. It became a unicorn in December 2021 after a $220M Series B at a $1.25B valuation, led by General Atlantic and SoftBank. It has more than 600 employees from over 25 nationalities and reports more than 7.1 billion trust checks to date. Customers include eight of the top 10 U.S. banks, eight of the top nine U.S. telecoms, the top three global neobanks and four of the top five global marketplaces. It reads 4,900+ ID document types across 190+ countries.
features:
- 'Incode Platform: onboarding, ongoing authentication and fraud investigation in one system.'
- Facial recognition with passive liveness detection, tested by iBeta to ISO/IEC 30107-3 Level 3.
- 'Deepsight: deepfake and synthetic ID defense.'
- Document authentication across 4,900+ ID document types in 190+ countries.
- GovFaceMatch, digital ID (mDL, eID, wallets) and non-document verification paths.
- On-device age estimation, KYB and workforce verification.
