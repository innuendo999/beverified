verification_notes:
- SOC 2 Type 2, ISO/IEC 27001:2022, ISO/IEC 42001:2023 and Kantara IAL2 are listed on the trust centre only (source 3); no certificate opened, and the Kantara Trust Status List does not render.
- FedRAMP conflict: trust centre lists "FedRAMP Moderate" (source 3), but Incode's Nov 2025 release says FedRAMP Ready at the High baseline with authorization still to come (source 12). No FedRAMP Marketplace entry for Incode could be opened. Page shows the Ready status.
- ACCS registry lists "Incode Technologies Inc" (source 15) but the entry shows no certified scope, standard or dates. Incode's July 2024 release says it covers facial age estimation and document-based age verification; not added as scope.
- Gartner Magic Quadrant Leader placements (2024, 2025, 2026) rest on Incode's release and landing page (source 1; Gartner document dated 28 Jul 2026); the Gartner report itself is gated and was not opened.
- Gartner Peer Insights counts differ by view (product page 55 ratings; vendor page 53 Identity Verification reviews, 57 all markets). Product page figure used.
- Nov 2025 Bloomberg report (reprinted by Incode) of talks to raise $150M to $300M at up to $3B valuation; no closed round found, so the page keeps only the 2021 $1.25B figure (sources 8, 11).
