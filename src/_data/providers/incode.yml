verdict: Incode's Omni platform handles onboarding and ongoing authentication in one system, trained on more than 400 million identity profiles — among the largest proprietary datasets in the category — and it's been named a Gartner Magic Quadrant Leader two years running. Its 2025 acquisition of AuthenticID adds further consolidation, though pricing remains enterprise-only.
what_is:
- Incode is an identity-verification company founded by CEO Ricardo Amper, headquartered in San Francisco, California, and valued at $1.25B since becoming a unicorn in 2021. With more than 600 employees across 25+ nationalities, it processes 4.1B+ identity checks per year on a proprietary dataset of 400M+ identity profiles, serving Fortune 500 companies, neobanks, and governments across 200+ countries.
features:
- Incode Omni — end-to-end onboarding and ongoing authentication in one platform.
- Facial recognition with passive liveness detection.
- Document authentication with deepfake detection.
- Fraud prevention built on a 400M+ profile proprietary dataset.
- Top-ranked performance in NIST FRTE biometric benchmarks.
- Single-platform approach across onboarding and authentication.
