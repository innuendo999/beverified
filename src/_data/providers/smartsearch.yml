pros:
- Strong fit for UK legal, property, accountancy and financial-services firms
- Individual and business verification in one platform
- DIATF-certified SmartDoc identity check, with Credas Connect added through the 2026 acquisition
cons:
- UK-centric; international checks exist but the product and client base centre on the UK
- No published pricing
- Built around data-based AML checks; document and facial checks come through SmartDoc rather than a document-first IDV flow
