faq:
- q: How much does SmartSearch cost?
  a: SmartSearch does not publish pricing; its AML/KYC platform is quoted based on client volume and requirements.
- q: What is JMLSG compliance?
  a: JMLSG (Joint Money Laundering Steering Group) provides UK AML guidance; SmartSearch's verification workflows are built to meet these requirements.
- q: Does SmartSearch verify both individuals and businesses?
  a: Yes, SmartSearch offers combined individual and business AML/KYC verification in one platform.
- q: Who owns SmartSearch?
  a: A majority stake in SmartSearch is held by Triple PE (Fund I).
- q: What is the best alternative to SmartSearch?
  a: ComplyAdvantage is the best alternative for broader international sanctions/PEP data. KYC360 is the closest fit for full customer-lifecycle risk management.
- q: Who are SmartSearch's main competitors?
  a: SmartSearch competes with ComplyAdvantage, KYC360, and NameScan, differentiating through deep UK regulatory (JMLSG) specialization.
