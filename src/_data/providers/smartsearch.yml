faq:
- q: How much does SmartSearch cost?
  a: SmartSearch does not publish pricing; it quotes on request.
- q: What is JMLSG compliance?
  a: JMLSG (Joint Money Laundering Steering Group) publishes UK AML guidance for the financial sector. SmartSearch builds its checks for UK regulated firms that follow this guidance.
- q: Does SmartSearch verify both individuals and businesses?
  a: Yes, SmartSearch offers individual and business AML/KYC checks, for the UK and internationally, in one platform.
- q: Who owns SmartSearch?
  a: Triple Private Equity took a majority stake in SmartSearch in March 2024; the founders and existing shareholders kept a minority stake.
- q: Is SmartSearch certified under the UK digital identity trust framework?
  a: Yes. The UK government register lists SmartCredit Limited's SmartDoc Advanced with Facial Recognition and Fraud Check as certified from 4 March 2026 to 4 March 2029. Credas Connect, from the Credas business SmartSearch acquired, is also on the register.
- q: Who are SmartSearch's main competitors?
  a: SmartSearch competes with ComplyAdvantage, KYC360, and NameScan, differentiating through its focus on UK regulated firms.
