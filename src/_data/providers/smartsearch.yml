verdict: SmartSearch was one of the first electronic AML verification services in the UK and remains squarely focused on compliance checks for legal, property, accountancy and financial-services firms. Its individual and business checks in one platform, plus a SmartDoc identity check certified under the UK digital identity trust framework (DIATF), are real strengths for UK-regulated firms, though its product and client base stay centred on the UK.
what_is:
- SmartSearch is a UK AML and KYC verification company founded in 2011 by Martin Cheek and John Dobson and based in Ilkley, West Yorkshire. Its registered company is SmartCredit Limited, which the ICO data protection register lists with the trading name SmartSearch. Triple Private Equity took a majority stake in March 2024, and Phil Cotter is CEO. SmartSearch says it is trusted by over 7,000 regulated businesses, including one in three of the UK's top 200 law firms and one in two of the top 100 accountancy firms. In January 2026 it completed the acquisition of Credas Technologies, another UK KYC and AML provider.
features:
- UK and international AML checks for individuals and businesses.
- Sanctions and PEP screening, with the Dow Jones WatchList updated daily.
- Ongoing monitoring, with KYC checks re-run every night. The pricing page lists ongoing sanctions, PEP and adverse media monitoring among the solutions for its Enterprise Compliance tier.
- SmartDoc document check with facial recognition, certified under the UK DIATF.
- KYB checks on businesses, which SmartSearch says run in minutes.
- Browser-based platform and API access.
