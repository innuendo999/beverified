verdict: SmartSearch was one of the first electronic AML verification services in the UK and remains squarely focused on JMLSG-compliant checks for legal, property, and financial-services firms. Its individual-plus-business screening in one platform and 24-hour integration are real strengths for UK-regulated firms, though its reach outside the UK is limited.
what_is:
- SmartSearch is a UK AML and KYC verification company founded in 2011 in West Yorkshire, headquartered in Ilkley, UK, led by CEO Phil Cotter, with a majority stake held by Triple PE. Serving more than 7,000 clients and 60,000 users, it provides JMLSG-compliant individual and business verification for legal, property, and financial-services firms.
features:
- Combined individual and business AML/KYC verification.
- Sanctions, PEP, UBO, and adverse-media screening.
- Ongoing monitoring for existing customers.
- JMLSG-compliant verification workflows for UK regulated firms.
- Browser-based and API access.
- Reported 24-hour integration timeline.
