verification_notes:
- 'Founded 2011: from The Negotiator (Mar 2024). The legal entity SmartCredit Limited was incorporated on 11 Aug 2005, so the brand and company dates differ.'
- 'Clients: homepage (checked 2026-10-22) says over 7,000 regulated businesses; a Nov 2025 press release says 7,500+; the help-centre FAQ (source 13, footer 2025) still says more than 6,500 clients and 60,000 users. Homepage figure used; the users figure is not shown because it sits beside the older client count.'
- '"Triple PE Fund I": fund name still not confirmed (Investec deal page did not load on 2026-10-22); record uses Triple Private Equity majority stake.'
- 'Alternatives: NameScan best_for was a dash placeholder; set to null so the record passes the dash check.'
- 'Pricing page tiers are labelled "Commonly Used Solutions" and the page calls pricing modular; it does not say a solution is only available in one tier. Record words monitoring as "listed under" Enterprise, not "Enterprise only".'
- 'User ratings: G2 product page (source 12) shows 5.0 from 1 review (March 2024) and does not show a seller website; matched on name and AML description. Capterra UK lists SmartSearch with 0 reviews and a "from US$500 per user" starting price that the vendor does not publish; not used.'
- '2026-10-22 capabilities pass: transaction screening appears only as a homepage line in what an AML check includes; no product page describing it was found.'
