- 'Networks: protocols overview names TRP, TRISA, TRUST, Sygna Bridge, VerifyVASP, OpenVASP, Shyft Veriscope and Netki TransactID with a general aim to integrate live protocols, but does not say which are live. TRP page: every customer has a live TRP 1.0 endpoint. TRUST page: Coinbase does not allow external vendors to interact with TRUST directly; customers apply themselves and connect by webhook; TRUST BBS for incoming. VerifyVASP page: support pending a security review. TRISA page: marked historical, says CipherTrace discontinued it (TRISA itself announced interoperability with Ospree in June 2024, so Notabene''s page looks out of date). Sygna page: invites firms to connect through Notabene''s API, no live status. GTR page did not load. CryptoSwift''s record says it receives transfers from Notabene.'
