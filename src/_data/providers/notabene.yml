  note: Public API references and a Postman collection, a self-service sandbox with RoboVASP test counterparties, embedded Withdrawal Assist and Deposit Assist components, webhooks through Svix with signed payloads, retries and a polling fallback, EU and US regions, and integrations documented by Fireblocks and Ripple Custody. Three platform versions run side by side, and SafeTransact v1 is due to retire in 2027, so v1 users face a migration; API access itself is granted through support.
