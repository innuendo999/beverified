  by_profile:
  - Exchanges, custodians and payment firms that want a hosted Travel Rule service with a large counterparty network, and do not want to run software themselves, are Notabene's clearest fit.
  - Small VASPs that mostly receive transfers can start on the free plan and answer counterparties from the dashboard before they integrate anything.
  - Firms whose main counterparties are TRUST members or Asia-Pacific exchanges on VerifyVASP should check how Notabene reaches them before they sign, since neither route is direct today.
faq:
- q: How much does Notabene cost?
  a: 'Notabene publishes one price: its SafeTransact-Rise plan is free, lets you send up to $10,000 a month and receive unlimited incoming transfers, and needs no protocol integration. The full platform has no published price and is quoted after a demo. Its services agreement says invoices are due in 30 days, order forms renew automatically for one-year terms unless you give 60 days'' notice, and Notabene may change fees at each renewal.'
- q: Is there a free version of Notabene?
  a: Yes. SafeTransact-Rise is free and gives access to Notabene's network and transaction dashboard. You can receive and respond to unlimited incoming transfers and send up to $10,000 a month. It suits a VASP that mostly receives Travel Rule data; once outgoing volume grows past the cap you move to a paid, quoted plan.
- q: Can Notabene send Travel Rule data to TRUST members?
  a: Not directly. Notabene's own TRUST page says Coinbase does not let outside vendors connect to TRUST. A Notabene customer that wants TRUST must apply for membership itself, run the TRUST connection in its own systems and pass those transfers to Notabene by webhook. If many of your transfers go to TRUST members, check that path before you sign.
- q: Which Travel Rule protocols does Notabene support?
  a: Notabene says every customer has a live TRP 1.0 endpoint, and its main reach is its own network. TRP 1.0 is not the current version (3.2.1, July 2024); Notabene says it can add the latest version if VASPs ask. TRUST works only through the customer's own membership, VerifyVASP support is pending a security review, and Notabene's TRISA page is marked as historical. Its Sygna Bridge page invites firms to connect through Notabene's API but does not say the link is live. Notabene also backs TAP, an open protocol for authorizing payments before settlement.
- q: How does Notabene verify self-hosted wallets?
  a: 'Notabene lists four methods: a signature proof, a micro-transaction (Satoshi test), a screenshot and a self-declaration checkbox. Its developer docs list eight signature types covering Bitcoin, Litecoin, EVM chains, Solana, Tron, XRP, Cardano and Stellar, with named wallets such as Ledger, Trezor, MetaMask and Phantom. Screenshots are reviewed by a compliance officer in the dashboard, and Notabene calls them weaker than signatures or micro-transactions. The VASP chooses which methods to accept.'
- q: Is Notabene ISO 27001 or SOC 2 certified?
  a: Notabene says it is ISO/IEC 27001:2022 certified and has an annual SOC 2 Type II audit covering Security and Privacy, and it first announced a clean SOC 2 Type II report in January 2022. It names neither the certification body nor the auditor publicly; the certificate and report are shared through its Trust Center. It also names Cobalt and LRQA for penetration testing.
- q: Does Notabene have a sandbox?
  a: Yes. Notabene's developer docs say you can set up a sandbox account yourself, and API access is then arranged through its support team. The sandbox includes RoboVASPs, test counterparties that always give one response (authorize, reject, confirm address and so on), so you can test each outcome before going live. SafeTransact v1 is due to retire in 2027, so new integrations should start on the current version.
- q: Does Notabene also do KYC?
  a: No. Notabene identifies and screens counterparty institutions and handles Travel Rule data, but we found no customer identity verification product. Pair it with a separate KYC provider for onboarding your own customers.
- q: What is the best alternative to Notabene?
  a: 21 Analytics if your counterparties are on TRUST or you need software you run yourself. CryptoSwift if you want published plan prices. VerifyVASP if most of your counterparties are exchanges in Asia-Pacific.
