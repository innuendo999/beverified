  note: The network claim is the largest in this category (2,300+ institutions, vendor-stated and inconsistent across pages), TRP is offered only in version 1.0 rather than the current 3.2.1, Fireblocks and Ripple Custody document built-in integrations, and four self-hosted wallet methods are offered. TRUST is reachable only through the customer's own membership, VerifyVASP is pending, and no live TRISA route is documented.
