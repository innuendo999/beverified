pros:
- Free plan lets a VASP answer unlimited incoming Travel Rule transfers and send up to $10,000 a month with no protocol integration
- Large hosted network (2,300+ institutions, vendor-stated) and built-in integrations documented by Fireblocks and Ripple Custody
- Published SLA with 99.5% monthly uptime and a 30-minute P1 response, plus vendor-stated ISO/IEC 27001:2022 and SOC 2 Type II
cons:
- 'Limited reach beyond its own network: no direct TRUST connection (customers must join TRUST themselves and bridge it by webhook), TRP only in version 1.0 rather than the current 3.x, VerifyVASP support pending, and Notabene''s own TRISA page calls that protocol discontinued'
- The paid platform has no published price, order forms renew automatically for one-year terms, and Notabene may change fees at each renewal
- The ISO/IEC 27001 certificate and SOC 2 report are shared only through the Trust Center, with no certification body or auditor named publicly, and there is no customer KYC product
