verdict: "Notabene is the hosted choice: exchanges, custodians and payment firms get a Travel Rule service with no software of their own to run, a large network by Notabene's own count, and a free plan that answers incoming transfers with no integration. The limits show beyond that network. TRUST works only through your own membership, TRP is version 1.0 unless you ask for the current one, the paid platform is quoted, and the ISO and SOC 2 evidence sits behind a Trust Center request."
what_is:
- Notabene sells Travel Rule compliance to crypto firms as a hosted service. Before a transfer goes on chain, it works out which institution controls the counterparty wallet, exchanges the originator and beneficiary data that FATF Recommendation 16 requires, and records whether the counterparty accepted. Rules decide which transfers need data, which thresholds apply in each jurisdiction and when a transfer is approved, held or rejected. Notabene says 2,300+ regulated institutions are in its network and that it has 280+ customers; it gives other figures on other pages, and we could not check any of them.
- Reach comes mainly from Notabene's own network. Notabene says every customer has a live TRP 1.0 endpoint, but not the current version: it says it can add the latest TRP version, which uses the Travel Address, if VASPs ask. The current specification is 3.2.1 (July 2024), mutual TLS has been mandatory since 3.0.0, and 3.x implementations such as Didit's reject requests that lack the 3.x headers. Notabene also says Coinbase does not let outside vendors connect to TRUST, so customers who want TRUST must join it themselves and pass those transfers to Notabene by webhook. Its VerifyVASP page says support is waiting on a security review, and its TRISA page is marked as historical. Notabene's help centre says it moved its focus from protocol interoperability to reachability, and it now backs its own open protocol, TAP, for authorizing payments before settlement. Fireblocks and Ripple Custody both document a built-in Notabene integration.
- Notabene, Inc. is a Delaware corporation; its services agreement says customers in the EEA, the UK and Switzerland may contract with Notabene ID GmbH under Swiss law instead. Its terms choose New York law, with courts in Kings County. Pelle Braendgaard is co-founder and CEO and Alice Nawfal is COO. Notabene was founded in 2020, went through Y Combinator, raised a $10.2 million Series A in 2021 and a $14.5 million Series B led by DRW VC in November 2024, and announced a strategic investment from Ripple, amount not disclosed, in July 2026. It also runs Notabene Flow, a stablecoin payments product, which this review does not cover.
features:
- Hosted Travel Rule platform that identifies the counterparty institution, exchanges originator and beneficiary data and records the outcome before a transfer settles, with jurisdiction thresholds and approval rules you configure.
- 'Free SafeTransact-Rise plan: receive and respond to unlimited incoming transfers and send up to $10,000 a month, with no protocol integration, through Notabene''s dashboard.'
- TRP 1.0 endpoint for every customer (not the current 3.x version), a webhook bridge for firms that are TRUST members themselves, and built-in integrations documented by Fireblocks and Ripple Custody.
- Self-hosted wallet checks by signature proof (eight signature types covering Bitcoin, EVM chains, Solana, Tron, XRP, Cardano, Stellar and others), micro-transaction (Satoshi test), screenshot or self-declaration, chosen by the VASP and collected through embedded Withdrawal Assist and Deposit Assist components.
- Public API references for each platform version and a public Postman collection, a self-service sandbox with test counterparties (RoboVASPs) that return each possible response, webhooks delivered through Svix with signed payloads, retries and a polling fallback, and EU and US hosting regions.
- 'Published service level agreement: 99.5% monthly uptime, P1 issues covered 24/7 with a 30-minute response, standard support 24 hours a day on weekdays.'
