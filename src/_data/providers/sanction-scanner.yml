faq:
- q: How much does Sanction Scanner cost?
  a: Sanction Scanner's Starter plan is €990 a month for 100 entities, with two months free on annual billing. The Enterprise plan is quoted on request.
- q: Where is Sanction Scanner based?
  a: Sanction Scanner lists offices in London, UK, and Istanbul, Türkiye, and says it was established in 2019.
- q: Who backs Sanction Scanner?
  a: CB Insights lists TT Ventures and Mastercard Lighthouse Türkiye as investors. Mastercard selected Sanction Scanner for its Lighthouse Türkiye acceleration programme in 2024.
- q: How many clients does Sanction Scanner serve?
  a: Sanction Scanner says it serves more than 800 clients across 70+ countries.
- q: What is the best alternative to Sanction Scanner?
  a: ComplyAdvantage is the best alternative for enterprise-scale sanctions/PEP data depth. MemberCheck is the closest fit for deeper four-tier PEP screening.
- q: Who are Sanction Scanner's main competitors?
  a: Sanction Scanner competes with ComplyAdvantage, MemberCheck, and NameScan, differentiating through accessible, API-first mid-market pricing.
