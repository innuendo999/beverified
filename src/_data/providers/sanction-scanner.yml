verdict: 'Sanction Scanner''s pitch is accessibility: enterprise-grade sanctions, PEP, and adverse-media screening without a six-figure contract or a six-month implementation. Backed by Mastercard Lighthouse Turkiye and TT Ventures, and named to Deloitte''s Turkey Technology Fast 50 in 2025, it''s a reasonable mid-market fit, though its scale and screening depth trail category giants.'
what_is:
- Sanction Scanner is an AML screening company founded around 2018–2019 (sources vary) and headquartered with offices in both Istanbul, Turkey, and London, UK, led by founder and CEO Fatih Coskun with roughly 26–27 employees. Backed by Mastercard Lighthouse Turkiye and TT Ventures, it serves 800+ clients across 70+ countries, including banks, neobanks, payment companies, fintechs, crypto exchanges, insurance, and lending businesses.
features:
- Real-time AML name screening — sanctions, PEP, and adverse media.
- Transaction monitoring and fraud detection.
- Customer risk assessment with adjustable risk parameters.
- API-first architecture for fast integration.
- Minimal-configuration setup aimed at quick go-live.
- Coverage across 70+ countries and multiple regulated sectors.
