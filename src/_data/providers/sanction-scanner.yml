verification_notes:
- ISO 27001, ISO 9001 and SOC 2 are vendor-stated only; no certificate, certification body or register entry was found. The SOC 2 mention on the pricing page refers to the data centres, not necessarily to Sanction Scanner itself.
- Investors (TT Ventures, Mastercard Lighthouse Türkiye) come from CB Insights only. Mastercard's own release describes Lighthouse as an acceleration programme and does not mention investment.
- A 2025 Deloitte Fast 50 listing (old page) could not be confirmed; the latest confirmed listing is 2024 (third consecutive year).
- Employee count (26 to 27) dropped; no current source opened.
- G2 themes not visible on the fetched page; Capterra page did not load. User review themes are kept as general statements only.
- '2026-10-22 capabilities pass: the vendor now trades as complead; complead.ai describes itself as "complead, formerly Sanction Scanner" (source 9) and sanctionscanner.com comparison pages redirect there. Name, link and copy still say Sanction Scanner; review before release.'
- '2026-10-22 capabilities pass: complead FAQ says it does not do document or biometric identity verification and runs alongside an IDV provider (source 9). Transaction monitoring is listed only in the Enterprise plan (source 1).'
