verdict: 'Sanction Scanner''s pitch is accessibility: sanctions, PEP and adverse-media screening with a published Starter plan instead of a six-figure contract or a six-month implementation. The company behind it rebranded as complead in September 2026, and Sanction Scanner continues as complead''s sanctions and PEP screening product. It went through the Mastercard Lighthouse Türkiye acceleration programme in 2024 and has made Deloitte''s Technology Fast 50 Türkiye list four times (2022, 2023, 2024 and 2026). It is a reasonable mid-market fit, though its scale and screening depth trail the category giants.'
what_is:
- Sanction Scanner is the sanctions and PEP screening product of complead, the AML compliance company that traded as Sanction Scanner until it rebranded in September 2026. The company says it was established in 2019 and incorporated in the UK in 2020, with London as its headquarters and offices in Istanbul, Türkiye, and New York. It is led by founder and CEO Fatih Coşkun. CB Insights lists TT Ventures and Mastercard Lighthouse Türkiye as investors. The company says it serves 800+ clients in 80+ countries, and its products cover name and transaction screening, adverse media, transaction monitoring, fraud detection, customer risk assessment and KYB. It does not offer document or biometric identity verification.
features:
- 'Real-time AML name screening against 3,000+ sanctions, PEP and watchlists, plus adverse media.'
- Transaction monitoring, transaction screening and fraud detection.
- Customer risk assessment with adjustable risk parameters.
- API-first architecture with REST API, webhooks and SDKs.
- Daily automated re-screening of the customer portfolio (ongoing monitoring).
- KYB company verification and ownership checks.
pricing:
  summary: Sanction Scanner publishes a Starter plan at €990 a month for 100 entities, billed monthly or annually (annual billing includes two months free). Usage above the monthly limit is billed at standard rates, and the Enterprise plan is quoted on request. No free trial is mentioned on the pricing page.
