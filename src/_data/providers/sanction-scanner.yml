verification_notes:
- 'Investors (TT Ventures, Mastercard Lighthouse Türkiye) still come from CB Insights only, which records the latest round as "Incubator/Accelerator". Mastercard''s release describes an acceleration programme; complead pages and the 2022 Paradergi interview name no investor.'
- 'SOC 2 Type II is vendor-stated: the complead Trust Center (source 12) says the report is available under NDA; not opened.'
- 'ISO certificates (sources 13, 14) were opened: holder Sanction Scanner Ltd, valid 02.07.2026 to 01.07.2027. The certification body is not named in the PDF text; check the logo or the body''s register if needed.'
- 'Founded: sanctionscanner.com about page and the founder''s rebrand post say 2019; complead.ai/company says "Founded 2020", which matches the UK incorporation year in the rebrand post. Kept 2019.'
- 'Countries: sanctionscanner.com about page still says 70+ countries; complead pages and the Foreks report say 80+. Using 80+ (source 11).'
- '2026 Deloitte Fast 50 Türkiye listing comes from the Foreks report (source 15) and complead''s company page ("four times"); Deloitte''s own Fast 50 page did not yet list the 2026 winners. No 2025 listing.'
- 'Rebrand date: taken from complead''s announcement dated 21 September 2026 (source 10). The founder quote "In September 2026 we rebranded" was not found verbatim; the 1 Oct 2026 Paradergi interview confirms the rebrand without a date.'
- 'Link: sanctionscanner.com home, pricing and about pages still load under the Sanction Scanner name (footer: "Sanction Scanner is a complead product"); only comparison pages redirect to complead.ai (302). link.url kept.'
- 'G2 product is now titled "Complead (formerly Sanction Scanner)" (4.8 from 70 reviews on 23 Oct 2026; the complead review cites the same listing); G2 themes still not visible. Review themes come from Capterra (source 16).'
