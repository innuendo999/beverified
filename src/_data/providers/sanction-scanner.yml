verdict: 'Sanction Scanner''s pitch is accessibility: sanctions, PEP and adverse-media screening with a published Starter plan instead of a six-figure contract or a six-month implementation. It went through the Mastercard Lighthouse Türkiye acceleration programme in 2024 and made Deloitte''s Technology Fast 50 Türkiye list for the third year running in 2024. It is a reasonable mid-market fit, though its scale and screening depth trail the category giants.'
what_is:
- Sanction Scanner is an AML compliance company established in 2019, with offices in London, UK, and Istanbul, Türkiye. It is led by founder and CEO Fatih Coşkun. CB Insights lists TT Ventures and Mastercard Lighthouse Türkiye as investors. The company says it serves 800+ clients in 70+ countries, and its products cover name and transaction screening, adverse media, transaction monitoring, fraud detection, customer risk assessment and KYB.
features:
- 'Real-time AML name screening against 3,000+ sanctions, PEP and watchlists, plus adverse media.'
- Transaction monitoring, transaction screening and fraud detection.
- Customer risk assessment with adjustable risk parameters.
- API-first architecture with REST API, webhooks and SDKs.
- Daily automated re-screening of the customer portfolio (ongoing monitoring).
- KYB company verification and ownership checks.
pricing:
  summary: Sanction Scanner publishes a Starter plan at €990 a month for 100 entities, billed monthly or annually (annual billing includes two months free). Usage above the monthly limit is billed at standard rates, and the Enterprise plan is quoted on request. No free trial is mentioned on the pricing page.
