faq:
- q: How much does FullCircl cost?
  a: Pricing is not published. nCino Identity Solutions, the current name for FullCircl's platform, quotes on request.
- q: Is FullCircl still operating?
  a: The platform still operates, but under nCino. nCino completed its acquisition of FullCircl on 5 November 2024, rebranded it in October 2025, and fullcircl.com now redirects to nCino Identity Solutions. Companies House shows FullCircl Limited, DueDil Limited and W2 Global Data Solutions Limited in members' voluntary liquidation, a solvent wind-up, since 21 October 2025.
- q: What is FullCircl's history?
  a: FullCircl was formed when DueDil and Artesian merged in 2021. It acquired W2 Global Data Solutions in 2023, was bought by nCino in 2024 and was rebranded as nCino Identity Solutions in 2025.
- q: Does FullCircl cover both KYB and KYC?
  a: Yes. The platform covers KYB, KYC, AML, fraud prevention and identity verification through one API and orchestration layer.
- q: Is FullCircl focused on a specific region?
  a: Its roots and customer base are in the UK, but nCino Identity Solutions says it covers 246 countries and territories through its connected data sources.
- q: What is the best alternative to FullCircl?
  a: KYC Hub is the best alternative for broader no-code AML lifecycle orchestration. GBG is the closest fit for a larger, publicly traded data network.
- q: Who are FullCircl's main competitors?
  a: FullCircl competes with KYC Hub, ComplyCube, and GBG, differentiating through its business-intelligence layer alongside compliance orchestration.
