verdict: 'FullCircl is now part of nCino, which completed its acquisition in November 2024, and the product is sold as nCino Identity Solutions; fullcircl.com redirects there. The pitch is still consolidation: one API and orchestration layer over 400+ identity verification services, covering KYB, KYC, AML, fraud and identity verification, plus business-intelligence tools for sales and onboarding teams. It grew from UK roots (DueDil, Artesian and W2) and suits regulated businesses that want registry and identity data in one place.'
what_is:
- FullCircl was a UK-based compliance-orchestration and customer-lifecycle platform formed when DueDil and Artesian merged in 2021. It bought Cardiff-based W2 Global Data Solutions in 2023, and US banking-software company nCino agreed to buy it in October 2024 for $135 million in cash, closing the deal on 5 November 2024. The platform is now marketed as nCino Identity Solutions. It offers identity verification, KYC, AML, fraud prevention, KYB, age verification and affordability checks through a single REST API connected to 400+ verification services, and says it covers 246 countries and territories and serves 2,700+ institutions.
features:
- Unified orchestration across KYB, KYC, AML, fraud and identity verification.
- Single REST API connecting to 400+ identity verification services.
- KYB data on 365 million entities, including company ownership and financial data.
- SmartAcquire business-intelligence tooling for sales and onboarding teams.
- Onboarding plus ongoing monitoring.
- Age verification and affordability checks for gambling operators.
