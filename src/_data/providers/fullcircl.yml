verdict: 'FullCircl is now part of nCino, which completed its acquisition in November 2024. In October 2025 nCino retired the FullCircl brand, and the compliance and verification products are now sold as nCino Identity Solutions; fullcircl.com redirects there. The pitch is still consolidation: one API and orchestration layer over 400+ identity verification services, covering KYB, KYC, AML, fraud and identity verification, plus business-intelligence tools for sales and onboarding teams. It grew from UK roots (DueDil, Artesian and W2) and suits regulated businesses that want registry and identity data in one place.'
what_is:
- FullCircl was a UK-based compliance-orchestration and customer-lifecycle platform formed when DueDil and Artesian merged in 2021. It bought Cardiff-based W2 Global Data Solutions in 2023, and US banking-software company nCino agreed to buy it in October 2024 for $135 million in cash, closing the deal on 5 November 2024. In October 2025 nCino rebranded FullCircl: its customer lifecycle tools (SmartBanker, ProBanker, SmartOnboard, SmartBroker) moved into the nCino platform, and its compliance and verification technology was relaunched as nCino Identity Solutions, a standalone product for SME to mid-market fintechs, payments providers and other regulated businesses. It offers identity verification, KYC, AML, fraud prevention, KYB, age verification and affordability checks through a single REST API connected to 400+ verification services, and says it covers 246 countries and territories. The site says it is trusted by over 2,700 institutions, the same figure nCino gives for its own customer base.
features:
- Unified orchestration across KYB, KYC, AML, fraud and identity verification.
- Single REST API connecting to 400+ identity verification services.
- KYB data on 365 million entities in 160+ countries, including company ownership and financial data.
- SmartAcquire business-intelligence tooling for sales and onboarding teams.
- Onboarding plus ongoing monitoring.
- Age verification and affordability checks for gambling operators.
