verification_notes:
- 'Ownership and brand: nCino agreed to buy FullCircl on 30 Oct 2024 ($135M cash) and completed on 5 Nov 2024 (sources 2, 3). On 6 Oct 2025 nCino retired the FullCircl brand: lifecycle tools (SmartBanker, ProBanker, SmartOnboard, SmartBroker) moved into the nCino platform and compliance products became nCino Identity Solutions (source 7). fullcircl.com 302-redirects to identitysolutions.ncino.com (checked 2026-10-22). Name and slug kept per spec.'
- 'Companies House: FullCircl Limited (13944944), DueDil Limited (06999618) and W2 Global Data Solutions Limited (07669978) are in members'' voluntary liquidation (declaration of solvency, commencement 21 Oct 2025, liquidators at The Ewart, Belfast) (sources 9 to 11). Artesian Solutions Limited (05667880) also shows "Liquidation" in search results; its case type was not opened. nCino executives became directors of FullCircl Limited and DueDil Limited on 5 Nov 2024. The UK entity that now contracts for nCino Identity Solutions was not identified.'
- 'The "over 2,700 institutions" figure on the Identity Solutions site matches nCino''s group customer count in its press boilerplate (source 7); no product-specific customer count is published. Older figures (600 in 2023, 400+ in Oct 2024) are not used.'
- 'Founding year left out: DueDil Limited was incorporated on 25 Aug 2009 (Companies House) and merged with Artesian in 2021 (Wikipedia, used only for the merger year); the FullCircl brand dates from 2021/2022.'
- '246 countries and territories (all services) and 160+ countries for KYB are vendor figures; depth outside the UK not tested.'
- 'Pricing: no pricing page or pricing link on identitysolutions.ncino.com (homepage and /fullcircl offer demo requests only). A GetApp listing titled nCino Identity Solutions shows a vendor-entered "1500 per user per year" starting price, free version and trial with 1 review; the listing appears to describe the legacy Artesian sales product, so it is not used.'
- 'No certifications found on the nCino Identity Solutions site; nCino group trust centre (trustcenter.ncino.com) not checked for coverage of this product. None listed.'
- 'G2 rating (source 12) is the old FullCircl listing, now titled nCino Identity Solutions; many reviews predate the acquisition and cover the DueDil/Artesian prospecting tools.'
