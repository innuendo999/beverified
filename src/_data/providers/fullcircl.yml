verification_notes:
- FullCircl was acquired by nCino (agreement 30 Oct 2024, $135M cash; completed 5 Nov 2024 per nCino 8-K). fullcircl.com 302-redirects to identitysolutions.ncino.com. link.url updated to the current site; name and slug kept per spec.
- Companies House lists FULLCIRCL LIMITED (13944944, incorporated 28 Feb 2022) as in liquidation. Likely a post-acquisition group restructuring, but the type of liquidation was not opened or confirmed; not stated on the page.
- Founding year left out. DueDil was founded in 2011 and merged with Artesian in Aug 2021 (Wikipedia); FullCircl as a brand dates from 2021/2022. Wikipedia is used only for the merger year.
- Old "UK, EU" regions claim replaced by the vendor's 246 countries and territories figure; actual depth outside the UK not tested.
- No certifications published on the nCino Identity Solutions site; none listed. Old page claimed none.
- The pricing page URL errored; homepage shows no pricing, so "not published" is based on the homepage and demo-request flow.
- No G2 or Capterra rating opened. User review themes are general statements, not counted themes.
- Customer counts differ by source (600 in 2023, 400+ in Oct 2024, 2,700+ institutions on today's site, which likely includes W2 and nCino figures); the current site figure is used.
