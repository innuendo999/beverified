verdict: Veridas built its name on proprietary biometrics — facial and voice recognition that score near the top of independent NIST testing — rather than reselling third-party models. Backed by BBVA since its founding, it's strongest in Spain, Latin America, and Europe, though its funding and global scale trail category leaders built on larger venture rounds.
what_is:
- Veridas is an identity-verification and biometrics company founded in 2017 and headquartered in Tajonar, Navarra, Spain, as a joint venture between BBVA and das-Nano. Led by CEO and co-founder Eduardo Azanza, it develops proprietary facial and voice biometric technology alongside document verification, serving banks, gambling operators, and large venues across 25+ countries.
features:
- AI-powered document verification and facial biometrics for fast identity checks.
- Proprietary voice authentication for contact-center identity verification.
- Duplication Defense to detect synthetic and duplicate identities.
- Presentation-attack detection (liveness) independently tested by NIST.
- Nexus Identity Wallet for issuing and managing verified digital identities.
- ISO/IEC 27001 certified with a SOC 2 Type II report.
