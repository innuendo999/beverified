verdict: Veridas built its name on its own biometrics, facial and voice recognition that it says ranked near the top of NIST testing, instead of reselling third-party models. Founded in 2017 as a joint venture with BBVA, it is strongest in Spain, Latin America and Europe, and its liveness detection has passed iBeta ISO 30107-3 testing. In July 2026 it agreed to merge with Amsterdam-based Fourthline; the deal was expected to close in the second half of 2026.
what_is:
- Veridas is an identity-verification and biometrics company founded in 2017 and headquartered in Tajonar, near Pamplona, in Navarra, Spain, created as a joint venture between BBVA and das-Nano. Led by CEO Eduardo Azanza, it develops its own facial and voice biometric technology alongside document verification, and says it serves more than 350 clients in 25 countries across banking, insurance, telecoms and public administration. In July 2026 Veridas agreed to merge with Fourthline, with BBVA and other Veridas shareholders staying on as shareholders of the combined company; closing was expected in the second half of 2026, subject to regulatory approvals.
features:
- AI-powered document verification and facial biometrics for identity checks.
- Voice authentication for IVR, contact-center and chatbot identity checks.
- Duplication Defense to detect synthetic and duplicate identities.
- Passive liveness detection tested by iBeta to ISO/IEC 30107-3 Level 1 and Level 2.
- Nexus Identity Wallet for issuing and managing verified digital identities.
- eIDAS identity-proofing certificate (ETSI TS 119 461) issued by DEKRA in 2026, plus vendor-stated ISO/IEC 27001 and Spain's National Security Scheme (ENS) certification.
