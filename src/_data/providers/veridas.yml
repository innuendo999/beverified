faq:
- q: How much does Veridas cost?
  a: Veridas does not publish pricing; its biometric and document-verification modules are licensed per client based on volume and deployment scope.
- q: What makes Veridas different from other IDV providers?
  a: Veridas builds its own facial and voice biometric technology in-house, independently tested by NIST, rather than reselling third-party recognition models.
- q: Who owns Veridas?
  a: Veridas was founded as a joint venture between BBVA and das-Nano in 2017 and remains backed by both, including a €15 million rights issue in 2023.
- q: Does Veridas support voice authentication?
  a: Yes. Voice biometrics is one of Veridas' core proprietary technologies, used by contact centers to replace security questions.
- q: What is the best alternative to Veridas?
  a: Sumsub is the best alternative for published pricing and a broader all-in-one suite. Regula is the closest fit if document-authentication depth matters more than biometrics.
- q: Who are Veridas' main competitors?
  a: Veridas competes with Onfido, Regula, and Sumsub, differentiating through its proprietary, NIST-tested face and voice biometric technology.
