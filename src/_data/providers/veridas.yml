faq:
- q: How much does Veridas cost?
  a: Veridas does not publish pricing on its own site and quotes on request. Its AWS Marketplace listing for the Veridas ID Verification Platform shows USD 1.37 per identity verification on a 12-month contract.
- q: What makes Veridas different from other IDV providers?
  a: Veridas builds its own facial and voice biometric technology in-house rather than reselling third-party recognition models. It says its face engine ranked fourth in NIST's FRVT 1:N test in 2023, and its liveness detection has passed iBeta ISO 30107-3 Level 1 and Level 2 testing.
- q: Who owns Veridas?
  a: Veridas was founded in 2017 as a joint venture between BBVA and das-Nano. In April 2023 it announced a EUR 15 million capital increase from its existing partners. In July 2026 it agreed to merge with Fourthline; Veridas shareholders, including BBVA, are to remain shareholders of the combined company. Closing was expected in the second half of 2026.
- q: Does Veridas support voice authentication?
  a: Yes. Voice biometrics is one of Veridas' core technologies, used in IVR, contact centers and chatbots, and its Voice Shield product passed iBeta Level 1 presentation attack testing in December 2024.
- q: What is the best alternative to Veridas?
  a: Sumsub is the best alternative for published pricing and a broader all-in-one suite. Regula is the closest fit if document-authentication depth matters more than biometrics.
- q: Who are Veridas' main competitors?
  a: Veridas competes with Onfido, Regula, and Sumsub, differentiating through its own face and voice biometric technology.
