verification_notes:
- 'Fourthline merger agreed (announced 29 Jun / 16 Jul 2026), expected to close in H2 2026 subject to regulatory approvals. No completion notice on the Fourthline newsroom (source 10) as of 22 Oct 2026. Re-check after closing; name or brand may change. Keep consistent with the fourthline record.'
- 'das-Nano as co-founder/shareholder: confirmed only in 2020 sources (source 4 and a BBVA release of 12 Nov 2020). 2026 releases name only BBVA. A Veridas-hosted ISO 27001 certificate (Bureau Veritas, expired 17 Mar 2024) is filed as "Grupo das-Nano", but the current das-Nano stake is not confirmed.'
- 'NIST: the Business Wire release (Apr 2023) says 4th in FRVT 1:N; the NIST FRTE 1:N page (updated Oct 2026) was opened but the ranking tables did not load in our fetch, so vendor_stated.'
- 'ISO/IEC 27001: the only certificate copy found (Bureau Veritas ES118275-003-3, ISO/IEC 27001:2013) expired 17 Mar 2024; vendor docs still state ISO 27001 certification. No current certificate or register entry found.'
- 'SOC 2 Type II: no vendor statement found on 22 Oct 2026 (homepage, about page, docs, ENS page); marked not_found. A SOC 3 report for calendar 2023 is hosted by Veridas but does not name the auditor. ISO 9001 not found either; dropped from features.'
- 'ACCS register lists a UK DIATF certificate (Level 2, "certification validity 20/12/2024") and an ACCS 1:2020 age estimation certificate (validity 12/09/2025) for Veridas. Veridas is not on the gov.uk DVS register as of 22 Oct 2026 (all 66 entries checked). Not added as certifications; current status unclear.'
- 'eIDAS certificate date printed as 07/08/2026 (Spanish date format, so likely 7 Aug 2026); valid two years from issue.'
- 'Pricing page veridas.com/en/pricing/ could not be fetched on 22 Oct 2026; the AWS Marketplace price is a public list price and may differ from direct quotes.'
- 'No G2 page found; Capterra lists Veridas with 0 reviews. Review themes kept as general statements without counts.'
