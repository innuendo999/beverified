verdict: ComplyAdvantage is a sanctions, PEP and adverse-media screening platform, not a document-verification company. That distinction matters when comparing it with IDV vendors in this category. Its financial-crime risk data, a published Starter plan from $99 a month and the free ComplyLaunch programme for early-stage startups make it a strong AML data layer, typically deployed alongside a separate identity-verification provider rather than instead of one.
what_is:
- ComplyAdvantage is an AML data and financial-crime intelligence platform founded by Charles Delingpole, now its Executive Chairman, and run by CEO Vatsa Narasimha. Its UK operating company, IVXS UK Limited, was incorporated in London in March 2014. Its Mesh platform covers customer and company screening against sanctions, PEP and adverse-media data and ongoing monitoring on both the Starter and Enterprise plans. Transaction monitoring and payment screening are listed only on the Enterprise plan. The vendor also markets fraud detection, which the pricing page does not list under either plan. It does not perform document or biometric identity verification.
features:
- Customer and company screening against sanctions, watchlists, PEPs, RCAs and adverse media, on all plans.
- Real-time transaction monitoring and payment screening, listed on the Enterprise plan only.
- Agentic workflows that the vendor says resolve up to 85% of routine alerts autonomously, on the Starter Agentic and Enterprise plans.
- Ongoing monitoring of screened customers, on all plans.
- Built-in reporting support for SAR and CTR reports, per the vendor.
- The vendor states up to 70% fewer false positives in transaction monitoring (company-reported figure).
pricing:
  summary: ComplyAdvantage publishes a Starter plan from $99 a month, in Essentials and Agentic versions, for monitoring between 100 and 2,000 entities. Enterprise pricing is on application. Setup takes one business day, plans can be cancelled at any time by email, and ComplyLaunch gives qualifying early-stage startups free access.
