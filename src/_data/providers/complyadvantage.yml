verdict: ComplyAdvantage is a sanctions, PEP, and adverse-media screening platform, not a document-verification company — a distinction that matters when comparing it to IDV vendors in this category. Its proprietary financial-crime database and free ComplyLaunch tier for early-stage startups make it a strong AML data layer, typically deployed alongside a separate identity-verification provider rather than instead of one.
what_is:
- ComplyAdvantage is an AML data and financial-crime intelligence platform founded in 2014 by Charles Delingpole (previously known as Mimiro), headquartered in London. Its Mesh platform serves more than 1,000 enterprise clients with proprietary sanctions, PEP, and adverse-media screening data — it does not perform document or biometric identity verification.
features:
- Customer and business screening against sanctions, PEP, RCA, and adverse-media sources.
- Real-time transaction monitoring with AI-driven risk scoring.
- Agentic alert triage to reduce manual review workload.
- Explainable AI governance aligned with the EU AI Act and DORA.
- Case management with SAR (Suspicious Activity Report) filing support.
- Clients report up to 70% fewer false positives, per company-reported figures.
pricing:
