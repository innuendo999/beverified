faq:
- q: How much does Hawk cost?
  a: Hawk does not publish pricing; its transaction-monitoring platform is licensed to financial institutions based on volume and module selection.
- q: What is explainable AI in Hawk's platform?
  a: Hawk's patent-pending Explainable AI produces audit-ready reasoning behind AI-flagged alerts, aimed at satisfying regulator scrutiny.
- q: What is Hawk's pattern-sharing network?
  a: Hawk pools and shares transaction pattern data across client institutions, creating a network effect that helps catch novel fraud and money-laundering patterns faster.
- q: Who uses Hawk?
  a: Hawk serves more than 80 clients globally, from Tier-1 banks to mid-market fintechs, including Ecobank, VakifBank International, and Worldline.
- q: What is the best alternative to Hawk?
  a: Feedzai is the best alternative for Tier-1 bank-scale real-time payment fraud. ComplyAdvantage is the closest fit for sanctions/PEP data depth.
- q: Who are Hawk's main competitors?
  a: Hawk competes with Feedzai, ComplyAdvantage, and NICE Actimize, differentiating through explainable AI and cross-institution pattern sharing.
