faq:
- q: How much does Hawk cost?
  a: Hawk does not publish pricing; its platform is licensed to financial institutions based on volume and module selection.
- q: What is explainable AI in Hawk's platform?
  a: Hawk's explainable AI shows the reasoning behind AI-flagged alerts, so investigators and auditors can see why a transaction or customer was flagged.
- q: What is FRAML?
  a: FRAML is Hawk's combined fraud and AML offering, which brings fraud and AML data together on one platform instead of separate systems.
- q: Who uses Hawk?
  a: Hawk had more than 80 clients in April 2025, from Tier-1 banks to mid-market fintechs. Customers shown on its site include Ecobank, Vakif Bank, Synctera, VR Payment, Ebury and Alviere.
- q: Is Hawk SOC 2 audited?
  a: Hawk AI GmbH holds ISO/IEC 27001:2022 certification from TÜV SÜD, valid until November 2028. Hawk also says it has completed a SOC 2 Type II examination; its published SOC 2 executive summary names A-Lign as the auditor and covers April to July 2023.
- q: What is the best alternative to Hawk?
  a: Feedzai is the best alternative for Tier-1 bank-scale real-time payment fraud. ComplyAdvantage is the closest fit for sanctions/PEP data depth.
- q: Who are Hawk's main competitors?
  a: Hawk competes with Feedzai, ComplyAdvantage, and NICE Actimize, differentiating through explainable AI across AML, screening and fraud.
