verification_notes:
- 'Cross-institution pattern-sharing network: not on Hawk''s homepage or about page (sources 1, 2) on 2026-10-22. The only mention found is the undated vendor description on GetApp (getapp.co.uk/software/2052402/hawk-ai: "pattern data pooling and sharing among Hawk''s network"). Kept out of the review until Hawk''s own current pages describe it.'
- '"Patent-pending" explainable AI: not on Hawk''s own pages; appears only in the same undated GetApp description. Wording stays removed.'
- 'Client count 80+ is from April 2025 (source 4; Hawk''s Series C press release says the same). No current count on Hawk''s homepage or about page.'
- 'SOC 2: the information security page (source 5) says Hawk completed a SOC 2 Type II examination. The executive summary (source 6, A-Lign, observation period 1 Apr to 31 Jul 2023) does not state the report type and is the only public document; no newer report found. Kept as vendor-stated.'
- 'User ratings: G2 lists Hawk with 0 reviews (g2.com/sellers/hawk); GetApp UK and AWS Marketplace also show 0 reviews. No user_ratings added.'
- 'AWS Marketplace (source 9) shows a $0.01 unit price for Payment Screening that is a placeholder for private-offer contracts, not a usable price; not quoted.'
- 'Capabilities check: adverse_media cites the homepage (source 2), which does not name adverse media; the customer screening page (source 8) does ("sanctions, PEP/RCA, and adverse media watchlists"). Deployment (SaaS or private cloud) and the absence of identity verification match the homepage.'
- 'Worldline: named as a customer in April 2025 coverage (Munich Startup) but not among the logos or case studies on Hawk''s current homepage; not listed.'
