verdict: Hawk (formerly HAWK:AI) built one of the earlier explainable-AI approaches to AML transaction monitoring, pairing rules with behavioral AI and a cross-institution pattern-sharing network that creates a network effect against novel crime patterns. Serving Tier-1 banks down to mid-market fintechs, it reports roughly 90% alert accuracy and 50–70% fewer false positives.
what_is:
- Hawk is an AML transaction-monitoring and screening company founded in 2018 and headquartered in Munich, Germany, by CEO Tobias Schweiger and Wolfgang Berner (formerly branded HAWK:AI). Backed by €51.8M in Series C funding led by One Peak (with earlier backing from Macquarie, Rabobank, and others), it serves 80+ clients globally, from Tier-1 banks to mid-market fintechs including Ecobank, VakifBank International, and Worldline.
features:
- AML transaction monitoring combining rules and behavioral AI.
- Payments and customer screening against sanctions/watchlists.
- Transaction fraud detection.
- Customer risk rating using static and dynamic data.
- Patent-pending Explainable AI for audit-ready decisioning.
- Cross-institution pattern-data pooling and sharing (network effect).
