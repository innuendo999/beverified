verdict: Hawk (formerly HAWK:AI) built one of the earlier explainable-AI approaches to AML transaction monitoring, pairing rules with behavioral AI and adding screening, fraud detection and AI agents for investigations on one platform. It serves Tier-1 banks down to mid-market fintechs, and by its own figures cuts false alerts by 70% and AML investigation time by 62%.
what_is:
- Hawk is an AML, screening and fraud-prevention company founded in 2018 in Munich, Germany, by Tobias Schweiger (CEO) and Wolfgang Berner; it was originally known as HAWK:AI and its legal entity is Hawk AI GmbH. In April 2025 it raised a $56 million Series C led by One Peak, with Macquarie Capital, Rabobank, BlackFin Capital Partners and others, and at that point served more than 80 clients from Tier-1 banks to mid-market fintechs. Customers shown on its site include Ecobank, Vakif Bank, Synctera, VR Payment, Ebury and Alviere.
features:
- AML transaction monitoring combining rules and behavioral AI, plus an AML AI overlay for existing systems.
- Customer and payment screening against sanctions, PEP and adverse media watchlists.
- Transaction fraud, check fraud, and scam and mule detection, with a combined FRAML option.
- Customer risk rating and entity risk detection.
- Explainable AI for audit-ready decisioning.
- AI agents for AML investigations, CDD and screening, with a unified case manager and SAR/CTR filing.
