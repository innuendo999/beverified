verdict: "Blockpass suits small crypto firms that want customer KYC, wallet checks and Travel Rule messaging from one vendor with prices on the website. Its Travel Rule service, Envoy, uses TRISA as its main protocol, also sends over TRP, and falls back to email when a counterparty has neither. The catch: Envoy is an add-on for the Corporate plan ($999 a month on a 12-month term) with no published add-on price, we found no TRUST, GTR, CODE or Sygna route, and the TRISA and TRP links are stated only by Blockpass."
what_is:
- Blockpass is a compliance platform for crypto and other regulated businesses. Its core product is customer verification (KYC) with ID document checks, face match with 3D liveness, proof of address, and sanctions, PEP and adverse media screening, plus business verification (KYB), wallet screening (Crypto AML), a signed-message check for self-hosted wallets (Unhosted Wallet KYC) and On-Chain KYC attestations. Users who pass KYC get a reusable Blockpass identity profile they can share with other businesses on the network. Blockpass says it has verified 1.3 million identities and serves 1,000+ businesses; we could not check either figure.
- 'The Travel Rule service is called Blockpass Envoy. According to Blockpass''s own guide, TRISA is Envoy''s native protocol, TRP is used when the counterparty publishes a travel address, and a "Sunrise" option sends a secure compliance email to VASPs that support neither. Counterparties are picked from the TRISA Global Directory Service, the Daybreak directory, or added by hand. Envoy is the name of TRISA''s open-source Travel Rule node, which TRISA says supports the TRISA and TRP protocols; Blockpass runs it as a hosted account that its team sets up for each customer. In June 2025 Blockpass also announced a partnership to offer CryptoSwift''s Travel Rule tools to its clients; its current pages do not mention CryptoSwift.'
- The contracting company is Blockpass UK Ltd, registered at Companies House on 13 March 2018 (number 11251249) with an office address in London. Blockpass says it has been building since 2017; its press releases are issued by Blockpass IDN Ltd, a Hong Kong company that was the UK company's majority owner in 2018 and 2019. Adam Vaziri is CEO, and the register lists one active person with significant control, Hiroyuki Enomoto. Named clients in Blockpass's own releases include Chainproof, a Bermuda-licensed insurer that uses it for KYB, and launchpads such as ChainGPT and Ordify.
features:
- Envoy Travel Rule messaging over TRISA (native) and TRP, with an email fallback for counterparties on neither, per Blockpass. Counterparties come from the TRISA directory, the Daybreak directory or manual entry.
- Envoy dashboard with customer accounts for originators and beneficiaries, optional IVMS101 records linked to wallet addresses, a transfer inbox for sending and receiving, and Accepted, Rejected or Pending status on each transfer.
- Unhosted Wallet KYC, where the user connects a self-hosted wallet and signs a message to prove ownership, on Ethereum, Polygon, BSC, Avalanche and Arbitrum.
- Crypto AML wallet screening for links to illicit activity on Ethereum, Bitcoin, Polygon, BSC and Cardano, through the API or the dashboard.
- Customer KYC with 200+ ID document types, forensic and MRZ checks, face match with 3D liveness, proof of address, sanctions, PEP and adverse media screening, ongoing AML monitoring and periodic re-verification.
- KYB with company document and ownership submission, corporate AML checks and reusable business profiles, plus managed services such as manual review, a dedicated operator and enhanced due diligence on the Corporate plan.
