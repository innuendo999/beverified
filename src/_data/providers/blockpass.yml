  by_profile:
  - Small crypto firms, launchpads and token projects that need customer KYC, wallet checks and some Travel Rule messaging from one vendor are Blockpass's clearest fit.
  - VASPs whose main counterparties are on TRISA, or publish a TRP travel address, can reach them through Envoy; firms that send most transfers to TRUST, GTR or CODE members should ask how those are handled before signing.
  - Firms that only need Travel Rule messaging, not KYC, should compare the Corporate plan's yearly minimum with a Travel Rule specialist's price.
faq:
- q: How much does Blockpass cost?
  a: Blockpass publishes four plans. Basic costs $99 a month, Starter $249 and Growth $499, each on a one-month term, and Corporate $999 a month on a 12-month term. A full KYC check costs $1.35 on Basic and $1.00 on Corporate, and unhosted wallet KYC $1.25 to $0.50. Each plan has a 7-day free trial with no credit card. The Envoy Travel Rule add-on comes with Corporate, and its price is not published.
- q: What is Blockpass Envoy?
  a: Envoy is Blockpass's Travel Rule service. Blockpass's guide says it uses TRISA as its native protocol, sends over TRP when the counterparty has a travel address, and sends a compliance email when the counterparty has neither. Envoy is also the name of TRISA's open-source Travel Rule node. Blockpass hosts it for you, and its team creates your account and shares the login details.
- q: Which Travel Rule networks can Blockpass reach?
  a: TRISA and TRP, per Blockpass, plus email for VASPs on neither. Counterparties can be found in the TRISA Global Directory Service and the Daybreak directory or added by hand. We found no TRUST, GTR, CODE, Sygna, VerifyVASP or Notabene route, and no TRISA listing that confirms Blockpass, so test transfers with your main counterparties first.
- q: How does Blockpass verify self-hosted wallets?
  a: With its Unhosted Wallet KYC check. The user connects the wallet and signs a message, and Blockpass checks the signature together with the user's KYC data. Blockpass lists Ethereum, Polygon, BSC, Avalanche and Arbitrum. We found no Satoshi test, AOPP or screenshot method, and the pages do not say how this check links to Envoy transfers.
- q: Is Blockpass ISO 27001 certified?
  a: Yes. British Assessment Bureau, part of Amtivo, lists certificate 241611 for Blockpass under ISO/IEC 27001:2022, first issued on 9 March 2023, reissued on 11 March 2026 and valid to 8 March 2029. The scope covers software for KYC and AML tools. Blockpass also shows Cyber Essentials and Cyber Essentials Plus marks, which we did not check on a register. We found no SOC 2 claim.
- q: Does Blockpass also do KYC?
  a: Yes, KYC is its main product. It checks 200+ ID document types, matches the face with 3D liveness, checks proof of address and screens for sanctions, PEPs and adverse media, with ongoing monitoring. It also offers KYB, wallet screening and a reusable identity profile for verified users. We found no iBeta liveness letter for Blockpass.
- q: What is the best alternative to Blockpass for the Travel Rule?
  a: CryptoSwift if you want a published Travel Rule price. Ospree if you want TRISA and TRP routes that TRISA itself confirms, with wallet screening built in. 21 Analytics if many of your counterparties are on TRUST or you want software you run yourself.
