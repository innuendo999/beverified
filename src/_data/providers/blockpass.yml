verification_notes:
- 'Record decisions: link.type none (suggested by 21 Analytics, a partner ranked in Travel Rule; no commercial relationship with Blockpass recorded, and the suggestion has no influence on the score). link.url = the Travel Rule Solution page. Categories travel-rule only; crypto KYC, identity verification, KYB and cheap KYC are suggestions for the owner (Blockpass sells customer KYC with published per-check prices). Grade "Good" as on the other Travel Rule records (v3.0); under the v3.1 bands 3.7 would be "Very Good". Logo: horizontal Blockpass logo (blue toggle icon and BLOCKPASS wordmark) supplied by the editor on 12 Nov 2026; white made transparent for the wordmark, and the square logo tile is the toggle icon from the same image, centred on white. A square version sent at the same time was not used: it has an off-white background and a small sparkle mark in the corner. Not in src/_data/providers under another slug, not in tracked.yml. Wikidata id not searched; kg_mid unknown.'
