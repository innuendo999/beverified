pros:
- ISO/IEC 27001:2022 certificate confirmed on the certification body's site, valid to March 2029, with KYC and AML tools in scope
- KYC, KYB, wallet screening and Travel Rule from one vendor, with per-check prices published for every plan
- Envoy sends over TRISA and TRP and falls back to email when a counterparty has neither
cons:
- Envoy is an add-on for the Corporate plan, which costs $999 a month on a 12-month term, and the add-on price is not published
- No TRUST, GTR, CODE or Sygna route found, and the TRISA and TRP links are stated only by Blockpass
- Self-hosted wallets are checked by signature only, on five EVM networks, with no Satoshi test or Bitcoin signing found
