- Founding year 2010 rests on third-party sources only (Wikipedia; CB Insights also shows 2010). Jumio's homepage and About page do not state it, and no company registry entry was opened.
- ISO/IEC 27001:2022, SOC 2 Type 2 and PCI DSS are vendor-stated on the Privacy Center page; trust.jumio.com still does not load, and no certificate, audit report or register entry was opened. A 2022 Jumio release names Moss Adams as the SOC 2 auditor.
- Gartner Peer Insights rating is based on only 2 ratings. Capterra still shows 0 reviews for Jumio, so it is not listed.
