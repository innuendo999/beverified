verdict: 'Jumio is built for enterprise-scale identity verification: more than a billion transactions processed, bank and marketplace clients, and a platform that extends beyond onboarding into ongoing risk monitoring. That scale comes at the cost of pricing transparency. Rates are quoted through sales, and Vendr''s buyer data puts the median annual contract at about $55,850.'
what_is:
- Jumio is an identity-verification company founded in 2010 and based in Sunnyvale, California, with offices and representation in North America, Latin America, Europe, Asia Pacific and the Middle East. It says it has processed more than 1 billion transactions across more than 200 countries and territories. It is backed by Centana Growth Partners, Great Hill Partners and Millennium Technology Value Partners, and Mark Lorion became CEO in April 2026. Jumio sells to large enterprises (banks, marketplaces and fintechs) that need document and biometric verification alongside AML screening at global scale.
features:
- Document verification across 5,000+ ID types from 200 countries and territories.
- Selfie verification and liveness detection to prevent spoofing and deepfakes.
- AML screening covering sanctions, PEPs and adverse media, with ongoing monitoring after onboarding.
- Jumio Platform with orchestration, a rules engine, risk signals and AI risk scoring.
- Jumio Watch for continuous risk analysis beyond initial onboarding.
- selfie.DONE reusable biometric credentials for returning users.
