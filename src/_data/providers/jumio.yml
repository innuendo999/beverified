faq:
- q: How much does Jumio cost?
  a: Jumio does not publish pricing; it quotes volume-based enterprise contracts through sales. Third-party estimates suggest an effective cost of roughly $0.90 to $2.30 per verification, though this is not Jumio's official rate.
- q: Does Jumio include AML screening?
  a: AML watchlist and sanctions screening is available as an add-on module alongside Jumio's core document and biometric verification.
- q: Is Jumio good for startups?
  a: Jumio is built primarily for enterprise-scale deployments; its sales-quoted, volume-based pricing tends to suit large organizations more than early-stage startups.
- q: How does Jumio compare to Onfido?
  a: Both offer broad document coverage and enterprise-grade verification. Onfido has stronger developer SDKs and is now backed by Entrust's security infrastructure, while Jumio has processed a larger cumulative volume of verifications.
- q: What is the best alternative to Jumio?
  a: Sumsub is the strongest alternative for teams that want published pricing and a unified KYC/KYB/monitoring platform. Onfido is the closest match for enterprise-grade document coverage with stronger developer tooling.
- q: Who are Jumio's main competitors?
  a: Jumio competes with Onfido, Sumsub, and Regula, differentiating mainly on its processed-verification scale and enterprise support model.
