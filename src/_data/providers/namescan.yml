faq:
- q: How much does NameScan cost?
  a: NameScan publishes pay-as-you-go prices from $2.00 USD per scan on a 100-scan package, down to $1.40 per scan at 1,000 scans. Sapphire packages start at $1.70 per scan. Packages last 12 months, with no contract, minimum or setup fee.
- q: Who uses NameScan?
  a: NameScan serves accountants, betting, financial institutions, insurance, legal, precious metals, real-estate and virtual currency businesses needing sanctions, PEP, and adverse-media screening.
- q: Does NameScan offer batch screening?
  a: Yes, NameScan supports batch uploads alongside dashboard checks and a RESTful API.
- q: Where is NameScan based?
  a: NameScan lists its office in Chatswood, New South Wales, Australia. G2 lists it as founded in 2016.
- q: What is the best alternative to NameScan?
  a: SmartSearch is the best alternative for JMLSG-compliant UK screening at larger scale. ComplyAdvantage is the closest fit for enterprise-scale data depth.
- q: Who are NameScan's main competitors?
  a: NameScan competes with SmartSearch, ComplyAdvantage, and KYC360, differentiating through accessible, self-serve on-demand pricing for SMEs.
