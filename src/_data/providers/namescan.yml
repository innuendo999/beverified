verdict: 'NameScan targets a segment most AML platforms overlook: legal, real-estate, and crypto SMEs that need one-off or batch sanctions/PEP checks without an enterprise-lifecycle platform. It''s simple and self-serve where larger competitors require a sales conversation, though its scope and scale are narrower than full-service AML vendors.'
what_is:
- NameScan is a sanctions, PEP, and adverse-media screening company founded in 2016 and headquartered in Chatswood, New South Wales, Australia. It serves finance, legal, real-estate, and crypto businesses with global sanctions, PEP, and adverse-media datasets, positioned as an accessible, self-serve option for SMEs that don't need a full enterprise AML lifecycle platform.
features:
- PEP and sanctions screening against global datasets.
- Adverse-media screening.
- Identity verification alongside screening checks.
- Ongoing monitoring for existing customers.
- Batch screening for higher-volume needs.
- API access for integration into existing workflows.
