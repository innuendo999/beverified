verdict: 'NameScan targets a segment most AML platforms overlook: legal, real-estate, and crypto SMEs that need one-off or batch sanctions/PEP checks without an enterprise-lifecycle platform. It''s simple and self-serve, with published pay-as-you-go prices from $2.00 per scan and no contract, where larger competitors require a sales conversation, though its scope and scale are narrower than full-service AML vendors.'
what_is:
- NameScan is a sanctions, PEP, and adverse-media screening service based in Chatswood, New South Wales, Australia, and a member of the Neurocom Group alongside sister company MemberCheck. G2 lists it as founded in 2016. It serves accountants, betting, financial institutions, insurance, legal, precious metals, real-estate and virtual currency businesses, and says it has 27,000+ customers across 195 countries. It is positioned as an accessible, self-serve option for SMEs that don't need a full enterprise AML lifecycle platform.
features:
- PEP and sanctions screening (OFAC, UN, EU, UK, Australian and other regimes) from 20,000+ government and watchlist sources, updated daily.
- Two data tiers, Emerald (NameScan's own database, 700,000+ profiles) and Sapphire (Acuris Risk Intelligence data).
- Adverse-media screening.
- ID verification with document authentication and biometric liveness, sold as separate credits.
- Know Your Business (KYB) company checks.
- Batch upload and a RESTful API with a Developer Centre.
pricing:
  summary: NameScan publishes pay-as-you-go prices in USD. Screening starts at $2.00 per scan on a 100-scan package and falls to $1.40 per scan at 1,000 scans; Emerald packages go as low as $1.40 and Sapphire packages as low as $1.70 per scan. Packages are valid for 12 months, with no contract, no monthly minimum and no setup fee. ID verification and KYB are billed separately per check.
