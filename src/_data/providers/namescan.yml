pros:
- Accessible, self-serve pay-as-you-go screening for SMEs, with published per-scan prices
- Simple setup without an enterprise sales process or contract
- Batch and API options for scaling beyond one-off checks
cons:
- Narrower scope than full enterprise AML-lifecycle platforms; ongoing monitoring is offered through sister product MemberCheck
- Smaller scale and brand than category leaders
- Prepaid packages expire after 12 months
