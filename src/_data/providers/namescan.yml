verification_notes:
- 'Pricing: package prices come from the homepage (source 1) because the package selector on the pricing page (source 2) does not render as text. Rechecked 2026-10-22, unchanged.'
- 'Founded 2016: only on the G2 seller profile (source 4, vendor-supplied). The Australian Business Register shows the NameScan business name registered to Neurocom Pty Ltd on 11 Oct 2021 (source 7), a registration date, not a founding date. Capterra Canada lists the vendor as MemberCheck, founded 2008.'
- 'Ownership: the register confirms Neurocom Pty Ltd holds the NameScan business name (source 7). Nexiant AI Pty Ltd (ABN active from 15 Dec 2023, same postcode 2067, holds the FraudShield business name, source 8) lists "NameScan Pay As You Go" on nexiant.ai (source 9), and Capterra calls NameScan part of the Nexiant group. The legal link between Neurocom and Nexiant is not confirmed.'
- 'Monitoring: the PEP page (source 6) says ongoing monitoring is available through the enterprise product MemberCheck, not NameScan. The homepage and PEP page show a "Real-time Transaction Monitoring" heading with no detail; Capterra says transaction monitoring is offered through FraudShield. Capability left as not_disclosed.'
- 'ISO 27001:2022 and ISO 27701:2019 are vendor-stated on the about page (source 3); no certificate or certification body found. Logo alt text "ALAD-BAT CMS Accredited" not explained; not listed.'
