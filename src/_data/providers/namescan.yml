verification_notes:
- 'Pricing: old page said custom, on-demand and subscription. NameScan publishes pay-as-you-go per-scan prices; no subscription is described. Package prices are taken from the homepage because the pricing page selector did not render as text.'
- 'Founded 2016: only from the G2 seller profile (vendor-supplied). Capterra Canada shows the listed vendor as MemberCheck, founded 2008, and calls NameScan part of the Nexiant group.'
- 'Ownership: NameScan pages say it is a member of the Neurocom Group; Nexiant (nexiant.ai) also lists "NameScan Pay As You Go". Relationship not confirmed.'
- 'Ongoing monitoring: old feature list said ongoing monitoring; no monitoring feature is described on the current homepage or pricing page. Replaced with KYB.'
- 'ISO 27001:2022 and ISO 27701:2019 vendor-stated on the about page; no certificate found. Logo alt text "ALAD-BAT CMS Accredited" not explained; not listed.'
- 'User review themes rewritten from the five reviews visible on Capterra Canada; old "frequently cited" labels removed.'
