verdict: 'Verified bundles AML/KYC screening with e-signing and digital identification in one system, built for B2B compliance in the Nordics, with a managed AML service for the Nordic market that pairs advisers with the technology. Backed by Verdane since 2023 and grown through acquisitions (Assently, Pliance, GRC WATCH), it is strongly regional: a good fit inside the Nordics, less so outside it.'
what_is:
- 'Verified is a Nordic compliance-technology company founded in Sweden in 2012. It started with electronic signing and identification and later added anti-money laundering checks and third-party assessment. Verdane invested in spring 2023, after which Verified acquired Assently (e-signing and e-ID) and Pliance (AML automation) in 2023 and GRC WATCH (due diligence) in April 2024.'
- 'Verified says it has 5,500+ customers in the Nordics and EU and about 90 staff in Sweden, Norway, Finland and Romania. Verdane lists its headquarters as Stockholm; the Swedish office is in Solna.'
features:
- 'AML screening: PEP and sanctions lists within the EU, with continuous monitoring.'
- KYC workflows with beneficial owner identification and a customer risk assessment.
- E-signing for digital contract execution, covering the eIDAS levels of assurance.
- Integrated Nordic electronic IDs, plus passport reader and SMS verification.
- Contract management, due diligence and supplier assessment.
- 'AML Managed Services (Nordic market): advisers paired with the platform, with Verified handling KYC administration.'
pricing:
  summary: 'Pricing is not published; Verified quotes on request. Its AML and KYC pricing has three parts: a one-time setup fee, a monthly licence fee based on the number of customers and add-ons, and usage fees for signing and digital identification.'
