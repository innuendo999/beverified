verification_notes:
- 'Rebrand: Verified launched a new brand on 19 to 20 Oct 2026 (source 19) and verified.eu now redirects (302) to verified.io. Sources 1, 2 and 5 to 11 are verified.eu pages that now redirect; facts were re-pointed to sources 12 to 18 where the new site confirms them.'
- 'HQ: Verdane lists Stockholm (source 3). tic.io, a third-party view of Bolagsverket data (source 21), shows Verified Global AB, org. no. 556883-1233, seat Stockholm municipality, address Gårdsvägen 10 B, Solna, registered 3 Feb 2012. Official Bolagsverket record not opened. The office list (Solna, Oslo, Espoo, Bucharest) and staff count (about 90) are no longer on the site and were removed.'
- 'Pricing: the AML pricing page (source 8) that described a setup fee, a monthly licence and usage fees now redirects to the AML product page, which shows no pricing; the verified.io sitemap has no pricing page. Structure removed from summary, items, FAQ and cons.'
- 'AML Managed Services: the launch post (source 9) now redirects, and no current product or industry page mentions the service. Removed from verdict, features, pros, cons and FAQ. Re-add only if Verified confirms it is still offered.'
- 'Contract management: not described on the new eSign page (source 15), which mentions a document archive and status view; removed from features and FAQ.'
- 'ISO/IEC 27001 is vendor-stated: the new site says certified since 2018 (sources 12, 18) with no version, certification body or certificate number. The earlier news post (source 10) that said ISO/IEC 27001:2022, valid until November 2027, now redirects.'
- 'User ratings: the G2 seller profile "Verified" matches this company (www.verified.eu, Stockholm, founded 2012, source 20). It shows 5.0 from 2 reviews, both on Assently E-Sign; Verified AML has 0 reviews. Not added as a rating for the whole suite. No Capterra, Gartner Peer Insights or Trustpilot profile found.'
- 'GRC WATCH acquisition month (April 2024) came from source 5, which now redirects; the company page (source 13) confirms the year 2024 only.'
