verdict: 'Verified bundles AML/KYC screening with e-signing and digital identification in one system, built for B2B compliance in the Nordics with a managed-services option pairing consultants with the technology. Backed by Verdane and grown through acquisitions (Pliance, Assently, GRC Watch), it''s strongly regional: a good fit inside Scandinavia, less so outside it.'
what_is:
- Verified is a Nordic compliance-technology company headquartered in Oslo, Norway (its precise founding year is not consistently disclosed publicly), backed by Verdane. It serves more than 5,500 B2B clients across the Nordics with AML/KYC screening, e-signing, digital identification, and AI-powered contract management, built up through acquisitions including Pliance, Assently, and GRC Watch.
features:
- 'AML screening: PEP and sanctions checks.'
- KYC and customer registration workflows.
- E-signing for digital contract execution.
- E-ID / digital identification.
- AI-powered contract management.
- 'AML Managed Services: consultants paired with the platform, plus audit documentation consolidation.'
