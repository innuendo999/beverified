verification_notes:
- HQ "Oslo, Norway" was wrong; Verdane lists Stockholm, Sweden, and the contact page lists offices in Solna, Oslo, Espoo and Bucharest without naming an HQ. No company register entry was opened.
- ISO/IEC 27001:2022 is vendor-stated (news post says valid until November 2027); no certification body or certificate number published. Trust centre security page lists only subcontractor certifications.
- No G2, Capterra or Trustpilot profile for Verified (verified.eu) could be opened; user review themes removed.
- The words AI-powered (contract management) and audit documentation consolidation (managed services) were not found on Verified's pages; removed.
- AML pricing page hero contains placeholder text; pricing structure may change.
- Verdane press release (May 2023) and GRC WATCH news (April 2024) cite 4,000+ customers; current site says 5,500+.
