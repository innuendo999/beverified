faq:
- q: How much does Verified cost?
  a: Verified does not publish prices. Its site offers a demo, and prices are quoted on request.
- q: What does Verified's platform include?
  a: Verified combines AML/KYC screening, e-signing, digital identification with Nordic and Baltic eIDs, and GRC Due Diligence for supplier and partner checks.
- q: Which eIDs does Verified support?
  a: Verified lists Swedish BankID, Norwegian BankID, Danish MitID, Finnish Trust Network, Freja and Baltic eIDs including Smart-ID.
- q: What companies has Verified acquired?
  a: Verified acquired Assently (e-signing and e-ID) and Pliance (AML automation) in 2023, and GRC WATCH (due diligence) in April 2024.
- q: When was Verified founded?
  a: Verified was founded in Sweden in 2012, starting with electronic signing and identification.
- q: What is the best alternative to Verified?
  a: Signicat is the best alternative for the broadest eID coverage across Europe. SmartSearch is the closest fit for UK-specific JMLSG compliance.
- q: Who are Verified's main competitors?
  a: Verified competes with Signicat, SmartSearch, and KYC360, differentiating through its Nordic focus and bundled AML+e-signing+e-ID approach.
