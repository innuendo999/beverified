verdict: 'Verified bundles AML/KYC screening with e-signing and digital identification in one system, built for B2B compliance in the Nordics. Backed by Verdane since 2023 and grown through acquisitions (Assently, Pliance, GRC WATCH), it is strongly regional: a good fit inside the Nordics, less so outside it.'
what_is:
- 'Verified is a Nordic compliance-technology company founded in Sweden in 2012. It started with electronic signing and identification and later added anti-money laundering checks and third-party assessment. Verdane invested in spring 2023, after which Verified acquired Assently (e-signing and e-ID) and Pliance (AML automation) in 2023 and GRC WATCH (due diligence) in April 2024.'
- 'Verified says it serves 6,500+ Nordic businesses, with Sweden, Finland and Norway as its core markets. Verdane lists its headquarters as Stockholm; its registered address is in Solna. In October 2026 Verified launched a new brand and moved its website to verified.io.'
features:
- 'AML screening: every customer screened daily against PEP, sanctions and adverse media, with risk reassessed when owners, board members or hits change.'
- KYC workflows with beneficial owners identified automatically from official registers and a customer risk score based on your own risk policy.
- E-signing for digital contract execution, covering simple, advanced and qualified eIDAS signatures.
- Integrated Nordic and Baltic electronic IDs (BankID, MitID, Finnish Trust Network, Freja, Smart-ID), plus passport and SMS options in signing flows.
- 'GRC Due Diligence: one shared profile for supplier and partner checks instead of questionnaires.'
- 'LiveID: callers identify with their eID during a phone call, from the web portal or via API.'
