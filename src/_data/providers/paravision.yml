  by_profile:
  - Identity platforms, device makers and integrators that build their own verification flow are Paravision's buyers; its face engine reaches end users through products such as Persona.
  - Banks, governments and border programmes that need face matching, liveness or deepfake checks to run on their own servers or devices should put it on the shortlist.
  - Compliance teams that want a ready KYC product should buy an IDV platform instead, and can ask that vendor whose face and liveness engine it uses.
faq:
- q: What does Paravision sell?
  a: Face recognition (1:1 and 1:N), passive liveness detection, deepfake and synthetic face detection, age estimation, image quality checks and a walk-through Contactless Corridor. It sells them as SDKs and Docker containers to companies that build identity, travel, access control and payments products, not as a hosted KYC service for end customers.
- q: Is Paravision a KYC provider?
  a: Not on its own. It does not verify identity documents, screen sanctions lists or manage cases. Identity platforms license its face matching, liveness or age estimation and build the rest. Its partners page names Persona, ID.me and Entrust among them.
- q: How much does Paravision cost?
  a: Paravision does not publish pricing. Its contact page offers a demo, and licences are quoted. We found no free trial and no third-party price.
- q: Has Paravision's liveness been independently tested?
  a: Yes. iBeta's published letters show Paravision Liveness v1.0 passed ISO/IEC 30107-3 Level 1 in October 2023 and v1.2 passed Level 2 in December 2023, with no successful attacks in the Level 2 test on an iPhone 13. In the DHS RIVR 2025 PAD track, the published results list the system Paravision says is its own (P9) at under 1.7% APCER and under 0.5% BPCER. Paravision also reports a Level 3 evaluation of Liveness 2.0 by Ingenium Biometrics in 2025, but we did not see Ingenium's report.
- q: How does Paravision rank in NIST face recognition tests?
  a: Paravision says its paravision-018 and paravision-019 algorithms ranked in the top 5 globally on NIST's Visa-Border benchmark for 1:1 and 1:N in July 2025, and fourth for 1:1 in January 2026. NIST's FRTE pages list results by algorithm, but we could not read the result tables, so these ranks are vendor-stated here.
- q: Is Paravision's age estimation certified?
  a: Yes. The Age Check Certification Scheme register lists Paravision Inc's Age Estimator at Level 3, Highly Effective Compliance, against ACCS 1:2020, with an expiry date of 18 March 2027.
- q: What was the FTC case against Paravision?
  a: In 2021 the FTC settled with Everalbum, Inc., Paravision's former name, over its Ever photo app. The FTC alleged the app turned on face recognition by default for most users despite saying it would not, and kept photos and videos of users who deactivated their accounts. The final order of May 2021 required the company to delete models and algorithms built with Ever users' biometric data and runs for 20 years. The company neither admitted nor denied the allegations and says its current technology was not trained on Ever data.
- q: What is the best alternative to Paravision?
  a: If you want a full verification product, Incode and Veridas combine their own biometrics with document checks. If you are assembling your own stack, Regula's document authentication SDKs pair with a face engine such as Paravision's.
