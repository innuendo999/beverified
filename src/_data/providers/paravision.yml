verification_notes:
- 'First review; Paravision asked to be listed and sent no product details. link.type set to none (no commercial relationship recorded). No logo or wordmark file yet.'
- 'Score 3.9 is below the lowest other record (Zyphe 4.0). No grade word is defined below 4.0; "Good" (used for 4.0 to 4.3) is applied. Editor to confirm or set a separate band.'
- 'Partners, not labelled customers (partners page re-opened 2026-10-22): HID, ID.me, Persona, secunet, SITA, Toppan Next Tech, Globant, Plastic Omnium, PopID, Imprivata, Vicon, Brivo, Entrust, plus OP''nSoft in testimonials. Only Persona (Dec 2025 joint release), ID.me, Entrust and HID used in the record.'
- 'iBeta (re-checked 2026-10-22): the letters page still lists only Paravision Liveness v1.0 Level 1 (16 Oct 2023) and v1.2 Level 2 (28 Dec 2023); no letter for Liveness 2.0. Both letter PDFs now refuse automated access (robots) and the web archive is blocked. Level 2 stays confirmed on the letter opened 2026-10-18 (iPhone 13, iOS 16.6, 750 attacks, APCER 0%, BPCER not stated). The Level 1 letter has never been opened, so Level 1 is vendor_stated (Paravision liveness page) until it is. No BixeLab result found.'
- 'DHS RIVR 2025 (MdTF results re-opened 2026-10-22, vendors anonymised): PAD passive system 9 at APCER <1.7%, BPCER <0.5%, run time <2.3 s; MTDS 12 at FMR <0.01%, FNMR <0.08%. Webinar slide file names suggest Jan and Feb 2026 releases. Paravision identifies P9 and MTDS 12 as its systems; attribution stays vendor_stated.'
- 'NIST FRTE: Paravision''s benchmarks and Trust pages now cite October 2026 results (1:1 3rd, Visa-Border yaw 45 degrees or more, FNMR 0.0015 at FMR 1e-6; 1:N 11th, Visa-Border N=1.6M, FNIR 0.002 at FPIR 0.003); on 2026-10-18 the Trust page said 4th on 1:1 (Jan 2026). NIST 1:1 page (updated 2026-10-06) still renders tables by script with no readable rows, and report card PDFs failed to load. Ranks stay vendor_stated; confirm in a browser at the next re-check.'
- 'Ingenium Biometrics Level 3 PAD evaluation of Liveness 2.0 (Aug 2025): vendor release only; no public Ingenium report found (searched 2026-10-22).'
- 'Vendor-only claims not used: DHS RIVTD 2024 Track 3 and DHS Biometric Technology Rally 2021 to 2023 results; Liveness 2.0 gains (90%+ BPCER reduction, 40%+ fewer failures to acquire, 2x speed); Deepfake Detection training set (1.6M+ images), unnamed Five Eyes partner and "up to 97%" improvement; ACCS bias evaluation (100% precision); Australia AATT MAE of 1.56 years (AATT report not opened); Substack age estimation report (not opened).'
