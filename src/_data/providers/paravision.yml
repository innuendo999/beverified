verdict: Paravision is a biometrics supplier, not a KYC platform. It licenses face recognition, passive liveness, deepfake detection and age estimation as SDKs and Docker containers to companies that build identity products, and Persona, Entrust and ID.me appear among its named partners. The independent evidence is strong. iBeta's published letters confirm ISO/IEC 30107-3 Level 1 and Level 2 results for its liveness (2023 versions), the ACCS register lists its age estimator at Level 3 until March 2027, and the DHS RIVR 2025 results match the figures Paravision gives for its entries. A compliance team still needs a separate vendor for documents, screening and case handling. Prices are not published, we found no ISO/IEC 27001 or SOC 2 claim, and the company is bound until 2041 by a 2021 FTC order over its former Ever photo app. Shortlist it if you are building your own verification stack or want to know whose face engine sits inside your IDV vendor.
what_is:
- Paravision, Inc. is a San Francisco company that develops face biometrics and sells them to other businesses. Its products are Face Recognition (1:1 verification and 1:N search), Liveness (passive presentation attack detection from a single frame, now at version 2.0), Deepfake Detection (face swaps, expression swaps and fully synthetic faces, version 2.0 launched in June 2025), Age Estimation, an ISO/ICAO image quality suite for travel documents and a Contactless Corridor for walk-through border and airport checks. It ships them as C++ and Python server SDKs, Kotlin and Swift mobile SDKs, edge SDKs for NVIDIA, Ambarella, Hailo and Rockchip chips, and Docker containers that run on-premises or in AWS, Azure or Google Cloud. Buyers are identity platforms, device makers and system integrators. Its partners page names Persona, ID.me, Entrust, HID, secunet, SITA and Toppan Next Tech, and in December 2025 Persona and Paravision said Persona's entry to Australia's Age Assurance Technology Trial was built on Paravision's age estimation.
- The company began as Everalbum, maker of the Ever photo storage app, which had raised $8 million by 2016. Its face recognition started as a feature of that app. The business rebranded from Ever AI to Paravision in August 2019 and closed the Ever app in 2020. In January 2021 the FTC alleged that Everalbum had turned on face recognition by default for most Ever users despite saying it would not, and had kept photos and videos of users who deactivated their accounts. The final order of May 2021 names "Everalbum, Inc., also doing business as Ever and Paravision", required it to delete models and algorithms built with Ever users' biometric data, and runs for 20 years. The company neither admitted nor denied the allegations, and in its 2022 compliance report it said it had made the required deletions and that the technology it sells was not trained on Ever data. Doug Aley is chief executive. Paravision raised a $23 million round in May 2021 led by J2 Ventures, with HID Global taking part, and in September 2026 the US State Department awarded it a contract worth up to $6.5 million for digital identity assurance.
features:
- Face Recognition SDKs and containers for 1:1 verification and 1:N search, plus Paravision Search for large galleries over REST and gRPC.
- Passive liveness from a single selfie frame on iOS, Android and webcams, with server-side checks on Windows and Linux.
- Deepfake Detection 2.0, which scores still images and video frames for face swaps, expression swaps and fully synthetic faces.
- Age Estimation from a face image, certified by the Age Check Certification Scheme at Level 3 (Highly Effective Compliance).
- Image quality checks, including an ISO/ICAO suite for passport and visa photos, with live capture feedback on sharpness, lighting and pose.
- Deployment on-premises, in AWS, Azure or Google Cloud, on mobile devices or on edge chips from NVIDIA, Ambarella, Hailo and Rockchip.
