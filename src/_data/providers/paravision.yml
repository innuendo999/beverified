pros:
- Liveness confirmed by iBeta to ISO/IEC 30107-3 Level 2, and DHS RIVR 2025 results match the figures Paravision gives for its entries
- Age estimation listed at ACCS Level 3 (Highly Effective Compliance), valid to March 2027
- Runs on-premises, in your own cloud, on phones or on edge chips, so face images can stay inside your own systems
cons:
- A component supplier, with no document checks, AML screening or case management of its own
- No published pricing, trial or public developer documentation, and no ISO/IEC 27001 or SOC 2 claim
- Bound until 2041 by a 2021 FTC order over its former Ever photo app's use of face recognition
