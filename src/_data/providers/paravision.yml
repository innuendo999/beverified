verification_notes:
- 'New record, first review. Paravision asked to be listed and sent no product details; everything comes from public pages opened on 2026-10-18. link.type set to none (no commercial relationship recorded). No logo or wordmark file yet.'
- 'Score 3.9 is below the lowest existing record (Zyphe 4.0). No grade word is defined below 4.0 in the existing records; "Good" (used for 4.0 to 4.3) is applied. Editor to confirm or set a separate band.'
- 'Buyer type: Paravision sells components (SDKs, Docker containers, edge SDKs) to platforms and integrators. Partners page names HID, ID.me, Persona, Entrust, PopID, secunet, SITA, Toppan Next Tech, Globant, Imprivata, Plastic Omnium, Vicon, Brivo and OP''nSoft; homepage logos add CheckIn, Ingenico and eConnect. Roles inferred from partner descriptions; not labelled as customers by Paravision. Only Persona (Dec 2025 joint release), ID.me, Entrust and HID used in the record.'
- 'iBeta: letters page lists Paravision Liveness v1.0 Level 1 (16 Oct 2023) and v1.2 Level 2 (28 Dec 2023). Level 2 letter opened: iPhone 13, iOS 16.6, tests 5 to 28 Dec 2023, 5 PAI species, 750 attacks, APCER 0%, BPCER not stated in the letter. No iBeta letter found for Liveness 2.0 (launched Mar 2025) in the visible list; page text was long and the fetcher read it in two parts, the second part ending mid-table at 2020 entries.'
- 'DHS RIVR 2025: MdTF results page (vendors anonymised) shows PAD system 9 at BPCER <0.5%, APCER <1.7%, run time <2.3 s, and SMTD system 12 at FMR <0.01%, FNMR <0.08%, selfie FTXR 0%, document FTXR <0.35%. These match Paravision''s releases, which identify P9 and MTDS 12 as its systems. Biometric Update (Jan 2026) reports the MTDS 12 attribution as Paravision''s own claim. Status vendor_stated for the attribution. Goal colour coding not readable in text. DHS RIVR program page (dhs.gov) failed to load.'
- 'DHS RIVTD 2024 Track 3 ("lowest combined error rate and fastest processing time" for the earlier Liveness) and DHS Biometric Technology Rally 2021 to 2023 results are vendor claims only; not used.'
- 'NIST FRTE: Paravision release (28 Jul 2025) names paravision-018 (1:1) and paravision-019 (1:N), top 5 on Visa-Border for both; Trust page claims 4th on 1:1 Visa-Border (Jan 2026, FNMR 0.0015 at FMR 1e-6) and 5th on 1:N (Jul 2025). NIST FRTE 1:1 and 1:N pages opened (last updated 2026-10-06 and 2026-10-05) but result tables are script-rendered and not readable; NIST report PDF and report cards failed to fetch. Identity Week (Aug 2019) reports it ranked first in FRVT 1:1 Ongoing in July 2019. All NIST ranks left vendor_stated; confirm in a browser at the next re-check.'
- 'Ingenium Biometrics Level 3 PAD evaluation of Liveness 2.0 (Aug 2025, 1,900+ attempts, 190 PAIs): vendor release and Biometric Update headline only; Ingenium''s report not opened (available on request).'
- 'ACCS: registry entry opened: Paravision Inc, Age Estimator, Level 3 Highly Effective Compliance, ACCS 1:2020 and BS ISO/IEC/IEEE 29119-3:2013, expiry 18/03/2027; issue date 19/03/2025 inferred from the certificate file name only. Separate ACCS bias evaluation (Apr 2025, 100% precision across groups, MAE 1.1 to 1.6 years) is vendor-reported; not used.'
- 'Australia AATT: Persona and Paravision joint release (Dec 2025) says Persona''s platform, built on Paravision age estimation, had MAE 1.56 years, lowest in the trial. AATT report not opened; figures not used. Biometric Update also reports Persona and Paravision powering Substack age estimation (Dec 2025); article not opened.'
