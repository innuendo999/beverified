verification_notes:
- 'link.type set to none: no commercial relationship with Prove is recorded.'
- 'Liveness: capabilities.liveness set to no because no liveness, document or selfie product appears on prove.com, Human Assurance (source 9) is a bot and human classification from phone signals, and the June 2026 releases (sources 18, 19) describe biometrics with liveness and document checks as in development with design partners, GA planned later in 2026. Re-check at the next review; if a product page or lab letter appears, Fraud defense moves.'
- 'Know Your Agent: kya.availability set to announced, so Prove is not eligible for the KYA ranking yet (owner decision 2026-11-24: not ranked for now). The Oct 2025 release says "launch", but the Agentic Suite page (source 10) words most items as "designed to", calls Agent Wallet exploratory and asks buyers to contact sales about availability; no customer is named.'
- 'Certifications: prove.com names no SOC 2, ISO/IEC 27001 or other certificate; footer badges are images without readable text. A third-party security profile (Nudge Security) lists SOC 2, ISO 27001, PCI, FedRAMP and more without sources; not used.'
- 'Coverage: homepage and global page (source 13) say 200+ countries and regions; product pages list 8 to 10 named countries for core features plus "+25" or "+200 additional"; Signals is US only (source 17). 200 used as vendor-stated for the scorer; copy says the main features list fewer countries.'
- 'KYB: Pre-Fill for Business (source 8) says it verifies business entities and EIN/TIN; no registry list, UBO or monitoring described. Recorded as kyb_registry add_on. A Prove blog mentions a Baselayer partnership for business verification in ProveX; not opened.'
- 'Docs: developer.prove.com guides and reference pages redirect to a portal login for our fetch tool; search engines show their text, and the changelog is public. docs_public partial.'
- 'Funding: CB Insights lists $261.3M raised and a Series I; not used. $100M in 2020 from Prove''s own release.'
- 'Customers: homepage says 2,000+ companies; an Oct 2025 release says 1,500+ brands and a June 2026 blog footer says 2,500+. Homepage figure used.'
- 'User ratings: G2 not readable by our tools. Not recorded.'
- 'IDV 1.0: no category score computed. With no liveness product and no document checks its IDV score would sit far below #10 (ranking is top 10 only).'
- 'Logo tile and wordmark from the owner''s images (2026-11-24).'
- 'Incidents: none found in searches on 2026-11-24.'
