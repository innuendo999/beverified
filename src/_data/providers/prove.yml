  by_profile:
  - US banks, fintechs, card issuers and gaming operators with mobile-first sign-up are Prove's core fit.
  - Teams that want fewer document uploads can use Prove first and send only the users it cannot verify to a document check.
  - Regulated flows that require a document and selfie check for every user will need another vendor.
faq:
- q: How much does Prove cost?
  a: Prove does not publish prices. Its pricing page links to sales. Developers can test Pre-Fill for free in the developer portal sandbox with a company email address and no credit card.
- q: Does Prove do document and selfie verification?
  a: Not today. Prove's products verify people through their phone number, possession checks and identity data. In June 2026 Prove announced biometric products with liveness detection and document verification, described as in development with design partners. We found no product page or lab test for them yet.
- q: How does Prove Pre-Fill work?
  a: The user enters a phone number and a challenge such as a date of birth or the last four digits of the SSN. Prove checks that the user holds the phone, with a silent network check, an Instant Link or an SMS code, then returns verified identity data to pre-fill the form.
- q: Which countries does Prove cover?
  a: Prove says its network covers more than 200 countries and regions. Its product pages list the US, Canada, the UK, Australia, France, Germany, Brazil and a few others for the main features, and some features, such as Signals, work only in the US.
- q: Does Prove verify AI agents?
  a: Prove launched Verified Agent in October 2025. It ties an agent to a verified person, checks participants against a registry before each delegated action and keeps a consent log signed by user and merchant keys. Its product page asks buyers to contact sales about availability, so it is not yet in our Know Your Agent ranking.
- q: Is Prove SOC 2 or ISO 27001 certified?
  a: We found no security certification on prove.com. The site says it uses bank-grade security but names no audit, report or certificate.
- q: What is the best alternative to Prove?
  a: Socure is the closest alternative for US identity data checks, and it adds document and selfie verification. Persona and Incode fit teams that need document and liveness checks with a lab letter.
