verdict: KYCAID is a strong choice for small and mid-market teams that want a configurable KYC/AML verification flow without enterprise pricing, with published per-check prices from €0.50 for a document check and no monthly minimum. It's less deep on watchlist data than category leaders like ComplyAdvantage, but its customisable flows and white-label option on the Enterprise plan make it a practical fit for startups and platforms that verify on behalf of their own clients.
what_is:
- KYCAID is a KYC/AML verification platform that lets businesses configure onboarding flows combining document checks, face verification with liveness, AML screening, address checks and company checks. Its team says it has worked in KYC since 2018; the UK company KYCAID Limited was incorporated in November 2018 with a registered office in London, and KYCAID's privacy policy names Compligate Ltd, a company registered in England, as the operating entity. KYCAID says it covers 240+ countries and territories and is used by 100+ companies, mainly fintechs, exchanges and platforms.
features:
- Document verification and face verification with liveness checks, covering 240+ countries and territories.
- AML screening against PEP, sanctions, OFAC and other watchlists, an adverse media check and ongoing monitoring, each priced separately. Rule-based transaction monitoring and a crypto address check are on the same price list.
- Address, tax number, payment method, source of funds and mobile number checks as pay-as-you-go modules.
- Company check (KYB) covering corporate documents, business address, UBOs and authorised persons.
- Dashboard for customising the verification flow, with multiple workspaces in one account.
- API and hosted form integration, embeddable by iframe and on a custom domain; white labeling on the Enterprise plan.
pricing:
  summary: KYCAID publishes per-check prices in euros, excluding VAT, with no subscription or monthly minimum on its usage-based plan. A document check costs €0.50, liveness with face match €0.25, database screening against PEP, sanctions and other watchlists €0.10, an adverse media check €0.10, address verification €0.25 and a company check €10. Ongoing monitoring is an add-on at €100 a month. Non-document checks against government databases cost €0.05 to €0.80 depending on the country. New accounts get €50 credit on registration, and Enterprise pricing is tailored from 10,000 verifications a month.
  plans:
  - tier: Free start
    price: €50 credit
    note: No subscription and no card; the credit is spent at the per-check rates
    extra: Full access to KYC, AML and KYB checks
  - tier: Usage-based
    price: Per check, from €0.50
    note: No monthly minimum; pay only for the checks you run
    extra: €50 credit on registration
  - tier: Enterprise
    price: Custom
    note: White labeling, dedicated account manager, 24/7 priority support
    extra: From 10,000 verifications a month
