verification_notes:
- 'Pricing: old Starter $99/mo (500), Growth $299/mo (2,000), overage rates and 14-day trial are not on the vendor pricing page. Replaced with published EUR per-verification bundles.'
- 'Founded / HQ: old page said 2019, Vilnius. No source found. KYCAID Limited was incorporated 9 Nov 2018 (Companies House); the about page says "Since 2018". G2 lists HQ as Kyiv, Ukraine (seller-supplied); privacy policy names Compligate Ltd (England, incorporated 29 Dec 2023) as operator. Operational HQ not confirmed.'
- 'Certifications: ISO 27001, SOC 2 Type 2 and PCI DSS are stated only in the privacy policy ("continuously verified"); no certificate or register entry found. GDPR is a regulation, not a certification, and was dropped from the list.'
- '200+ document types: not found; the about page states 200+ countries and territories.'
- 'Mobile SDK: not listed in the public docs index; KYCAID told us (Oct 2026) that mobile SDKs are provided on request.'
- 'SOC 2: KYCAID told us (19 Oct 2026) it does not hold SOC 2 yet and expects it in early 2027, although its privacy policy still lists SOC 2 Type 2; removed from certifications. Re-check in Q1 2027.'
- 'Coverage: 240+ countries and territories confirmed by KYCAID to BeVerified by email on 19 Oct 2026 (vendor-stated); its public about page still says 200+.'
- 'Adverse media: the old FAQ said AML screening includes adverse media; the pricing page lists PEPs, sanctions, watchlists, OFAC and regulatory lists only. Removed.'
- 'User ratings: G2 shows 0 reviews for Kycaid ID Verification. Themes and counts removed.'
- 'Verification speed: about page gives both "20-sec" and "under 11 seconds"; not used.'
