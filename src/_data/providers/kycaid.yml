faq:
- q: How much does KYCAID cost?
  a: A single document check costs €0.50 and a company check €10, on a module price list that adds a fixed €100 monthly service fee. Bundles cost €0.75 for Basic KYC (document and face), €0.85 with AML screening and €1.10 with address verification, with €50 credit on registration. Enterprise pricing is tailored from 10,000 verifications a month.
- q: Does KYCAID support AML watchlist screening?
  a: Yes. KYCAID's AML screening covers PEPs, sanctions, OFAC and other regulatory watchlists, and it is included in the Standard and Advanced KYC bundles. Ongoing monitoring is available as a separate monthly module. The API docs also list a separate adverse media check, which is not priced on the pricing page.
- q: Is KYCAID good for startups?
  a: Yes, its pay-as-you-go pricing and dashboard for customising verification flows make it accessible for startups that don't have dedicated compliance engineering resources.
- q: Can KYCAID be white-labeled?
  a: Yes. White labeling is part of KYCAID's Enterprise plan, which starts at 10,000 verifications a month. Its docs also cover hosting the verification form on a custom domain.
- q: How does KYCAID compare to Sumsub?
  a: Sumsub offers deeper built-in watchlist coverage, while KYCAID is generally more affordable for smaller-volume, budget-conscious teams.
- q: What is the best alternative to KYCAID?
  a: Sumsub is the strongest overall alternative if watchlist depth matters more than price. Trulioo is another option to compare for high-volume global checks.
- q: How does KYCAID compare to Jumio?
  a: Jumio has broader brand recognition and more mature fraud-detection models, but KYCAID's customisable flows and published per-verification pricing make it more flexible for smaller teams.
- q: Who are KYCAID's main competitors?
  a: KYCAID's main competitors are Sumsub, Trulioo, Jumio, and ComplyAdvantage. It differentiates mainly through customisable verification flows and published per-verification pricing.
