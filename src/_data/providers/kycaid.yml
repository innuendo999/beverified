verdict: KYCAID is a strong choice for small and mid-market teams that want a configurable KYC/AML verification flow without enterprise pricing, with published prices from €0.50 per document check and €0.75 for a document plus face bundle. It's less deep on watchlist data than category leaders like ComplyAdvantage, but its customisable flows and white-label option on the Enterprise plan make it a practical fit for startups and platforms that verify on behalf of their own clients.
what_is:
- KYCAID is a KYC/AML verification platform that lets businesses configure onboarding flows combining document checks, face verification with liveness, AML screening, address checks and company checks. Its team says it has worked in KYC since 2018; the UK company KYCAID Limited was incorporated in November 2018 with a registered office in London, and KYCAID's privacy policy names Compligate Ltd, a company registered in England, as the operating entity. KYCAID says it covers 240+ countries and territories and is used by 100+ companies, mainly fintechs, exchanges and platforms.
features:
- Document verification and face verification with liveness checks, covering 240+ countries and territories.
- Built-in AML screening against PEP, sanctions, OFAC and other watchlists, plus ongoing monitoring. The API docs also list a separate adverse media check, rule-based transaction monitoring and a crypto address check; these have no price on the pricing page.
- Address, tax number, payment method, source of funds and mobile number checks as pay-as-you-go modules.
- Company check (KYB) covering corporate documents, business address, UBOs and authorised persons.
- Dashboard for customising the verification flow, with multiple workspaces in one account.
- API and hosted form integration, embeddable by iframe and on a custom domain; white labeling on the Enterprise plan.
pricing:
  summary: KYCAID publishes its prices in euros. Single modules start at €0.50 for a document check, €0.25 for face or address verification, €0.50 for AML screening and €10 for a company check, with ongoing KYC monitoring at €25 a month; this module price list adds a fixed €100 monthly service fee. Bundles are €0.75 for Basic KYC (document and face), €0.85 for Standard KYC (adds AML screening) and €1.10 for Advanced KYC (adds address verification), with €50 credit on registration. Non-document checks against government databases cost €0.05 to €0.80 depending on the country. Enterprise pricing is tailored from 10,000 verifications a month.
