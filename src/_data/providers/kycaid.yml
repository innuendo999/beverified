verification_notes:
- 'HQ: operational HQ not confirmed. Only registered offices are on record: KYCAID Limited (no. 11670407, London, incorporated 9 Nov 2018, active) and Compligate Ltd (no. 15376538, London, incorporated 29 Dec 2023, active), which the privacy policy names as the operator (sources 4, 5, 3). Companies House lists only Ukrainian-resident individuals as persons with significant control of both; Compligate''s controlling person changed on 12 Nov 2025 to a single holder of 75% or more (source 14). Ownership by another company not found. Neither G2 nor the about page now gives an HQ.'
- 'Certifications: ISO 27001 and PCI DSS are stated only in the privacy policy (last updated 17 Oct 2025: "Compliance with ... ISO/IEC 27001, SOC 2 Type 2, and PCI DSS standards is continuously verified"). No certificate, certification body or register entry found on 22 Oct 2026. Kept as vendor_stated.'
- 'SOC 2: KYCAID told us (19 Oct 2026) it does not hold SOC 2 yet and expects it in early 2027, although its privacy policy (17 Oct 2025) still lists SOC 2 Type 2; kept out of certifications. Re-check in Q1 2027.'
- 'Mobile SDK: still not in the public docs. The form integration guide covers a direct form URL, iframe embedding and a native WebView on iOS and Android (source 13). "SDKs on request" is vendor-stated (KYCAID, Oct 2026).'
- 'Coverage: 240+ countries and territories is vendor-stated by email (19 Oct 2026); kycaid.com/about-us still says "200 +" on 22 Oct 2026. The docs countries endpoint gives no count. Regions fact has no public source.'
- 'South Africa: KYCAID confirmed by email (21 Oct 2026) that it serves South African customers. The API docs now list South African ID number (SAID) checks that query "official records", with a photo and a name-match variant (source 12). The data source (e.g. Home Affairs) is not named and no price is on the pricing page.'
- 'Adverse media, transaction monitoring, crypto address check: listed in the API docs (sources 9, 10, 11) but not on the pricing page or homepage price list. Price, plan and availability not published. The pricing page AML module still lists PEPs, sanctions, watchlists, OFAC and regulatory lists only.'
- 'Watchlist source: the blacklist databases doc names no data provider; its sample response shows "Open Sanctions Default". "Smaller watchlist database than category leaders" is an editorial comparison, not a measured figure.'
- 'User ratings: G2 (Kycaid ID Verification) and Capterra (Kycaid) show 0 reviews; no Gartner Peer Insights page found. Trustpilot 2.2 from 38 reviews is mostly end users being verified, not buyers.'
- 'Verification speed: about page gives both "20-sec" and "under 11 seconds"; not used.'
