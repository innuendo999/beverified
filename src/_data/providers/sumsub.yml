verification_notes:
- 'Trust Center (source 4) lists 17 certifications and reports, but its View Certificate and Request Report buttons carry no links in the fetched page (likely JavaScript or a request form). ISO/IEC 27001, SOC 2 Type 2, PCI DSS and ETSI/eIDAS stay vendor-stated; no certification body register entry for ISO/IEC 27001 was found. ISO/IEC TS 29003 and ISO/IEC 29115 are now confirmed on the ACCS register (source 13). The iBeta entries are under vendor name Raritex Trade, product Sumsub Liveness.'
- 'Free trial: the pricing FAQ (source 1) states a 14-day trial with 50 free checks but does not say which plans it applies to. Sign-up buttons sit under Basic and Compliance.'
- 'G2 (source 10) showed 4.6 from 130 reviews on 2026-10-22. Review themes could not be read; kept as general statements without counts. The Capterra URL tried (capterra.com/p/180836) opened a different product; no Capterra rating added.'
- 'Capabilities check: features now state the plan for AML screening (Compliance), and for KYB, non-document checks, transaction monitoring and fraud prevention (custom plan), matching source 1 and the capabilities block. The pricing page lists AML screening only under Compliance; the custom plan lists ongoing monitoring but does not name AML screening, so "Compliance plan and above" for sanctions_pep is an inference. Adverse media is on the AML screening page (source 9) without a plan label.'
