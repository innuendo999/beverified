faq:
- q: How much does Sumsub cost?
  a: Sumsub's Basic plan is $1.35 per verification with a $149/month minimum; Compliance is $1.85 per verification with a $299/month minimum and adds AML screening and ongoing monitoring. Enterprise pricing is custom. Both published tiers include a 14-day free trial.
- q: Does Sumsub support KYB?
  a: Yes. Sumsub includes KYB and UBO verification for business onboarding alongside its individual identity-verification tools.
- q: Is Sumsub good for crypto businesses?
  a: Yes. Crypto exchanges including Binance, Bybit and Wirex use Sumsub for its combined KYC, AML and transaction-monitoring capabilities.
- q: How does Sumsub compare to Jumio?
  a: Sumsub publishes its pricing and bundles KYC, KYB, and monitoring in one platform; Jumio has greater enterprise scale but requires a sales call for pricing.
- q: What is the best alternative to Sumsub?
  a: Trulioo is the strongest alternative if non-documentary, database-driven proofing matters more than an all-in-one suite. Jumio is the closest match on enterprise scale.
- q: Who are Sumsub's main competitors?
  a: Sumsub competes with Jumio, Onfido, and Trulioo, differentiating mainly through published pricing and a unified KYC/KYB/monitoring platform.
