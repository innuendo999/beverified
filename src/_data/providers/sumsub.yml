faq:
- q: How much does Sumsub cost?
  a: Sumsub's Basic plan is $1.35 per verification with a $149 monthly minimum. Compliance is $1.85 per verification with a $299 monthly minimum and adds AML screening, ongoing monitoring and address checks. A custom plan with KYB, non-document checks and transaction monitoring is quoted on request. A 14-day free trial includes 50 checks.
- q: Does Sumsub support KYB?
  a: Yes. Sumsub offers business verification, including UBO checks, in its custom plan alongside its individual identity-verification tools.
- q: Is Sumsub good for crypto businesses?
  a: Sumsub is widely used in crypto. Bybit has used it since 2021 and Wirex is listed as a customer, and its plans include Travel Rule support.
- q: Has Sumsub's liveness check been independently tested?
  a: Yes. iBeta lists Sumsub Liveness as passing ISO/IEC 30107-3 presentation attack detection testing at Level 1 (Feb 2025), Level 2 (Mar 2025) and Level 3 (Sep 2026).
- q: What is the best alternative to Sumsub?
  a: Trulioo is the strongest alternative if non-documentary, database-driven proofing matters more than an all-in-one suite. Jumio is the closest match on enterprise scale.
- q: Who are Sumsub's main competitors?
  a: Sumsub competes with Jumio, Onfido, and Trulioo, differentiating mainly through published pricing and a unified KYC/KYB/monitoring platform.
