faq:
- q: How much does Sumsub cost?
  a: Sumsub's Basic plan is $1.35 per verification with a $149 monthly minimum. Compliance is $1.85 per verification with a $299 monthly minimum and adds AML screening, ongoing monitoring and address checks. A custom plan with KYB, non-document checks and transaction monitoring is quoted on request. A 14-day free trial includes 50 checks.
- q: Does Sumsub support KYB?
  a: Yes. Sumsub offers business verification, including UBO checks, in its custom plan alongside its individual identity-verification tools.
- q: Is Sumsub good for crypto businesses?
  a: Sumsub is widely used in crypto. Bybit has used it since 2021 and Wirex is listed as a customer. Travel Rule support is on every published plan, and Sumsub says its Travel Rule network connects more than 2,300 virtual asset service providers across GTR, CODE and Sygna.
- q: Has Sumsub's liveness check been independently tested?
  a: Yes. iBeta lists Sumsub Liveness as passing ISO/IEC 30107-3 presentation attack detection testing at Level 1 (Feb 2025), Level 2 (Mar 2025) and Level 3 (Sep 2026).
- q: Has Sumsub had a security incident?
  a: Yes. On 4 February 2026 Sumsub disclosed that an attacker entered a support ticketing system through a malicious attachment in July 2024 and was found during a security review in January 2026. Sumsub says names, and for some records emails or phone numbers, from a limited number of customer accounts may have been exposed, and that biometric data, ID document images and payment details were not accessed.
- q: "What are the best alternatives to Sumsub?"
  a: "The best Sumsub alternatives depend on what you need instead. Veriff has a lower monthly minimum on its published plans, iDenfy lets you pay only for approved checks, and Shufti Pro offers a free plan and on-premise deployment. For data-led KYB, look at Trulioo; for published module prices with AML screening and transaction monitoring on every plan, KYCAID; for enterprise volumes with separate AML, monitoring and video products, Jumio."
- q: Who are Sumsub's main competitors?
  a: Sumsub competes with Jumio, Onfido (now Entrust) and Trulioo, differentiating mainly through published pricing and a unified KYC/KYB/monitoring platform.
