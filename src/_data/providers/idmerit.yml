verdict: 'IDMERIT''s pitch is straightforward: identity verification across 180+ countries and territories from 440+ data sources, with a starting price of $0.10 per user per month on its Capterra listing. IDMERIT itself does not publish a rate card and quotes by country, module and volume. It is smaller than venture-backed rivals, which shows up in brand recognition and depth of add-on tooling, but for teams that need broad, affordable document and data-source checks it is worth a quote.'
what_is:
- IDMERIT is an identity-verification and fraud-prevention API provider headquartered in San Diego, California, and led by CEO Tony Raval. It says it has sourced identity data for over a decade and is an Inc. 5000 company. Its services include global identity data checks (IDMkyc), ID scanning with facial biometrics (IDMscan), AML screening (IDMaml), business verification (IDMkyb), device fingerprinting, live agent verification and telecom and utility data checks, serving banks, fintechs and e-commerce platforms.
features:
- Identity verification across 180+ countries and territories with 440+ underlying data sources.
- Support for 580+ ID types with document scanning and validation in under 30 seconds.
- Biometric face matching and live agent verification (IDMlive).
- AML, KYC and PEP/OFAC screening against 13M+ red-flagged profiles.
- Business verification covering 330M+ businesses in 140+ jurisdictions.
- Vendor-stated GDPR, HIPAA and CCPA compliance.
pricing:
