verification_notes:
- 'Founding year and HQ conflict across sources. IDMERIT states no founding year (Our Story says it has sourced identity data "for over a decade"); G2 says 2014 and Carlsbad, CA (source 5); GetApp says 2016. HQ San Diego per Our Story (source 2) and the 2020 ISO press release (source 6). The contact page gives no address. No company register entry found. Founded left as Not publicly disclosed.'
- 'Coverage figures differ on IDMERIT''s own pages: homepage says 180+ countries and 440+ data sources (source 1); Our Story says over 90 countries and the FAQ says over 600 databases in over 90 countries (sources 2, 3). Homepage figures used. Rechecked 2026-10-22, unchanged.'
- 'The $0.10 per user per month figure appears only on the Capterra/GetApp listing (source 4), not on idmerit.com; idmerit.com/pricing returned an error again on 2026-10-22. The unit (per user per month) is unclear for an identity check product.'
- 'SOC 2 Type 2 and ISO 27001 are badges on the homepage, which says data access policies follow "ISO 27001 and SOC2 requirements" (source 1). The only public certification evidence is an April 2020 press release on ISO/IEC 27001:2013 from an unnamed ANAB-accredited body (source 6); no current certificate, certification body or SOC 2 report found. Both stay vendor_stated.'
