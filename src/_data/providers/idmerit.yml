faq:
- q: How much does IDMERIT cost?
  a: IDMERIT's Basic plan starts at $0.10 per user per month for core identity verification, one of the lowest published rates in this category. AML/KYC and Video KYC modules are priced on higher tiers.
- q: How many countries does IDMERIT cover?
  a: IDMERIT verifies identities across 180+ countries using more than 440 data sources and support for 580+ document types.
- q: Is IDMERIT venture-funded?
  a: No. IDMERIT has not raised outside funding; it has grown as a self-funded, profitable business since its 2014 founding.
- q: Does IDMERIT support AML screening?
  a: Yes. IDMERIT offers AML, KYC, and PEP/OFAC screening alongside its core identity-verification checks.
- q: What is the best alternative to IDMERIT?
  a: Sumsub is the best alternative if you want a more established, published-pricing all-in-one platform. Trulioo is the closest fit for broader data-layer proofing at enterprise scale.
- q: Who are IDMERIT's main competitors?
  a: IDMERIT competes with Trulioo and Sumsub mainly on price. Its published per-user rate is the lowest in this category.
