verdict: 'IDMERIT''s pitch is straightforward: identity verification across 180+ countries starting at $0.10 per user per month, the lowest published rate in this batch. It''s self-funded and smaller than venture-backed rivals, which shows up in brand recognition and depth of add-on tooling, but for teams that just need broad, affordable document and data-source checks, the price is hard to beat.'
what_is:
- IDMERIT is an identity-verification and fraud-prevention API provider founded in 2014 and headquartered in Carlsbad, California, by Tony Raval. Unlike most venture-backed competitors in this category, IDMERIT has raised no outside funding, building its business instead on serving banks, fintechs, and e-commerce platforms that need affordable identity checks across a wide footprint of countries and data sources.
features:
- Identity verification across 180+ countries with 440+ underlying data sources.
- Support for 580+ document types with OCR and barcode recognition.
- Biometric checks with liveness detection and multi-factor authentication.
- AML, KYC, and PEP/OFAC screening bundled with core identity checks.
- Business verification and Video KYC for onboarding.
- GDPR, HIPAA, and CCPA-compliant data handling.
