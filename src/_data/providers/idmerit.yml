faq:
- q: How much does IDMERIT cost?
  a: Pricing is not published on IDMERIT's site; it quotes by country, module and volume. Capterra lists a Basic plan starting at $0.10 per user per month, but that is a marketplace listing, not an official rate card.
- q: How many countries does IDMERIT cover?
  a: IDMERIT says it verifies identities across 180+ countries and territories using 440+ data sources, with support for 580+ ID types.
- q: Does IDMERIT offer a free trial?
  a: Not a standard trial. Its FAQ describes free testing through a sandbox with sample data or a manually checked sample of about 100 rows; larger multi-country tests carry a flat fee.
- q: Does IDMERIT support AML screening?
  a: Yes. IDMERIT offers AML, KYC, and PEP/OFAC screening (IDMaml) alongside its core identity-verification checks.
- q: What is the best alternative to IDMERIT?
  a: Sumsub is the best alternative if you want a more established all-in-one platform with a published rate card. Trulioo is the closest fit for broader data-layer proofing at enterprise scale.
- q: Who are IDMERIT's main competitors?
  a: IDMERIT competes with Trulioo and Sumsub, mainly on price and data-source coverage.
