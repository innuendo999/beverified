  by_profile:
  - Banks, governments and large platforms that need data to stay in their own infrastructure are FaceTec's core fit.
  - Identity vendors that build their own KYC flow can license FaceTec as the liveness and face matching layer.
  - Small teams that want a hosted service with self-serve prices will find simpler options elsewhere.
faq:
- q: How much does FaceTec cost?
  a: FaceTec does not publish prices. It bills monthly for 3D Liveness usage, per check or per user depending on the account, with a minimum monthly commitment, and quotes on request. Photo ID scans are included at no charge. Firms that cannot meet the minimum can buy through FaceTec's distribution partners, which have no monthly minimum, per FaceTec.
- q: Is FaceTec's liveness independently tested?
  a: Yes. iBeta's public list shows FaceTec ZoOm at Level 1 (August 2018) and Level 2 (February 2019). In late 2025, BixeLab and Ingenium Biometric Laboratories tested FaceTec against injection attacks and their letters report no successful attack; Ingenium calls its level equivalent to CEN/TS 18099 High. BixeLab's letter also confirms a PAD Level 3 evaluation in 2025, with no successful attack in 100 high-effort mask attacks.
- q: Does FaceTec store my users' data?
  a: No. FaceTec sells device SDKs and a Server SDK that you run on your own servers or cloud, and it says no end-user biometric data or personal data is sent to FaceTec. You are responsible for hosting, storing and securing that data.
- q: Does FaceTec check identity documents?
  a: Yes, as part of Photo ID Match. It matches the face to the photo on the ID and reads the document with OCR, barcode and NFC scanning. FaceTec does not publish a country or document type count, and it does not sell AML screening.
- q: Is FaceTec SOC 2 or ISO 27001 certified?
  a: We found no ISO/IEC 27001 or SOC 2 claim on FaceTec's site. Because the software runs on your servers, your own security controls cover most of the data handling.
- q: What is the best alternative to FaceTec?
  a: iProov is the closest alternative if you want face verification run as a hosted service with a FIDO certificate. Incode and Sumsub suit teams that want liveness inside a full identity platform.
