verdict: 'FaceTec is a liveness and face matching provider for teams that can host it themselves, so no user data goes to FaceTec; its 3D Liveness holds iBeta and BixeLab lab letters. Prices are not published, and there is a monthly minimum. You host, scale and update the servers yourself, and it makes no ISO/IEC 27001 or SOC 2 claim.'
what_is:
- FaceTec, Inc. is a US biometrics software company. Its press releases are datelined Summerlin, Nevada, and a third-party software listing gives 2013 as its founding year. FaceTec says its software runs over 3.7 billion 3D Liveness checks a year.
- FaceTec sells 3D Liveness, 3D face matching, Photo ID Match with OCR, barcode and NFC scanning, and age checks as device SDKs plus a Server SDK. The customer runs the Server SDK on its own servers or cloud, so FaceTec does not receive end-user biometric data or personal data. FaceTec also runs a $600,000 Spoof Bounty Program.
features:
- 3D Liveness from a short video selfie, with device SDKs for iOS, Android and the browser.
- 3D face matching for onboarding and re-verification; FaceTec states a false acceptance rate of 1 in 125 million at under 1% false rejection.
- Photo ID Match that matches the face to the ID photo, with OCR, barcode and NFC scanning, included for customers at no extra charge per FaceTec.
- Age checks from the face, returned as age bands.
- Server SDK that the customer hosts, so biometric data and personal data stay on the customer's own servers or cloud.
- $600,000 Spoof Bounty Program for anyone who can bypass its liveness.
pricing:
