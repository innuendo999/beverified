pros:
- iBeta Level 1 and 2 letters, a BixeLab PAD Level 3 letter, and BixeLab and Ingenium injection attack tests from late 2025 with no successful attack
- Runs on your own servers, so no end-user biometric or personal data goes to FaceTec
- Photo ID scanning with OCR, barcode and NFC is included at no extra charge, per FaceTec
cons:
- No published prices, and a minimum monthly commitment
- You host, scale and patch the Server SDK yourself, and integrators say the device SDK must be updated every 90 days or it stops working
- No ISO/IEC 27001 or SOC 2 claim, and no published support hours
