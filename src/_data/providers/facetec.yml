verification_notes:
- 'link.type set to none: no commercial relationship with FaceTec is recorded.'
- 'iBeta: the full list on iBeta''s page shows FaceTec ZoOm v6.6.0 Level 1 (20 Aug 2018) and v6.9.11 Level 2 (7 Feb 2019), checked 25 Nov 2026. No newer iBeta entry.'
- 'PAD Level 3: BixeLab letter opened by the owner on 25 Nov 2026 (issued to FaceTec, Inc., report 27 Oct 2025, ISO/IEC 30107-3 PAD Level 3, 100 Level C attacks with 0 classification errors, 1 bona fide retry). Its last sentence says "to a level 2 sophistication", which contradicts its title and body; read as a typo in the letter, Level 3 recorded as confirmed. BixeLab is not on iBeta''s list, so program is pad_other. Ingenium Level 3 letter not opened. Fraud defense was already capped at 5, so the score does not change.'
- 'Injection: BixeLab IAD letter opened (issued to FaceTec, test report 27 Oct 2025, SDK Mobile v9.7.83 and Web v9.7.76, 48 injection attacks rejected; BixeLab says the outcome is not NVLAP-accredited). Ingenium evaluation statement opened (Level 2 IAD, consistent with CEN TS 18099 High, 20 Nov 2025, PASS). Both lab letters are published on facetec.com, treated as confirmed like the Didit iBeta letter.'
- 'Praetorian "Level 4" bypass and reverse engineering test (Aug to Sep 2025) is a security assessment, not a liveness standard; mentioned in the testing report, not scored.'
- 'HQ: press releases are datelined Summerlin, Nevada; the developers page metadata points to Orlando, Florida and FitGap gives Los Angeles. Summerlin used, labelled as the dateline.'
- 'Founded: 2013 from FitGap only (third party). FaceTec''s own pages do not state a year. Used for the 5-year track record point.'
- 'SDK update policy: Signicat''s FaceTec guide says the SDK must be updated every 90 days or the FaceTec service stops working, citing dev.facetec.com/updating. Used in the cons.'
- 'Coverage: no country or document count published, so the Coverage criterion is not scored and its weight is shared out.'
- 'Logo tile and wordmark from the owner''s image (2026-11-25).'
- 'Incidents: none found (searched 25 Nov 2026). A 2023 BIPA suit naming FaceTec was dismissed; private BIPA suits without a breach are not tracked.'
- 'Ondato''s security page describes a third-party facial technology with "NIST Level 1 & 2 PAD testing" and a "$100,000 Spoof Bounty Program", close to FaceTec''s wording, but Ondato does not name its supplier. Not stated on either review.'
