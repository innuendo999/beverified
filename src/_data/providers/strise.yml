verdict: Strise builds AI to automate routine AML compliance work, using a knowledge graph that maps companies, directors, owners, sanctions and adverse media. It is an Oslo-based company used by large Nordic banks such as Nordea, and it says one payments customer automated 80% of routine cases. It is smaller than most AML vendors it competes with, having raised a $10.8M Series A in 2023, and its customer base is mostly Nordic.
what_is:
- Strise is an AML compliance company founded in 2016 in Norway by Marit Rødevand, Patrick Skjennum and Sigve Søråsen, and launched commercially in 2019. Strise AS is registered in Oslo. It automates KYB and KYC onboarding, screening, ongoing monitoring, UBO discovery and risk scoring, and uses a knowledge graph of corporate data to cut manual compliance work. Customers named on its site include Nordea, Storebrand, SpareBank 1, Vipps MobilePay, BDO and British Land.
features:
- AI automation of routine AML cases, so analysts handle judgement-based reviews.
- KYB and KYC onboarding, including UBO discovery.
- Sanctions, PEP and adverse-media screening.
- Ongoing monitoring (ongoing due diligence) and remediation.
- Knowledge graph linking entities, directors, ownership, sanctions and adverse media.
- ID verification, document analysis and risk scoring modules.
