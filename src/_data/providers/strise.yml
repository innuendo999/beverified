pros:
- Automation of routine AML cases, with vendor case figures such as 80% of routine cases automated
- Knowledge graph that maps ownership, directors, sanctions and adverse media in one view
- Used by large Nordic banks and insurers, including Nordea and Storebrand
cons:
- Smaller company than most AML competitors, with a $10.8M Series A in 2023
- Customer base is mostly Nordic; reach outside the Nordics and UK is less proven
