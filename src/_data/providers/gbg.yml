faq:
- q: How much does GBG cost?
  a: GBG does not publish pricing; its identity and location-intelligence products are licensed based on volume and module selection.
- q: Is GBG a public company?
  a: Yes. GBG plc is listed on the London Stock Exchange (LSE:GBG) and is a constituent of the FTSE 250.
- q: What is Loqate?
  a: Loqate is GBG's location-intelligence product for address verification, acquired to extend its identity-data platform.
- q: What companies has GBG acquired?
  a: GBG has acquired IDology and Acuant in the US and Cloudcheck in New Zealand, among others, to build out its identity-data network.
- q: What is the best alternative to GBG?
  a: Trulioo is the best alternative for comparable data-layer proofing. Sumsub is the closest fit for published pricing and a simpler unified platform.
- q: Who are GBG's main competitors?
  a: GBG competes with Trulioo, Sumsub, and KYC360, differentiating through its data network scale and unique location-intelligence layer.
