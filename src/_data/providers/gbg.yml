verification_notes:
- '"280+ data sources", "190 countries" and "4.4B+ people" not found on current GBG pages. Replaced with GBG Go figures (110+ modules, 195+ countries) and the data-verification page figure (identity data in 50 countries).'
- 'Trust Network "400+ businesses across 80+ countries" replaced by the current "1,000+ brands" (GBG Go page); no country count published.'
- GBG Go page is inconsistent (headline 110+ modules, meta description 80+); the body figure is used.
- FTSE 250 membership ended at the 21 Sep 2026 index change (BusinessCloud, 3 Sep 2026). Not confirmed against the FTSE Russell notice itself.
- Founding year 1989 is the Companies House incorporation date (as Telme Group plc); Wikipedia says the business started as Phonelink Data in Sep 1989.
- Cloudcheck acquisition not confirmed on any page opened; removed from the acquisitions list.
- Revenue £285.0m FY26 (to 31 Mar 2026) replaces the old "£282.7M in 2025", which was the FY25 figure. FY26 also included a £73.1m non-cash impairment (statutory operating loss).
- ISO/IEC 27001, SOC 2 Type 2, PCI DSS, Cyber Essentials Plus and FedRAMP Moderate are from GBG's Trust Centre only; certificates and FedRAMP marketplace entry not opened.
- G2 lists GBG Go with a single review (4.0); too few for user themes, which are kept as general statements.
