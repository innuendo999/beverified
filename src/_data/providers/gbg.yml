verification_notes:
- GBG Go page is still inconsistent (body 110+ modules, meta description 80+); the body figure is used (source 5).
- ISO/IEC 27001:2022, SOC 2 Type 2, PCI DSS v4.0.1 and Cyber Essentials Plus come from GBG's Trust Centre only (source 6); certificates and the IASME register were not opened. The Trust Centre also lists ISO/IEC 20243:2024, not added.
- FedRAMP Moderate is held by Acuant, Inc. for COFRS (source 14); it does not cover GBG Go as a whole.
- User ratings are thin. G2 lists GBG Go with one review (4.0). Gartner Peer Insights shows no GBG reviews. Capterra lists "GBG Digital Risk Management Intelligence Platform" (1 review, 3.0), which does not clearly match GBG Go, so it is not used.
- Loqate publishes EUR and other pay-as-you-go prices besides those recorded; only the GBP Address Verify range is recorded.
