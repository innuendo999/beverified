faq:
- q: How much does GBG cost?
  a: GBG does not publish pricing for its identity and fraud products; they are licensed based on volume and module selection. Loqate address lookups are sold in published pay-as-you-go credit packs from £50, excluding VAT.
- q: Is GBG a public company?
  a: Yes. GB Group plc is listed on the London Stock Exchange (LSE:GBG). It moved from AIM to the main market in October 2025 and left the FTSE 250 index on 21 September 2026.
- q: What is Loqate?
  a: Loqate is GBG's location-intelligence product for address verification. It came from GBG's 2017 acquisition of PCA Predict.
- q: What companies has GBG acquired?
  a: GBG bought PCA Predict in 2017, IDology in the US in 2019, Acuant in the US in 2021 and Cloudcheck in New Zealand in 2022, among others, to build out its identity-data network.
- q: Is GBG certified under the UK trust framework?
  a: Yes. The UK government register lists five GB Group PLC services (GBG Go, ID3global, Identify, IDscan Enterprise and oZone FYQ2), certified on 14 September 2026 and expiring on 27 September 2029.
- q: What is the best alternative to GBG?
  a: Trulioo is the best alternative for comparable data-layer proofing. Sumsub is the closest fit for published pricing and a simpler unified platform.
- q: Who are GBG's main competitors?
  a: GBG competes with Trulioo, Sumsub, and KYC360, differentiating through its data network scale and its location-intelligence layer.
