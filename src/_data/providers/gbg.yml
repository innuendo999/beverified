verdict: GBG is the rare publicly traded company in this category (LSE:GBG, on the London main market since October 2025). Its GBG Go platform offers 110+ identity, fraud and risk modules across 195+ countries, with a location-intelligence layer from Loqate. It's less about slick no-code UX and more about deep data infrastructure, grown through a string of acquisitions (PCA Predict, IDology, Acuant). Revenue grew 3.2% at constant currency in FY26, and the shares left the FTSE 250 in September 2026.
what_is:
- GBG (GB Group plc) is a publicly traded identity, fraud and location-intelligence company incorporated in 1989 and registered in Chester, UK, led by CEO Dev Dhiman. It has more than 1,100 staff across 15 countries and reported revenue of £285.0m for the year to 31 March 2026. It combines identity data verification, document and biometric verification, fraud signals and location intelligence (via Loqate) in its GBG Go platform, built up through acquisitions including PCA Predict (2017), IDology (2019) and Acuant (2021).
features:
- Identity data verification, with identity data sourced in 50 countries.
- Document authentication and biometric verification alongside identity checks.
- Location intelligence via Loqate for address verification.
- Fraud signals, including application fraud, identity takeover and mule detection.
- 'GBG Trust Network: a cross-industry consortium powered by more than 1,000 brands.'
- 110+ identity, fraud and risk modules within GBG Go, including GBG Identity Score.
