verdict: GBG is the rare publicly traded company in this category (LSE:GBG, FTSE 250), built around a genuinely massive data network — 280+ sources across 190 countries — plus a unique location-intelligence layer via its Loqate acquisition. It's less about slick no-code UX and more about deep data infrastructure, grown through a string of acquisitions (IDology, Acuant, Cloudcheck).
what_is:
- GBG is a publicly traded identity-data and location-intelligence company founded in 1989 and headquartered in Chester, UK, led by CEO Dev Dhiman, with roughly 1,100 employees and revenue of £282.7M in 2025. It combines identity verification, document verification, and location intelligence (via its Loqate product) across a network of 280+ data sources and 190 countries, expanded through acquisitions including IDology, Acuant, and Cloudcheck.
features:
- Identity data matching and verification across 280+ data sources.
- Document verification alongside identity checks.
- Location intelligence via Loqate for address verification.
- Synthetic-identity detection.
- GBG Trust Network — a consortium of 400+ businesses across 80+ countries.
- GBG Identity Score and 80+ modules within GBG Go.
