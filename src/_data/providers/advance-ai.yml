verdict: Advance.AI focuses on emerging-market identity verification, KYC/KYB, AML and credit scoring, with its strongest footprint in Southeast Asia. It was founded in Singapore in 2016 and is part of Singapore-headquartered Advance Intelligence Group. It does not publish coverage figures, customer counts or prices, so buyers outside its core markets should confirm country support before committing.
what_is:
- Advance.AI was founded in Singapore in August 2016 and is part of Singapore-headquartered Advance Intelligence Group, whose backers include SoftBank Vision Fund 2, Warburg Pincus, Northstar and EDBI. It launched in Singapore, China, Indonesia, India, Vietnam and the Philippines and later expanded into Mexico and Nigeria. Its AdvanGuard suite covers identity and document verification, face authentication with liveness detection and know-your-business checks, alongside AML, compliance and credit-scoring products for lenders.
features:
- Identity and document verification (AdvanGuard suite).
- Face authentication with liveness detection.
- Know Your Business (KYB) checks.
- Configurable end-to-end eKYC workflows.
- AML, compliance and risk management solutions.
- Credit scoring for lenders, such as its Facial Multi-loan Score.
