- 'Founding year (Aug 2016, Singapore) and group HQ are from the vendor about page only; no registry entry opened.'
- 'Homepage headline statistics render as "0" placeholders, so no coverage or customer figures are used. The credit-scoring page says "trusted by over 500 enterprises" but is undated; not used as a fact.'
- 'Credit scoring is not on the current homepage; the Facial Multi-loan Score page is undated. Kept as a product but re-check whether it is still sold.'
- '"Device intelligence" feature not found on current vendor pages. Removed.'
- 'Homepage shows ISO/IEC 27001, a privacy information management certificate, a BSI certificate and iBeta Level 1 and 2 badges as images; no certificate or iBeta letter opened (Advance.AI not listed on the iBeta page checked).'
- 'G2 lists Advance.AI under AI Consulting Services with no visible rating or review count; no user ratings recorded and the unverified review themes were removed.'
