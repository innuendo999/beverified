verification_notes:
- 'Founding (Aug 2016, Singapore) is from the vendor about page only. No official ACRA record opened; a third-party registry mirror could not be tied to the ADVANCE.AI brand. Fintech News Singapore (May 2023) dates the parent group to 2016.'
- 'Parent is still named Advance Intelligence Group on its own site (it shortens to "Advance"; no rebrand to "ADVANCE Group" found). Group site lists ADVANCE.AI, Atome Financial and Ginee. Investors in what_is match Bloomberg (May 2023: Warburg Pincus, Northstar; 2021 Series D led by SoftBank Vision Fund 2); EDBI is from the vendor page only.'
- 'No coverage, customer or check figures used: homepage statistics still render as "0" placeholders, and the undated credit-scoring page says "trusted by over 500 enterprises".'
- 'Credit scoring is not in the homepage product menu; the Facial Multi-loan Score page still loads but is undated and has no demo link. Confirm it is still sold, since a pro and the tagline rely on it.'
- 'ISO/IEC 27001:2013 (Feb 2020, Indonesia) is vendor-stated (about page timeline, homepage badge images). The Security & Compliance page lists no certificates; no certificate or register entry found, so current status is unknown.'
- 'No user ratings: G2 lists Advance.AI only under AI Consulting Services with no rating; Capterra and Gartner Peer Insights pages did not load.'
