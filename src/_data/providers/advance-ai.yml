faq:
- q: How much does Advance.AI cost?
  a: Advance.AI does not publish prices. Its pricing page offers usage-based, prepaid capacity and license-period billing, with rates on request and free sign-up to test.
- q: Where is Advance.AI based?
  a: Advance.AI was founded in Singapore in 2016 and is part of Singapore-headquartered Advance Intelligence Group.
- q: What markets does Advance.AI focus on?
  a: Advance.AI focuses on Southeast Asia. It launched in Singapore, China, Indonesia, India, Vietnam and the Philippines and later expanded into Mexico and Nigeria.
- q: Does Advance.AI offer credit-risk assessment?
  a: Yes. Advance.AI offers credit-scoring products for lenders, such as its Facial Multi-loan Score, alongside identity verification.
- q: What is the best alternative to Advance.AI?
  a: IDMERIT is the best alternative for broader multi-country coverage. Trulioo is the closest fit for global data-layer proofing.
- q: Who are Advance.AI's main competitors?
  a: Advance.AI competes with IDMERIT, Trulioo, and Shufti Pro, differentiating through its Southeast Asia/APAC emerging-market focus.
