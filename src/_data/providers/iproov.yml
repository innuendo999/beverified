  by_profile:
  - Banks and governments that already run document checks and want strong face verification on top are iProov's core fit.
  - Large employers can use its workforce suite for hiring and help desk account recovery.
  - Small teams that need a full KYC flow with published prices will find better fits elsewhere.
faq:
- q: How much does iProov cost?
  a: iProov does not publish prices and quotes on request. Its UK government G-Cloud listing shows £0.07 to £2.00 per transaction for public sector buyers, and its G-Cloud 14 pricing document lists an overage rate of £1.70 per biometric transaction.
- q: Is iProov's liveness independently tested?
  a: Yes, with older results. iBeta's published list shows Level 1 and Level 2 letters for iProov from 2020. iProov also holds a FIDO Face Verification certificate from Ingenium, issued in July 2024 and valid to January 2028. iProov says Ingenium tested Dynamic Liveness against injection attacks at CEN/TS 18099 High in 2026, but the report is not published.
- q: Does iProov check identity documents?
  a: iProov matches the user's face to the photo on their ID document, but it does not sell a full document verification and AML product. Teams usually pair it with a document verification vendor.
- q: Is iProov on the UK DVS register?
  a: Yes. iProov ID is certified on the UK DVS register in the Holder role, under trust framework version 0.4 gamma, from 16 October 2025 to 16 October 2028. The register entry lists no supplementary codes such as Right to Work.
- q: What is the difference between Dynamic Liveness and Express Liveness?
  a: Dynamic Liveness lights the user's face with a short sequence of screen colours to check the face is real and present, and is the version iProov has certified. Express Liveness is passive and needs no extra step from the user.
- q: What is the best alternative to iProov?
  a: Veriff is the closest alternative for certified face matching with published prices. Incode and Sumsub suit teams that want liveness inside a full identity platform.
