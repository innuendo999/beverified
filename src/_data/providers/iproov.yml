pros:
- FIDO Face Verification certificate (July 2024, valid to January 2028) and iBeta Level 2 letters for its liveness
- iProov ID is on the UK DVS register, and its users include the UK NHS login and large banks such as UBS and ING
- Its injection attack test at CEN/TS 18099 High (Ingenium Level 4, February 2026) is one of the few named injection results, per iProov
cons:
- A liveness and face verification specialist: document checks, AML screening and case management need other vendors
- No published prices; G-Cloud public sector listings are the only figures
- Its iBeta letters date from 2020, and the injection test report is not published
