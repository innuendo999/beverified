verdict: 'iProov is a liveness provider for banks, governments and large platforms that need strong face verification inside an identity flow they already run; its Dynamic Liveness holds a FIDO certificate and iProov ID is on the UK DVS register. Prices are quoted. It sells no document checks or AML screening, and its iBeta letters date from 2020.'
what_is:
- iProov is a London biometrics company founded in 2011 by its CEO, Andrew Bud, and is privately owned. In January 2022 it raised $70 million from Sumeru Partners. Its about page names UBS, ING, Rabobank, the UK NHS login and government programmes in Singapore and Australia among its users.
- iProov sells face verification for remote onboarding, authentication, account recovery and workforce access. Dynamic Liveness checks a user against the photo on their ID or an earlier enrolment, using a sequence of screen colours to show the face is real and present; Express Liveness is a passive version. iProov runs its own Security Operations Center (iSOC) that monitors attacks and updates its defences.
features:
- Dynamic Liveness (active, screen colour sequence) and Express Liveness (passive) face verification.
- Face matching against an ID document photo for remote onboarding, or against an earlier enrolment for authentication and account recovery.
- iProov ID, a reusable identity service certified on the UK DVS register as a Holder.
- Workforce suite for hiring, help desk account recovery and MFA, and Verified Meetings for video calls.
- SDKs for iOS, Android and web, plus Flutter, React Native and MAUI, with a REST API and the iPortal admin console.
- Security Operations Center (iSOC) with threat monitoring and red team testing.
