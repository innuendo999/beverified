verification_notes:
- Founded 2019 not confirmed; About page says operating since 2020. Shown as Operating since 2020.
- HQ Cape Town not confirmed; vendor says remote first and lists Johannesburg, Cape Town and London offices.
- October 2025 UK launch not confirmed on any page opened (news archive only shows 2026 items; web search budget ran out). Replaced with Companies House incorporation of RelyComply (UK) Limited on 3 Jul 2025.
- Explainable AI, bias mitigation and emerging-market framing do not appear on the homepage or the AI module page; removed from tagline, verdict, pros and FAQ.
- James Saunders is co-founder and CTO, not sole founder; other founders not named on the site.
- Cyber incident (Sep 2026): categories and number of affected individuals not disclosed; forensic investigation ongoing at time of notice. Re-check before release.
- Homepage shows a SANCERT ISO logo without naming the standard; no register entry opened.
- G2 page could not be opened and no review counts were verifiable; praise and criticize removed.
