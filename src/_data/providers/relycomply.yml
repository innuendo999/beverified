verdict: RelyComply unifies KYC, KYB and AML in one platform, with identity verification, screening, transaction monitoring, case management and goAML regulatory reporting. It is strongest for South African institutions working under FICA. It set up a UK company in July 2025 and announced its UK launch in October 2025, with a London office. Buyers should note that the brand is still young outside Africa and that RelyComply disclosed a cyber incident in September 2026 affecting systems that hold customer data; the forensic investigation was still ongoing at the latest update found (22 September 2026).
what_is:
- RelyComply is an anti-financial-crime platform that says it has been operating since 2020. It is led by CEO Bradley Elliott and co-founder and CTO James Saunders, describes itself as remote first, and lists offices in Johannesburg, Cape Town and London; its UK company, RelyComply (UK) Limited, was incorporated in July 2025, and it announced its UK launch in October 2025. The platform covers KYC (IDV, document and selfie checks, screening, risk assessment, adverse media), KYB, AML transaction monitoring and screening, case management and goAML reporting. Named clients include Standard Bank and SnapScan. In September 2026 it disclosed that an attacker exploited a zero-day flaw in a third-party application to reach some systems holding customer data; it rebuilt the affected environment and reported the incident to South Africa's Information Regulator. SA Home Loans, EasyEquities, Satrix and Peregrine Capital told their customers that their data may have been accessed, and a group calling itself Dire Wolf claimed the attack, which has not been verified. A client notice updated on 22 September 2026 said the forensic investigation was still ongoing; RelyComply had published no further update by 22 October 2026.
features:
- Unified KYC, AML, and KYB platform.
- Identity verification with selfie-to-ID face matching, liveness checks and daily re-screening against watchlists and adverse media.
- Business verification, entity screening and business risk assessments for KYB.
- Machine-learning analytics aimed at reducing false positives from manual review.
- Real-time transaction monitoring and transaction screening.
- Case management and goAML regulatory reporting.
