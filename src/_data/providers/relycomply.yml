verdict: RelyComply unifies KYC, KYB, and AML in one platform built around explainable AI — designed to make false-positive reductions auditable rather than a black box — with particular attention to bias mitigation for emerging markets. Its October 2025 UK launch extends South African roots into a new region, though the brand is still young outside Africa.
what_is:
- RelyComply is an anti-financial-crime platform founded in 2019 and headquartered in Cape Town, South Africa, founded by James Saunders and led by CEO Bradley Elliott. It provides a unified KYC/AML/KYB platform with perpetual KYC, region-based government ID checks, and explainable AI for bias mitigation, expanding into the UK market in October 2025.
features:
- Unified KYC, AML, and KYB platform.
- Enhanced identity verification with perpetual (ongoing) KYC.
- Region-based government ID checks.
- Bias mitigation built into AI risk scoring.
- Real-time transaction monitoring.
- Explainable AI designed to reduce false positives with auditable reasoning.
