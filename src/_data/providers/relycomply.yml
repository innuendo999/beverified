faq:
- q: How much does RelyComply cost?
  a: RelyComply does not publish pricing; it quotes on request.
- q: What does RelyComply's platform cover?
  a: KYC (identity verification, document and selfie checks, screening, risk assessment, adverse media), KYB, AML transaction monitoring and screening, case management and goAML regulatory reporting.
- q: Does RelyComply operate in the UK?
  a: Yes. RelyComply lists a London office, and RelyComply (UK) Limited was incorporated at Companies House in July 2025. It announced its UK launch in October 2025.
- q: Has RelyComply had a security incident?
  a: Yes. On 16 September 2026 RelyComply disclosed that an unauthorised party exploited a zero-day vulnerability in a third-party application to access some systems holding customer data. It said the access was stopped, the environment was rebuilt, customers were notified and the incident was reported to South Africa's Information Regulator. Several clients, including SA Home Loans, EasyEquities, Satrix and Peregrine Capital, told their customers that their data may have been accessed. Peach Payments stopped sending data to RelyComply and moved the affected services to another provider. As of a client update on 22 September 2026 the forensic investigation was still ongoing, and RelyComply had published no further update by 22 October 2026.
- q: What is the best alternative to RelyComply?
  a: ComplyAdvantage is the best alternative for a larger, established financial-crime database. Napier is the closest fit for AI-native transaction monitoring with a sandbox.
- q: Who are RelyComply's main competitors?
  a: RelyComply competes with ComplyAdvantage, Napier, and Sanction Scanner, differentiating through a unified KYC/KYB/AML platform with a South African compliance focus.
