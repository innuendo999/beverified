verdict: 'VerifyVASP suits VASPs whose counterparties are mostly in Asia-Pacific, above all South Korea, Singapore and, since it bought Sygna in April 2026, Japan. It runs a closed network with a documented CODE connection. The weak points are paperwork and prices. Its SOC 2 Type II claim names no auditor, we found no current ISO/IEC 27001 certificate, no prices are published and there is no TRUST, TRP or GTR link. Ask for the SOC 2 report and a quote.'
what_is:
- 'VerifyVASP sells Travel Rule messaging to VASPs. Members exchange the originator and beneficiary data that FATF Recommendation 16 requires through its TravelRule API, and only VASPs that pass VerifyVASP''s due diligence can join. VerifyVASP describes the network as peer to peer, with personal data encrypted end to end by the sending VASP and no central storage of it. In its 2024 response to an EBA consultation it described central servers in the cloud and Travel Rule data held in enclave servers that member VASPs manage, and Notabene calls it a closed, centralized protocol. Two other products sit beside it. VerifyName checks whether the sender and recipient of a first-party transfer are the same person, for jurisdictions where the Travel Rule does not apply yet. VerifyWallet checks that a customer controls a self-hosted wallet through signature challenges and small test payments. VerifyVASP is also a GLEIF Validation Agent, so it can issue Legal Entity Identifiers to VASPs.'
- 'The company is VerifyVASP Pte. Ltd. of Singapore, founded in 2019 according to The Block and its G2 profile. In April 2026 it described itself as a subsidiary of Upbit Global Pte. Ltd., a Singapore holding company that also owns Upbit''s exchanges in Singapore, Indonesia and Thailand. Upbit told Byline Network in March 2026 that Upbit Global uses the Upbit brand but has no equity link to Dunamu, the Korean operator of Upbit. Shih Yun Chia is CEO. VerifyVASP raised a USD 5 million Series A at a USD 100 million valuation in September 2022, led by FTX Ventures. It says it has processed more than USD 500 billion in Travel Rule transfers, a figure we could not check.'
- 'On 29 April 2026 VerifyVASP announced it had bought Sygna Inc., the Travel Rule provider behind Sygna Bridge, which CoolBitX launched in 2019 and which is strong in Japan. No terms were disclosed. VerifyVASP says Sygna members keep working without disruption and will move to its own network over time. The Sygna site, API docs and member list were still online in October 2026, with 39 members listed, many of them Japanese exchanges.'
features:
- Members-only Travel Rule network with due diligence before a VASP can send or receive, and a directory of member contact details.
- Personal data encrypted end to end by the sending VASP, with regional nodes for data localisation, per VerifyVASP; its privacy policy says data is stored in Singapore and/or Korea.
- Per-member trigger rules, so each VASP sets its own threshold and required fields by jurisdiction.
- VerifyWallet, which checks control of a self-hosted wallet through ECDSA or Ed25519 signature challenges and small test payments, and names MetaMask, Ledger, Trezor and Phantom.
- VerifyName, a name-match check for first-party transfers in jurisdictions without Travel Rule rules, which VerifyVASP says matches 91.7% of requests automatically.
- Sygna Bridge, now owned by VerifyVASP, with a public REST API, SDKs in Java, JavaScript and Python, a Robot VASP test counterparty and published service levels.
