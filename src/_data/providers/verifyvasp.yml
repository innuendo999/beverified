- 'Still open, certifications: SOC 2 Type II auditor and report not seen (SOC 2 is an attestation). Homepage ISO logo (iso.svg) has no standard, number, body or scope; not listed. Sygna homepage still says "All Sygna products are ISO/IEC 27001 certified"; the SGS 2021 certificate (Global Security Mag) would have needed recertification in 2024; no certificate, number or SGS register entry found. Homepage "DORA ready", FATF, DTIF, IFTA and Finalist logos not used.'
