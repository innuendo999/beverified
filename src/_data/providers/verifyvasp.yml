  by_profile:
  - Exchanges and brokers whose main counterparties are in South Korea, Singapore or Japan are VerifyVASP's clearest fit.
  - Former Sygna Bridge customers should ask when they will move to the VerifyVASP network and what changes in price and integration.
  - Firms whose counterparties sit mainly on TRUST, TRP or GTR should check first, since we found no direct connection to those networks.
faq:
- q: How much does VerifyVASP cost?
  a: VerifyVASP publishes no prices. Its terms of service describe a base subscription fee plus an API usage fee, billed quarterly, with the rates set in each licence agreement. Coincub lists the model as pay as you go, but we found no figures anywhere. Ask for a written quote that covers both fees and any minimum.
- q: Who owns VerifyVASP?
  a: VerifyVASP Pte. Ltd. is a Singapore company that described itself in April 2026 as a subsidiary of Upbit Global Pte. Ltd., a Singapore holding company that also owns Upbit's exchanges in Singapore, Indonesia and Thailand. Upbit told Byline Network in March 2026 that Upbit Global uses the Upbit brand but has no equity link to Dunamu, the Korean company that runs Upbit. VerifyVASP raised a USD 5 million Series A led by FTX Ventures in September 2022.
- q: What happened to Sygna Bridge after VerifyVASP bought Sygna?
  a: VerifyVASP announced the purchase of Sygna Inc. on 29 April 2026 without disclosing terms. It says Sygna members keep operating without disruption and will move to the VerifyVASP network over time, adjusted to local rules. In October 2026 the Sygna site, its developer docs and its member list of 39 VASPs were still online, and we found no date for the move. Sygna customers should ask for a migration plan in writing.
- q: Which networks and protocols can VerifyVASP reach?
  a: VerifyVASP members reach each other. CODE, the Korean Travel Rule solution, says it is integrated with VerifyVASP, GTR and Sygna, and a Korean report from May 2022 describes a partial VerifyVASP and CODE link from April 2022. Sygna announced interoperability with TRISA in February 2022, and Sumsub lists Sygna Bridge among the protocols it connects to. We found no direct VerifyVASP connection to TRUST, the open TRP protocol, GTR or Notabene's network. Notabene says VerifyVASP cannot send transfers to non-members.
- q: Is VerifyVASP SOC 2 or ISO 27001 certified?
  a: VerifyVASP says its platform passed a SOC 2 Type II assessment covering security, availability and processing integrity from 1 February 2025 to 31 January 2026, its fourth year in a row. It does not name the auditor, and the report is sent on request. Its homepage shows an ISO logo, but we found no ISO certificate, number or scope for VerifyVASP. Sygna said Sygna Bridge was ISO/IEC 27001 certified by SGS in 2021 and that all its products were certified in 2022, and its homepage still says so. We did not see a current certificate. Ask for the SOC 2 report and any certificate with its scope and dates.
- q: How does VerifyVASP verify self-hosted wallets?
  a: VerifyWallet asks the customer to sign a challenge with the wallet's key (ECDSA or Ed25519 with a nonce) and can also use small test payments. VerifyVASP names MetaMask, Ledger, Trezor and Phantom among supported wallets but publishes no wallet or chain list. Sygna also offers a Wallet Address Filter with Elliptic that tells you whether an address is hosted or self-hosted, which is not a proof of ownership.
- q: Does VerifyVASP store personal data?
  a: VerifyVASP says personal data is encrypted end to end by the sending VASP, can be read only by the receiving VASP and is not stored centrally. Its privacy policy says data is stored in Singapore and/or Korea unless stated otherwise, and its 2024 EBA consultation response said Travel Rule data sits in enclave servers managed by member VASPs. Notabene and Coincub both describe the system as centralized. Members sign a data processing agreement.
- q: What is the best alternative to VerifyVASP?
  a: 21 Analytics suits firms that need TRUST or the open TRP protocol and want to run the software themselves. Sumsub suits firms that want Travel Rule bundled with KYC and published prices, and it already connects to Sygna Bridge and CODE. Notabene is the hosted option with more reach outside Asia-Pacific.
