pros:
- Large Asia-Pacific exchange network, and CODE, the Korean Travel Rule solution, documents a live connection to it
- The Sygna purchase adds Sygna Bridge and its Japanese members, with Sygna's public API docs and test tools still online
- Self-hosted wallet checks by signature challenge, plus a name-match check for first-party transfers
cons:
- No prices published; the terms describe only a subscription plus usage fee
- SOC 2 Type II is vendor-stated with no auditor named, and we found no current ISO/IEC 27001 certificate
- Network size differs between pages (110+, 130+ or 150+ VASPs), VerifyVASP's own API docs are not public beyond an overview, and we found no TRUST, TRP or GTR link
