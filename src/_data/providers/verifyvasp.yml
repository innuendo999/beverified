- 'Funding: The Block and Fintech News Singapore (8 Sep 2022), Series A USD 5M at USD 100M valuation led by FTX Ventures with Peak Capital and "Bcharu". CB Insights shows USD 5.02M total and also lists Global FinTech Hackcelerator; no later round found. FTX''s later collapse not stated (no source opened).'
- 'Still open, interoperability: no VerifyVASP link to TRUST (Coinbase lists only 21 Analytics), TRP, GTR, TRISA directly or Notabene found; Notabene still "looking to add support" pending a security review and says non-members cannot be reached. Whether Sygna''s TRISA (Feb 2022) and Sumsub links survive the migration, and the migration date, are unknown.'
- 'Still open, docs and support: docs.verifyvasp.com still shows only a company overview; API style, SDKs, sandbox host and changelog not public. No support hours, SLA or support email published. Sygna developer centre has a changelog link with no dated entries and a status page link; Sygna SLA pages not opened.'
- 'Still open, pricing: no figures anywhere. Structured data lists products at "0" USD with a contact link (schema placeholder). Notabene says alliance membership is free; conflicts with the fee clauses in the terms, not used. Coincub: pay as you go; Sygna Bridge sign-up plus annual fee.'
- 'Not used: superlatives in the acquisition release and EBA response; Upbit CCO testimonial on independent audits; homepage partner logos (Amber, BitMEX, Bitget, Bybit, Crypto.com, HTX, OKX, Upbit, BingX, Flipster, Gate, HashKey) as customers. Independent membership evidence: Bybit (Blockmedia, 18 Mar 2022), Upbit (Notabene). No Capterra, SourceForge or Gartner Peer Insights listing found; rfp.wiki pages are AI-generated, not used.'
- 'No enforcement action, breach disclosure or litigation involving VerifyVASP or Sygna found in searches to 22 Oct 2026. VerifyVASP is not a licensed VASP and claims no licence.'
