verdict: Napier AI is a dedicated transaction-monitoring and sanctions-screening platform built for financial institutions and insurers, and says it is trusted by more than 150 institutions, with Banco do Brasil and Australia Post among the clients named on its site. Its built-in sandbox for testing monitoring rules before go-live is a genuine differentiator, though like most AML specialists here, it doesn't do identity verification on its own.
what_is:
- Napier AI is an anti-money-laundering compliance company founded in 2015 and headquartered in London, led by CEO Greg Watson. Marlin Equity Partners made a majority growth investment in the company, announced in February 2025. Napier provides transaction monitoring, transaction and client screening (sanctions, PEPs and adverse media) and perpetual client risk assessment on its Napier AI Continuum platform, and says more than 150 financial institutions, insurers and wealth and asset managers use it, naming clients such as Banco do Brasil, Australia Post, State Street and Starling Bank.
features:
- Real-time transaction monitoring with 100+ built-in AML typologies, combining rules and AI.
- Real-time and batch client screening for sanctions, PEPs and adverse media, with AI fuzzy name matching in more than 20 languages.
- Perpetual Client Risk Assessment (pCRA) for continuous customer risk scoring.
- Sandbox for testing and tuning monitoring rules before deployment.
- Napier AI Continuum platform in three deployment options (Continuum Pro, Live and Flow).
- Regulatory Reporting Manager that pre-fills up to 80% of SAR, STR and SMR report fields and files directly where supported.
