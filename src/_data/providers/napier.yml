verdict: Napier AI is a dedicated transaction-monitoring and sanctions-screening platform built for financial institutions and insurers, trusted by more than 150 institutions including Banco do Brasil and Australia Post. Its Continuum sandbox for testing detection models is a genuine differentiator, though like most AML specialists here, it doesn't do identity verification on its own.
what_is:
- Napier AI is an anti-money-laundering compliance company founded in 2015 and headquartered in London, led by CEO Greg Watson. It provides transaction-monitoring, sanctions- and PEP-screening, and client-risk-assessment tools to more than 150 financial institutions, insurers, and asset managers, including Banco do Brasil and Australia Post.
features:
- Real-time and batch transaction monitoring for AML compliance.
- Sanctions, PEP, and adverse-media screening across 25+ languages.
- Perpetual Client Risk Assessment (pCRA) for continuous customer risk scoring.
- Napier Continuum sandbox for testing and tuning detection models.
- Natural-language processing to reduce false-positive match rates.
- Automated suspicious-activity-report (STR/SAR) data collation and filing.
