faq:
- q: How much does Napier AI cost?
  a: Napier AI does not publish pricing. It quotes on request and describes a subscription model that includes bi-annual product updates.
- q: Does Napier AI verify identity documents?
  a: No. Napier AI is a transaction-monitoring and sanctions-screening platform. It does not perform document or biometric identity verification.
- q: What is Napier Continuum?
  a: Napier AI Continuum is Napier's platform for its monitoring, screening and risk-assessment products, offered as Continuum Pro, Live and Flow. Its transaction monitoring includes a sandbox for testing rules before they go live.
- q: Who uses Napier AI?
  a: Napier says more than 150 financial institutions, insurers, and wealth and asset managers use it, and names clients including Banco do Brasil, Australia Post, State Street and Starling Bank.
- q: Who owns Napier AI?
  a: Marlin Equity Partners made a majority growth investment in Napier AI, announced on 3 February 2025. Greg Watson remains CEO.
- q: What is the best alternative to Napier AI?
  a: ComplyAdvantage is the best alternative for broader proprietary financial-crime data. Unit21 is the closest fit if agentic, end-to-end investigation automation matters more than screening depth.
- q: Who are Napier AI's main competitors?
  a: Napier AI competes with ComplyAdvantage and Unit21, differentiating through its sandbox-testing approach and multilingual name-matching engine.
