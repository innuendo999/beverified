faq:
- q: How much does Napier AI cost?
  a: Napier AI does not publish pricing; its AML platform is licensed to financial institutions based on volume and module selection.
- q: Does Napier AI verify identity documents?
  a: No. Napier AI is a transaction-monitoring and sanctions-screening platform — it does not perform document or biometric identity verification.
- q: What is Napier Continuum?
  a: Napier Continuum is a sandbox environment that lets compliance teams test and tune detection models before deploying them in production.
- q: Who uses Napier AI?
  a: Napier AI is trusted by more than 150 financial institutions, insurers, and asset managers, including Banco do Brasil and Australia Post.
- q: What is the best alternative to Napier AI?
  a: ComplyAdvantage is the best alternative for broader proprietary financial-crime data. Unit21 is the closest fit if agentic, end-to-end investigation automation matters more than screening depth.
- q: Who are Napier AI's main competitors?
  a: Napier AI competes with ComplyAdvantage and Unit21, differentiating through its sandbox-testing approach and multilingual sanctions-matching engine.
