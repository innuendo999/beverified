pros:
- Public price list for every module, a free plan with monthly credit and no minimum or contract
- Liveness confirmed by iBeta at ISO/IEC 30107-3 Level 2, and an ISO/IEC 27001 certificate from Bureau Veritas is published
- Identity, database lookups, AML screening, transaction monitoring and wallet screening in one API with SDKs for web and mobile
cons:
- Our console priced AML screening at $0.27 per screening, above the $0.20 on the public pricing page
- Liveness is confirmed by iBeta at Level 2, while Sumsub and Shufti Pro hold Level 3 letters
- Founded in 2023, and KYB registry checks are still priced as staging rates pending production rollout
