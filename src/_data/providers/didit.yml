verification_notes:
- 'New record, first review 2026-11-17. No commercial relationship recorded; link.type none.'
- 'iBeta Level 2 re-checked 17 Nov 2026 (owner approved the fetch): letter signed by Ryan Borgstrom, iBeta Director of Biometrics, names Didit Identity''s Didit Biometric Authentication v3.0, Apple iPhone 17 on iOS 26.1, 9 Nov 2026, 300 attacks, IAPAR 0%. Published on Didit''s site (S3 link from its blog), so confirmed under our rule; not yet on iBeta''s public list on 17 Nov 2026 (list not re-checked). Fraud defense 3.5 to 4.5.'
- 'Spain report opened 17 Nov 2026 (tesoro.es, Feb 2026): sandbox test under Ley 7/2020, supervised by CNMV, SEPBLAC took part, tests 1 Nov 2024 to 9 Jul 2025, 50 users plus attack tests (printed documents, deepfakes, masks). The claim that NFC plus liveness is as safe as in-person identification is Didit''s own, quoted in the report as the promoter''s view; the supervisors'' conclusions do not say it. Do not state it as a regulator finding. Fact added as a sandbox test only.'
- 'Pricing: page notes a price change on 1 Nov 2026 and does not say which version it shows; figures read 17 Nov 2026. Older Didit pages say 500 free verifications a month; the pricing page now gives $10 monthly credit on the Free plan, which is used here. Non-document prices from the pricing page: US $0.27, Nigeria NIN $0.20, BVN $0.35; the Australia country page gives $0.45 per DVS query.'
- 'SOC 2: security page says Type 1 (ATOM, Apr 2026) and Type 2 (Atom Assurances, issued Jul 2026, period 9 Mar to 1 Jul 2026), reports behind a request form. Vendor-stated. FSM youth protection seal (29 Jun 2026) PDF on Didit''s site not opened.'
- 'Customer counts conflict: homepage says 3,000+ organisations, Biometric Update (May 2026, from Didit''s release) says 1,500 customers. Neither used. Logo wall (Firecrawl, Slash, Crnogorski Telekom, UCSF Neuroscape, Bit2Me) not used.'
- 'Vendor claims not used: 99% of verifications under 2 seconds, latency percentiles, 100% uptime, 0 breaches, 3 to 5 times cheaper than incumbents, +30% month-on-month growth, profitability.'
- 'User ratings from search result pages on 17 Nov 2026 (G2 blocks the fetcher): G2 4.9 from 18 reviews, Capterra 5.0 from 8. Trustpilot shows 3.1 to 3.5 from 17 to 18 reviews depending on the country page; mostly end users, not added.'
- 'docs.didit.me opened 17 Nov 2026: SDKs for web, iOS and Android, sandbox mentioned. No case management feature, adverse media or video ident documented on the docs home page; left not_disclosed.'
- 'No breach, enforcement action or lawsuit involving Didit found in searches on 17 Nov 2026.'
- 'Certification re-check 2026-11-20: the Level 2 letter (9 Nov 2026) is now listed on iBeta''s own page under Didit Identity; the entry cites the ibeta.com copy instead of the copy on Didit''s storage.'
