faq:
- q: How much does Didit cost?
  a: Didit publishes its prices. A full KYC check costs $0.33 at list price, AML screening $0.20 and ongoing AML monitoring $0.07 per user per year. The Free plan includes $10 of credit a month, Growth costs $99 a month and Scale $299 a month with more credit and discounts, and Enterprise is quoted. The pricing page says there are no minimums or contracts.
- q: Is Didit's liveness detection certified?
  a: Yes. iBeta confirmed Didit Biometric Authentication v3.0 at Level 2 of ISO/IEC 30107-3 presentation attack detection on 9 November 2026, with no attack accepted in 300 attempts on an iPhone 17. Didit publishes the letter. An earlier Level 1 letter for v2.0, dated 4 February 2026, is on iBeta's own site.
- q: Is Didit ISO 27001 or SOC 2 certified?
  a: Didit publishes an ISO/IEC 27001:2022 certificate from Bureau Veritas, number ES144068, valid until 3 June 2027. It says it holds a SOC 2 Type 2 report issued in July 2026, which it shares on request; we have not seen the report.
- q: Where does Didit store data?
  a: Didit says sessions are processed and stored in the EU on AWS by default. Other regions, and in-country residency where available, are offered on Enterprise contracts.
- q: Does Didit verify identities without a document?
  a: Yes. Didit checks ID numbers against government and bureau data in many countries and prices each lookup by country, from $0.05 to $4.30. Examples include NIN and BVN in Nigeria and the Document Verification Service in Australia.
