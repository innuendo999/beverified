verdict: 'Didit ranks first in our Cheap KYC ranking, a self-serve provider for startups that want to start free and pay a public list price per check, with iBeta Level 2 liveness. A full KYC check costs $0.33, and the Free plan gives $10 of credit a month to work-email sign-ups. The company was founded in 2023, and our console priced AML screening at $0.27, not the published $0.20.'
what_is:
- Didit is a self-serve KYC provider that publishes a list price for every check. In our own sandbox account we picked the result of a test session before it started, used Didit's sample passport instead of a real ID, and replayed the session with a ready-made AML scenario. The workflow editor shows the list price of every step and adds them up per finished session, $0.65 for ID, liveness, face match, AML screening and device checks; the same screen priced AML screening at $0.27, above the $0.20 on the pricing page.
- Didit sells identity verification and fraud prevention through one API and a web console. Its modules cover ID document checks with NFC chip reading, passive and active liveness, face match and face search, age estimation, proof of address, phone and email checks, checks against government databases without a document, AML screening with ongoing monitoring, transaction monitoring, crypto wallet screening, Travel Rule messages, reusable KYC and biometric login. Every module has a public list price, and a free plan includes monthly credit.
- The company was founded in 2023 by twin brothers Alberto Rosas (CEO) and Alejandro Rosas, and says it has two headquarters, in San Francisco and Barcelona. The iBeta letter names Didit Identity, Inc., and the ISO/IEC 27001 certificate names Didit Identity Spain S.L. in Barcelona. Didit joined Y Combinator's Winter 2026 batch and announced in May 2026 a $6 million seed tranche that brought its total seed funding to $7.5 million.
features:
- ID document verification with NFC chip reading, passive and active liveness, 1:1 face match and 1:N face search for duplicate accounts.
- Checks against government and bureau data without a document, priced per country, for example NIN and BVN in Nigeria and the Document Verification Service in Australia.
- AML screening of people and companies, with ongoing monitoring priced per user per year.
- Transaction monitoring, crypto wallet screening and Travel Rule messages in the same account.
- Age estimation from a selfie, with a German FSM youth protection seal for its age verification, per Didit.
- REST API, webhooks and SDKs for web, iOS, Android, React Native and Flutter, plus a free plan for testing.
