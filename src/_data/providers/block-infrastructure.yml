verdict: "BlockTravel, from Block Infrastructure, is an early product for VASPs, exchanges and custodians that want Travel Rule messaging and sanctions checks to run before a payment settles, not after. Block Infrastructure says TRP and TRISA work today in both directions; no other source confirms that yet. It is still in design partner stage, with public availability planned for later in 2026, and has no published prices, public docs, named customers, certifications, TRUST route or self-hosted wallet check."
what_is:
- BlockTravel is Block Infrastructure's compliance product for digital asset payments. Before a payment moves, it screens every party on every leg of the transfer, exchanges Travel Rule data with the counterparty VASP in the IVMS 101 format, and holds settlement until the checks pass. The screening runs in what the company calls Agentic Compliance, an automated workflow that runs sanctions screening, checks on-chain data and applies the institution's own rules, with a manual review queue for exceptions. Block Infrastructure says OpenVASP TRP and TRISA work today as both sender and receiver, and that the same adapter model extends to Sygna Bridge, Notabene, VerifyVASP, CODE and Veriscope, without saying any of those connections is live. Integration is through a REST API and an event layer, with webhooks on each state change, on compliance exceptions and on counterparty timeouts, and a sandbox with synthetic payments and reference counterparty VASPs. In May 2026 the company showed the product at the Bermuda Digital Finance Forum, in a simulated transfer on Canton DevNet where checks ran before Canton Coin settled and the result was written on-chain.
- The company is Block Infrastructure Ltd, a private limited company registered at Companies House on 21 October 2024 (number 16030386), with its registered office in London. Richard Beverley is co-founder and CEO, Kurtis Wright co-founder and COO, and Joshan Mahmud co-founder and CTO; the team page says they previously worked at ClearBank, and Wright also at HSBC. The register lists four directors, all appointed at incorporation. In January 2026 the register recorded a first Gazette notice for compulsory strike-off, and the action was discontinued a week later, the day after a late confirmation statement was filed. The company calls itself seed stage and names no investors or customers. Its other product, BlockID, is a reusable KYC and KYB network for banks, also in design partner stage. It is unrelated to 1Kosmos's BlockID.
features:
- Travel Rule messaging over OpenVASP TRP and TRISA, as both sender and receiver, with IVMS 101 data, per Block Infrastructure. Sygna Bridge, Notabene, VerifyVASP, CODE and Veriscope are named as networks the same adapter model can reach, with no live connection stated.
- Screening of every party on every leg of a payment before it moves, covering sanctions, on-chain data and your own policy rules, with a manual review queue for exceptions.
- Settlement gated on compliance, so a payment that has not cleared cannot move. Shown in May 2026 in a simulated transfer on Canton DevNet.
- REST API and event subscription layer, with webhooks on each state change, on compliance exceptions and on counterparty response timeouts. Listed standards are OpenAPI 3.0, OAuth2 and mTLS.
- Sandbox with synthetic payments across the supported Travel Rule protocols and reference counterparty VASPs, offered to design partners.
- A Network Compliance Oracle use case that lets participating institutions query BlockTravel's current screening state for a counterparty, transaction or chain address through one API.
