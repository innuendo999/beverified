pros:
- TRP and TRISA work today as both sender and receiver, per Block Infrastructure, with IVMS 101 data and one API meant to add other networks
- Sanctions, on-chain and policy checks run before a payment settles, and settlement is held until they pass, with a manual review queue for exceptions
- REST and event APIs with webhooks on each state change and timeout, plus a sandbox with synthetic payments and reference counterparty VASPs
cons:
- Not generally available yet; BlockTravel is in design partner stage, with public availability planned for later in 2026 and no named customers
- No prices, no public API docs and no security certification claimed, so due diligence has to start from scratch under NDA
- No self-hosted wallet check and no TRUST or GTR route documented, and the TRP and TRISA links are confirmed only by the vendor
