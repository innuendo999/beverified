  by_profile:
  - VASPs, exchanges and custodians in the UK, the Crown Dependencies and the Nordics that want to help shape an early product, and can sign a mutual NDA, are BlockTravel's clearest fit for now.
  - Firms that want Travel Rule, sanctions and policy checks to block settlement until they pass, rather than run after a transfer, should look at its gated settlement model.
  - Firms that need a product on general release, a vendor security report or a self-hosted wallet check today should use a provider that already publishes them.
faq:
- q: How much does BlockTravel cost?
  a: Block Infrastructure does not publish prices. BlockTravel is in design partner stage, and the site says only that design partners will get preferential commercial terms once the product leaves that stage. We found no third-party price either. Ask for written terms that say how payments, screenings and counterparties are counted, and what changes at general release.
- q: Is BlockTravel available now?
  a: Only to design partners. The homepage says Block Infrastructure is validating its products with a small group ahead of public availability later in 2026. Design partners must show real integration intent, give named compliance and technical contacts for structured feedback, and sign a mutual NDA. In return they get early access, a direct line to the build team and a say in what ships in V1.
- q: Which Travel Rule protocols does BlockTravel support?
  a: Block Infrastructure says OpenVASP TRP and TRISA work today as both sender and receiver, with IVMS 101 data. It names Sygna Bridge, Notabene, VerifyVASP, CODE and Veriscope as networks the same adapter model can reach, but does not say any of them is connected. We found no TRUST or GTR route, and no listing by OpenVASP or TRISA that confirms the TRP and TRISA links, so ask for a test transfer with your main counterparties.
- q: How does BlockTravel verify self-hosted wallets?
  a: The BlockTravel page does not describe a self-hosted wallet method. We found no signed message, Satoshi test, AOPP or screenshot proof. If you need to verify unhosted wallets under the EU Transfer of Funds Regulation, ask Block Infrastructure how this works before you sign.
- q: What is the BlockTravel compliance oracle on Canton?
  a: In May 2026 Block Infrastructure showed BlockTravel at the Bermuda Digital Finance Forum in a simulated transfer on Canton DevNet, the Canton Network's test environment. Smart contracts called the oracle to run Travel Rule, sanctions and AML policy checks before settlement, the outcome was written on-chain as an audit record, and Canton Coin then moved in one atomic step. The protocols used in the demo were not named.
- q: Is Block Infrastructure ISO 27001 or SOC 2 certified?
  a: We found no claim of either. The site lists frameworks its customers work under, such as FATF, MiCA, FCA and MAS rules, and technical standards such as OAuth2 and mTLS, but none of these is a certification. Block Infrastructure claims no licence or registration of its own.
- q: Who is behind Block Infrastructure?
  a: Block Infrastructure Ltd was registered in London on 21 October 2024. Its co-founders are Richard Beverley (CEO), Kurtis Wright (COO) and Joshan Mahmud (CTO), who previously worked at ClearBank according to the team page. The company calls itself seed stage and names no investors. In January 2026 Companies House recorded a first Gazette notice for compulsory strike-off, which was discontinued a week later, the day after a late confirmation statement was filed.
- q: What is the best alternative to BlockTravel?
  a: CryptoSwift if you need a hosted Travel Rule API with published prices today. Ospree if you want TRP and TRISA routes with built-in wallet screening. 21 Analytics if many of your counterparties are on TRUST or you want software you run yourself.
