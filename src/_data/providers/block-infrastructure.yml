verification_notes:
- 'Record decisions: link.type none (suggested by 21 Analytics, a partner ranked in Travel Rule; no commercial relationship with Block Infrastructure recorded, and the suggestion has no influence on the score). link.url points to the BlockTravel page given in the brief. Categories travel-rule only: sanctions and on-chain checks are part of BlockTravel, but BlockID (KYC and KYB) is a separate pre-release product, so crypto KYC is left as a suggestion for the owner. Logo null: the site serves /brand-assets/01-logo/lockup-horizontal.svg, but the fetch tool needed a permission nobody could grant in this unattended run; owner to supply the logo. Not confused with 1Kosmos BlockID (passwordless authentication, Capterra listing 266248, 0 reviews) or with Block, Inc.'
- 'Availability: homepage says "validating with a small group ahead of public availability later in 2026"; product, BlockTravel and use-case pages all describe design partner stage and V1 scope. Financial IT (19 May 2026) and TechBullion (21 May 2026, labelled partner content) say the same. The homepage also says the infrastructure is validated "in production" with that group; no deployment is named. Eligibility of a pre-GA product for the Travel Rule ranking is an owner decision (the KYA rubric ranks only GA or open beta; Travel Rule has no written rule).'
- 'Networks: BlockTravel page (11 Nov 2026): "OpenVASP TRP and TRISA are the protocols we operate today, on both the sending and receiving side"; "the same adapter model extends to Sygna..."; "The Travel Rule market runs several others, including Sygna Bridge, Notabene, VerifyVASP, CODE and Veriscope"; "BlockTravel is built to speak to each of them through the same API". Recorded as planned, not live. No TRUST, GTR or own network. OpenVASP TRP page (openvasp.org/trp) could not be opened (permission); web searches found no TRISA or travelrule.io listing for Block Infrastructure. Open: re-check both at the next pass.'
- 'Self-hosted wallets: the BlockTravel page has no mention of self-hosted or unhosted wallets, signatures, Satoshi tests or AOPP (checked by a targeted read on 11 Nov 2026). Fact set to Not publicly disclosed.'
- 'Company: Companies House overview, officers and filing history opened 11 Nov 2026. Incorporated 21 Oct 2024, GBP 100 capital at incorporation; SIC 63110 and 82990; directors Richard Frederick Beverley (also secretary), Suhumar Karur, Joshan Mahmud, Kurtis Wright, all appointed 21 Oct 2024. The team page lists a co-founder and Chief Data Officer called "Suhu"; not matched to Suhumar Karur in the record. Filings: GAZ1 first gazette for compulsory strike-off 6 Jan 2026, CS01 for 20 Oct 2025 filed 13 Jan 2026, DISS40 strike-off discontinued 14 Jan 2026; total exemption full accounts to 31 Oct 2025 filed 20 Oct 2026 (not opened); AD01 registered office moved from 71-75 Shelton Street, Covent Garden, London WC2H 9JQ to C/O Ajn Accountants, 1 Empire Mews, London SW16 2BF on 3 Nov 2026; PSC04 and CH03 for Richard Beverley dated 20 Oct 2026, filed 4 Nov 2026. Next confirmation statement date 20 Oct 2026, due 3 Nov 2026, shown overdue on 11 Nov 2026. PSC register page not opened (permission), so other persons with significant control, if any, are unknown.'
- 'Funding: about page says seed stage; no round, amount or investor found in searches. Fact Not publicly disclosed.'
- 'Regulatory status: no licence or registration claimed on any page. FCA cryptoasset register not searched directly; a web search found no FCA entry for Block Infrastructure. Frameworks listed on the site (FCA, MAS, GDPR, DABA, MiCA, FATF) are customer frameworks, not vendor certifications.'
- 'Certifications: none claimed. The homepage says it publishes "what we hold today and what we are pursuing next" but does not separate the two; no ISO/IEC 27001, SOC 2 or Cyber Essentials claim found. Privacy policy at /legal/privacy/ returned a client error on 11 Nov 2026; no terms page linked.'
- 'User ratings: no G2, Capterra or SourceForge listing found for Block Infrastructure or BlockTravel. user_ratings empty.'
- 'Press: news page lists the Canton demo (Financial IT, Finopotamus, Digital Assets Edge 19 May 2026; TechBullion, 0xzx 21 May 2026), Stablecon Europe (The Fintech Times, 22 May 2026), a podcast (28 May 2026), Let Fintech Grow profile (8 Jul 2026, not opened: permission) and two opinion pieces (Aug 2026). No customer, partner or pilot is named in the pieces opened. Team page also lists Jakob (Partner, Europe), Nikolaj Klein (Partner, Nordics) and Anthony Ralphs (Compliance and Advisory Lead, formerly Ripple); not in the record.'
- 'No enforcement action, breach disclosure, litigation or acquisition involving Block Infrastructure found in searches to 11 Nov 2026.'
