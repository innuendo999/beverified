verdict: Onfido pairs strong developer tooling with broad document coverage, and since its 2024 acquisition by Entrust, it now sits inside a larger identity-security portfolio. It's a solid enterprise IDV choice for teams that want SDK depth and optional AML screening, though pricing remains sales-only and support responsiveness gets mixed reviews.
what_is:
- Onfido is an AI-powered document and biometric identity-verification company founded in 2012 in Oxford, England, by Husayn Kassai, Eamon Jubbawy, and Ruhul Amin, headquartered in London with offices in New York, Albuquerque, Lisbon, and Singapore. Entrust acquired Onfido in April 2024, and it now operates as part of Entrust's broader identity-security portfolio while retaining its own brand.
features:
- Document verification powered by Onfido's Atlas AI engine.
- Biometric face match with active and passive liveness detection.
- Watchlist and AML screening (sanctions, PEP, adverse media), with optional ongoing monitoring.
- SDKs and APIs built for fintech and web3 integration.
- Coverage across 2,500+ document types from 195 countries.
- Available via AWS Marketplace for simplified enterprise procurement.
