faq:
- q: How much does Onfido cost?
  a: Entrust does not publish Onfido pricing and quotes it through sales. Onfido Ltd's UK G-Cloud 14 listing (May 2024) prices checks from £0.43 to £2.12 per transaction, depending on check type and volume. Vendr's buyer data puts the average contract at about $260,000 a year.
- q: Who owns Onfido?
  a: Entrust completed its acquisition of Onfido in April 2024. The product is now marketed as Entrust Identity Verification, and onfido.com redirects to Entrust's site.
- q: Does Onfido include AML screening?
  a: Yes. Entrust's watchlist screening checks customers against sanctions, PEP, adverse media and global watchlists, with optional re-screening every 24 hours, alongside document and biometric verification.
- q: How many countries does Onfido cover?
  a: Entrust says it supports more than 2,500 document types across 195 countries.
- q: What is the best alternative to Onfido?
  a: Sumsub is the best alternative for published pricing and a unified KYC/KYB/monitoring suite. Jumio is the closest match on enterprise processed-verification scale.
- q: Who are Onfido's main competitors?
  a: Onfido competes with Jumio, Sumsub, and Trulioo, differentiating through developer-focused SDKs and, since 2024, its place in Entrust's identity-security portfolio.
