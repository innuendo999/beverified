verdict: Onfido pairs strong developer tooling with broad document coverage. Entrust completed its acquisition in April 2024, and the product is now sold as Entrust Identity Verification, with onfido.com redirecting to Entrust. It is a solid enterprise IDV choice for teams that want SDK depth and optional watchlist screening, though pricing remains sales-only and support responsiveness gets mixed reviews.
what_is:
- Onfido is an AI-powered document and biometric identity-verification company founded in 2012, according to Entrust; its UK company, Onfido Ltd, was incorporated in December 2010 and is registered in London. Entrust completed its acquisition of Onfido in April 2024, when Onfido reported more than $140 million in annual revenue and over 1,200 customers. The product now sits in Entrust's identity-security portfolio as Entrust Identity Verification, described by Entrust as built on Onfido technology.
features:
- Document verification with AI models built on tens of millions of verifications, plus NFC chip reading where the document supports it.
- Biometric face match with liveness detection (Motion), tested by iBeta to ISO/IEC 30107-3.
- Watchlist screening against sanctions, PEP, adverse media and global watchlists, with optional re-screening every 24 hours.
- Smart Capture SDK, APIs and the Workflow Studio no-code builder.
- Coverage of more than 2,500 document types across 195 countries.
- Integrations with Microsoft Entra Verified ID and Okta Workforce Identity.
pricing:
  summary: Entrust does not publish Onfido (Entrust Identity Verification) pricing and quotes it through sales. The only public price list is Onfido Ltd's UK G-Cloud 14 listing for public-sector buyers, dated May 2024. It prices each check by type and annual volume, from £1.39 for a document check at 10,000 checks down to £0.73 at 1 million. Vendr's buyer data puts the average contract at about $260,000 a year. These are third-party figures, not Entrust's current list prices.
