verification_notes:
- onfido.com redirects to Entrust and link.url points to entrust.com. Owner to decide whether the outbound link type, logo or wordmark should change to Entrust.
- Office locations beyond the London registered office (old page listed New York, Albuquerque, Lisbon, Singapore) not confirmed on any page opened; still omitted.
- AWS Marketplace listing could not be opened (robots block); availability there still unconfirmed and not claimed.
- Entrust's Remote IDV Practice Statement (Dec 2025) says Facial Similarity Motion holds iBeta PAD Level 1 and Level 2; iBeta's public list shows only Level 1 for Motion v2.0 (Jul 2026). Level 2 for Motion not shown as confirmed.
- ISO/IEC 27001:2022, SOC 2 Type II, ETSI TS 119 461 / EN 319 401 and NIST 800-63-3 IAL2 are vendor-stated; no certificate, audit report or register entry opened.
- Gartner Peer Insights shows 4.3 from 47 ratings in the identity verification market and 4.4 from 60 on the all-markets product page; the market page is used.
