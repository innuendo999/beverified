faq:
- q: How much does Onfido cost?
  a: Onfido uses customized, volume-based pricing quoted via sales, with no published rate card; higher-volume contracts qualify for lower per-verification rates.
- q: Who owns Onfido?
  a: Entrust acquired Onfido in April 2024. Onfido continues to operate under its own brand as part of Entrust's identity-security portfolio.
- q: Does Onfido include AML screening?
  a: Yes. Onfido offers watchlist and AML screening (sanctions, PEP and adverse media) with optional ongoing monitoring, alongside its core document and biometric verification.
- q: How many countries does Onfido cover?
  a: Onfido supports 2,500+ document types across 195 countries.
- q: What is the best alternative to Onfido?
  a: Sumsub is the best alternative for published pricing and a unified KYC/KYB/monitoring suite. Jumio is the closest match on enterprise processed-verification scale.
- q: Who are Onfido's main competitors?
  a: Onfido competes with Jumio, Sumsub, and Trulioo, differentiating through developer-focused SDKs and, since 2024, Entrust's security backing.
