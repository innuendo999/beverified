verdict: 'Shufti Pro''s pitch is breadth: 230+ countries and territories, 10,000+ document types, and 150+ languages, built on a proprietary AI stack rather than licensed third-party models. Flexible deployment — cloud, private cloud, or on-premise — makes it a fit for teams with data-residency constraints, though like most competitors here, actual pricing requires a quote.'
what_is:
- Shufti Pro is an identity-verification and KYC/AML platform founded in 2017 by Victor Fredung and Shahid Hanif, headquartered in London with offices in the US, Poland, and the UAE. It's built around a proprietary AI verification stack — rather than reselling third-party models — and markets itself on the breadth of its geographic, document, and language coverage.
features:
- Document verification and facial biometrics with liveness and deepfake detection.
- KYB (business verification) alongside individual identity checks.
- AML screening and ongoing transaction monitoring.
- Video KYC and proof-of-address verification.
- Age verification for regulated industries.
- Cloud, private cloud, and on-premise deployment options.
pricing:
  summary: Shufti Pro does not publish standard pricing; plans are quoted via sales, though a 7-day free trial is available to test the platform first. Third-party estimates place the effective cost at roughly $0.50–$1.70 per verification — an external estimate, not an official rate, and setup fees apply on some plans.
