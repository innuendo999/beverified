faq:
- q: How much does Shufti Pro cost?
  a: Shufti Pro does not publish standard pricing; plans are quoted via sales. Third-party estimates put the effective cost at roughly $0.50–$1.70 per verification, and a 7-day free trial is available.
- q: Does Shufti Pro support KYB?
  a: Yes. Shufti Pro offers business verification (KYB) alongside its individual identity-verification and AML screening tools.
- q: What certifications does Shufti Pro hold?
  a: Shufti Pro holds ISO 27001:2022 and SOC 2 certifications and is GDPR compliant.
- q: Can Shufti Pro deploy on-premise?
  a: Yes. Shufti Pro supports cloud, private-cloud, and on-premise deployment, which suits clients with strict data-residency requirements.
- q: What is the best alternative to Shufti Pro?
  a: Sumsub is the strongest alternative if published, transparent pricing matters more than raw country and language coverage.
- q: Who are Shufti Pro's main competitors?
  a: Shufti Pro competes with Sumsub, Jumio, and Onfido, differentiating mainly through geographic/language breadth and flexible deployment options.
