faq:
- q: How much does Shufti Pro cost?
  a: Shufti Pro publishes its pricing. The Free Forever plan covers up to 10 verifications a month, Essentials starts from $1.50 per verification for up to 20,000 verifications, and Enterprise pricing is quoted on request.
- q: Does Shufti Pro support KYB?
  a: Yes. Shufti Pro offers business verification (KYB), UBO verification and due diligence alongside its individual identity-verification and AML screening tools.
- q: What certifications does Shufti Pro hold?
  a: Shufti Pro's liveness detection passed iBeta ISO/IEC 30107-3 Level 3 testing in April 2026, confirmed by iBeta's published letter; iBeta letters also cover Level 1 (October 2024) and Level 2 (April 2025). Shufti also states ISO 27001:2022, SOC 2 Type II, PCI DSS and Cyber Essentials Plus, but does not name the certification bodies on its site. The one certificate it links, Cyber Essentials Plus, ran from February 2024 to February 2025.
- q: Can Shufti Pro deploy on-premise?
  a: Yes. Shufti Pro supports SaaS, private-cloud, and on-premise deployment, which suits clients with strict data-residency requirements.
- q: What is the best alternative to Shufti Pro?
  a: Sumsub is the strongest alternative if you want a published compliance tier that bundles AML screening, ongoing monitoring and a free trial.
- q: Who are Shufti Pro's main competitors?
  a: Shufti Pro competes with Sumsub, Jumio, and Onfido, differentiating mainly through geographic/language breadth and flexible deployment options.
