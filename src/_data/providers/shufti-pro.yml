verification_notes:
- ISO 27001:2022, SOC 2 Type II, PCI DSS and Cyber Essentials Plus are vendor-stated; the certifications page names no certification body or certificate number and links only to Shufti's own subpages. trust.shuftipro.com was not opened.
- Founded and HQ use the Companies House registration (SHUFTI PRO LIMITED, 11039567, incorporated 31 Oct 2017, registered office in London). The About page lists offices but does not name a headquarters.
- The old 10,000+ document types figure was dropped; no current Shufti page states a document-type count.
- The old 7-day free trial, setup fees and $0.50 to $1.70 third-party estimate were dropped; the pricing page now publishes plans and states no trial length or setup fee.
- Brand: the site and press now use "Shufti"; the legal entity and iBeta letters use "Shufti Pro". No rebrand announcement was found. Added "Shufti" to alternate_names.
- Old office list (US, Poland, UAE) replaced; Poland is not among the eight offices listed.
- Homepage claims a Trustpilot 4.8; Trustpilot was not opened, so it is not recorded.
- choose_instead and FAQ for Sumsub rewritten because "published per-check pricing instead of a sales quote" no longer distinguishes Sumsub; the new wording uses Sumsub's own record (src/_data/providers/sumsub.yml), not re-checked here.
