verdict: 'Shufti Pro''s pitch is breadth: 240+ countries and territories and 150+ languages, on a technology stack the company says it builds and owns rather than licensing third-party models. Flexible deployment (SaaS, private cloud or on-premise) makes it a fit for teams with data-residency constraints. Unlike most competitors here, it now publishes entry pricing, with a free tier and a per-verification Essentials plan; enterprise volumes still need a quote.'
what_is:
- Shufti Pro, which now trades as Shufti, is an identity-verification and KYC/AML platform founded in 2017 by Shahid Hanif (CEO) and Victor Fredung (Chairman). Its UK company, Shufti Pro Limited, is registered in London, and it lists offices in the UK, Sweden, the UAE, Singapore, Hong Kong, Pakistan, Cyprus and the US. It says it builds and owns its own technology stack instead of reselling third-party models, and markets itself on the breadth of its geographic and language coverage. It says more than 2,000 businesses use it.
features:
- Document verification and facial biometrics with liveness detection (iBeta ISO/IEC 30107-3 Level 3 tested).
- KYB (business verification), UBO checks and due diligence alongside individual identity checks.
- AML screening and ongoing transaction monitoring.
- Video KYC (VideoIdent) and proof-of-address verification.
- Age verification, including facial age estimation with step-up checks.
- SaaS, private cloud, and on-premise deployment options.
pricing:
  summary: Shufti Pro publishes its pricing. A Free Forever plan covers up to 10 verifications a month, the Essentials plan starts from $1.50 per verification for up to 20,000 verifications, and Enterprise pricing is quoted on request. AML screening and KYB are listed from Essentials; transaction monitoring, VideoIdent and eIDV are listed under Enterprise. Setup fees, minimums and trial terms are not stated on the pricing page.
