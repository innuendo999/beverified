- 'Funding: Unit21 Series B release (source 7) confirms a $13M Series A (Oct 2020) and $34M Series B (Jul 2021); with the $45M Series C (source 3) disclosed rounds sum to $92M. Any earlier funding is not disclosed, so the fact keeps total not disclosed.'
- 'HQ: San Francisco from the Oct 2026 release dateline (source 8); the site and contact page give no street address.'
- 'Pricing: unit21.ai/pricing returned an error again on 2026-10-22; no pricing structure confirmed.'
