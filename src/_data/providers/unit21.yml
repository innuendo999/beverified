faq:
- q: How much does Unit21 cost?
  a: Unit21 does not publish pricing; it quotes on request.
- q: What are Unit21's AI agents?
  a: Unit21 offers a Detection Agent and an Investigation Agent that review alerts, gather supporting evidence and pre-populate filings such as SARs, CTRs and 314(a) responses, instead of only summarizing alerts for analysts.
- q: Who uses Unit21?
  a: Unit21 says it has more than 180 customers in more than 90 countries, including Chime, Green Dot, Crypto.com, Intuit, and Sallie Mae, across banking, fintech, and crypto.
- q: Does Unit21 handle both fraud and AML?
  a: Yes. Unit21 combines real-time fraud monitoring with AML transaction monitoring, case management, screening and regulatory filing in one platform.
- q: What is the best alternative to Unit21?
  a: ComplyAdvantage is the best alternative if sanctions/PEP data depth matters more than investigation automation. Feedzai is the closest fit for Tier-1 bank-scale payment fraud.
- q: Who are Unit21's main competitors?
  a: Unit21 competes with ComplyAdvantage, Feedzai, and Napier, differentiating through AI agents that carry out investigation work.
