verdict: 'Unit21''s AI agents go further than most fraud/AML tools. Its Detection and Investigation agents triage alerts, gather evidence and pre-populate regulatory filings such as SARs, instead of only summarizing cases for a human analyst. That ambition is backed by real customers (Chime, Green Dot, Sallie Mae), though pricing is not published.'
what_is:
- Unit21 is a fraud-prevention and AML platform founded in 2018 by Trisha Kothari and Clarence Chio and headquartered in San Francisco. It started as a no-code risk and compliance platform and now adds AI agents on top, used by more than 180 customers in more than 90 countries, according to Unit21, including Chime, Green Dot and Crypto.com, to combine fraud detection, AML transaction monitoring and regulatory filing. Co-founder Trisha Kothari led the company as CEO until April 2026, when founding engineer Tyler Allen became CEO and she moved to chair of the board.
features:
- AI agents (Detection Agent and Investigation Agent) that handle alert review and investigation work, beyond alert triage.
- Real-time fraud monitoring with stated sub-250ms latency.
- AML transaction monitoring, sanctions and payment screening, and customer risk ratings.
- AI pre-populated SAR, STR, CTR, 314(a) and goAML filings.
- Coverage across RTP, FedNow, ACH, card and crypto payments.
- Device intelligence and a US fraud consortium alongside rule-based detection.
