pros:
- AI agents that carry investigation work forward rather than only summarizing alerts; one customer case study (Nexo) cites a 93% cut in false positives
- Used by 180+ customers, per Unit21, including Chime, Green Dot, and Sallie Mae
- Covers RTP, FedNow, ACH, card and crypto payments in one platform
cons:
- No published rate card
- Best suited to regulated financial institutions rather than early-stage startups
- CEO change in April 2026 (co-founder Trisha Kothari moved to chair) brings some organizational change
