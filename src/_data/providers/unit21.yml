faq:
- q: How much does Unit21 cost?
  a: Unit21 does not publish pricing; its platform is licensed per capability and quoted based on institution size and volume.
- q: What is Unit21's AI Suite?
  a: Unit21's AI Suite uses agentic AI to execute the full financial-crime investigation lifecycle — from alert ingestion to regulator-ready narrative drafting — rather than just summarizing alerts for analysts.
- q: Who uses Unit21?
  a: Unit21 is trusted by more than 200 institutions, including Chime, Green Dot, Intuit, and Sallie Mae, across banking, fintech, and crypto.
- q: Does Unit21 handle both fraud and AML?
  a: Yes. Unit21 unifies real-time payment fraud detection with AML transaction monitoring, case management, and automated regulatory filing in one platform.
- q: What is the best alternative to Unit21?
  a: ComplyAdvantage is the best alternative if sanctions/PEP data depth matters more than investigation automation. Feedzai is the closest fit for Tier-1 bank-scale payment fraud.
- q: Who are Unit21's main competitors?
  a: Unit21 competes with ComplyAdvantage, Feedzai, and Napier, differentiating through its agentic AI that completes investigations end-to-end.
