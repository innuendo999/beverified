verification_notes:
- 'New record, first review. 21 Analytics asked to be listed as a Travel Rule solution; link.type set to none (no commercial relationship recorded).'
- 'Listing claim "We have the strongest network by being the only Travel Rule solution with a built-in TRUST network access": the coinbase.com/travelrule page (title "Travel Rule Universal Solution Technology") has an "Interoperability Partners" section listing only 21 Analytics, and its Myths and Facts say "TRUST members may also use TRUST via our partnership with 21 Analytics to connect to other protocols" and "TRUST is actively working on expanding its integrations". Notabene says it "cannot connect directly" because Coinbase does not let external vendors interact with TRUST; it can relay TRUST transfers by webhook for customers that are TRUST members themselves. Sumsub Travel Rule FAQ names Sumsub protocol, GTR, TRP, CODE and Sygna Bridge, no TRUST. No TRUST link found for VerifyVASP, Sygna (acquired by VerifyVASP, 29 Apr 2026), TRISA or Shyft Veriscope. CipherTrace TRP not checked (no current source opened). TRUSThub lets any VASP, member or not, exchange data with TRUST members, so other vendors'' customers can reach TRUST members without built-in access. Result: "only" confirmed as of Oct 2026 for built-in vendor access, per the TRUST operator page; "strongest network" is vendor-stated and not measurable from public data. Record says what TRUST lists and labels the rest.'
- 'The "only" wording on 21 Analytics'' own site is a different claim: "The only Travel Rule solution that guarantees GDPR-compliance" (homepage, regulations page). Not used. "21 Analytics'' prices can''t be matched" (TRUST page) not used.'
- 'TRUST size and counterparties: 21 Analytics homepage says "6 of the top 6 firms in Kaiko''s Q3 2026 Exchange Ranking", the TRUST page says "8 of the top 10", the 8.1.0 post says "top 8 global exchanges" (Kaiko Q2 2026). Inconsistent, Kaiko not opened; not used. Crypto Briefing (28 May 2026) says over 195 participating VASPs worldwide; not stated in the record, available for copy with attribution.'
- 'TRUST dates: TRUST built in from 21 Travel Rule 8.1.0 (release notes 30 Mar 2026, blog 31 Mar 2026); TRUST and 21 Analytics partnership release 28 May 2026 (21 Analytics blog copy; quote from Laura Hildebrandt, Senior Manager, AML Advisory and TRUST, Coinbase). 2025 recap already mentions close collaboration with TRUST. Company page says it was "the first solution provider to join forces with TRUST". The EIN Presswire copy of the release (einpresswire.com/article/916587211) could not be opened: HTTP 429 from the fetch proxy.'
- 'TRUST membership: Coinbase page says members must meet AML, security and privacy requirements (Exiger assists), costs split evenly among members, free option for smaller VASPs, affiliates join without extra fees. The 21 Analytics release says eligible firms may join free of charge. 21 Analytics TRUST page: "Some firms may be eligible for free TRUST support via 21 Analytics'' product".'
- 'TRISA: 21 Analytics post says the OpenVASP and TRISA bridge works "out-of-the-box" with 21 Travel Rule (undated). No direct TRISA endpoint in the 8.3.0 reference deployment (services trpd, trustd, aopd, aopp-portal). Products page says it supports "every Travel Rule protocol in the market"; not supported by the docs, not used. No GTR, CODE, Sygna, VerifyVASP or TAP support found.'
- 'ISO/IEC 27001:2022: homepage "ISO 27001:2022 Certified", blog of 27 Apr 2026 "has received the ISO/IEC 27001:2022 accreditation", Scytale case study (modified June 2026) says it renewed. No certificate, number, body or scope published. Trust centre compliance.21analytics.co renders by script and returned no content to the fetcher. Status vendor_stated. Also claimed: ISO 27034, 27036 and 20243 "aligned", OWASP ASVS Level 2, DORA and NIS2 "ready"; not certifications, not used. No SOC 2 claim found.'
- 'Legal entity and registry: graph.swiss (register mirror) shows 21 Analytics AG, UID CHE-204.325.525, Poststrasse 22, 6300 Zug, registered 8 Jun 2018, CHF 100,000 capital, active, former name 21 Lectures AG; board Lucas Betschart (chair), Filip Gospodinov, Dominik Spicher. Moneyhouse shows Betschart as president of the board (SHAB 28 Apr 2026, joint signature) and board member of OpenVASP (CHE-330.545.004). Zefix not opened directly. Evidence labelled independent as a register extract via a mirror.'
- 'Founded: vendor says 2020 ("founded in 2020 to address the Travel Rule"); entity registered 2018 under an earlier name. Both shown.'
- 'Leadership: company page names Filip Gospodinov CEO, Lucas Betschart COO, Dominik Spicher CTO, Hannah Zacharias Head of Regulatory Affairs. Moneycab (21 Aug 2020) named Betschart as CEO at the time.'
- 'Funding: not disclosed on any page opened; no round found in search. CB Insights and Caplight pages not opened.'
- 'Pricing: pricing page shows Essentials and Enterprise with no prices, flat fee regardless of volume, unlimited transactions and users, no onboarding fees (Essentials). G2 (vendor-provided): Starter CHF 900/month, Essentials and Enterprise contact for pricing, billed yearly. Capterra UK: starting price CHF 900, flat rate, Starter sold only through Microsoft Azure Marketplace, 5,000 VASP-to-VASP transactions a month. Azure Marketplace listing not found or opened. Coincub lists an "Annual License" model with no figures. No free tier or trial found.'
- 'Deployment: self-hosted ("on-premises" defined as your own hardware or cloud). Reference deployment 8.3.0: Podman 5.6.0+ with Quadlet and systemd, Helm 3.8.0+, Kubernetes or OpenShift, PostgreSQL, Keycloak, HAProxy ingress, images from registry.21analytics.ch with a licence login. Architecture 7.1.0 adds SeaweedFS and Docker Compose. Security page: Rust backend, no vendor access to PII, logs or configuration. "Zero telemetry" from homepage. Managed service via AML Incubator (Canada) announced 21 Oct 2025; host not specified in the release.'
- 'Open source: components used are PostgreSQL, Keycloak, SeaweedFS, Caddy. The product itself is licensed, not open source. AOPP is described as created by 21 Analytics in 2020; no public spec repository found. TRP is maintained by the OpenVASP Association.'
- 'Self-hosted wallets: four methods (AOPP, signature, Satoshi test, visual proof) on the product page and in docs (gui/self-hosted_wallets). 540+ wallets and 2,800+ assets via the AOPP portal per vendor; "100% accuracy" claim not used. Trezor blog (28 Jan 2022) removed AOPP. Other wallet removals in 2022 (Sparrow, BlueWallet) reported in search snippets only; not opened, not stated.'
- 'Jurisdictions: regulations page tracks 30 jurisdictions with thresholds and status (e.g. Switzerland CHF 0, EU EUR 0, Singapore SGD 1500, US USD 3000, Brazil from 2 Feb 2027). UK listed with an EUR threshold, likely a vendor typo. No per-jurisdiction compliance claim used.'
- 'Regulatory context: EU TFR 2023/1113 applies from 30 Dec 2024 (EUR-Lex metadata; article text not rendered to the fetcher). FATF seventh targeted update published 16 Jul 2026; Regulation Tomorrow quotes "almost half of jurisdictions that have introduced Travel Rule legislation" have not yet taken supervisory or enforcement action. MiCA not checked separately.'
- 'Customers: case studies for Tangany, Xerof and Relai. Homepage logos (Vontobel, Luzerner Kantonalbank, NiceHash, Crypto Finance, Laser Digital, Bitstack, WhiteBIT, 21 Bitcoin, BtcDirect, Coinify, Finst, Transfi, Bitrue, Animoca Brands) are unlabelled; not used as customers. Crypto Finance and Mt Pelerin took part in the August 2020 first transfer (Moneycab).'
- 'Partners: risk score providers Chainalysis, Crystal, Global Ledger, Beosin, Merkle Science (docs and 2025 recap); AML Incubator (managed service). Memberships: OpenVASP Association, Bitcoin Association Switzerland, Crypto Valley Association, CryptoUK (company page).'
- 'User ratings: G2 lists 21 Travel Rule with no reviews; Capterra UK shows 0 reviews. user_ratings left empty.'
- 'Support: pricing page: Essentials 24/5, 72-hour standard SLA, "Within 3 business days", additional charges may apply; Enterprise priority, "Within 24 hours", no additional charges. Support needs screen sharing or log upload (security docs).'
- 'Regulatory and legal: no enforcement action, breach disclosure, litigation or acquisition involving 21 Analytics found in searches to Oct 2026.'
- 'Categories: travel-rule only. 21 Analytics does no customer KYC or wallet screening of its own (it integrates third-party risk scores), so the crypto KYC list does not fit.'
- 'Wikidata id not found; kg_mid unknown. LinkedIn not opened.'
