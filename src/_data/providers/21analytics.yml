  by_profile:
  - Regulated VASPs, brokers and banks in Switzerland and the EU that want Travel Rule data to stay in their own infrastructure are 21 Analytics' clearest fit.
  - Firms whose main counterparties are TRUST members such as Coinbase, Kraken or Gemini should shortlist it, provided they can pass TRUST's due diligence.
  - Small teams with no operations staff should look at the managed option through AML Incubator or a hosted vendor, since the standard product is software you run yourself.
faq:
- q: How much does 21 Analytics cost?
  a: The pricing page lists Essentials and Enterprise tiers with a flat fee, unlimited transactions and users, and no onboarding fee on Essentials, but it shows no prices. G2 and Capterra list a Starter plan at CHF 900 a month, which Capterra says is sold only through the Microsoft Azure Marketplace with up to 5,000 VASP-to-VASP transactions a month. Get a written quote for Essentials or Enterprise.
- q: Is 21 Analytics really the only Travel Rule solution with TRUST access?
  a: As of October 2026, TRUST's own page names 21 Analytics as its only interoperability partner and says TRUST members can use it to connect to other protocols. Notabene says it cannot connect to TRUST directly, and we found no TRUST link for Sumsub, VerifyVASP, Sygna, TRISA or Veriscope. TRUSThub, TRUST's own tool, does let VASPs outside the network exchange data with members, so "only" holds for built-in vendor access, not for reaching TRUST members at all. "Strongest network" is 21 Analytics' own claim and we could not measure it.
- q: Do I need to be a TRUST member to use the TRUST connection?
  a: Yes. 21 Analytics says the connection works after your firm passes TRUST's due diligence, and TRUST says every member must meet its anti-money laundering, security and privacy requirements first. TRUST splits running costs between members and offers a free option for smaller VASPs. 21 Analytics says some firms may get free TRUST support through its product.
- q: Which Travel Rule protocols does 21 Analytics support?
  a: TRUST and TRP are built in, TRISA counterparties can be reached through the TRP and TRISA bridge, and VASPs with no Travel Rule solution get encrypted email. We found no direct connection to GTR, CODE, VerifyVASP (which bought Sygna in 2026) or Notabene's network, so check your counterparty list before you commit.
- q: Is 21 Analytics self-hosted or SaaS?
  a: Self-hosted. You run it on your own hardware or cloud, on Podman or on Kubernetes and OpenShift through Helm charts, with a PostgreSQL database. Since October 2025 AML Incubator has offered a managed Travel Rule service that can deploy the software for you instead, and Capterra lists a Starter plan on the Azure Marketplace.
- q: How does 21 Analytics verify self-hosted wallets?
  a: It offers four proofs. These are AOPP, which 21 Analytics created and says works in 540+ wallets, a signed message, a Satoshi test (a small transfer from the wallet) and a screenshot or video proof. Trezor removed the open AOPP standard from its software in January 2022 after user objections. 21 Analytics says the one-click route still works with Trezor, Ledger, Jade, TRONLink and 540+ other wallets, some through its own direct integrations rather than AOPP.
- q: Is 21 Analytics ISO 27001 or SOC 2 certified?
  a: It is ISO/IEC 27001:2022 certified. The certificate, which anyone can download from the 21 Analytics Compliance Centre, was issued by InterCert on 24 April 2026 (registration number IC-IS-2604284). It covers the business processes, infrastructure and data behind developing, running and maintaining its compliance software, and it is valid to 23 April 2027, subject to a yearly surveillance audit, with recertification due in April 2029. InterCert is accredited for ISO/IEC 27001 by the Standards Council of Canada. Other reports in the Compliance Centre, such as DORA and NIS2 readiness, an SBOM attestation, a container image vulnerability report and ISO 20243 and ISO 27034 verification reports, are released on request, some under an NDA. We found no SOC 2 claim.
- q: What is the best alternative to 21 Analytics?
  a: Notabene is the closest alternative if you want a hosted Travel Rule network rather than software you run yourself. Sumsub suits firms that want Travel Rule bundled with KYC and published prices, and VerifyVASP, which bought Sygna in 2026, is strongest in Asia-Pacific.
