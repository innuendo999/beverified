verdict: '21 Analytics suits regulated VASPs, brokers and banks that want to run Travel Rule software in their own infrastructure. Its main strength is TRUST: the network Coinbase helps run lists 21 Analytics as its only interoperability partner. TRP and four ways to verify self-hosted wallets are built in too. The ISO/IEC 27001:2022 certificate is public, but there is no SOC 2 report and no published prices, and you run and patch the software yourself.'
what_is:
- 21 Analytics sells 21 Travel Rule, software that VASPs install in their own data centre or cloud account to exchange originator and beneficiary data with other VASPs under FATF Recommendation 16 and the EU Transfer of Funds Regulation. It ships as containers with a PostgreSQL database and talks to counterparties over TRP and TRUST. VASPs without a Travel Rule solution get encrypted email. A Compliance Dashboard and a GraphQL API handle review and integration, and an AOPP portal collects proofs that a customer controls a self-hosted wallet. 21 Analytics says it cannot access customer data, logs or configuration in a deployment. Support works by screen sharing or log upload. Its other products are 21 Virtual Counter and 21 Sunrise, for requesting data from VASPs that have no Travel Rule tool.
- The company is 21 Analytics AG of Zug, Switzerland. It says it was founded in 2020 to address the Travel Rule, while the commercial register shows the company itself registered on 8 June 2018 under an earlier name, 21 Lectures AG. Filip Gospodinov is CEO, Lucas Betschart is COO and chairs the board, and Dominik Spicher is CTO. Betschart also sits on the board of the OpenVASP Association, which maintains TRP. In August 2020 the software carried what a Swiss news report described as the first automated Travel Rule transfer between Swiss intermediaries, Crypto Finance and Mt Pelerin. It created AOPP the same year. Trezor dropped the open AOPP standard from its wallet software in January 2022 after user objections, and 21 Analytics says its software still supports Trezor through a direct integration. TRUST announced 21 Analytics as a technology partner in May 2026. Published case studies cover Tangany, Xerof and Relai. 21 Analytics discloses no funding.
features:
- Built-in TRUST connectivity, with transfers to TRUST members detected automatically once your firm has passed TRUST's own due diligence.
- Native TRP messaging with IVMS101 data, TRISA counterparties reachable through the TRP and TRISA bridge, and encrypted email for VASPs that have no Travel Rule solution.
- Four self-hosted wallet proofs (AOPP, signed messages, Satoshi tests and screenshot or video proofs). 21 Analytics says one-click proofs work with 540+ wallets, including Trezor, Ledger, Jade and TRONLink, some through direct integrations rather than the AOPP standard.
- Self-hosted deployment on Podman or Kubernetes and OpenShift via Helm charts, with images from a licensed private registry and no telemetry, per 21 Analytics.
- Compliance Dashboard with counterparty VASP management, business rules that can be written in plain language with AI, audit logs and exports.
- Native wallet risk scores from Chainalysis, Crystal, Global Ledger, Beosin and Merkle Science, plus a GraphQL API and an integration client SDK.
