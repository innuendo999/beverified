pros:
- Built-in TRUST connectivity, and TRUST's own page lists 21 Analytics as its only interoperability partner
- Runs in your own infrastructure with no telemetry, and 21 Analytics says it cannot see customer data
- Four ways to prove self-hosted wallet ownership, plus public versioned docs and a release every few months
cons:
- The pricing page shows no prices; the CHF 900 monthly Starter figure comes only from G2 and Capterra
- No SOC 2 report, and security reports beyond the ISO/IEC 27001 certificate need an access request or NDA
- You install, patch and back up the software yourself, and there are only two public user reviews so far, both on SourceForge
