- 'Feedback from 21 Analytics by email, 20 Oct 2026: (1) ISO/IEC 27001 certificate downloadable from compliance.21analytics.co (reports and documents tab), linked as Compliance Centre on the homepage; DORA and NIS2 readiness, ICT risk statement, ISO 20243 and ISO 27034 verification reports there only under NDA. The page renders client-side and returned only its title to our fetcher; certificate number, body and scope not yet checked, status stays vendor_stated. (2) SourceForge is their chosen review platform: 1 review, 5.0, posted 13 Oct 2026. (3) Sygna was bought by VerifyVASP, wording merged. (4) Sandbox given to prospects on request, docs to be updated; integration 4.3 to 4.4. (5) Trezor: the open AOPP standard is gone from Trezor, but 21 Analytics says its software supports Trezor, Ledger, Jade, TRONLink and 540+ wallets through direct integrations; Trezor removed from the track record note. (6) Pricing: rubric unchanged, the pricing page still shows no prices; a price list was shared privately and is not used in the record.'
- 'ISO/IEC 27001 confirmed 20 Oct 2026: certificate PDF downloaded by the editor from the Compliance Centre (public Download button; ISO/IEC 27001:2022 and the release communication plan are public, the other documents are behind Request Access). Certificate: InterCert, 21 Analytics AG, Poststrasse 22, Zug; scope ISMS covering business processes, infrastructure and data for development, operation and maintenance of its compliance software; SoA version 1.0; initial certification and issue 24 Apr 2026; surveillance validity 23 Apr 2027; recertification 23 Apr 2029; registration IC-IS-2604284; SCC and IAF marks. SCC directory: InterCert Inc. accredited, file 8070, valid to 2030-02-25; SCC scope (v7, 2024-11-12) lists ISO/IEC 27001:2013 and 27001:2022 under ISMS. Registration number not checked in the InterCert lookup form (script rendered). The certificate gives 24 Apr 2026 as the initial certification date with InterCert, while the Scytale case study says the certification was renewed, so an earlier certificate was probably with another body; not stated in the record. Compliance 3.8 to 4.3 (same treatment as AML Watcher); overall 3.99 to 4.115, rounds to 4.1.'
