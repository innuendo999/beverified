verdict: 'VerifyMy is narrower than most providers in this batch by design: it focuses on age assurance and content moderation, with a method that estimates age from an email address alongside mobile, credit card, facial estimation and ID document checks. Its platform is certified to ISO/IEC 27566-1 by the Age Check Certification Scheme. That focus makes it a strong fit for platforms with age-gating obligations, though it is not a general-purpose KYC or AML platform.'
what_is:
- 'VerifyMy is a safety-technology company that launched with age assurance in 2019. Its UK entity, Verifymy Limited, was incorporated in England and Wales on 14 June 2019 as KYC AVC UK Ltd and took its current name in June 2024; the registered office is in London. Founder and CEO Ryan Shaw built the original product, VerifyMyAge, as an age-verification tool for businesses selling age-restricted products and services.'
- 'The company has since added identity verification, content moderation and consent management, has staff in London, Lisbon and São Paulo, and says it has verified more than 35 million users.'
features:
- Email-based age checks that do not require a document.
- Mobile number, credit card, name and address, ID document with face match, and Brazilian CPF checks.
- Facial age estimation; its face estimation API is certified to IEEE 2089.1-2024 by ACCS.
- 'Content moderation: creator identity and consent checks, pre-recorded and livestream moderation, complaints and case management.'
- Age assurance platform certified to ISO/IEC 27566-1:2025, with email and facial estimation rated highly effective, per VerifyMy.
- Used by platforms in social media, gaming, e-commerce, and adult content.
