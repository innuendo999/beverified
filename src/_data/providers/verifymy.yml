verdict: 'VerifyMy is narrower than most providers in this batch by design: it focuses specifically on age assurance, with a proprietary method that estimates age from just an email address alongside more conventional document and video checks. That focus makes it a strong fit for platforms with age-gating obligations, though it''s not a general-purpose identity-verification or AML platform.'
what_is:
- VerifyMy is an age-assurance and content-moderation company founded in 2019 and headquartered in London, led by CEO Ryan Shaw. It launched as VerifyMyAge, focused on age verification and estimation for age-restricted products and services, and has since verified more than 35 million users across social media, gaming, e-commerce, and adult platforms.
features:
- Proprietary email-based age estimation without requiring a document.
- Document, credit-card, and mobile-number based age-verification methods.
- AI-driven age estimation from short video capture.
- Content-moderation tools alongside age-assurance checks.
- Deployment across social media, gaming, e-commerce, and adult platforms.
- Privacy-preserving, proportionate verification designed to minimize user friction.
