verification_notes:
- KJM approval is vendor-stated; the KJM database pages could not be paged past page 1 in our fetch, so the listing was not found.
- 35M+ users verified is a vendor figure with no date or method.
- G2 shows no reviews; Trustpilot has one unprompted 1-star review on an unclaimed profile. No user_ratings added and user review themes removed.
- Old feature "AI-driven age estimation from short video capture" corrected to facial age estimation; no video-specific method found.
- Old con "smaller scale and funding than general-purpose IDV competitors" removed; funding not checked.
- VerifyMy is not on the UK DIATF register (search returned 0 results); it never claimed to be.
- ISO/IEC 27566-1 certificate valid to 20/05/2029 and IEEE 2089.1 certificate valid to 21/09/2027 per the ACCS register entry.
