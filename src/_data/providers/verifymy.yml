faq:
- q: How much does VerifyMy cost?
  a: VerifyMy does not publish pricing. Age-assurance and content-moderation modules are quoted on request.
- q: How does VerifyMy's email-based age estimation work?
  a: VerifyMy estimates a user's age from an email address, with no document or selfie needed. VerifyMy says the method was rated highly effective in its ISO/IEC 27566-1 assessment.
- q: What platforms use VerifyMy?
  a: VerifyMy works with platforms in social media, online gaming, e-commerce, and adult content, and says it has verified more than 35 million users.
- q: Does VerifyMy do full identity verification?
  a: Not as a KYC or AML platform. VerifyMy offers ID document and face match checks, but for age assurance and creator verification and consent rather than regulated KYC or AML screening.
- q: Is VerifyMy certified?
  a: Yes. The Age Check Certification Scheme register lists VerifyMy's age assurance platform as certified to ISO/IEC 27566-1:2025 and ACCS 1:2025 (valid to May 2029), and its face age estimation API to IEEE 2089.1-2024 (valid to September 2027). VerifyMy also states German KJM approval.
- q: What is the best alternative to VerifyMy?
  a: Shufti Pro is the best alternative if you want age verification bundled into a broader IDV/AML platform. Onfido is the closest fit for general-purpose identity verification.
- q: Who are VerifyMy's main competitors?
  a: VerifyMy competes with Shufti Pro, Onfido, and IDnow on age-related checks, differentiating through its low-friction email-based estimation method.
