faq:
- q: How much does VerifyMy cost?
  a: VerifyMy does not publish standard pricing; age-assurance and content-moderation modules are quoted based on platform type and verification volume.
- q: How does VerifyMy's email-based age estimation work?
  a: VerifyMy uses a proprietary method to estimate a user's age from just an email address, avoiding the friction of a document or video capture.
- q: What platforms use VerifyMy?
  a: VerifyMy is deployed across social media, online gaming, e-commerce, and adult platforms, having verified more than 35 million users.
- q: Does VerifyMy do full identity verification?
  a: No. VerifyMy focuses specifically on age assurance and content moderation rather than general-purpose identity verification or AML screening.
- q: What is the best alternative to VerifyMy?
  a: Shufti Pro is the best alternative if you want age verification bundled into a broader IDV/AML platform. Onfido is the closest fit for general-purpose identity verification.
- q: Who are VerifyMy's main competitors?
  a: VerifyMy competes with Shufti Pro, Onfido, and IDnow on age-related checks, differentiating through its proprietary, low-friction email-based estimation method.
