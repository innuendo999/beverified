faq:
- q: How much does Regula cost?
  a: Regula does not publish pricing. Its SDKs, IDV Platform and hardware document readers are quoted per project, with usage-based pricing for the SDKs. The Document Reader SDK has a 30-day free trial with full access.
- q: Does Regula offer a hosted platform?
  a: Since October 2025 Regula sells an IDV Platform that combines document and biometric checks with AML and PEP screening and can be deployed in the cloud or on-premise. Its core products remain SDKs and hardware that teams integrate into their own systems.
- q: Can Regula run on-premise?
  a: Yes. Regula offers self-hosted Linux, Windows and Docker packages and offline mobile operation, and its IDV Platform supports on-premise deployment, so verification data can stay inside a client's own infrastructure.
- q: How many document templates does Regula support?
  a: Regula says its library covers more than 16,500 document templates from 254 countries and territories.
- q: What is the best alternative to Regula?
  a: Sumsub is the strongest alternative if you want a hosted, all-in-one platform with published pricing. Jumio is the closest match for enterprise-scale cloud onboarding.
- q: Who are Regula's main competitors?
  a: Regula competes with Jumio, Onfido, and Sumsub. It differentiates through forensic document authentication, SDKs and hardware readers, though it now also sells its own IDV Platform.
