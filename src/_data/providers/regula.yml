verdict: Regula is the deepest document-forensics option in identity verification, built for teams that need to catch sophisticated document fraud. Its 16,500-template library and self-hosted deployment options suit banks and border agencies with strict data-residency rules. It is still best known for SDKs and hardware readers, though since October 2025 it also sells an IDV Platform that adds AML and PEP screening, with cloud or on-premise deployment. Pricing is quoted rather than published, with a 30-day free trial of the Document Reader SDK.
what_is:
- Regula is a document-authentication and biometric-verification technology company founded in 1992, with offices in Daugavpils (Latvia), Reston (Virginia, USA), Warsaw, Düsseldorf, Naarden and Rio de Janeiro. Arif Mamedov is chief executive of Regula Forensics, Inc. Regula licenses a Document Reader SDK and Face SDK, plus proprietary hardware document readers and forensic devices, to banks, border-control agencies, forensic labs and fintechs; it says over 2,000 enterprises use its products. In October 2025 it launched an IDV Platform that combines document and biometric checks with AML and PEP screening, deployable in the cloud or on-premise.
features:
- Document Reader SDK with OCR, MRZ parsing, barcode reading, and RFID/NFC chip reading for e-passports, e-IDs and e-DLs.
- Forensic-level authenticity checks against a library of more than 16,500 document templates covering 254 countries and territories.
- Face SDK with 1:1 and 1:N face matching and active and passive liveness, iBeta tested to ISO/IEC 30107-3 Levels 1 and 2.
- Self-hosted packages (Linux, Windows, Docker) and offline mobile operation, so verification data can stay inside client infrastructure.
- Proprietary hardware document readers and forensic devices alongside the software SDKs.
- IDV Platform (launched October 2025) adding AML and PEP screening, with cloud or on-premise deployment.
