verdict: Regula is the deepest document-forensics option in identity verification, built for teams that need to catch sophisticated document fraud rather than run a full onboarding flow. Its 16,000-template library and on-device deployment suit banks and border agencies with strict data-residency rules, but it ships as an SDK and hardware reader, not a plug-and-play platform, and pricing is quoted per project rather than published.
what_is:
- Regula is a document-authentication and biometric-verification technology company founded in 1992 and headquartered in Daugavpils, Latvia, under CEO Arif Mamedov and co-founder Ivan Shumsky. Rather than selling a hosted onboarding platform, Regula licenses a Document Reader SDK and Face SDK, plus proprietary hardware document readers, to banks, border-control agencies and fintechs that need forensic-level document authentication inside their own systems.
features:
- Document Reader SDK with OCR, MRZ parsing, and RFID/NFC chip reading for e-passports and ID cards.
- Forensic-level authenticity checks against a 16,000+ template library covering 254 countries and territories.
- Face SDK combining biometric face match with liveness detection.
- On-premise and on-device deployment options so verification data never leaves client infrastructure.
- Proprietary hardware document readers alongside the software SDKs.
- Support for 30+ languages across SDK and hardware interfaces.
pricing:
