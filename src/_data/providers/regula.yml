faq:
- q: How much does Regula cost?
  a: Regula does not publish pricing. Its Document Reader SDK, Face SDK, and hardware document readers are quoted per project based on deployment scale, so there's no published per-check rate to compare against.
- q: Does Regula offer a hosted, no-code platform?
  a: No. Regula ships as an SDK and hardware toolkit for teams to integrate into their own systems, not a hosted, no-code onboarding platform.
- q: Can Regula run on-premise?
  a: Yes. On-premise and on-device deployment are core to Regula's positioning, so verification data can stay inside a client's own infrastructure. Many banks and government agencies require that.
- q: How many document templates does Regula support?
  a: Regula's library covers 16,000+ ID templates from 254 countries and territories, one of the largest in the category.
- q: What is the best alternative to Regula?
  a: Sumsub is the strongest alternative if you want a hosted, all-in-one platform with published pricing. Jumio is the closest match for enterprise-scale cloud onboarding.
- q: Who are Regula's main competitors?
  a: Regula competes with Jumio, Onfido, and Sumsub, though it differentiates by selling a document-authentication SDK and hardware readers rather than a full hosted onboarding platform.
