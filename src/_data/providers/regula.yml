verification_notes:
- HQ Daugavpils is inferred from the vendor office list (first listed); the about page does not name a headquarters. A directory (firmas.lv) lists Regula Baltija SIA at Daugavpils, but no official register page was opened.
- Co-founder Ivan Shumsky not confirmed on any page opened; removed.
- Gartner MQ recognition is 2026 per vendor homepage; the old 2025 claim was not confirmed and the Gartner page was not opened.
- The 30+ languages claim was removed; the SDK page says 138+ languages and scripts for document text, which is a different measure.
- ISO 27001 and ISO 9001 certificate details (dates, scope, body) not readable on the vendor page; no certification-body register opened.
- Vendor homepage shows G2 4.9/5 but the G2 page could not be opened; user_ratings left empty.
- Web search budget ran out during this check; Gartner MQ and founder details could not be searched further.
