verification_notes:
- 'link.type set to none: no commercial relationship with Ondato is recorded.'
- 'iBeta: the full list on iBeta''s page has no Ondato entry (checked 25 Nov 2026). Ondato''s security page shows "iBeta ISO 30107-3 Level-1 and Level-2 certifications" for third-party facial technology it does not name; per the IDV 1.0 rule a letter held by a supplier stays vendor-stated, so liveness has no lab letter.'
- 'Ondato''s supplier wording ("NIST Level 1 & 2 PAD testing", "$100,000 Spoof Bounty Program") resembles FaceTec''s, but Ondato does not name it, so no supplier is stated.'
- 'NIST FATE age estimation: owner checked the NIST results table on 25 Nov 2026 (table updated 6 Nov 2026): ondato-001, submitted 7 Mar 2025, is listed. Confirmed; adds 0.5 to fraud defence under v3.1.'
- 'eIDAS: certification of the identity proofing service announced April 2025 (The Paypers); no conformity assessment body, standard version or certificate number found. vendor_stated.'
- 'Pricing: the per-verification range is official, but the page does not map volumes to prices, so the Budget KYC cost at 100 and 1,000 checks cannot be computed. Older plan pages with monthly license fees (€259 and €569) appear only in third-party listings and are not used. The plans page at ondato.com/?p=2321 is tagged noindex.'
- 'Coverage: 192 countries and 10,000+ documents from the FAQ. non_doc marked partial for Smart-ID and Mobile-ID e-signatures and document-free age checks.'
- 'Incident: July 2024 leak from a client''s data in a database Ondato administered as processor (Estonian DPI decision, 2025). The DPI reprimanded the controller, could not determine whether the controller or Ondato caused it, and found Ondato''s measures not shown to be insufficient, while saying Ondato did not cooperate enough in the investigation. Added to incidents.yml with counted: false (older than 24 months).'
- 'Logo tile and wordmark from the owner''s image (2026-11-25).'
