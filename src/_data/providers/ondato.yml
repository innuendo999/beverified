pros:
- Published per-verification prices from €0.50 and a price for each add-on, charged only for completed verifications
- 10,000+ document types from 192 countries, with NFC and video identification
- KYC, KYB, AML screening and monitoring, and age verification on one platform
cons:
- No liveness lab letter in Ondato's own name; its liveness comes from an unnamed third party
- The price range does not say which volume gets which price, and plan fees or minimums are not published
- Certificates such as ISO/IEC 27001 and eIDAS are shown without a certifier or certificate number
