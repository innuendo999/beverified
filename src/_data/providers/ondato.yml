faq:
- q: How much does Ondato cost?
  a: Ondato publishes a per-verification price of €1.40 to €0.50, depending on volume, and charges only for completed verifications. It does not say which volume gets which price. Add-ons are priced separately, for example AML screening at €0.45 to €0.04 per check and video identification at €0.90 to €0.15 per minute.
- q: Is Ondato's liveness independently tested?
  a: Not in Ondato's own name. Ondato's security page says its facial technology comes from a third party and shows iBeta Level 1 and 2 certifications, but iBeta's public list has no entry for Ondato. Ondato does not name the supplier.
- q: How many countries and documents does Ondato support?
  a: Ondato says it accepts 10,000+ document types from 192 countries.
- q: Does Ondato offer AML screening and KYB?
  a: Yes. Ondato screens against sanctions, PEP and adverse media sources with a database updated daily, offers ongoing AML monitoring and has a KYB product. It also runs AML Ranger, a free AI screening assistant.
- q: Has Ondato had a data breach?
  a: In July 2024 a client's data held in a database Ondato administered as processor leaked after a cyber attack. Estonia's Data Protection Inspectorate reprimanded the client, said it could not determine whether the client or Ondato caused the leak, and did not find Ondato's security measures insufficient.
- q: What is the best alternative to Ondato?
  a: iDenfy is the closest alternative for EU identity checks with published human review hours. Sumsub and ComplyCube suit teams that want liveness with a lab letter in the vendor's name or self-serve plans.
