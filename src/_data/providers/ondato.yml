verdict: 'Ondato is an identity verification provider for EU and UK businesses that want ID checks, KYB, AML screening and age checks from one vendor with prices on the page. Identity verification costs €0.50 to €1.40, but the range does not say which volume gets which price. Its liveness comes from an unnamed third party, and in July 2024 a client''s data leaked from a database Ondato ran as processor.'
what_is:
- Ondato is a KYC and AML software company founded in 2018 by Liudas Kanapienis (CEO) and Andrej Vistorskij (Chief Product Officer). Its headquarters are in London and its R&D centre is in Vilnius, Lithuania. Ondato says it has 100+ employees and has onboarded more than 40 million users.
- Ondato sells identity verification with document checks, liveness, NFC and video identification, plus KYB, AML screening and monitoring, age verification and e-signatures, run from its Ondato OS platform. In 2025 it launched AML Ranger, a free AI screening assistant that we review separately.
features:
- Identity verification with 10,000+ document types from 192 countries, active liveness and face matching.
- NFC-based identity verification and video identification with an agent.
- Manual review by Ondato's own KYC specialists as a paid feature.
- AML screening for sanctions, PEP and adverse media with a daily-updated database, plus ongoing AML monitoring.
- Know Your Business onboarding, age verification with document-free and reusable options, and Smart-ID and Mobile-ID e-signatures.
- Web SDK, mobile SDKs, REST API and a no-code setup, with an unlimited sandbox.
pricing:
  summary: Ondato publishes a per-verification price of €1.40 to €0.50 depending on volume, without saying which volume gets which price, and you pay only for completed verifications. Add-ons are priced separately, for example AML screening at €0.45 to €0.04 per check and video identification at €0.90 to €0.15 per minute. Plan or platform fees and minimums are not published; the page sends buyers to sales.
