pros:
- One hosted API covers Travel Rule messaging, wallet and transaction screening and a rule engine, with TRM Labs, Crystal and Global Ledger data built in
- Live routes to TRP, TRISA, the CryptoSwift network and email, and TRISA itself announced full interoperability with Ospree
- Public developer docs with OpenAPI references, documented webhook retries and security, and a sandbox environment
cons:
- No prices at all, and the three plans show the same feature list, so you cannot compare tiers without a sales call
- No ISO/IEC 27001 or SOC 2 claim, only a vendor-stated UK Cyber Essentials certificate; the company registration number and hosting location are not published
- Self-hosted wallets are verified by signature only, there is no TRUST, GTR, Sygna or CODE route yet, and there are no user reviews on G2
