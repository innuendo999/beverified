verification_notes:
- 'Record decisions: link.type none (suggested by 21 Analytics, a partner ranked in Travel Rule; no commercial relationship with Ospree recorded, and the suggestion has no influence on the score). Categories travel-rule only: Ospree screens wallets and transactions with partner data but has no customer KYC of its own, so crypto KYC is left as a suggestion for the editor. Grade "Good" for 3.5 is an editor decision (no existing record sits at 3.5 or 3.6; 3.4 is Fair, 3.7 Good). Logo: wordmark supplied by the editor on 4 Nov 2026 (white PNG, traced to SVG and set in dark ink for light cards). Not confused with Ospree Duty Free (Singapore travel retail, unrelated).'
- 'Networks: docs Protocols page (4 Nov 2026) lists Ospree, EMAIL, TRP, TRISA and Cryptoswift as supported, and Sumsub, Fireblocks, "TRUSTHubs" and GTR under future interoperability options with no dates. It says technical support does not mean a counterparty is enabled (registration, certificates, keys, legal agreements may be needed). The per-protocol pages (ospree.md, email.md, trp.md, trisa.md) and the docs llms.txt DRAFT page could not be opened: the fetch tool required a permission that was not granted in this unattended run. The CryptoSwift page was opened. TRISA side: travelrule.io page (modified 28 Jun 2024) announces full interoperability and says Ospree is backed by Ripple and Techstars; trisa.io homepage does not list Ospree. OpenVASP TRP page shows "ospree" with a link to ospree.io after the vendor list (21 Analytics, Blockchain Intelligence Group); its position on the page makes it unclear whether it is listed as a vendor; Protofire (updated Oct 2026) reads it as one of three TRP vendors. Ospree TRISA blog post dated 20 Jun 2024. Sample API requests show protocol "flow"; not explained.'
- 'Self-hosted wallets: API integration flows describe a Verify Address Ownership link and a signed attestation, then a webhook. The Blockchain Analytics product page says CAIP-122 cryptographic message signing, off-chain, no gas. Learn page on self-hosted wallets and the Verify Address Control endpoint page could not be opened (permission). No Satoshi test, AOPP, screenshot or declaration method found. The API overview says both addresses in a transfer cannot be self-hosted, and that beneficiary_vasp_id must match the initiating VASP while its example shows SLFHST: an inconsistency in the docs.'
- 'Company: terms name "Ospree Pte Ltd., a Singapore company", governed by Singapore law, no registration number, no date. Privacy policy (last updated 12/11/2024) gives 111 North Bridge Road, #08-18 Peninsula Plaza, Singapore 179098 and support@ospree.io; no DPO, hosting provider or data location. CB Insights gives 75 High Street, Singapore. ACRA / Bizfile not opened; search found no register mirror for "Ospree Pte. Ltd." (results were for unrelated Osprey companies), so the UEN and incorporation date are open. Founded: Ospree does not state it; G2 seller listing 2022, village.ai 2022, GetLatka 2018 (estimate site, not used); the security blog post is dated 11 Sep 2022 and the Coinfirm partnership 29 Nov 2022. Silicon Republic (13 Apr 2023): founders spread across Singapore and the US, Techstars Web3 class of 2023.'
- 'Funding: none disclosed by Ospree. CB Insights: one seed round, $120K, "4 yrs ago", investors Techstars programmes; village.ai also $120K seed, Ripple and Techstars as backers. "Backed by Ripple" comes from TRISA''s page and the XRP Ledger Program on Ospree''s about page; no Ripple investment amount found, so the record says only Techstars for the round. Tracxn blocked by robots.'
- 'Figures not used as facts beyond vendor-stated labels: homepage 120+ projects, 65M+ end users, 99.9% uptime, 1,600+ VASPs, users in 25+ countries; about page 70M+ end users (differs from homepage 65M+); CoinMENA post 65 million users. "First company to offer multi-chain, native Travel Rule capabilities" (CoinMENA post) and "a leading digital asset compliance platform" not used. 99.9% uptime is not a contractual SLA (terms not checked for an SLA clause).'
- 'Certifications: Cyber Essentials post (12 May 2026) links to registry.blockmarktech.com/certificates/1d0181ca-a153-453d-825a-88611777dcdc/; the record could not be opened (permission), and the IASME certificate search was not reachable either. Level (basic or Plus), body and expiry unknown; status vendor_stated. No ISO/IEC 27001 or SOC 2 claim on homepage, about page, security post or help centre (help centre lists "What certifications do Ospree''s data centers have?" with no answer text).'
- 'Customers and partners: CoinMENA (blog 4 Aug 2025, Dubai dateline July 2025; licensed in Bahrain and the UAE per Ospree''s post, licences not checked with the regulators). Homepage testimonials: Crystal Intelligence, Provenance Compliance, Techstars Web3, Bit2Me Security Token Exchange (Enrique Palacios Rojo), Summons Abogados, RAID Square (Sebastien Martin); only Bit2Me STX and RAID Square read as users. CB Insights lists Globiance as a customer (not used). Partnerships page: CFC MENA, Summons, NOEWE, GDF, Crystal Intelligence, Lukka, TRM Labs, Global Ledger, Nominis, TRISA, Utila, Monetari, Ripple, Cardano. Monetari is "exclusive channel partner in Türkiye" (blog 10 Mar 2026), which cites MASAK rules from February 2025 and says the setup supports "100% deployment on local Turkish infrastructure".'
