  by_profile:
  - Exchanges, payment firms and OTC desks that want Travel Rule messaging and wallet screening from one hosted vendor are Ospree's clearest fit.
  - Firms whose counterparties use TRP, TRISA or the CryptoSwift network can reach them through Ospree's single API; firms that rely on TRUST, GTR or Sygna members should ask for dates for those routes in writing.
  - Buyers that need an ISO/IEC 27001 or SOC 2 report for vendor due diligence should ask Ospree for its security evidence before a trial, since neither is published.
faq:
- q: How much does Ospree cost?
  a: Ospree does not publish prices. Its plans page lists Foundation, Scale and Enterprise, each with a "Contact sales" button and the same list of features, and it states no volume limits, minimums, setup fees or trial terms. G2 shows no pricing either. Ask for a written quote that sets out what each tier includes and how transfers and wallet screenings are counted.
- q: Which Travel Rule protocols and networks does Ospree support?
  a: Ospree's developer docs list five live routes, its own network, email, TRP, TRISA and the CryptoSwift network, all reached through one API. TRISA's own site announced full interoperability with Ospree in June 2024, and OpenVASP's TRP page names Ospree. Sumsub, Fireblocks, TRUSThub and GTR are listed as future options with no dates. We found no route to Sygna, VerifyVASP or CODE, so check your main counterparties before you commit.
- q: Can Ospree send Travel Rule data to TRUST members?
  a: Not directly today. Ospree's docs list TRUSThub, the TRUST tool for VASPs outside the network, only as a future option, and we found no other TRUST route. If many of your transfers go to TRUST members such as Coinbase, ask Ospree for a date and a test transfer before you sign.
- q: How does Ospree verify self-hosted wallets?
  a: Ospree generates a link that the VASP sends to its customer, and the customer signs an ownership attestation with the wallet. Ospree says this uses CAIP-122 message signing off-chain, so no funds move and no gas is paid. Once signed, the address is labelled self-hosted and a webhook tells your system. We found no Satoshi test, AOPP or screenshot proof, so customers whose wallet cannot sign a message have no fallback in the docs.
- q: Is Ospree SaaS or self-hosted?
  a: Ospree is hosted. Its terms describe a web-based software-as-a-service product, and the docs offer a sandbox and a production environment. A March 2026 release with Monetari says the setup can run fully on local Turkish infrastructure, but Ospree publishes no on-premises product, hosting provider or data location.
- q: Is Ospree ISO 27001 or SOC 2 certified?
  a: We found no ISO/IEC 27001 or SOC 2 claim. Ospree announced UK Cyber Essentials certification in May 2026 and links to a certificate record, which we could not open, so it stays vendor-stated. Cyber Essentials is a basic UK scheme that covers controls such as secure configuration, access control, patching and malware protection; it is not an audit of a whole security programme. A 2022 Ospree post says data is encrypted at rest and in transit and backed up every 24 hours.
- q: Does Ospree also do KYC or wallet screening?
  a: It does wallet and transaction screening, with risk data from TRM Labs, Crystal and Global Ledger and a bring-your-own-key option for other providers. We found no customer identity verification of its own; Ospree's help centre asks which KYC solutions it supports but gives no answer, so pair it with a separate KYC provider.
- q: What is the best alternative to Ospree?
  a: CryptoSwift if you want published plan prices and more ways to verify self-hosted wallets. 21 Analytics if your counterparties are on TRUST or you need software you run yourself. VerifyVASP if most of your counterparties are exchanges in Asia-Pacific.
