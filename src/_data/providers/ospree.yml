verdict: 'Ospree suits crypto exchanges, payment firms and OTC desks that want Travel Rule messaging and wallet screening from one hosted API. It reaches counterparties over its own network, the open TRP and TRISA protocols, the CryptoSwift network and email, and it pulls risk data from TRM Labs, Crystal and Global Ledger. Self-hosted wallets are verified by a signed attestation only. Ospree publishes no prices, names no SOC 2 or ISO/IEC 27001 certificate, and we found no direct link to TRUST, GTR, Sygna or CODE.'
what_is:
- Ospree is a hosted compliance platform for digital asset firms. Its Travel Rule module, which the website calls Travel Rule Atlas, collects originator and beneficiary data, sends it to the counterparty VASP and records the result. The same API screens wallet addresses and transactions with data from blockchain analytics partners, and a rule engine can flag, block or escalate a transfer based on that risk and on jurisdiction thresholds. An Accounts Directory stores customer and counterparty records, and a Reporting Hub exports Travel Rule and analytics reports as CSV or JSON. Firms can integrate through the full REST API or through embeddable ready-made screens. Ospree says its VASP directory lists 1,600+ VASPs and that 120+ projects are connected; we could not check either figure.
- 'The developer docs list five live routes: Ospree''s own network, email, TRP, TRISA and CryptoSwift. Sumsub, Fireblocks, TRUSThub and GTR are listed as future options with no dates. The docs also warn that support for a protocol does not mean a counterparty is enabled, since each route can need its own registration, certificates or agreements. TRISA''s own site announced full interoperability with Ospree in June 2024, and OpenVASP''s TRP page names Ospree. A counterparty that is on none of these networks can be invited by email and joins after Ospree reviews its sign-up.'
- The company is Ospree Pte. Ltd., a Singapore company, with an address at Peninsula Plaza in Singapore in its privacy policy. Javier Tamashiro is co-founder and CEO and Jukka Pellinen is co-founder and CTO. Ospree went through the Techstars Web3 accelerator in 2023 and lists the IBM Hyper Protect Accelerator and the XRP Ledger Program on its about page. It does not disclose its founding year or funding; its G2 listing gives 2022, and CB Insights shows a single seed round of $120,000. Named users include CoinMENA, which is licensed in Bahrain and the UAE, while Bit2Me STX and RAID Square appear in homepage testimonials. Monetari, part of the TeraBank Group, is its exclusive channel partner in Türkiye.
features:
- One REST API for Travel Rule transfers, with endpoints to create, list, update and act on a transfer, and webhooks for status changes, with documented delivery, retries and security.
- Live routes to Ospree's own network, email, TRP, TRISA and the CryptoSwift network, all through the same API. Ospree says it handles each protocol, so you do not integrate with them one by one.
- Wallet and transaction screening with risk data from TRM Labs, Crystal and Global Ledger, plus a bring-your-own-key option for analytics providers you already pay for.
- Rule engine that turns your policy into automated decisions, such as flagging, blocking or escalating a transfer, with alert notifications.
- Self-hosted wallet ownership checks by a signed attestation that the customer completes through a link Ospree generates. Ospree says the signature uses CAIP-122 message signing off-chain, so no funds move and no gas is paid.
- VASP directory with a request flow that invites a missing counterparty by email, plus a sandbox environment and a jurisdictions page with Travel Rule rules for 12 markets.
