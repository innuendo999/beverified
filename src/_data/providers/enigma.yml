faq:
- q: How much does Enigma cost?
  a: Enigma publishes its prices. Credits cost 1 cent each. Plans are Free, Pro at $20 a month with 2,100 credits and Max at $200 a month with 25,000 credits, and Enterprise is quoted. KYB Identify is $1.50 and KYB Verify $2.50 per match, and searches that do not match are not charged.
- q: Does Enigma cover businesses outside the US?
  a: No. Enigma's KYB data covers 52 US jurisdictions (the 50 states, DC and Puerto Rico), and its documentation says it has no plans to expand KYB outside the US. It suggests using a partner for global KYB.
- q: What is the difference between KYB Identify and KYB Verify?
  a: KYB Identify confirms that a business is real and operating, and suits high-volume sign-up flows. KYB Verify adds the full Secretary of State record, including registration status, for teams that need checks a regulator will accept.
- q: Does Enigma provide beneficial ownership (UBO) data?
  a: Only partly. US jurisdictions generally do not publish UBO information, so Enigma returns possible owners based mainly on officers in Secretary of State filings, and can check whether a given name is linked to a business.
- q: Is Enigma SOC 2 certified?
  a: Enigma says it is SOC 2 Type 2 compliant for the security, availability and confidentiality criteria. The auditor and report date are not published, so we list it as vendor-stated.
- q: Does Enigma offer sanctions screening?
  a: Yes. Enigma screens people and businesses against OFAC sanctions and a PEP list it builds from government publications, at onboarding and on an ongoing basis, and can screen payments such as wires and ACH. Watchlist screening costs $0.50 per request.
- q: What is the best alternative to Enigma?
  a: Trulioo is the best alternative if you need KYB outside the US. Persona fits teams that want KYB and individual identity checks in one workflow.
