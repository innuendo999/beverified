pros:
- Full rate card is public, including KYB at $1.50 or $2.50 per match and no charge for non-matches
- Deep US data, with 100M+ registrations across 52 jurisdictions plus card revenue and operating signals
- Modern access options, including a GraphQL API, Console, MCP server and partner platforms such as Alloy
cons:
- KYB covers the US only, and Enigma says it has no plans to expand it
- No UBO register data; possible owners come mainly from officers in state filings
- SOC 2 Type 2 is vendor-stated with no auditor or report date named, and there are almost no public user reviews
