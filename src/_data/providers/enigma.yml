verdict: Enigma is a strong pick for teams onboarding US small businesses that want KYB by API and a price list they can read before talking to sales. It matches businesses against more than 100 million registrations across all 52 US jurisdictions, adds card revenue and web signals to show whether a business is actually operating, and charges $1.50 or $2.50 per match, with no charge when nothing matches. The catch is scope. KYB is US only, and Enigma says it has no plans to expand it, so it works best as the US layer in a multi-vendor setup. Its SOC 2 Type 2 claim is vendor-stated, and it has almost no public user reviews.
what_is:
- Enigma Technologies is a New York data company founded in 2011 by Hicham Oudghiri and Marc DaCosta. It started out publishing public government data and now sells data on the identity and financial health of US small and medium businesses. It raised a $95 million round in September 2018 led by NEA, with BB&T, Capital One Growth Ventures, MetLife and Third Point among the new investors. Its products cover KYB (Identify and Verify), sanctions and PEP screening for customers and transactions, enrichment and card revenue data for underwriting and sales, and a government records archive.
- Enigma resolves businesses to one profile in what it calls an identity graph, linking registrations, brands, operating locations, officers and card transaction data. It says it covers every US business and sees 40% of US card volume across the top 60 issuing banks. Logos on its site include Capital One, Chase, Truist, Ramp, Alloy and Gusto, and its published case studies cover Ramp, Wisetack, Findigs and FMCG Direct.
features:
- KYB Identify confirms a business is real and operating; KYB Verify adds the full Secretary of State record and registration status.
- Business registration data across 52 US jurisdictions (50 states, DC and Puerto Rico), from 200+ sources.
- Optional TIN/EIN and SSN verification, plus OFAC sanctions and PEP watchlist screening.
- Transaction screening for wires, ACH, Zelle and similar payments, with ongoing monitoring of customers.
- Card revenue, operating status, location and firmographic data for underwriting and sales targeting.
- GraphQL API, a web Console, an MCP server for AI agents and a KYB agent on Google Cloud Marketplace.
pricing:
  summary: Enigma publishes its prices. Data is billed in credits at 1 cent each. There is a Free plan, Pro at $20 a month with 2,100 credits and Max at $200 a month with 25,000 credits; Enterprise is quoted. KYB Identify costs $1.50 and KYB Verify $2.50 per match, with no charge for searches that do not match. Screening is billed per request, from $0.10 for negative news to $1.00 for TIN verification.
