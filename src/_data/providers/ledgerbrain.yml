verdict: "LedgerBrain fits a VASP that mainly wants wallet and transaction screening and would like Travel Rule messages handled in the same workspace, with counterparty screening and a release review before data is sent. The screening plans have published prices from $115 a month. The Travel Rule side is thin on evidence: it sits only in the custom-priced Enterprise plan, the site names no Travel Rule protocol or network, we found no self-hosted wallet proof, and the ISO/IEC 27001 badge comes with no certificate."
what_is:
- 'LedgerBrain is a blockchain intelligence platform for compliance teams at VASPs and banks. Its main jobs are screening wallets and transactions before funds move (KYT), due diligence on counterparties and entities (KYE), tracing flows of funds, case management and custom risk policies with score bands. The Travel Rule module prepares and exchanges IVMS-101 originator and beneficiary data with counterparties. In the product demo, each transfer sits in an inbox with Sent, Awaiting response, Completed, Rejected and Expired views, a counterparty directory, due diligence records and a release review that checks the institution, sanctions and PEP status and the destination wallet before a message is approved. LedgerBrain says it is live in a morning with no sales call, but Travel Rule is listed only in the Enterprise plan.'
- 'The site names no Travel Rule protocol or network. One demo screen labels a counterparty "Verified Envoy node". Envoy is the name of TRISA''s open-source Travel Rule node, but LedgerBrain does not say it uses TRISA, and we found no LedgerBrain or Sixpence entry in TRISA material. The "Supported networks" section lists blockchains (Bitcoin, Ethereum, Tron, Solana and others), not Travel Rule networks.'
- 'LedgerBrain is made by Sixpence, the trading name of Silver Sixpence (Pty) Ltd, a blockchain data company founded in Pretoria, South Africa, in 2020. Carel de Jager is founder and CEO. Sixpence''s LedgerCore data engine also runs its LedgerWatch investigations product and the Coinfig tax tool. Sixpence says audit firm Mazars used its Merkle tree tool in 2022 proof-of-reserves reports and that Coinbase picked it in 2023 for a proof-of-reserves grant. LedgerBrain also sells pay-per-report KYT, KYE and Know Your Agent screening to AI agents over the x402 payment protocol, at $0.10 a report in USDC. No Travel Rule customer is named.'
features:
- IVMS-101 Travel Rule messages with a transfer inbox (sent, awaiting response, completed, rejected, expired), a counterparty directory and due diligence records, on the Enterprise plan.
- Release review before a message is sent, with institution screening, sanctions and PEP checks and a destination wallet risk check, plus an audit history and a PDF audit record.
- Wallet and transaction risk scores with direct and indirect exposure, custom score bands and exposure rules, and continuous monitoring with risk change alerts every 12 hours, 24 hours or 7 days.
- Know Your Entity due diligence on exchanges and VASPs, flow of funds tracing with sanctions exposure, and case management.
- Coverage of 14 blockchains, including Bitcoin, Ethereum, Tron, Solana, Polygon, BNB Chain, Base, Arbitrum and Optimism.
- Public OpenAPI spec for pay-per-report KYT, KYE and Know Your Agent reports over x402 (USDC on Base, no API key), plus an MCP server for AI agents.
