verification_notes:
- 'Record decisions: link.type none (suggested by 21 Analytics, a partner ranked in Travel Rule; no commercial relationship with LedgerBrain or Sixpence recorded, and the suggestion has no influence on the score). Categories travel-rule only; Know Your Agent is a suggestion for the owner. Grade "Good" as on the other Travel Rule records (v3.0). Not in src/_data/providers under another slug and not in tracked.yml. Logo null: the session network policy blocks ledgerbrain.io for downloads, so no logo file could be taken from the site; owner to supply one.'
- 'Access: ledgerbrain.io pages render by script. WebFetch saw only titles and metadata (homepage "LedgerBrain, Digital-Asset Risk Decisions"; /compliance "KYT, Travel Rule & Entity Due Diligence"; /travel-rule "Sign in"; /partners metadata names Silver Sixpence (Pty) Ltd as publisher); Chromium was refused by the session proxy (403 on ledgerbrain.io). Page content comes from three full-page screenshots the owner supplied in chat on 18 Nov 2026: (a) a landing page "Make an explainable decision before value moves" with three cards (screen deposits and withdrawals, know your counterparty, exchange Travel Rule messages), footer with an ISO 27001 badge; source 2 assumes this is /compliance, the screenshot shows no URL; (b) the homepage with features, supported networks, pricing and FAQ; (c) the Travel Rule demo workspace at ledgerbrain.io/travel-rule ("Demo preview").'
- 'Travel Rule evidence: hero copy "exchange IVMS-101 Travel Rule messages"; card "Prepare and manage IVMS-101 Travel Rule information with counterparties"; homepage card "Travel Rule compliance: connect counterparties" and "Screen counterparties. Control message release. Keep the evidence."; demo release review (Revision 3) with institution screening, sanctions and PEP, destination wallet, "Release approved", "IVMS-101", "Every decision recorded", "Audit record PDF", counterparty "Northgate Ramp, Verified Envoy node". Workspace menu: Inbox, Needs review, Sent, Awaiting response, Completed, Rejected, Expired, Directory, Due diligence, Release reviews; transfers marked "Hosted/direct". FAQ item "How does Travel Rule compliance work on the platform?" was collapsed in the screenshot: its answer was not read and may name protocols.'
- 'Not found: any named Travel Rule protocol or network, an email fallback, a self-hosted wallet ownership proof, Travel Rule API endpoints (the OpenAPI spec, version 1.0.0, lists KYT, KYE, KYA job, KYA traces and metals price only; contact "LedgerLink Team", info@ledgerlink.io), a TRISA directory entry for LedgerBrain or Sixpence (web search only; the TRISA GDS was not queried). "Verified Envoy node" is read as a hint, not a claim.'
- 'Pricing (homepage screenshot, Monthly and Individual selected): Basic $115/month, 500 credits; Standard $230, 1,250 credits; Compliance $460, 3,000 credits; annual billing 20% less; Enterprise custom with Travel Rule, Trace Funds, Custom Policies, Manage Cases, volume pricing, custom integration planning, security and procurement support, dedicated support. The Organization toggle and yearly prices were not seen. x402: live catalog $0.10 per KYT, KYE and KYA report (and $1.00 for a metals price); the agent docs README example shows 1.00 USDC per call; the record uses the live catalog.'
- 'Company: Silver Sixpence (Pty) Ltd, Pretoria, founded 2020, from the founder''s press kit and bio; CIPC register not opened, registration number unknown. Sixpence homepage names Mazars (testimonial) and the Coinbase proof-of-reserves grant; LedgerCore names Nedbank among implementations of LedgerCore, not of LedgerBrain, so Nedbank is not stated in the record. The OpenAPI contact "LedgerLink" is not explained on any page we read.'
- 'User ratings: Product Hunt shows 1 upvote and no reviews; no G2 or Capterra listing found. x402 List traction (48 settlements all-time from one buyer) not used.'
- 'Vendor claims not used as facts: "live in a morning", "no sales call required" (true only for screening plans), "explainable decision" wording, demo figures (risk score 61, balances), the 1,282 counter in the demo header.'
- 'No enforcement action, breach disclosure or litigation involving LedgerBrain or Sixpence found in searches to 18 Nov 2026.'
