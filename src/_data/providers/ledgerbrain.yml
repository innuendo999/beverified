  by_profile:
  - Small and mid-sized VASPs that want wallet and transaction screening first, with Travel Rule messages in the same workspace, are LedgerBrain's clearest fit.
  - VASPs whose counterparties sit on TRUST, TRP, TRISA, GTR or CODE should ask which of them LedgerBrain can reach, since the site names none.
  - Buyers who must verify self-hosted wallets should ask how LedgerBrain handles them, since we found no ownership proof.
faq:
- q: How much does LedgerBrain cost?
  a: LedgerBrain publishes three screening plans, Basic at $115 a month, Standard at $230 and Compliance at $460, with 500, 1,250 and 3,000 credits a month and 20% off on annual billing. Travel Rule is listed only in the Enterprise plan, which is priced on request. Pay-per-report API calls over x402 cost $0.10 each in USDC.
- q: Which Travel Rule protocols does LedgerBrain support?
  a: LedgerBrain says it exchanges IVMS-101 Travel Rule messages with counterparties, but its site names no protocol or network, such as TRP, TRISA, TRUST, GTR, CODE or Sygna. One demo screen labels a counterparty "Verified Envoy node", and Envoy is TRISA's open-source Travel Rule node, but LedgerBrain does not say it uses TRISA. Ask for the list of networks it can reach before you sign.
- q: Does LedgerBrain verify self-hosted wallets?
  a: We found no method for proving that a customer controls a self-hosted wallet, such as a signed message, a Satoshi test, AOPP or a screenshot. The release review before a Travel Rule message screens the destination wallet's risk, which is a different check.
- q: Is LedgerBrain ISO 27001 certified?
  a: The site shows an ISO/IEC 27001 badge, but it does not publish the certificate, the certification body or the scope, and we found no register entry, so we treat it as vendor-stated. We found no SOC 2 claim.
- q: Who makes LedgerBrain?
  a: LedgerBrain is made by Sixpence, the trading name of Silver Sixpence (Pty) Ltd, a blockchain data company founded in Pretoria, South Africa, in 2020 and led by founder and CEO Carel de Jager. Sixpence also runs the LedgerCore data engine, the LedgerWatch investigations product and the Coinfig tax tool.
- q: Does LedgerBrain also do KYT and wallet screening?
  a: Yes, that is its main product. It scores wallets and transactions for direct and indirect exposure, traces flows of funds, monitors addresses every 12 hours, 24 hours or 7 days, and runs due diligence on counterparties and entities. AI agents can buy single KYT, KYE or Know Your Agent reports over x402 for $0.10 each.
- q: What is the best alternative to LedgerBrain?
  a: Ospree if you want wallet screening and Travel Rule from one hosted API with documented TRP and TRISA routes. Blockpass if you want a hosted Envoy service on TRISA and TRP next to KYC. CryptoSwift if you need a published Travel Rule price and self-hosted wallet checks.
