verification_notes:
- 'Founded: old page said 2006. KYC360 company page says it launched in 2015 as an AML knowledge platform; the Jersey entity was created 2016-02-23 (LEI record). No source for 2006 found.'
- 'Customer count: old page said more than 1,400 organisations. Vendor and Experian say only "hundreds"; removed.'
- 'Certifications: KYC360 site names none. A TrustRadius listing mentions an "ISO 27001-accredited hosting environment" (hosting, not KYC360 itself); not listed.'
- 'User ratings: Capterra RiskScreen listing shows 0 reviews (Sept 2026); G2 page could not be opened. Praise and criticism themes removed. Capterra also shows "from $900 per user per year", which conflicts with the vendor page and was not used.'
- 'Experian Ascend integration: announced for 2026 in the October 2025 press release; current status not confirmed.'
- 'Company timeline lists "Acquired by Experian" under 2026 while the press release is dated 27 October 2025; we use the press release date.'
- '2026-10-22 capabilities pass: the platform page (kyc360.com/financial-crime-compliance) cites "full EU data residency and ISO 27001 accreditation", which conflicts with the earlier note that the site names no certifications. Certifications not changed.'
