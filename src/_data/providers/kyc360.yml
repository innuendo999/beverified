  legacy_note: Aggregated from third-party review platforms (G2, Capterra) as of Jul 2026. Not verbatim quotes; user reviews average shown separately from our editorial score.
  praise:
  - AML expertise (frequently cited) — reviewers cite founder Stephen Platt's industry authority as a trust signal.
