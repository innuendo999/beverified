faq:
- q: How much does KYC360 cost?
  a: KYC360 publishes ad-hoc screening plans from £105 a month for 21 search credits up to £395 a month for 209, or £1,050 to £3,950 a year for 250 to 2,500 credits. A standard search uses 1 credit and an EDD search 10. The full platform is quoted by sales.
- q: Who owns KYC360?
  a: Experian announced the acquisition of KYC360 on 27 October 2025. KYC360 now describes itself as a wholly owned subsidiary of Experian plc.
- q: Who founded KYC360?
  a: KYC360 was founded by Stephen Platt, a founder of the International Compliance Association. It launched in 2015 as an AML knowledge platform and evolved from the RiskScreen product.
- q: What screening data does KYC360 use?
  a: KYC360's ad-hoc screening uses Dow Jones data for sanctions, PEP and watchlist checks and a live web search for adverse media. Its company timeline also lists data partnerships with World-Check, Kompany, Sayari, GDC and LexisNexis.
- q: What is the best alternative to KYC360?
  a: ComplyAdvantage is the best alternative for a larger proprietary financial-crime database. Napier is the closest fit for AI-native transaction monitoring with a sandbox.
- q: Who are KYC360's main competitors?
  a: KYC360 competes with ComplyAdvantage, Napier, and SmartSearch, differentiating through founder AML expertise and its price-by-searches model.
