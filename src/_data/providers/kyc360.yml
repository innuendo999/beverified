verdict: Experian announced its acquisition of KYC360 in October 2025, adding data-network backing to a platform built on deep AML expertise. Founder Stephen Platt is also a founder of the International Compliance Association. Its ad-hoc screening is priced by search credits rather than seats, which suits firms with variable screening volume. Experian said it would bring KYC360 into its Ascend platform from 2026, so check which combined features are live in your market.
what_is:
- KYC360 is a KYC and AML platform for regulated businesses, covering onboarding, screening, remediation and customer lifecycle management. It launched in 2015 as an AML knowledge platform, evolved from the RiskScreen product, and is run by founder Stephen Platt, a founder of the International Compliance Association. The operating company, KYC Global Technologies Limited, is registered in St Helier, Jersey, and KYC360 also lists an office in London. Experian announced the acquisition in October 2025 and KYC360 now describes itself as a wholly owned subsidiary of Experian plc. Its ad-hoc screening uses Dow Jones data for sanctions, PEP and watchlist checks, plus live web search for adverse media, and the company says it works with hundreds of organisations worldwide.
features:
- Onboarding and AML due diligence workflows.
- Ad-hoc and batch sanctions, PEP and watchlist screening using Dow Jones data, with live web adverse-media search.
- Customer lifecycle management (CLM) and remediation of existing customer files.
- Enhanced due diligence (EDD) reports and multilingual alias name matching.
- RESTful APIs, pre-built connectors and a RiskScreen Salesforce app.
- Recognised as a Market Disruptor (Gold) in Chartis FCC50 2026, featured in Chartis RiskTech100 2026, and named a Noteworthy Solution in Celent's 2026 adverse media screening report.
