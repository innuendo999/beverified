pros:
- Deep AML expertise from founder Stephen Platt, also a founder of the International Compliance Association
- Published per-search credit pricing with unlimited users suits lower, variable screening volumes
- Now backed by Experian's data network following its October 2025 acquisition
cons:
- Smaller team scale than category giants
- More focused on AML screening and lifecycle than document-first identity verification
- Experian announced integration into its Ascend platform from 2026, so the combined offer is still new
