verdict: KYC360 was acquired by Experian in October 2025, adding data-network backing to a platform already built on unusually deep AML expertise — founder Stephen Platt also founded the International Compliance Association. Its price-by-searches model (not per-seat) suits firms with variable screening volume, though the Experian integration is still in progress.
what_is:
- KYC360 is a customer-lifecycle KYC/AML platform founded in 2006 in Jersey (originally RiskScreen), headquartered in Saint Helier, Jersey, and founded by Stephen Platt, a leading AML expert who also founded the International Compliance Association. Acquired by Experian in October 2025, it serves more than 1,400 organizations with Dow Jones-powered sanctions, PEP, watchlist, and adverse-media screening.
features:
- Onboarding and AML due diligence workflows.
- Batch and ad-hoc sanctions/PEP/watchlist screening via Dow Jones data.
- Perpetual (ongoing) monitoring across the customer lifecycle.
- Customer lifecycle risk management and reporting.
- APIs and a RiskScreen Salesforce app.
- Recognized in Chartis FCC50 (2024) and Celent Noteworthy (2026, adverse media).
