pros:
- Published self-serve pricing with per-verification rates, which is rare in this category
- 'Broad document coverage: 12,500+ ID documents from 230+ countries and territories, per Veriff'
- Passive liveness tested by iBeta to ISO/IEC 30107-3 Level 2, plus UK DIATF certification
cons:
- Per-verification fees sit on top of the monthly minimum, and AML screening is a paid add-on
- An intruder took ID images, addresses and dates of birth of 8,583 Total Wireless customers from Veriff's systems in November 2025, and three class actions name Veriff
- End users on Trustpilot report selfie capture failures and failed checks with no reason given
