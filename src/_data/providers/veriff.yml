verdict: 'Veriff pairs automated decisions with human review (on its Plus and Premium plans) and says it supports 12,500+ government-issued ID documents from 230+ countries and territories. Its passive liveness check passed iBeta''s ISO/IEC 30107-3 Level 2 test in 2024, and its UK service is on the government''s DIATF register. Self-serve plans are published, with a $49, $99 or $209 monthly minimum plus $0.80 to $1.89 per verification. That is unusually transparent for this category, though the per-check fees on the higher tiers cost more than budget-first competitors. In November 2025 an intruder took ID images of 8,583 Total Wireless customers from Veriff''s systems, so ask how access to the Veriff portal is secured in your contract.'
what_is:
- 'Veriff is an identity-verification company based in Tallinn, Estonia. Veriff OÜ was entered in the Estonian business register on 20 October 2015. Kaarel Kotkas founded the company and is its CEO; Veriff also names Janer Gorohhov as a co-founder. Veriff acquired device-intelligence company BrowserID in January 2019, opened a New York office in November 2019, and raised a $100 million Series C at a reported $1.5 billion valuation in early 2022.'
- 'Veriff says it supports 12,500+ government-issued ID documents from 230+ countries and territories and serves 3,000+ businesses. In February 2026 it announced the acquisition of Estonian KYB provider Vespia, and it now offers business verification through a limited access program.'
features:
- Document verification and biometric face match; Veriff lists 12,500+ supported ID documents.
- Passive liveness detection with deepfake and injected-media detection, tested by iBeta to ISO/IEC 30107-3 Level 1 and Level 2.
- AML screening (PEP, sanctions and adverse media), database verification, and proof-of-address checks.
- Age validation, plus selfie-based age estimation without an ID document.
- Business verification (KYB) from 300+ jurisdictions, offered through a limited access program after the Vespia acquisition.
- Fraud tools that cross-link risky identities, documents and devices, building on its 2019 BrowserID acquisition.
- Hosted verification page, SDKs and webhooks.
