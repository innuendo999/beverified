verdict: Veriff pairs AI decisioning with human review across 12,000+ document types and 230+ countries — an Estonian unicorn built to catch deepfakes with an iBeta Level 2-certified liveness check. Its published starter tiers ($49–$209/mo) are a rare transparency win in this category, though premium tiers cost more than budget-first competitors.
what_is:
- Veriff is an identity-verification company founded in October 2015 and headquartered in Tallinn, Estonia, by CEO Kaarel Kotkas and Janer Gorohhov, with offices added in New York (2019), London (2020), and Barcelona (2021). A unicorn since raising venture funding, it acquired device-intelligence company BrowserID in 2019 and verifies identities across 12,000+ document types in 230+ countries and 48 languages.
features:
- Document verification and biometric face match across 12,000+ document types.
- Passive liveness detection with deepfake resistance, iBeta Level 2 certified.
- AML screening, database verification, and proof-of-address checks.
- Age validation and business verification.
- Device intelligence via its 2019 BrowserID acquisition.
- Web, iOS, and Android SDKs with published API.
