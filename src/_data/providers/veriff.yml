faq:
- q: How much does Veriff cost?
  a: 'Veriff publishes starter tiers: Essential at $49/month, Plus at $99/month, and Premium at $209/month, with custom pricing above that for enterprise volume.'
- q: Does Veriff detect deepfakes?
  a: Yes. Veriff's passive liveness detection is iBeta Level 2 certified and built to resist deepfake and presentation attacks.
- q: How many countries does Veriff cover?
