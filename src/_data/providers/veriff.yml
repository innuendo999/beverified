faq:
- q: How much does Veriff cost?
  a: 'Veriff publishes self-serve plans with a monthly minimum plus a per-verification fee: Essential ($49 minimum, $0.80 per verification), Plus ($99, $1.39) and Premium ($209, $1.89). Enterprise pricing for 5,000+ verifications a month is quoted on request, and PEP and sanctions screening is a $0.64 add-on.'
- q: Has Veriff had a data breach?
  a: Yes. Total Wireless, a Verizon prepaid brand, told customers in January 2026 that an unauthorised party obtained images of government-issued IDs, and for some people postal addresses and dates of birth, from Veriff's systems. Veriff gave Total Wireless the list of affected people on 10 December 2025, and 8,583 customers were notified. Veriff told CyberInsider the incident came from phishing that compromised a customer employee's credentials. Three class actions naming Veriff were filed in New York federal court in January 2026.
- q: Does Veriff detect deepfakes?
  a: Veriff says its passive liveness check detects deepfakes and injected media. The liveness product passed iBeta's ISO/IEC 30107-3 Level 1 and Level 2 presentation attack tests in 2024.
- q: How many countries does Veriff cover?
  a: Veriff says it supports 12,500+ government-issued ID documents from 230+ countries and territories.
- q: Who founded Veriff?
  a: Kaarel Kotkas founded Veriff in 2015 and is its CEO; Veriff also names Janer Gorohhov as a co-founder. Veriff OÜ was registered in Estonia in October 2015, with its legal address in Tallinn.
- q: Does Veriff offer KYB?
  a: Yes. Veriff announced the acquisition of KYB provider Vespia in February 2026. Its business verification product draws on register data from 300+ jurisdictions and is offered through a limited access program.
- q: "What are the best alternatives to Veriff?"
  a: "The best Veriff alternatives depend on the gap you need to fill. Sumsub adds KYB with UBO checks and case management on one platform, iDenfy lets you pay only for approved checks, and ComplyCube includes sanctions and PEP screening on its cheapest plan. Persona suits teams that build their own flows, Incode adds live agent video calls, and Onfido suits enterprises that want Entrust's developer SDKs."
- q: Who are Veriff's main competitors?
  a: Veriff competes with Sumsub, iDenfy, and Onfido, differentiating through document depth and published self-serve pricing.
