verification_notes:
- 'Pricing page re-checked 2026-10-22: the add-on block still shows "Total: $0.09 per verification" and the calculator shows $660.00 for 600 Essential verifications; neither reconciles with the listed per-unit prices. We show only the per-unit figures.'
- 'Veriff pricing, KYB and sign-up pages show a "not available in your location" banner from our fetch location; prices are as displayed.'
- 'ISO/IEC 27001, SOC 2 Type II and Cyber Essentials remain vendor-stated: the security page names no certification body or dates, and trust.veriff.com did not render its content.'
- 'KYB is still a limited access program (sign-up page says the full KYB service is "launching mid-2026"); general availability not confirmed as of 2026-10-22.'
- 'FIDO register entries list an expiry (DocAuth 1 Oct 2029, Face Verification 13 Nov 2029) but no issue date. DocAuth covers the Full Auto IDV product only, not hybrid review. The direct DocAuth products page did not load; both entries were read on the Face Verification products page.'
- 'Homepage also lists CCPA/CPRA and GDPR compliance; these are compliance statements, not certificates, and are not listed.'
