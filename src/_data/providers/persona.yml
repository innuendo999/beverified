verdict: 'Persona''s pitch is flexibility: reusable, customizable verification templates that product teams assemble into their own onboarding flows rather than a single fixed workflow. That configurability is a real strength for teams with unusual requirements, though it means a steeper setup curve and less out-of-the-box AML depth than specialized screening vendors. Entry pricing is published (Essential from $250 a month on a 12-month term); larger plans are quoted.'
what_is:
- Persona is an identity-verification infrastructure company founded in 2018 and headquartered in San Francisco, California, by CEO Rick Song and Charles Yeh. It raised a $200 million Series D at a $2 billion valuation in April 2025. It provides a no-code workflow builder and reusable verification templates combining document, biometric, and database checks, with KYC, KYB, AML, age assurance, case management and link analysis (Graph), aimed at product teams building custom onboarding flows. In April 2026 its Persona for Government product received FedRAMP Moderate authorization.
features:
- No-code workflow builder (Workflows) with reusable, customizable templates.
- Document, selfie, and database-based identity checks, plus KYB business verification.
- 'Age assurance: selfie age estimation, email-based inference, phone, credit card, ID, database and digital ID checks, with a reusable verified age attribute.'
- Orchestration across multiple verification methods and data sources, with Graph link analysis for coordinated fraud.
- Case management (Cases) for manual review workflows.
- Developer-first APIs and SDKs.
