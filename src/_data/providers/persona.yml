verdict: 'Persona''s pitch is flexibility: reusable, customizable verification templates that product teams assemble into their own onboarding flows rather than a single fixed workflow. That configurability is a real strength for teams with unusual requirements, though it means a steeper setup curve and less out-of-the-box AML depth than specialized screening vendors.'
what_is:
- Persona is an identity-verification infrastructure company founded in 2018 and headquartered in San Francisco, California, by CEO Rick Song and Charles Yeh. It provides a no-code workflow builder and reusable verification templates combining document, biometric, and database checks, aimed at product teams building custom onboarding and KYC/AML flows.
features:
- No-code workflow builder with reusable, customizable templates.
- Document, biometric, and database-based identity checks.
- Age verification alongside identity and KYC/AML checks.
- Orchestration across multiple verification methods and data sources.
- Case management for manual review workflows.
- Developer-first APIs and SDKs.
