pros:
- Full financial-crime lifecycle (identity, screening, monitoring, case management) in one no-code platform, with monitoring from the Growth tier
- 'Fast configuration: 100+ templates to ship flows in hours, per the vendor'
- Modular pricing that lets you change tiers or add and remove modules at any time
cons:
- No published prices; a quote needs a demo and a pilot
- SOC 2 is described only as "aligned", not as an audited report
- Younger, smaller brand than established category leaders
