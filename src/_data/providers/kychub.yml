verification_notes:
- 'HQ: old page said London with US, India and Singapore offices. KYC Hub about page says operator MerlinAI Labs Pvt Ltd is headquartered in Bangalore, with London as European HQ and Singapore as APAC hub; no US office named. Privacy policy also names Obsessory Online Services Pvt. Ltd. at a Bangalore address; relationship between the two entities not confirmed.'
- 'Founded: old page said 2018; Startups.co.uk Startups 100 2023 profile says 2017. Vendor pages give no year. No registry record found.'
- 'Employees: old page said roughly 102; no source found, removed.'
- 'Pricing: old page said transparent pay-as-you-go tiers. Pricing page now shows three custom tiers on a monthly commitment; pay-as-you-go not mentioned.'
- 'ISO 27001: vendor badge and FAQ only; no certifying body, scope or certificate found. SOC 2 described as "aligned" only.'
- 'Old cons about dashboard performance at large-bank scale and BI exports were attributed to reviews; G2 shows 4 reviews (4.0) with themes not visible and Capterra UK 0 reviews. Replaced.'
- 'Go-live "weeks rather than months": OpsFlow page says configuration time drops "from weeks to hours"; rewritten.'
- 'Homepage stats block renders placeholders (0+ countries, <0s, 0%); counts taken from other homepage sections.'
