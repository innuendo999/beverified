verification_notes:
- 'HQ: about page (2026-10-22) says operator MerlinAI Labs Pvt Ltd is headquartered in Bangalore, with London as European HQ and Singapore as APAC hub; no US office named. The privacy policy names only Obsessory Online Services Pvt. Ltd. (KYC Hub) at an HSR Layout, Bangalore address. No registry record found for either entity; relationship not confirmed.'
- 'Founded: Startups.co.uk Startups 100 2023 profile says 2017 (old page said 2018). Vendor pages give no year; no Indian or UK registry record found. Kept as 2017 from the third-party profile.'
- 'ISO 27001: vendor badge, about page and FAQ only; no certifying body, scope or certificate found. SOC 2 described as "aligned" only.'
- 'Pricing FAQ says AML screening includes adverse media in 100+ languages, while the tier list puts adverse media in Growth and above. Record follows the tier list.'
- 'G2 shows 4 reviews (4.0) on 2026-10-22 with themes not visible; Capterra UK shows 0 reviews. No user themes added.'
- 'Go-live: pricing FAQ says typically weeks; OpsFlow page says configuration drops "from weeks to hours" and flows ship in hours from templates. The pro refers to flow configuration only.'
