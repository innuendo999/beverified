verdict: KYC Hub's OpsFlow builder lets compliance teams configure onboarding, monitoring, and escalation without code, unifying identity, screening, and transaction monitoring in one platform rather than stitching together point solutions. Pricing is modular, with three quote-based tiers set by volume and modules, but no rates are published and quotes follow a demo and pilot.
what_is:
- KYC Hub is a financial-crime compliance platform co-founded by Jay Rao and Farnoush Mirmoeini. It is operated by MerlinAI Labs Pvt Ltd, which KYC Hub says is headquartered in Bangalore, India, with a European HQ in London and an APAC hub in Singapore. It serves banks, fintechs, lenders, and crypto businesses through OpsFlow, a no-code orchestration builder covering onboarding, screening, monitoring, and case escalation in one platform.
features:
- 'OpsFlow: no-code builder for onboarding, monitoring and escalation workflows, with 100+ templates.'
- KYC and sanctions, PEP and watchlist screening on every tier, with verification in 190+ countries and 3,000+ document types; KYB with UBO discovery is Enterprise only.
- Real-time AML rules and anomaly detection for transaction monitoring, from the Growth tier.
- 200+ data integrations through one API and GraphIntel, a knowledge graph of high-risk entities.
- Case management; region-specific data residency is an Enterprise-tier option.
- ISO 27001 certified and GDPR compliant, per the vendor; identity verification in under five seconds, per the vendor.
