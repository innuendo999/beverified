faq:
- q: How much does KYC Hub cost?
  a: KYC Hub does not publish rates. Its three tiers (Starter Compliance, Growth and Enterprise) are quoted on a monthly commitment based on expected volume and modules, after a demo and pilot.
- q: What is OpsFlow?
  a: OpsFlow is KYC Hub's no-code builder for configuring onboarding, monitoring, and escalation workflows without engineering support.
- q: Does KYC Hub cover the full compliance lifecycle?
  a: Yes. KYC Hub unifies identity verification, KYB, AML screening, transaction monitoring, and case management in one platform.
- q: How fast is KYC Hub verification?
  a: KYC Hub says identity verification at account opening takes under five seconds.
- q: What is the best alternative to KYC Hub?
  a: ComplyCube is the best alternative for simpler API-first identity/AML checks. Unit21 is the closest fit for agentic AI investigation automation at larger scale.
- q: Who are KYC Hub's main competitors?
  a: KYC Hub competes with ComplyCube, Unit21, and Sumsub, differentiating through its no-code, full-lifecycle orchestration approach.
