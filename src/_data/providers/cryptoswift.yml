verification_notes:
- 'Record decisions: link.type none (suggested by 21 Analytics, a partner ranked in Travel Rule; no commercial relationship with CryptoSwift recorded, and the suggestion has no influence on the score). Categories travel-rule only: CryptoSwift integrates third-party KYT and its selfie step is a liveness check without ID matching, so it is not a crypto KYC provider. Logo: wordmark supplied by the editor on 30 Oct 2026 (CryptoSwift logo with white text); text recoloured to the site ink colour (#14141A) for the light background, icon colour unchanged. Wikidata id not found; kg_mid unknown.'
- 'Networks: CODE homepage (codevasp.com/en, Oct 2026) lists CryptoSwift under "Interoperability" with CodeVASP, VerifyVASP, GTR, Sumsub, Sygna and Notabene, shows its logo, and carries a news item dated 23 Dec 2025 that CryptoSwift integrates with CodeVASP. Notabene: CryptoSwift product update of 10 Sep 2025 says incoming transactions from the Notabene network can be received after registering a webhook in a free Notabene account; no outgoing route to Notabene stated. Ospree docs (undated) describe CryptoSwift as an interoperability route for Ospree customers, no direct CryptoSwift integration needed. CryptoSwift FAQ text, as quoted on its product and partners pages, describes TRP, TRUST, TRISA, Sygna Bridge and VerifyVASP as protocols on the market but does not say CryptoSwift supports them. The ecosystem page (cryptoswift.eu/ecosystem/ redirects to cryptoswift.network) could not be opened: the fetch tool refused it and the browser pane blocks the domain. Re-check it when possible; it may list more networks.'
- 'Network size, vendor figures differ by date: homepage 250+ connected and 2,500+ reachable VASPs, 85+ jurisdictions (Oct 2026); GetApp listing 2,000+ identified VASPs/CASPs; guide of Jan 2025 over 1,000 identified VASPs. Record uses the homepage figures, labelled vendor-stated.'
- 'ISO/IEC 27001: CryptoSwift blog (3 Sep 2026, modified 14 Sep) says "passed ISO 27001:2022 certification"; Copla case study (10 Jul 2026) says certification was achieved in two months, with no body, number, scope or version. Site footer shows an unnamed ISO emblem. Status vendor_stated. "GDPR Compliant", "DORA Ready" and "99.9% uptime" are site badges, not certifications or a contractual SLA (terms of 1 Jun 2026 contain no SLA). No SOC 2 claim found.'
- 'Registry: krediidiraportid.ee (register mirror) gives registration 3 Feb 2023, Rukki tn 28 Tartu, share capital €100, board Indrek Ulst (since 3 Feb 2023) and Uve Poom (since 30 Jun 2025), employees 3 in 2025 and 0 in 2023 and 2024, revenue €83,147 in 2025 and €10,013 in 2024, VAT number from 9 Jan 2025. The official e-Business Register (ariregister.rik.ee) and the GLEIF record for the LEI were not opened (shell blocked by the network allowlist); LEI is from CryptoSwift''s own terms. Founded: vendor says 2022 (about page; Blockpass release says founded 2022). Tenity release calls Indrek Ulst a solo founder in July 2025; Uve Poom is listed as co-founder on the about page and joined the board in June 2025.'
- 'Funding: €510,000 pre-seed, July 2025, from Tenity, Startup Wise Guys, DEPO Ventures and angels (tech.eu, Tenity press release, AIN). No later round found.'
- 'Pricing: page checked 30 Oct 2026. Professional is shown twice with different labels ("Automated" and "Advanced compliance operations") and identical content. Credit definition not on the pricing page; the FAQ page returned a server error to the fetcher. GetApp says "transaction-count-based pricing with no upfront fees", which conflicts with the annual upfront billing on the pricing page; the vendor page is used.'
- 'Customers: homepage testimonials from Januar, Lightspark (Striga), Change, CryptoVoucher and Instacoins; tech.eu adds Crypto2Cash. Case studies: Januar (10 Aug 2026; Danish FSA payment institution with a MiCA CASP licence, per the case study) and Striga (26 Aug 2025; about four hours of technical work). Partners announced: Blockpass (11 Jun 2025, distribution of CryptoSwift Travel Rule to Blockpass clients), Global Ledger (29 Aug 2025, wallet attribution and risk), Lexters (2025, Romanian VASPs); tech.eu also names AML Watcher, Scorechain and Fraud.com as partners.'
- 'STRIP: GitLab topic page shows the project CryptoSwift / STRIP with 1 star, last updated 14 Oct 2025; the repository itself was not opened. Developer docs (docs.cryptoswift.eu, api.cryptoswift.eu) were not opened: the fetch tool refused them. Sandbox, webhooks and REST are from the product and pricing pages.'
- 'User ratings: GetApp UK and Software Advice AU show 0 reviews (a star graphic is shown with no reviews behind it). No G2, Capterra or SourceForge reviews found. user_ratings left empty.'
- 'Vendor claims checked and not used: "lightest integration effort on the market" (tech.eu quote, not measurable); payment logos (Mastercard Identity Check, VISA Secure, Swedbank) are checkout badges, not partners or customers.'
- 'No enforcement action, breach disclosure, litigation or acquisition involving CryptoSwift found in searches to 30 Oct 2026.'
