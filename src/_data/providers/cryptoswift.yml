pros:
- Prices on the website, from €600 a month on annual billing, with no setup fee and a free sandbox
- Four self-hosted wallet checks, including signatures that CryptoSwift says work with 600+ wallet apps
- A rule engine and risk score that can approve, hold, escalate or block each transfer automatically
cons:
- No TRUST, TRP or TRISA link found; reach beyond its own STRIP network rests on CODE and incoming Notabene transfers
- ISO/IEC 27001:2022 is vendor-stated with no certificate, auditor or scope published, and there is no SOC 2 report
- A young, small company (registered 2023, €510,000 pre-seed) with no user reviews yet, and the pricing page does not say what a credit buys
