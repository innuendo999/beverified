verdict: 'CryptoSwift suits EU crypto firms that want a hosted Travel Rule API with prices on the website: Essentials costs €600 a month on annual billing, with a €7,200 minimum a year. It routes messages over its own STRIP network, CODE lists it as a connected network, and incoming Notabene transfers can be received. Self-hosted wallets can be checked by signature, micro-transfer, photo or self-declaration. The company is small and young (registered in 2023, €510,000 pre-seed in 2025), its ISO/IEC 27001 certificate is not published, and we found no TRUST, TRP or TRISA link.'
what_is:
- CryptoSwift is a hosted Travel Rule platform. A VASP sends transaction and originator and beneficiary data to one REST API, and CryptoSwift delivers it to the counterparty VASP, returns the delivery status and a risk result, and applies the customer's own rules to proceed, wait for more information, send the transfer to manual review or block it. Messages travel over STRIP, CryptoSwift's own open-source JSON messaging standard. Around the messaging sit a client dashboard, a rule engine, a Travel Rule risk score, a VASP directory with counterparty profiles, and wallet screening through KYT providers the customer already uses. An on-premises add-on called Outpost keeps personal data in the customer's own database while the cloud platform handles routing. The homepage claims 250+ connected VASPs, 2,500+ reachable VASPs and 85+ jurisdictions; we could not check those figures.
- 'Before you buy, check how far CryptoSwift reaches outside its own network. CODE, the Korean Travel Rule network, lists CryptoSwift on its homepage among the networks it connects to, and CryptoSwift says it has received transfers from the Notabene network since September 2025. Ospree''s developer docs describe CryptoSwift as a route to VASPs on the CryptoSwift network. CryptoSwift''s FAQ explains TRP, TRUST, TRISA, Sygna Bridge and VerifyVASP, but we found no page saying CryptoSwift connects to any of them.'
- The company is CryptoSwift OÜ of Tartu, Estonia (registry code 16668875). It says it was founded in 2022; the Estonian register shows the company registered on 3 February 2023. Indrek Ulst is CEO and founder and Uve Poom is COO and co-founder. In July 2025 it raised a €510,000 pre-seed round from Tenity, Startup Wise Guys, DEPO Ventures and angel investors. Blockpass, Global Ledger and Lexters have announced partnerships with it. Named customers include Januar, a Danish payment institution with a MiCA licence, Striga (now part of Lightspark), Change, CryptoVoucher and Instacoins.
features:
- One REST API for pre-transaction and post-transaction Travel Rule messages, with webhooks for message, transaction and wallet verification status.
- Rule engine that decides on each transfer from message status, counterparty risk, wallet risk, sanctions screening and transaction attributes, with versioned policies and an audit history.
- VASP directory with counterparty profiles, jurisdictions, legal entities and a Travel Rule risk score.
- Self-hosted wallet checks by cryptographic signature, micro-transfer (Satoshi test), photo or video proof and self-declaration. CryptoSwift says signatures work with 600+ wallet apps on EVM networks, Bitcoin, Solana and Tron, and an optional guided selfie or source-of-funds step can be added.
- A claim feature for incoming transfers that arrive without Travel Rule data, where CryptoSwift tries to identify the sending VASP and requests the missing information.
- Free sandbox with separate credentials, a developer portal with interactive demos, and Outpost on the Enterprise plan for keeping personal data on your own premises.
pricing:
