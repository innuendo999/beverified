  by_profile:
  - EU crypto-asset service providers under the Transfer of Funds Regulation that want a hosted API and published prices are CryptoSwift's clearest fit.
  - Firms that send most transfers to TRUST members, or to VASPs on TRP or TRISA, should get CryptoSwift to show how it reaches those counterparties before signing.
  - Larger firms that must keep customer data on their own premises need the Enterprise plan, which is the only one with Outpost.
faq:
- q: How much does CryptoSwift cost?
  a: Essentials costs €600 a month and Professional €1,200 a month, billed annually and paid upfront, so the yearly minimum is €7,200 or €14,400. Quarterly billing costs €750 or €1,500 a month. Enterprise is quoted. Plans include 2,000, 6,000 or 20,000+ monthly credits, but the pricing page does not say what one credit buys, so ask how transfers and wallet checks are counted.
- q: Which Travel Rule networks can CryptoSwift reach?
  a: Its own STRIP network, which it says connects 250+ VASPs and reaches 2,500+. CODE lists CryptoSwift on its homepage as a connected network, CryptoSwift says it can receive transfers from the Notabene network, and Ospree's docs describe CryptoSwift as a route for Ospree customers. We found no connection to TRUST, TRP, TRISA, GTR or VerifyVASP, so check your main counterparties before you commit.
- q: What is STRIP?
  a: STRIP is CryptoSwift's own open-source, JSON-based standard for exchanging Travel Rule data. Its repository is public on GitLab. Other networks, such as CODE, reach CryptoSwift customers through their own integrations with CryptoSwift.
- q: How does CryptoSwift verify self-hosted wallets?
  a: It offers four methods. The customer signs a message with the wallet's private key, sends a small test transfer, uploads a photo or video as proof, or declares ownership. CryptoSwift says signatures work with 600+ wallet apps on EVM networks, Bitcoin, Solana and Tron. Since September 2026 you can also ask for a guided selfie or source-of-funds documents. The selfie step does not match the face to an ID document.
- q: Is CryptoSwift SaaS or self-hosted?
  a: It is a hosted service on Google Cloud. On the Enterprise plan, an extension called Outpost runs in your own infrastructure so personal data stays in your database, while the cloud platform still handles messaging and routing.
- q: Is CryptoSwift ISO 27001 certified?
  a: CryptoSwift says it passed ISO/IEC 27001:2022 certification, and Copla, its compliance consultant, published a case study about it in July 2026. Neither names the certification body, the certificate number or the scope, and we did not see the certificate. We found no SOC 2 claim. The "GDPR Compliant" and "DORA Ready" badges on its site are its own statements.
- q: What is the best alternative to CryptoSwift?
  a: 21 Analytics if you want software you run yourself or need TRUST access. VerifyVASP if your counterparties are mostly in Asia-Pacific. TRP if you want a hosted API that charges per message instead of an annual minimum.
