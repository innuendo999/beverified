verification_notes:
- Customer count stays at the 300+ enterprises from the February 2025 release. The About page now shows an animated "Enterprise customers" counter that reads as 450+ but is split across page elements, and no dated Sardine release or news report with a newer count was found on 2026-10-22.
- SOC 2 is vendor-stated; the security page links to a trust centre (security.sardine.ai) that lists no frameworks, report type or auditor and gates documents behind a request.
- User review themes are not visible on G2 (4.8 from 39 reviews; the Sardine homepage shows 4.9), and no Capterra or Gartner Peer Insights listing was found. Themes stay as general statements without frequency claims.
