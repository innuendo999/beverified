faq:
- q: How much does Sardine cost?
  a: Sardine does not publish pricing; it quotes on request.
- q: What makes Sardine different?
  a: Sardine combines device intelligence and behavior biometrics for pre-transaction fraud scoring with onboarding checks, transaction monitoring, sanctions screening and case management in one platform.
- q: Who uses Sardine?
  a: Sardine said in February 2025 that more than 300 enterprises rely on it. Named customers include FIS, GoDaddy and Intuit, and National Bank of Canada deployed it in 2026.
- q: Who backs Sardine?
  a: Sardine's backers include Activant Capital, a16z, Google Ventures, Experian Ventures, Moody's, Visa, FIS and National Bank of Canada. Total funding reached $170 million in May 2026.
- q: What is the best alternative to Sardine?
  a: SEON is the best alternative for a lighter-weight device/digital-footprint fraud tool. Unit21 is the closest fit for agentic, end-to-end investigation automation.
- q: Who are Sardine's main competitors?
  a: Sardine competes with SEON, Unit21, and Feedzai, differentiating through pre-transaction device and behavior scoring combined with AML compliance tooling.
