verdict: Sardine scores fraud risk from device fingerprinting and behavior biometrics before a transaction completes, then extends into AML monitoring, case management, and instant settlement — an unusual combination. Backed by a16z, Visa, and Experian and used by Santander and Travelex, it's built for financial institutions rather than small self-serve teams.
what_is:
- Sardine is a fraud-prevention and AML platform founded in 2020 and headquartered in San Francisco, led by CEO Soups Ranjan. It combines device fingerprinting and behavior-biometric fraud scoring with AML monitoring, case management, and instant settlement tools, serving more than 300 banks, retailers, and fintechs including Santander, Travelex, and ClearBank.
features:
- Device fingerprinting and behavior-biometric fraud scoring.
- Real-time, pre-transaction machine-learning fraud detection.
- Identity verification alongside fraud scoring.
- AML monitoring with case management and SAR filing.
- Instant ACH/settlement support.
- Chargeback protection tooling.
