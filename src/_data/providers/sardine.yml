verdict: Sardine scores fraud risk from device intelligence and behavior biometrics before a transaction completes, then extends into onboarding, transaction monitoring, sanctions screening and case management. Having fraud and AML compliance in one platform is still unusual. Backed by a16z, Visa and Experian, with customers such as FIS, GoDaddy and Intuit, it's built for financial institutions and larger platforms rather than small self-serve teams.
what_is:
- Sardine is a fraud-prevention and AML compliance platform founded in 2020 and based in San Francisco, led by co-founder and CEO Soups Ranjan. It combines device intelligence and behavior-biometric fraud scoring with KYC/KYB onboarding, transaction monitoring, sanctions screening and case management. In February 2025 it said more than 300 enterprises rely on it; named customers include FIS, GoDaddy and Intuit. A May 2026 Series C extension led by National Bank of Canada took total funding to $170 million.
features:
- Device intelligence and behavior-biometric fraud scoring.
- Real-time, pre-transaction machine-learning fraud detection.
- Identity, document and bank verification alongside fraud scoring.
- AML transaction monitoring, sanctions screening and case management, with an agent that drafts SAR narratives.
- Payment, card-issuing, refund and policy-abuse fraud tools.
- Account-takeover and bot detection.
