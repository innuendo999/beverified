verdict: 'Trulioo''s differentiator is data breadth rather than document scanning alone: it checks people and businesses against data sources across 195 countries, says it can verify more than 14,000 ID document types and 700 million business entities, and screens against more than 6,000 watchlists. That makes it a strong choice for non-documentary proofing and KYB, though it leans more toward a data-API product than a polished no-code UX, and it does not publish prices.'
what_is:
- Trulioo is a global identity-verification and KYB platform founded in 2011 in Vancouver, Canada, by Stephen Ufford and Tanis Jorge. Its 2021 Series D of $394 million, led by TCV, brought total funding to $474 million at a $1.75 billion valuation. Vicky Bindra has been CEO since April 2025. Trulioo covers 195 countries and says it can verify more than 14,000 ID document types and 700 million business entities, and in November 2025 it added credit decisioning to its KYB product.
features:
- Person and business verification across 195 countries.
- Document verification covering 14,000+ ID document types.
- Database and data-source checks for non-documentary identity proofing.
- KYB on 700 million business entities, with credit decisioning added in November 2025.
- AML and watchlist screening against 6,000+ watchlists.
- Fraud detection using predictive risk signals and consortium data.
pricing:
  summary: Trulioo does not publish pricing and quotes on request. G2's listing, whose pricing data was last updated in January 2021, gives the pricing model as per transaction, with a free trial. Vendr's buyer data puts the median at $4,500 a year, within a range of $3,870 to $16,050. These are third-party figures, not Trulioo's official rates.
