verification_notes:
- HQ evidence is the ISO certificate address (59 Kazimiero Barsausko St, Kaunas); the Lithuanian company register was not opened.
- ISO 27001 certificate opened as a PDF hosted on iDenfy's site; CERT International's own register was not checked.
- iDenfy's iBeta ISO 30107-3 claim not found on iBeta's public confirmation-letter list; kept as vendor-stated.
- SOC report type (1 or 2) not stated by iDenfy.
- Former name "Identifikaciniai Projektai" and co-founder Gediminas Ciulde could not be confirmed; removed.
- The homepage claim of "up to 70% lower costs" has no stated baseline; removed from pricing summary.
- Pricing calculator on the pricing page shows an inconsistent total (100 x $1.35 shown as $1,215); per-check figure taken from the plan block.
- Trustpilot reviews include end users being verified, not only business customers.
