faq:
- q: How does iDenfy's pricing work?
  a: iDenfy charges only for approved verifications — rejected checks aren't billed, which the company reports can save up to 70% versus pay-per-completed-verification pricing. Contact iDenfy for current rates.
- q: Does iDenfy use human review?
  a: Yes, every verification case at iDenfy includes a human review step alongside its AI-driven checks.
- q: Does iDenfy support KYB?
  a: Yes, iDenfy offers business verification (KYB) alongside individual identity checks.
- q: Where is iDenfy based?
  a: iDenfy is headquartered in Kaunas, Lithuania, and offers an EU-hosted option with EEA-specific document templates.
- q: What is the best alternative to iDenfy?
  a: Sumsub is the best alternative for larger scale and published pricing. ComplyCube is the closest fit for a comparably budget-friendly API-first option.
- q: Who are iDenfy's main competitors?
  a: iDenfy competes with Sumsub, ComplyCube, and Shufti Pro, differentiating through its pay-per-approved pricing and human-reviewed process.
