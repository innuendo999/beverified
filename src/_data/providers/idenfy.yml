verification_notes:
- 'The /pricing/ URL (source 1) now shows only a quote form to our fetcher; plan figures come from the identity-verification-price page (source 8) and the billing docs (source 9). A second iDenfy pricing page variant (idenfy.com/?p=481) shows Enterprise at $0.90 per verification with a 6,000 checks per year minimum, falling to $0.55 from 12,000; not used because it conflicts with source 8.'
- 'Add-on prices (approved-only, AML, 24/7 review) now appear only in the ROI calculator (source 10), which calls them estimates subject to change and lists 24/7 review at different prices in different sections. The billing docs say the pay-per-approved unit price is "slightly higher" without a figure. iDenfy''s AI info page describes pay-per-approved as the default model.'
- 'Price calculator on source 8 shows totals that do not match the unit prices (100 x $1.35 shown as $270; Premium 100 x $1.30 shown as $260, below its $325 minimum). Per-check figures taken from the plan cards.'
- 'Document count conflicts: the homepage now says 3,500+ active government-issued documents, iDenfy''s AI info page says 16,000+ document types. Number removed from what_is.'
- 'HQ evidence is the ISO certificate address (59 Kazimiero Barsausko St, Kaunas). The Lithuanian Register of Legal Entities was not opened; the aggregator scoris.lt lists iDenfy, UAB (code 304617621, registered 25 Aug 2017) at a different Kaunas address (Griciupio g. 7-212).'
- 'ISO 27001 certificate ISMS-1851/A (CERT International) opened as a PDF on iDenfy''s site; CERT International''s register not checked. iDenfy''s compliance docs (source 11) cite a different certificate, No. 1512120135 from TUV Thuringen; not reconciled.'
- 'iBeta ISO 30107-3: iDenfy says it was tested under iBeta methodology (source 11) with no level or date; not found on the readable part of iBeta''s confirmation-letter list. Kept as vendor-stated.'
- 'SOC 2 Type II auditor named by iDenfy as House of CPA; report not public (on request).'
- 'Trustpilot reviews include end users being verified, not only business customers. Trustpilot count fell from 31 to 29 since 2026-10-18.'
