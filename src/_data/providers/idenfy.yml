verdict: 'iDenfy''s pricing is its headline feature. It publishes self-serve rates of $1.35 per verification on Basic ($135 monthly minimum) and $1.30 on Premium ($325 minimum), and for $0.50 more per check you pay only for approved verifications, so rejected checks cost nothing. That is unusual in a category dominated by quote-only pricing. Add in-house manual review and it is a strong fit for cost-conscious fintech, crypto and gaming teams, even if its brand scale trails category leaders.'
what_is:
- iDenfy (UAB "iDenfy") is an identity-verification company founded in 2017 and based in Kaunas, Lithuania, with offices in the United Kingdom and the USA. CEO Domantas Ciulde leads a team of 50+. It serves fintech, crypto, gaming and marketplace businesses, combining AI-driven document and biometric checks with in-house experts who double-check verifications. It says it supports onboarding in 200+ countries and territories, extracts data from government-issued documents and is used by 1,000+ businesses.
features:
- AI document and biometric verification with liveness, double-checked by in-house reviewers (24/7 manual review is a paid add-on).
- KYB with access to 180+ company registries in 120 countries, plus UBO verification.
- Proxy detection, phone validation and verification, address checks and risk assessment.
- AML screening and ongoing monitoring, plus transaction monitoring.
- NFC-based document verification.
- 'Approved-only billing add-on: rejected verifications are not charged.'
pricing:
