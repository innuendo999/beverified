verdict: 'iDenfy''s pricing model is its headline feature: you pay only for approved verifications, with rejected checks billed at nothing — a genuinely unusual structure in a category dominated by per-attempt or subscription pricing. Add human review of every case and it''s a strong fit for cost-conscious fintech, crypto, and gaming teams, even if its brand scale trails category leaders.'
what_is:
- iDenfy is an identity-verification company founded in 2017 (originally Identifikaciniai Projektai) and headquartered in Kaunas, Lithuania, co-founded by CEO Domantas Ciulde and Gediminas Ciulde. It serves fintech, crypto, gaming, and marketplace businesses with a three-layer AI and human-reviewed verification process, offering an EU-hosted option and templates for EEA national ID documents.
features:
- AI biometric, liveness, and document verification with human review on every case.
- KYB and business verification.
- Proxy detection and fraud scoring.
- AML screening and ongoing monitoring.
- NFC-based document verification.
- Pay-per-approved pricing model — rejected verifications aren't billed.
