faq:
- q: How does iDenfy's pricing work?
  a: iDenfy's Basic plan costs $1.35 per verification with a $135 monthly minimum, and Premium costs $1.30 per verification with a $325 monthly minimum. Its ROI calculator lists approved-only billing at $0.50 more per check, so rejected verifications are not charged. Enterprise pricing is custom and, according to iDenfy, drops to $0.55 per verification at volume. A 14-day free trial includes 10 checks.
- q: Does iDenfy use human review?
  a: iDenfy says in-house experts double-check identity verifications. Its ROI calculator lists round-the-clock (24/7) manual review as a per-check add-on at $0.35 to $0.55, depending on the plan.
- q: Does iDenfy support KYB?
  a: Yes. iDenfy offers business verification (KYB) with access to 180+ company registries in 120 countries, plus UBO verification.
- q: Where is iDenfy based?
  a: iDenfy (UAB "iDenfy") is based in Kaunas, Lithuania, with offices in the United Kingdom and the USA.
- q: What is the best alternative to iDenfy?
  a: Sumsub is the best alternative for larger scale and published pricing. ComplyCube is the closest fit for a comparably budget-friendly API-first option.
- q: Who are iDenfy's main competitors?
  a: iDenfy competes with Sumsub, ComplyCube, and Shufti Pro, differentiating through its approved-only billing option and published per-check pricing.
