verdict: AMLRanger (styled AML Ranger) is not a separate company. It is an AI screening assistant made by Ondato, the London-headquartered KYC and AML vendor, and went live in October 2025. It runs sanctions, PEP and adverse-media checks and returns short sourced reports, and it is free to use with monthly credits. It suits quick individual checks; teams that need case management, ongoing monitoring or a documented API should look at Ondato's main AML software or a dedicated screening platform.
what_is:
- AMLRanger is an AI-powered AML screening assistant launched by Ondato in October 2025. It offers three assistants (PEP Screening Ranger, Sanctions Screening Ranger and Adverse Media Ranger) that search global and local sources in real time and summarise findings with sources, in under 30 seconds per check according to Ondato. It is free to use with monthly credits. Ondato was founded in 2018, is headquartered in London and runs R&D in Vilnius, Lithuania.
features:
- Sanctions screening assistant.
- PEP screening assistant.
- Multilingual adverse-media screening assistant.
- Sanctions, watchlist, PEP and adverse-media sources in 100+ languages, according to Ondato.
- Real-time analysis across global and local data sources.
- Uses context to reduce false positives, according to Ondato.
- Short reports with sources, in under 30 seconds per check according to Ondato.
