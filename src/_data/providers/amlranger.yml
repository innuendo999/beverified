verification_notes:
- 'AMLRanger (AML Ranger) is an Ondato product launched in October 2025, not a standalone company; Ondato''s about page lists it as its first AI-powered assistant (source 4).'
- 'amlranger.ai and its sub-pages (/pep-screening, /sanctions-screening, /adverse-media-screening, /simplified-due-diligence; /pricing has no content) render only metadata to our fetch tools, so the in-app plan screen, credit allowance and any paid tier could not be checked. Free monthly credits are now confirmed by Ondato (source 6); the amount is not published anywhere we found.'
- 'API: Ondato''s blog (source 6) says AML Ranger is designed to integrate with banks'' systems via API, while amlranger.ai says it "requires no setup or APIs" (source 7). No API documentation found; the record says no API documentation is published rather than no API.'
- 'Ongoing monitoring: amlranger.ai PEP page metadata mentions tracking status changes and the sanctions page mentions AML monitoring; press says real-time screening and monitoring. No description of a continuous-monitoring feature found, so it is not claimed.'
- 'No G2, Capterra or Gartner Peer Insights listing for AML Ranger found (Capterra "Ranger" 1244459 is an unrelated RFP tool). No user_ratings.'
- 'No certifications claimed for AML Ranger. Ondato''s about page shows GDPR and unnamed "ISO" badges plus KJM and NIST NISTIR 8525 badges for Ondato in general; not attached to this product.'
- 'link.type left null for the owner to decide. Alternatives do not include Ondato itself (locked field); consider an Ondato review.'
