faq:
- q: How much does AMLRanger cost?
  a: AMLRanger is free to use through a web portal, with free credits that renew each month. Ondato does not publish the monthly credit allowance or any paid tiers.
- q: Who makes AMLRanger?
  a: AMLRanger is a product of Ondato, a KYC and AML vendor founded in 2018 and headquartered in London. It went live in October 2025.
- q: Where is AMLRanger's company headquartered?
  a: Ondato, which makes AMLRanger, lists its headquarters in London and its R&D centre in Vilnius, Lithuania.
- q: What does AMLRanger screen for?
  a: AMLRanger has three assistants for sanctions, PEP and adverse-media screening. Each returns a short report with sources.
- q: What is the best alternative to AMLRanger?
  a: ComplyAdvantage is the best-documented alternative with a verified enterprise track record. Napier AI is the closest fit for AI-native transaction monitoring.
- q: Who are AMLRanger's competitors?
  a: AMLRanger competes in the sanctions/PEP screening space alongside ComplyAdvantage, Napier AI, and SEON.
