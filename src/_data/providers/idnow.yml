verdict: IDnow made its name on VideoIdent, the human-video identity check that satisfies Germany's strict BaFin financial-regulator requirements — a compliance bar few global competitors are built around. Its 2022 acquisition of France's Ariadnext extended that strength across Europe, though its brand and case studies still skew most heavily toward the DACH region.
what_is:
- IDnow is an identity-verification company founded in 2014 and headquartered in Munich, Germany, led by CEO Andreas Bodczek. It built its reputation on VideoIdent, a BaFin-compliant video identification method required for many regulated onboarding flows in Germany, and has since expanded into automated (AutoIdent) verification and e-signing, extending its European footprint through the 2022 acquisition of French identity-verification company Ariadnext.
features:
- VideoIdent — BaFin-compliant, human-assisted video identity verification.
- AutoIdent — automated document and biometric identity checks.
- eSigning for qualified electronic signatures.
- Trust services aligned with German and EU regulatory requirements.
- Pan-European document coverage extended via the Ariadnext acquisition.
- AML/KYC screening alongside core identity verification.
