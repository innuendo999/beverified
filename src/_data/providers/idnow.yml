faq:
- q: How much does IDnow cost?
  a: IDnow does not publish pricing; its VideoIdent and AutoIdent products are licensed on a per-verification, volume-based basis.
- q: What is VideoIdent?
  a: VideoIdent is IDnow's human-assisted video identity-verification method, built to satisfy Germany's BaFin financial-regulator requirements for regulated onboarding.
- q: Does IDnow only serve Germany?
  a: No, though its strongest track record is in the DACH region. Its 2022 acquisition of France's Ariadnext extended its document coverage and reach across Europe.
- q: Does IDnow support e-signing?
  a: Yes. IDnow offers eSigning for qualified electronic signatures alongside its core identity-verification products.
- q: What is the best alternative to IDnow?
  a: Signicat is the best alternative for the broadest set of national eID methods across Europe. Sumsub is the closest fit for published pricing and global/crypto coverage.
- q: Who are IDnow's main competitors?
  a: IDnow competes with Signicat, Onfido, and Sumsub, differentiating through its BaFin-compliant VideoIdent and deep German-market relationships.
