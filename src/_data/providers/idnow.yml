faq:
- q: How much does IDnow cost?
  a: Pricing is not published; IDnow quotes on request. Its products are licensed to regulated institutions on a volume basis.
- q: What is VideoIdent?
  a: VideoIdent is IDnow's agent-led video identity-verification method. A trained specialist checks the user over live video, and IDnow builds it to meet BaFin Circular 3/2017 and the German Money Laundering Act.
- q: Does IDnow only serve Germany?
  a: No, though its strongest track record is in the DACH region. Its acquisition of France's ARIADNEXT, announced in 2021, extended its reach across Europe, and it reports 600+ customers worldwide.
- q: Does IDnow support e-signing?
  a: Yes. IDnow offers simple, advanced and qualified electronic signatures and qualified electronic seals alongside its identity-verification products.
- q: Who owns IDnow?
  a: Corsair Capital, a minority investor since 2019, acquired a majority stake in March 2025. Philippe Morel was confirmed as CEO in July 2026.
- q: What is the best alternative to IDnow?
  a: Signicat is the best alternative for the broadest set of national eID methods across Europe. Sumsub is the closest fit for published pricing and global/crypto coverage.
- q: Who are IDnow's main competitors?
  a: IDnow competes with Signicat, Onfido, and Sumsub, differentiating through VideoIdent and deep German-market relationships.
