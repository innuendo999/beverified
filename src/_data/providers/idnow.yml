verdict: IDnow made its name on VideoIdent, an agent-led video identity check built to meet BaFin Circular 3/2017 and the German Money Laundering Act. Few global competitors are built around that compliance bar. Its acquisition of France's ARIADNEXT, announced in 2021, extended that strength across Europe, though its brand and case studies still skew most heavily toward the DACH region.
what_is:
- IDnow is an identity-verification company founded in 2014 and headquartered in Munich, Germany. Corsair Capital took a majority stake in March 2025, and Philippe Morel was confirmed as CEO in July 2026, succeeding Andreas Bodczek. IDnow built its reputation on VideoIdent, an agent-led video identification method used for regulated onboarding in Germany and Austria. It has since expanded into automated document and biometric verification, eID and EUDI Wallet support, AML screening and qualified e-signing, and extended its European footprint by acquiring French identity-verification company ARIADNEXT. IDnow reports 145M+ completed transactions a year and 600+ customers.
features:
- 'VideoIdent: agent-led video identity verification built for BaFin Circular 3/2017 and Austrian FMA rules.'
- Automated document and biometric verification (AutoIdent) across 3,800+ supported documents.
- Simple, advanced and qualified electronic signatures (SES, AES, QES) and qualified electronic seals.
- eID schemes and EUDI Wallet support for identification and authentication.
- AML screening, IBAN, address and driving licence verification alongside core identity checks.
- Risk intelligence and device authentication for fraud prevention.
