verification_notes:
- ARIADNEXT deal announced 30 June 2021 and subject to regulatory approval (sources 7, 9). No page opened gives the closing date.
- PVID, ETSI TS 119 461, ISO/IEC 27001, ISAE 3402 and TISAX come from IDnow's own trust centre (source 10), which lists certificate numbers. The ANSSI catalogue PDF, the LSTI register and the ENX TISAX database were not opened, so all stay vendor_stated.
- QTSP status of IDnow Trust Services AB is from IDnow's press release only; the EU Trusted List browser did not load.
- Founded 2014 and the Corsair majority stake come from IDnow's press release (source 8) and Munich Startup (source 3). The deal closing date and the commercial register entry were not opened.
- G2 has no IDnow listing. Capterra UK has a single review, too few for themes.
