verdict: 'Feedzai operates at a different scale than most of this batch: real-time machine-learning fraud detection deployed across roughly 80% of the Fortune 500 and four of North America''s five largest banks, protecting more than $8 trillion in transactions annually by the company''s own figures. That scale is built for tier-1 institutions — pricing is enterprise-only, and integration timelines reflect it.'
what_is:
- Feedzai is a payment-fraud detection and transaction-monitoring company founded in 2011 and headquartered in Coimbra, Portugal, with a US headquarters in San Mateo, California, and an office in the UK. Led by CEO Nuno Sebastião alongside co-founders Pedro Bizarro and Paulo Marques, Feedzai became a unicorn in 2021 and, by its own figures, protects more than $8 trillion in transactions annually across roughly 80% of the Fortune 500 and four of the five largest banks in North America.
features:
- Real-time machine-learning transaction fraud detection.
- RiskOps platform combining fraud detection, case management, and risk orchestration.
- Device intelligence layered into transaction scoring.
- Customizable fraud-detection workflows per institution.
- Transaction scoring across the full customer lifecycle, not just onboarding.
- Built for the volume and latency requirements of Tier-1 banks and card networks.
