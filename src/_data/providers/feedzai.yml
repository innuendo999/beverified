verdict: 'Feedzai operates at a different scale than most of this batch: real-time AI fraud and AML detection that, by the company''s own figures, secures about $9 trillion in payments a year and protects around 1 billion consumers, with banks and processors such as Mastercard, Fiserv, CaixaBank and Raiffeisen Bank International among its named customers. That scale is built for large institutions. Pricing is enterprise-only, and integration timelines reflect it.'
what_is:
- Feedzai is a fraud-prevention and AML company founded in 2011 in Coimbra, Portugal, by Nuno Sebastião, Pedro Bizarro and Paulo Marques. Nuno Sebastião is co-founder, chairman and CEO. It lists offices in Coimbra, Lisbon, Porto, London, New York and Atlanta. Feedzai became a unicorn in 2021, bought DemystData in 2025 and raised a roughly $75 million Series E in October 2025 at a valuation above $2 billion. By its own figures it processes 120 billion events and secures $9 trillion in payments a year. It was also selected as the primary fraud detection provider for the ECB's proposed digital euro.
features:
- Real-time AI transaction fraud, new-account fraud and scam detection.
- RiskOps platform combining fraud, identity and AML, with RiskOps Studio for strategy configuration, investigations and reporting.
- Device intelligence and behavioral biometrics layered into risk scoring.
- AML transaction monitoring and watchlist screening.
- Feedzai IQ network intelligence and the Farol AI agent for risk analysis and investigations.
- Built for the volume and latency requirements of large banks, processors and card networks.
