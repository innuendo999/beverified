verification_notes:
- 'The old claims "about 80% of the Fortune 500" and "four of the five largest North American banks" were not found on any current Feedzai page or news source we opened; removed.'
- '"$8T+ protected" replaced by the current vendor figure of $9T in payments a year (about-us and homepage).'
- US HQ in San Mateo is no longer listed; the contact page lists six offices without naming a headquarters. Old HQ fact replaced by the office list.
- Paulo Marques is named as a co-founder by ECO News (2025) but is not on the current leadership page.
- No certifications are published on Feedzai's site; trust.feedzai.com blocks automated access. A Feedzai job ad mentions PCI DSS, ISO/IEC 27001/27701 and SOC 2 as standards the team works to, which is not a certification claim, so nothing is listed.
- G2 profile exists but shows no reviews (checked 2026-10); no user ratings added. User review themes are general statements, not counted themes.
- DemystData deal value (about $100M) is from unnamed sources in ECO News; not used in the page.
