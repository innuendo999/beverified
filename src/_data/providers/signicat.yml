faq:
- q: How much does Signicat cost?
  a: Signicat does not publish prices. Its pricing page says costs combine setup, subscription and transaction fees, with transaction prices depending on the identity methods used and volume discounts applied. A free developer account is available.
- q: What is an EU Qualified Trust Service Provider?
  a: A QTSP is a provider authorized under the EU's eIDAS regulation to provide qualified trust services such as qualified certificates, time-stamps and signature validation. Signicat lists QTSP entries in Norway, Spain and Lithuania (through Dokobit).
- q: How many identity methods does Signicat support?
  a: Signicat says it supports 35+ electronic identity methods and digital wallets, most of them European.
- q: Does Signicat do AML screening?
  a: Signicat offers access to PEP, sanctions and adverse-media data sources within its platform, and it added anti-fraud and identity technology through its April 2022 acquisition of the UK company Sphonic.
- q: What is the best alternative to Signicat?
  a: IDnow is the best alternative for BaFin-compliant video identification in Germany specifically. Sumsub is the closest fit for published pricing and global/crypto coverage.
- q: Who are Signicat's main competitors?
  a: Signicat competes with IDnow, Onfido, and Sumsub, differentiating through the breadth of national eID methods it supports across Europe.
