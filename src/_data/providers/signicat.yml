verification_notes:
- EU QTSP status is vendor-stated here; Signicat links to EU Trusted List entries (NO, ES, LT) but the trusted-list browser is a dynamic app and was not read.
- ISO 27001 confirmed from the DNV certificate PDF itself (C849517, Signicat AS, valid 12 Oct 2026 to 11 Oct 2029); the DNV certificate checker blocked automated access.
- UK DIATF register entry for Signicat B.V. (ReadID) opened; the page did not show role or certificate dates.
- SOC 2 statement on the security page refers to Type 1 for 2018 and Type 2 for 2019; no current report confirmed.
- Idfy was removed from the acquisitions list (no source opened) and "spin-off of Kantega" removed (no source opened).
- Customer count changed from 1,300+ enterprise customers to the vendor's current "more than 21,000 companies"; the two figures may count different things.
- Homepage claims "over 240 identity methods", which appears to include data sources; we keep the About page's 35+ eID methods and digital wallets.
- G2 has only 8 reviews; user review themes are kept as general statements.
