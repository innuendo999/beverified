verdict: 'Signicat''s breadth is its case: 35+ electronic-ID methods and digital wallets, e-signatures, and KYC/AML onboarding in one platform, built through a run of acquisitions since 2019 (Connectis, Encap, Dokobit, Electronic IDentification, Sphonic and, in 2025, Inverid''s ReadID). It is an EU qualified trust service provider and holds a DNV-issued ISO 27001 certificate, which makes it a natural fit for pan-European onboarding, though its per-country breadth is more valuable in Europe than elsewhere.'
what_is:
- Signicat is a digital-identity and electronic-trust platform that has operated since 2006, headquartered in Trondheim, Norway, and owned by Nordic Capital since 2019. It covers identity proofing, authentication, electronic signing and trust orchestration, and says more than 21,000 companies use its solutions. It grew through acquisitions including Connectis, Encap, Dokobit, Electronic IDentification, the UK anti-fraud and identity specialist Sphonic (2022) and Inverid, maker of the NFC-based ReadID (2025).
features:
- 35+ electronic-ID (eID) methods and digital wallets, mostly European.
- ID document and biometric verification, including NFC chip reading through ReadID.
- Electronic signing (API and Dokobit portal) and trust orchestration in one platform.
- PEP, sanctions and adverse-media data sources within the onboarding platform.
- Fraud and identity risk tooling, expanded through the 2022 Sphonic acquisition.
- EU Qualified Trust Service Provider (QTSP) services under eIDAS.
