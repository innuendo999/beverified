verification_notes:
- EU QTSP status (Signicat AS time-stamps NO, Signicat SLU certificates ES, Dokobit UAB validation LT) is still vendor-stated. The EU trusted-list browser is a dynamic app, and the national lists (nkom.no XML/PDF, Spanish ministry TSL) blocked automated access on 2026-10-22. The BSI directory entry ETS 055 that search links to Signicat could not be read.
- SOC 2 is vendor-stated; the security page still cites Type 1 for 2018 and Type 2 for 2019 and shares the report only with contracted customers. No current report confirmed.
- Cyber Essentials Plus is vendor-stated; the security page gives no certificate or link, and no IASME register entry was opened.
- User ratings are thin (G2 8 reviews, Capterra 1). Gartner Peer Insights shows 4.7 in a ratings overview but 0 all-time reviews in the header, so it is not recorded. Review themes stay as general statements.
