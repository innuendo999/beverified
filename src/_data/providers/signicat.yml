faq:
- q: How much does Signicat cost?
  a: Signicat does not publish pricing; its platform is licensed based on module selection (identity verification, e-signing, KYC/AML) and volume.
- q: What is an EU Qualified Trust Service Provider?
  a: A QTSP is a provider authorized under the EU's eIDAS regulation to issue qualified electronic signatures and trust services; Signicat holds this status.
- q: How many identity methods does Signicat support?
  a: Signicat supports 35+ national electronic-ID (eID) verification methods across Europe, one of the broadest sets in the category.
- q: Does Signicat do AML screening?
  a: Yes, through its 2022 acquisition of the UK-based fraud-and-AML specialist Sphonic, Signicat added financial-crime detection to its identity platform.
- q: What is the best alternative to Signicat?
  a: IDnow is the best alternative for BaFin-compliant video identification in Germany specifically. Sumsub is the closest fit for published pricing and global/crypto coverage.
- q: Who are Signicat's main competitors?
  a: Signicat competes with IDnow, Onfido, and Sumsub, differentiating through the breadth of national eID methods it supports across Europe.
