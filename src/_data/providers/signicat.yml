verdict: 'Signicat''s breadth is its case: 35+ national electronic-ID methods, e-signatures, and KYC/AML onboarding unified in one platform, built through nearly a decade of acquisitions (Idfy, Connectis, Encap Security, Sphonic, and others). As an EU-qualified trust service provider, it''s a natural fit for pan-European onboarding, though its per-country breadth is more valuable in Europe than elsewhere.'
what_is:
- Signicat is a digital-identity and electronic-trust platform founded in 2006 as a spin-off of Kantega, headquartered in Trondheim, Norway, and backed by Nordic Capital since 2019. It unifies identity verification, authentication, electronic signing, and KYC/AML onboarding for more than 1,300 enterprise customers across banking, government, and insurance, built up through acquisitions including Idfy, Connectis, Encap Security, and the UK fraud-and-AML specialist Sphonic.
features:
- 35+ national electronic-ID (eID) verification methods across Europe.
- Document and biometric identity verification for KYC/KYB onboarding.
- Electronic signing and identity orchestration in one platform.
- AML/KYC-compliant onboarding workflows aligned with eIDAS.
- Fraud and financial-crime detection via its Sphonic acquisition.
- EU Qualified Trust Service Provider (QTSP) status.
