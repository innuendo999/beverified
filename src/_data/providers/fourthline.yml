verification_notes:
- Veridas merger signed 16 Jul 2026, expected to close in H2 2026 subject to regulatory approvals. As of 22 Oct 2026 neither the Fourthline newsroom (latest item 13 Oct 2026) nor press coverage reports completion, a combined brand name, post-merger leadership or ownership split. Re-check after closing; name, brand and ownership fact may change.
- 'KYB (re-checked 2026-10-25): the homepage navigation lists Identity Verification, Digital Proof of Address, Qualified Electronic Signature, Investigations & CDD Reporting, AML Screening & Monitoring, Re-KYC & Remediation, Anti-Financial Crime and Case Review Portal, with no KYB or business verification product; the docs describe clients as natural persons. kyb removed from categories and KYB from directory_categories on 2026-10-25. Only historical mention found: a 13 Jan 2021 Fourthline news item on 2020 growth (fourthline.com/news/fourthline-celebrates-record-growth-2020) says Bol.com verified 20,000+ resellers through "Fourthline''s KYC for Business solution". Not used in copy; no current product page found.'
- ISO/IEC 27001:2022 (EY CertifyPoint 2021-039), iBeta ISO 30107-3 Level 1/2 and ISAE 3000 remain vendor-stated. The certificate was not opened, and iBeta's confirmation-letter page could not be fetched (robots block), so no lab letter was seen.
- eIDAS QTSP status: Fourthline's 24 Aug 2026 release says Fourthline Trust Services AB is on the EU Trusted List under PTS supervision. The EU trusted list browser and the PTS list could not be read with our tools; status stays vendor_stated.
- No user ratings: the G2 page (source 11) and the Capterra listing (capterra.com/p/206795/Fourthline) show no rating or reviews; Gartner Peer Insights could not be fetched. Review themes are general statements, not counted themes.
