faq:
- q: How much does Fourthline cost?
  a: Fourthline does not publish pricing; its modular KYC/AML platform is licensed to regulated institutions based on volume and module selection.
- q: Who uses Fourthline?
  a: Fourthline serves European banks and fintechs. Clients named in July 2026 include Revolut, N26, Trade Republic, Qonto, Scalable Capital, Scalapay, Raisin, Rabobank and Bitpanda.
- q: What is re-KYC?
  a: Re-KYC is Fourthline's automated process for re-verifying and remediating existing customer files so they stay compliant without manual review.
- q: Is Fourthline merging with another company?
  a: Yes. In July 2026 Fourthline and Spanish digital identity provider Veridas agreed to merge, aiming at a combined platform for Europe, Latin America and the US. Completion was expected in the second half of 2026, subject to regulatory approvals.
- q: Can Fourthline issue qualified electronic signatures?
  a: Yes. In August 2026 its subsidiary Fourthline Trust Services AB received qualified trust service provider status under eIDAS, supervised by the Swedish Post and Telecom Authority.
- q: What is the best alternative to Fourthline?
  a: Sumsub is the best alternative for published pricing and broader global/crypto coverage. IDnow is the closest fit for BaFin-compliant video identification specifically in Germany.
- q: Who are Fourthline's main competitors?
  a: Fourthline competes with Sumsub, Onfido, and IDnow, differentiating through its deep focus on regulated European financial institutions.
