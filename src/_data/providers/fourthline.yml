verdict: Fourthline built its reputation inside Europe's regulated financial sector — N26, Trade Republic, Qonto, and Western Union are among its clients — combining identity verification, AML screening, and continuous re-KYC in a single API. It's deliberately focused on financial institutions rather than chasing every vertical, and in 2026 announced plans to merge with Veridas into a combined global identity platform.
what_is:
- Fourthline is a KYC and AML compliance company founded in 2017 (rebranded from Safened in 2019) and headquartered in Amsterdam, co-founded by Krik Gunning and Chris van Straeten. It provides a single-API platform combining identity verification, fraud detection, and AML screening for banks, fintechs, and insurers, serving European clients including N26, Trade Republic, Qonto, and Western Union.
features:
- Single API integration covering identity verification, AML, and fraud detection.
- AI-enabled photometric algorithms for biometric verification.
- Automated, customizable re-KYC (continuous KYC) process.
- Bank-account verification and transaction monitoring.
- Custom watchlist and sanctions-list screening.
- Modular deployment — pick individual modules by risk appetite.
