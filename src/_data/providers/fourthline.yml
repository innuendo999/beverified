faq:
- q: How much does Fourthline cost?
  a: Fourthline does not publish pricing; its modular KYC/AML platform is licensed to regulated institutions based on volume and module selection.
- q: Who uses Fourthline?
  a: Fourthline serves European banks, fintechs, and insurers, including N26, Trade Republic, Qonto, Scalable Capital, and Western Union.
- q: What is re-KYC?
  a: Re-KYC (continuous KYC) is Fourthline's automated process for periodically re-verifying existing customers to stay compliant without manual review.
- q: Is Fourthline merging with another company?
  a: In 2026, Fourthline announced plans to merge with Veridas to form a combined global identity platform spanning Europe, Latin America, and the US.
- q: What is the best alternative to Fourthline?
  a: Sumsub is the best alternative for published pricing and broader global/crypto coverage. IDnow is the closest fit for BaFin-compliant video identification specifically in Germany.
- q: Who are Fourthline's main competitors?
  a: Fourthline competes with Sumsub, Onfido, and IDnow, differentiating through its deep focus on regulated European financial institutions.
