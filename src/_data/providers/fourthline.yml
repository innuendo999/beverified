verification_notes:
- Veridas merger announced 16 Jul 2026, expected to close in H2 2026 subject to regulatory approval. No completion notice found on the Fourthline newsroom (latest item 13 Oct 2026). Re-check after closing; name or brand may change.
- Total funding "€70M raised" not confirmed. Only the €50M round of April 2023 led by Finch Capital (FinTech Futures) was confirmed; funding fact removed.
- '"Rebranded from Safened in 2019" not found on any page opened; removed.'
- Western Union was named as a client in 2023 (FinTech Futures) but not in the July 2026 client list; dropped from the client list.
- KYB is not listed among Fourthline's current solutions on its homepage, although the record sits in the KYB category. Bank-account verification and transaction monitoring are also not on current pages; removed from features.
- ISO/IEC 27001 (EY CertifyPoint 2021-039), iBeta Level 1/2 and ISAE 3000 are vendor-stated; certificate and lab letter not opened. Fourthline was not found on iBeta's public confirmation-letter page, so the iBeta work may sit with a technology partner or under another name.
- eIDAS QTSP status is reported by Fourthline and Biometric Update; the EU trusted list entry was not opened.
- No G2 rating or review count visible; user review themes are general statements, not counted themes.
- Founding year: vendor says 2017; one FinTech Futures article (2023) says 2018. Vendor year kept.
