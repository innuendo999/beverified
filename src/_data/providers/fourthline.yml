verdict: Fourthline built its reputation inside Europe's regulated financial sector, with Revolut, N26, Trade Republic, Qonto and Bitpanda among its clients. It combines identity verification, AML screening and monitoring, and re-KYC in one modular platform, and since August 2026 its Swedish subsidiary is a qualified trust service provider for electronic signatures. It's deliberately focused on financial institutions rather than chasing every vertical. In July 2026 it agreed to merge with Spanish identity provider Veridas; the deal was expected to close in the second half of 2026, subject to regulatory approval.
what_is:
- Fourthline is a KYC and AML compliance company founded in 2017 and headquartered in Amsterdam, with an office in Barcelona. It was co-founded by Krik Gunning and Chris van Straeten; Paul Stoddart became CEO in 2026. It provides a modular platform combining identity verification, AML screening and monitoring, re-KYC and fraud detection for banks, fintechs and insurers, and says it is locally compliant in 30+ jurisdictions and supports 3,500+ document types. Clients named in 2026 include Revolut, N26, Trade Republic, Qonto, Scalable Capital, Raisin, Rabobank and Bitpanda.
features:
- Modular platform covering identity verification, AML screening and monitoring, and fraud detection.
- Biometric face match and liveness detection, with iBeta Level 1 and 2 testing stated by the vendor.
- Automated re-KYC and remediation for existing customers.
- Digital proof of address and qualified electronic signatures (QES).
- Investigations, CDD reporting and a case review portal.
- 'Modular deployment: pick individual modules by risk appetite.'
