# AML for Banks 1.0 evidence (docs/scoring-aml-banks.md), one entry per provider in the aml/banks ranking.
# Read by scripts/rescore-aml-banks.mjs together with the provider record (capabilities{}, integration{}, certifications[]).
# Evidence protocol: product pages, documentation portal, brochures and datasheets on the vendor's own domain, trust centre.
# Pages behind a login or a form do not count. Every value has a url and the date it was checked.
# Values the scorer reads:
#   typologies: named | count | none          latency: stated | none
#   channels: [names as the vendor writes them]  entity_links, segmentation, alert_priority, self_service_rules, simulation: yes | partial | no
#   alert_reason: factors (rules or risk factors shown) | generic | no
#   filing: named_channel (FinCEN BSA e-filing, goAML) | claimed (filing or pre-filled reports, channel not named) | no
#   change_log: with_approvals | log_only | no      data_model: published | described | no      ingestion: both | one | no
#   four_eyes: yes | no
# fit: no points; shown per provider as yes, no or not stated.
complyadvantage:
  checked: '2026-11-24'
  bank_evidence: {value: Hampshire Trust Bank (UK specialist bank) case study, url: 'https://complyadvantage.com/customer-stories/how-htb-deployed-an-agile-scalable-transaction-monitoring-and-customer-screening-program/'}
  typologies: {value: count, note: rule categories such as velocity and average amount; no scenario list, url: 'https://complyadvantage.com/transaction-monitoring/'}
  latency: {value: stated, note: sub-second responses, aggregation under 20 ms, url: 'https://complyadvantage.com/transaction-monitoring/'}
  channels: {value: [cards, crypto], url: 'https://complyadvantage.com/transaction-monitoring/'}
  entity_links: {value: no, note: related entities shown in the case view only, url: 'https://complyadvantage.com/transaction-monitoring/'}
  segmentation: {value: yes, note: customers grouped by attributes and risk level, url: 'https://complyadvantage.com/transaction-monitoring/'}
  alert_priority: {value: yes, note: alert priorities set to the firm's risk appetite, url: 'https://complyadvantage.com/transaction-monitoring/'}
  alert_reason: {value: factors, note: risk score component breakdown and natural-language reasoning, url: 'https://complyadvantage.com/transaction-monitoring/'}
  filing: {value: claimed, note: SAR and CTR reports and filing; channel not named, url: 'https://complyadvantage.com/transaction-monitoring/'}
  four_eyes: {value: no, note: review stages for workflows; no second-reviewer rule stated, url: 'https://complyadvantage.com/transaction-monitoring/'}
  self_service_rules: {value: partial, note: natural-language rule building, but the FAQ says rules are created during implementation, url: 'https://complyadvantage.com/transaction-monitoring/'}
  simulation: {value: partial, note: sandbox shows alert-volume impact before go-live; historical data not stated, url: 'https://complyadvantage.com/transaction-monitoring/'}
  model_docs: {value: partial, note: independent validation and bias management mentioned; no documentation pack, url: 'https://complyadvantage.com/transaction-monitoring/'}
  change_log: {value: no, url: 'https://complyadvantage.com/transaction-monitoring/'}
  data_model: {value: described, note: composable data model over a JSON REST API; no public specification, url: 'https://complyadvantage.com/transaction-monitoring/'}
  ingestion: {value: one, note: real-time API; batch for transactions not stated, url: 'https://complyadvantage.com/transaction-monitoring/'}
  fit:
    deployment: {value: vendor-hosted cloud, url: 'https://complyadvantage.com/customer-stories/how-htb-deployed-an-agile-scalable-transaction-monitoring-and-customer-screening-program/'}
    core_systems: {value: not stated}
    overlay: {value: not stated}
    framl: {value: yes, url: 'https://complyadvantage.com/transaction-monitoring/'}
    filing_channel: {value: not stated}
