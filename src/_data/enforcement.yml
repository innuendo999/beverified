# AML Fines Tracker data: one record per regulator document (docs/aml-fines.md).
# Hand-written fields only. Machine fields (sha256, pages, archive copy, link status,
# excerpt check, FX rates) live in src/_data/enforcementDocs.json, written by
# scripts/enforcement/fetch.mjs in GitHub Actions. Never type a USD conversion here.
#
# date_basis: signed (the date on the signature page) | published (the regulator's list
#   or release date, used when the document leaves the signature date blank)
# firm_type: bank | broker | msb | emi | payment | neobank | vasp | card | casino | individual | other
# action: penalty | settlement | restriction | licence_revoked | cease_and_desist | order_no_penalty | formal_agreement
# position: admitted | neither_admit_nor_deny | contested | not_stated
# failures: keys of the taxonomy in docs/aml-fines.md, section 5.1
# findings[].level: order | press_notice | media
# findings[].excerpt: verbatim text from the document. Full sentences only from US federal
#   documents (FinCEN, OFAC, OCC, Fed, FDIC); under 15 words for every other source.
#   fetch.mjs checks that each excerpt appears in the document text.
# earlier: earlier actions the document itself refers to (id of an entry here, or an
#   object for actions before 2025 or by regulators we do not track).
# verified: date the entry was last checked against the document itself.
# ranking_keys: computed from failures (src/_lib/enforcement.js); set ranking_override with a note only when needed.
# repeat: true only when the document says the conduct continued after an earlier action
#   on the same failure (e.g. FinCEN calling a firm a recidivist).
# credits: amounts the regulator credits against its penalty for other regulators' penalties.
# parallel: other regulators' actions on the same conduct named in the document.
# status_note: what happened to the action later (e.g. terminated by the regulator), with the source.
# parallel_note: a parallel action known from the regulator's release rather than the document.
# requirements: what the order makes the firm do (lookbacks, programme fixes), with pins.
#   Used mainly for non-monetary orders; an entry needs findings or requirements.
