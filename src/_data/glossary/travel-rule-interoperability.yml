term: Travel Rule interoperability
abbr: null
also_known_as: [Protocol interoperability, Cross-network Travel Rule messaging]
cluster: crypto
definition: Travel Rule interoperability is the ability of providers on different Travel Rule protocols or networks to exchange originator and beneficiary data with each other. Without it, a provider can only send the required information to counterparties that use the same system.
seo_description: "Travel Rule interoperability lets providers on different protocols exchange Travel Rule data. The main protocols, what FATF and the EBA say, what to ask."
capability: null
