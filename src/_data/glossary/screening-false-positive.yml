term: False positive (AML screening)
also_known_as: [False hit, False alarm, False match]
cluster: aml
definition: In AML screening, a false positive is an alert that flags a customer or payment as a possible match to a sanctions, PEP or adverse media record, where review shows the person or entity is not the one listed. A false negative is the opposite, a real match the system missed.
seo_title: "What Is a False Positive in AML Screening? | BeVerified"
seo_description: "A false positive is a screening alert that turns out not to be a real match. Why they happen, how alerts are cleared and how to compare vendors."
rankings: [aml]
related: [fuzzy-name-matching, sanctions-screening, aml-case-management, transaction-monitoring, adverse-media-screening]
body: |
  ## Why false positives happen

  Screening tools are built to catch names that are close to a list entry, not only exact ones. [Fuzzy name matching](/glossary/fuzzy-name-matching/), common names and missing identifiers all produce alerts for people who merely share a name with someone on a list. OFAC acknowledges this. In [FAQ 5](https://ofac.treasury.gov/faqs/5), OFAC says that many potential matches identified through screening are false positives. It also describes "weak AKAs", broad or generic aliases on its list that may generate a large volume of false hits when run through a computer screening system.

  The same happens in transaction monitoring. The FCA's [Financial Crime Guide](https://www.handbook.fca.org.uk/handbook/FCG/3/2.html) notes that many alerts will be false alarms, particularly when generated by automated systems (FCG 3.2.5).

  False positives are a cost, not a compliance failure. A false negative, a true match the tool missed, is the failure. Any attempt to cut alert volumes has to be measured against that risk.

  ## How an alert is cleared

  OFAC's FAQ 5 sets out how to assess a potential match. Review the full list entry and compare the details: does the party have a different date of birth, identification number or nationality? If few details match, OFAC says the firm may be able to proceed. If several match, the firm moves on to its procedures for likely matches. OFAC also says it does not confirm potential matches or false positives, so the decision and its evidence stay with the firm.

  That evidence matters. The [FCA's sanctions guidance](https://www.handbook.fca.org.uk/handbook/FCG/7/2.html) lists as good practice having sufficient resources to identify false positives, and as poor practice having no audit trail of decisions where potential matches are judged to be false positives (FCG 7.2.4). This is the job of [AML case management](/glossary/aml-case-management/): each closed alert should show who reviewed it, what was compared and why it was closed.

  ## Reducing false positives without missing matches

  The levers are the threshold, the data and the workflow. A tighter threshold cuts alerts but raises the chance of a miss, which is why the FCA lists both "too sensitive" and "not sensitive enough" calibration as poor practice (FCG 7.2.3). Better customer data, such as a full date of birth and nationality, lets the tool rule out more alerts automatically. The workflow decides how often analysts see the same name twice: ask whether a cleared customer and list entry pair is suppressed until one of them changes, and how that suppression is logged.

  When you compare providers, ask for alert rates on data like yours, and ask how they show that a lower alert rate did not come from missing true matches. The [AML software ranking](/providers/aml/) compares reviewed providers.
buyer_questions:
  - What false positive rate do you see for customers like us, and how do you measure missed true matches at the same setting?
  - Which identifiers (date of birth, nationality, ID number, address) can the tool use to rule out an alert automatically, and is that rule logged?
  - "Once an analyst clears an alert, what stops the same customer and list entry from alerting again, and what makes it reopen?"
  - Can we see, for every closed alert, who reviewed it, what they compared and why they closed it?
  - Can we test a threshold or rule change on our historical data before it goes live?
faq:
  - q: What is a false positive in sanctions screening?
    a: It is an alert where a customer's name looks like a sanctioned person's name but, after review, the customer is a different person. OFAC says many potential matches from screening are false positives.
  - q: What is the difference between a false positive and a false negative?
    a: A false positive is an alert that turns out not to be a real match. A false negative is a real match that the system did not flag. False negatives are the failure that screening exists to prevent.
  - q: Will OFAC confirm whether a match is a false positive?
    a: No. OFAC's FAQ 5 states that it does not confirm potential matches or false positives to its sanctions lists, so firms make and document the decision themselves.
