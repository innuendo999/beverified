definition: A crypto-asset service provider (CASP) is the EU legal term, defined in MiCA, for a legal person or undertaking whose business is providing one or more crypto-asset services to clients on a professional basis and that is allowed to do so under Article 59 of MiCA.
seo_description: "A CASP is a firm authorised under the EU's MiCA Regulation to provide crypto-asset services. The ten services, authorisation, passporting and the 2026 deadline."
