body: |
  ## What a CASP does

  Article 3(1), point (15) of the Markets in Crypto-Assets Regulation, Regulation (EU) 2023/1114 ([MiCA](/glossary/mica/)), defines a crypto-asset service provider as a legal person or other undertaking whose occupation or business is the provision of one or more crypto-asset services to clients on a professional basis, and that is allowed to provide those services under Article 59.

  Point (16) lists ten crypto-asset services:

  - custody and administration of crypto-assets on behalf of clients;
  - operation of a trading platform for crypto-assets;
  - exchange of crypto-assets for funds;
  - exchange of crypto-assets for other crypto-assets;
  - execution of orders for crypto-assets on behalf of clients;
  - placing of crypto-assets;
  - reception and transmission of orders for crypto-assets on behalf of clients;
  - advice on crypto-assets;
  - portfolio management on crypto-assets;
  - transfer services for crypto-assets on behalf of clients.

  ## Authorisation and the end of the transitional period

  Under [Article 59](https://www.esma.europa.eu/publications-and-data/interactive-single-rulebook/mica/article-59-authorisation), only two kinds of firm may provide crypto-asset services in the EU: a legal person or other undertaking authorised as a CASP under Article 63, or an already regulated firm (such as a credit institution, investment firm, electronic money institution or fund manager) that is allowed to provide the services under Article 60. An authorised CASP can provide its services throughout the Union, through a branch or under the freedom to provide services.

  MiCA has applied in full since 30 December 2024. Article 143(3) let firms that provided crypto services under national law before that date continue until 1 July 2026 at the latest, or until their MiCA application was granted or refused, and Member States could shorten that period. In a [statement of 17 April 2026](https://www.esma.europa.eu/sites/default/files/2026-04/ESMA75-113276571-1679_Statement_on_the_end_of_transitional_periods_under_MiCA.pdf), ESMA said the transitional period would expire across the EU on 1 July 2026 and that any entity providing crypto-asset services to EU clients without a MiCA licence after that date would be in breach of EU law. ESMA tells consumers to check the ESMA Interim MiCA Register.

  ## CASPs and the Travel Rule

  MiCA covers authorisation and conduct. The anti-money laundering side comes from Regulation (EU) 2023/1113, the [Transfer of Funds Regulation](/glossary/transfer-of-funds-regulation/). It added CASPs to the definition of financial institution in Directive (EU) 2015/849 and requires them to send originator and beneficiary information with every crypto-asset transfer, the EU version of the [Travel Rule](/glossary/travel-rule/).

  CASP is the EU counterpart of the FATF's [virtual asset service provider](/glossary/virtual-asset-service-provider/). Our [MiCA guide](/guide/mica-regulation-guide/) covers capital, conduct rules and the register in more depth, and the [crypto KYC ranking](/providers/crypto/) compares providers that serve CASPs.
buyer_questions:
  - Which of our MiCA crypto-asset services does your onboarding and monitoring flow support, and which would need custom work?
  - Does your Travel Rule module meet Regulation (EU) 2023/1113 for transfers of any amount, including transfers to and from self-hosted addresses?
  - Can your product check whether a counterparty appears in the ESMA Interim MiCA Register?
  - Where is customer data stored and processed, and can it stay in the EU?
  - Which other EU CASPs use your product in production, and in which Member States?
faq:
  - q: What is a CASP under MiCA?
    a: A CASP is a legal person or undertaking that provides one or more of the ten crypto-asset services listed in MiCA to clients on a professional basis, and is allowed to do so under Article 59, either through CASP authorisation or as an already regulated firm under Article 60.
  - q: Can a CASP still operate under the MiCA transitional period?
    a: No. Article 143(3) set 1 July 2026 as the latest end date, and ESMA said that after that date any entity providing crypto-asset services to EU clients without a MiCA licence is in breach of EU law.
  - q: What is the difference between a CASP and a VASP?
    a: VASP is the FATF's global term with five activities. CASP is the EU legal term from MiCA, with ten listed services and an EU authorisation that can be passported across Member States.
