definition: The UK Money Laundering Regulations 2017 (SI 2017/692) are the main UK rules on customer due diligence and other anti-money laundering controls for banks, payment and crypto firms, accountants, lawyers, estate agents and other relevant persons. They came into force on 26 June 2017 and have been amended since.
seo_title: "What Are the UK Money Laundering Regulations 2017? | BeVerified"
seo_description: "The UK Money Laundering Regulations 2017 set CDD, EDD and PEP rules for regulated firms. Key regulations 27, 28, 33 and 35, 2026 changes and vendor questions."
