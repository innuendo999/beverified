definition: A virtual asset service provider (VASP) is the FATF term for any person or business that, for or on behalf of others, exchanges virtual assets for fiat or for other virtual assets, transfers them, keeps them safe, or provides financial services linked to a token issue.
seo_description: "A VASP is the FATF term for a business that exchanges, transfers or holds virtual assets for others. The five activities, licensing and the EU CASP link."
