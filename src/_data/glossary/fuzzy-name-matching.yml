term: Fuzzy name matching
also_known_as: [Fuzzy matching, Fuzzy logic name search, Approximate name matching]
cluster: aml
definition: Fuzzy name matching finds names that are similar to, but not exactly the same as, an entry on a sanctions, PEP or watch list, such as spelling variants, transliterations and typos. It gives each pair a similarity score, and pairs above a chosen threshold become alerts.
seo_description: "Fuzzy name matching flags names similar to a sanctions or PEP list entry. How scoring and thresholds work, what OFAC and the FCA say, and what to ask vendors."
rankings: [aml]
related: [sanctions-screening, screening-false-positive, politically-exposed-person, adverse-media-screening, aml-case-management]
body: |
  ## How fuzzy name matching works

  Names do not travel well. The same person can appear as Mohammed, Muhammad or Mohamed, with a middle name or without one, with family name first or last, or transliterated from Arabic, Cyrillic or Chinese script in several ways. An exact match would miss all of those, so screening tools compare names with algorithms that measure how close two strings are and return a score.

  OFAC's own free search tool is a public example of how this works. OFAC says Sanctions List Search uses fuzzy logic that combines character, string and phonetic matching, and only on the name field (FAQ 246). According to [OFAC FAQ 249](https://ofac.treasury.gov/faqs/249), it scores with two algorithms, Jaro-Winkler and Soundex, in two ways: once on the full name string and once on each part of the name, giving a composite score. It returns the higher of the two. A score of 100 means an exact match and lower scores are potential matches (FAQ 247). Commercial tools use their own methods and weightings, which is why the same name can score differently from one vendor to the next.

  ## The threshold decides the trade-off

  Every fuzzy matcher needs a threshold. Set it low and the tool flags more variants but buries analysts in [false positives](/glossary/screening-false-positive/). Set it high and alerts drop, but real matches with unusual spellings slip through. OFAC will not pick the number for you. In [FAQ 250](https://ofac.treasury.gov/faqs/250) it says it cannot recommend a specific match threshold score because each search has its own facts, and users must make their own determinations based on their internal risk assessments and compliance practices.

  The UK regulator's [Financial Crime Guide](https://www.handbook.fca.org.uk/handbook/FCG/7/2.html) puts this in terms of calibration. Good practice in FCG 7.2.3 includes automated systems that can make fuzzy matches to catch similar or variant spellings of names, and a firm that understands its screening tool and how it is calibrated. Poor practice includes calibration that is not tailored, so the system is either too sensitive or not sensitive enough, and not checking whether the number of hits is unexpectedly high or low.

  Some list entries are noisy by design. OFAC marks certain broad or generic aliases as "weak AKAs", which may generate a large volume of false hits. OFAC says it does not expect firms to screen for [weak AKAs](https://ofac.treasury.gov/faqs/topic/1646), but that they can help decide whether a hit from other information is accurate.

  ## What to check when you compare providers

  Ask the vendor to explain its matching in plain terms and to show why a given pair scored as it did. Check that you can set thresholds per list or customer segment, that every change is logged, and that you can test a new setting on your own data before you switch it on. Ask how the tool handles non-Latin scripts, name order, initials and missing names. Our [sanctions screening](/glossary/sanctions-screening/) entry covers the lists themselves, and the [AML software ranking](/providers/aml/) compares reviewed providers.
buyer_questions:
  - Which matching methods do you use (character, phonetic, transliteration, token order), and can you show why a specific pair matched?
  - Can we set different thresholds per list, per product or per customer risk level, and is every change logged with who made it?
  - Can we test a threshold change on our own historical data and see the effect on alert volumes and missed matches before going live?
  - How do you handle names in Arabic, Cyrillic, Chinese and other non-Latin scripts?
  - Do you use date of birth, nationality or other identifiers to score or suppress alerts, and how is that configured?
  - How do you treat weak aliases on the OFAC list?
faq:
  - q: What match score should we use for sanctions screening?
    a: There is no official number. OFAC says it cannot recommend a match threshold score and that users must set their own based on their risk assessment and compliance practices.
  - q: What algorithms are used for fuzzy name matching?
    a: Typical methods measure how similar the characters are, how similar the names sound, or both. OFAC's own Sanctions List Search uses Jaro-Winkler and Soundex and reports the higher of a full-name score and a name-part score.
  - q: Why does fuzzy matching create so many false positives?
    a: It is designed to flag names that are close but not identical, so common names and short or generic aliases match many people. Tuning the threshold and using other identifiers such as date of birth reduce the noise.
