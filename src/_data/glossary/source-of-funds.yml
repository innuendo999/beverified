term: Source of funds
abbr: SOF
also_known_as: [Origin of funds]
cluster: aml
definition: >-
  Source of funds (SOF) is the origin of the money used in a specific business relationship or transaction, such as a salary payment, a property sale or a loan. It differs from source of wealth (SOW), which is how the customer built up their total assets, for example through inheritance or savings.
seo_description: "Source of funds is where the money in a transaction comes from; source of wealth is how a customer built their assets. When FATF, EU and UK rules ask for each."
rankings: [aml]
related: [enhanced-due-diligence, politically-exposed-person, customer-due-diligence, transaction-monitoring, risk-based-approach]
body: |
  ## Source of funds and source of wealth

  The two terms are often used together, but they answer different questions. The European Banking Authority's [risk factor guidelines](https://www.eba.europa.eu/sites/default/files/document_library/Publications/Guidelines/2021/963637/Final%20Report%20on%20Guidelines%20on%20revised%20ML%20TF%20Risk%20Factors.pdf) define them in paragraph 12:

  - **Source of funds** "means the origin of the funds involved in a business relationship or occasional transaction."
  - **Source of wealth** "means the origin of the customer's total wealth, for example inheritance or savings."

  Take a customer who deposits 200,000 to buy an investment product. The source of funds is where that 200,000 came from, say the sale of a flat. The source of wealth is how the customer came to own the flat and the rest of their assets: a career, a business, an inheritance. Source of funds is narrow and tied to a transaction. Source of wealth is about the customer's whole financial picture.

  ## When the rules ask for each

  Source of funds is part of ordinary monitoring. [FATF Recommendation 10](https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html) says ongoing due diligence should check that transactions match the firm's knowledge of the customer, "including, where necessary, the source of funds". Article 13(1)(d) of Directive (EU) 2015/849 and [regulation 28(11)(a) of the UK Money Laundering Regulations 2017](https://www.legislation.gov.uk/uksi/2017/692/regulation/28) say the same.

  Source of wealth usually comes in with [enhanced due diligence](/glossary/enhanced-due-diligence/). Both are required in these cases:

  - **Politically exposed persons.** FATF Recommendation 12 asks firms to take "reasonable measures to establish the source of wealth and source of funds". The same duty appears in Article 20 of the EU directive and UK regulation 35(5)(b).
  - **High-risk third countries.** Article 18a(1) of the EU directive and UK regulation 33(3A)(c) require information on the source of funds and source of wealth of the customer and the beneficial owner.

  Under the EU AML Regulation, which applies from 10 July 2027, information on the source of funds and source of wealth is one of the enhanced due diligence measures listed in Article 34(4)(c). The Anti-Money Laundering Authority's draft standards, still at consultation stage, list tax declarations, pay slips, audited accounts and public deeds as examples of evidence.

  ## What to check when you compare providers

  Most AML tools do not verify source of funds on their own. They flag when it is needed, for example on a PEP match or an unusual transaction, and give analysts a place to request, store and review the evidence. Ask whether the product can collect documents from the customer inside the case, whether it separates source of funds from source of wealth in the record, and whether the analyst's conclusion is logged. Our [AML software ranking](/providers/aml/) compares reviewed providers.
buyer_questions:
  - At which points does your product flag that source of funds or source of wealth information is needed?
  - Can the customer upload supporting documents directly into the case, and how are they stored?
  - Does the case record keep source of funds and source of wealth as separate items with their own evidence and conclusion?
  - Can analysts compare the declared source of funds with the customer's actual transaction activity?
faq:
  - q: What is the difference between source of funds and source of wealth?
    a: Source of funds is the origin of the money in a specific relationship or transaction, such as the sale of a property. Source of wealth is the origin of the customer's total assets, such as inheritance, savings or business income.
  - q: When do banks ask for source of funds?
    a: As part of ongoing due diligence when a transaction does not fit what the bank knows about the customer, and routinely in enhanced due diligence cases such as politically exposed persons or customers linked to high-risk third countries.
  - q: What documents prove source of funds?
    a: It depends on where the money came from. AMLA's draft EU standards give tax declarations, pay slips, audited accounts and public deeds as examples.
