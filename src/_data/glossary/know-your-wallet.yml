term: Know Your Wallet
abbr: KYW
also_known_as: [Wallet screening, Wallet due diligence, Crypto address screening]
cluster: crypto
definition: Know Your Wallet (KYW) is an industry label for the checks a crypto business runs on a wallet address before it accepts or sends funds. It covers screening the address for links to sanctioned or illicit activity and, for self-hosted wallets, checking that the customer owns or controls it.
seo_title: "What Is Know Your Wallet (KYW)? | BeVerified"
seo_description: "Know Your Wallet (KYW): screening crypto addresses for sanctions and illicit links, and proving a customer controls a self-hosted wallet."
