term: AML case management
also_known_as: [Alert and case management, Financial crime case management, Investigation management]
cluster: aml
definition: AML case management is the part of a compliance system where analysts review alerts from screening and transaction monitoring, collect evidence, record a decision and, where needed, prepare a suspicious activity report. It holds the audit trail that shows supervisors how each alert was handled.
seo_description: "AML case management is where analysts review screening and monitoring alerts and record decisions. What UK, EU and US rules expect and what to ask vendors."
capability: case_management
rankings: [aml]
related: [transaction-monitoring, screening-false-positive, suspicious-activity-report, sanctions-screening, enhanced-due-diligence]
body: |
  ## How case management works

  Screening and monitoring tools produce alerts. Case management is what happens next. Alerts land in a queue, get assigned to an analyst, and are often grouped into one case per customer so the analyst sees the whole picture rather than ten separate hits. The analyst compares data, adds notes and documents, may ask the customer or the relationship manager for information, and then closes the case with a reason or escalates it. A second reviewer may check the decision. Escalated cases go to the money laundering reporting officer (the nominated officer in UK law), who decides whether to file a [suspicious activity report](/glossary/suspicious-activity-report/).

  A case management tool can be part of a screening or [transaction monitoring](/glossary/transaction-monitoring/) product, or a separate system that collects alerts from several sources.

  ## What regulators look for

  A case tool's main job is to keep a complete decision trail that can be retrieved years later. The FCA's [Financial Crime Guide](https://www.handbook.fca.org.uk/handbook/FCG/3/2.html) lists as good practice a clear process for documenting decisions and SARs that set out the reasons for suspicion in plain English (FCG 3.2.10). Poor practice includes a nominated officer who dismisses concerns escalated by staff without documenting reasons, and one who passes every internal report to the NCA without considering whether it is truly suspicious. On monitoring, the guide flags manual scrutiny of alerts that lacks resources and cannot cope (FCG 3.2.5A). For sanctions alerts, it lists as poor practice having no audit trail of decisions where potential matches are judged to be [false positives](/glossary/screening-false-positive/) (FCG 7.2.4).

  Retention periods set how long that trail must last. The EU [Anti-Money Laundering Directive](https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02015L0849-20240709) requires firms to keep customer due diligence records and supporting evidence and records of transactions for five years after the end of the business relationship or the occasional transaction (Article 40). In the US, banks keep a copy of each SAR and its supporting documentation for five years from the date of filing under [31 CFR 1020.320](https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1020/subpart-C/section-1020.320), and OFAC requires records of transactions subject to its rules to be available for at least 10 years.

  Access control matters too. A SAR and any information that would reveal its existence are confidential under US rules, and EU and UK law forbid tipping off the customer. Case files that hold SAR material need tighter permissions than ordinary customer records.

  ## What to check when you compare providers

  Look at how alerts from different tools come together, how cases are assigned and escalated, and whether every action is time-stamped and tied to a named user. Check the reporting too. A compliance lead will usually want backlog age, time to close and outcome by alert type, and a supervisor may ask for the same figures. The [AML software ranking](/providers/aml/) shows which reviewed providers include case management.
buyer_questions:
  - Can the case tool take alerts from screening, transaction monitoring and third-party systems, and group them by customer?
  - Is every action, note and status change time-stamped and tied to a named user, and can that audit trail be exported?
  - Can we set up four-eyes review, escalation paths and SLA timers ourselves?
  - How do you restrict access to cases that contain SAR information?
  - Can the tool prepare a SAR or STR in the format our financial intelligence unit uses, or do we re-key it?
  - How long do you retain closed cases, and can we set retention to match our legal obligations?
faq:
  - q: What is the difference between alert management and case management?
    a: Alert management is the triage of individual hits from screening or monitoring. Case management groups related alerts, holds the investigation and records the final decision, including whether a suspicious activity report was filed.
  - q: How long do AML case records have to be kept?
    a: It depends on the rule. The EU Directive sets five years after the end of the business relationship, US banks keep SARs and supporting documents for five years from filing, and OFAC requires transaction records to be available for at least 10 years.
  - q: Do we need a separate case management tool?
    a: Not necessarily. Some screening and monitoring products include one, and the provider table on this page shows which reviewed providers do. A separate tool makes sense when alerts come from several systems and need one queue and one audit trail.
