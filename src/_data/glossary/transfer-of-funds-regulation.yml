term: Transfer of Funds Regulation
abbr: TFR
also_known_as: [Regulation (EU) 2023/1113, EU Travel Rule]
cluster: standards
definition: The Transfer of Funds Regulation, Regulation (EU) 2023/1113, sets the information that must accompany transfers of funds and crypto-assets in the EU. It has applied since 30 December 2024 and requires crypto-asset service providers to send originator and beneficiary data with every crypto transfer, whatever the amount.
seo_description: "The EU Transfer of Funds Regulation (EU) 2023/1113 is the Travel Rule for crypto. Required data, no threshold, self-hosted wallets and the EUR 1,000 check."
seo_title: "What Is the Transfer of Funds Regulation (TFR)? | BeVerified"
