term: AML/CTF Act (Australia)
also_known_as: [Anti-Money Laundering and Counter-Terrorism Financing Act 2006, AML/CTF Act 2006, AML/CTF Amendment Act 2024]
cluster: standards
definition: The Anti-Money Laundering and Counter-Terrorism Financing Act 2006 is Australia's main AML law, enforced by AUSTRAC. It applies to businesses that provide designated services. Reforms passed in 2024 took effect for current reporting entities on 31 March 2026 and extend the law to lawyers, accountants and real estate from 1 July 2026.
seo_title: "What Is Australia's AML/CTF Act? | BeVerified"
seo_description: "Australia's AML/CTF Act 2006 and the 2024 reforms: 31 March and 1 July 2026 dates, tranche two, virtual assets, CDD changes and what to ask vendors."
rankings: [australia, aml]
