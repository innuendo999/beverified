body: |
  ## What IVMS 101 defines

  Under the [Travel Rule](/glossary/travel-rule/), the provider sending crypto passes the originator's and beneficiary's details to the receiving provider. IVMS 101 gives both sides the same vocabulary for that data. The current [IVMS 101.2023 standard](https://cdn.prod.website-files.com/648841abc97f28489cc3f2ce/6656e9c60c3029989dcd7431_IVMS101.2023%20interVASP%20data%20model%20standard.pdf) has six top-level entities: Originator, Beneficiary, OriginatingVASP, BeneficiaryVASP, TransferPath and PayloadMetadata. Each person is either a natural person or a legal person, with structured elements for names, geographic address, date and place of birth and national identification.

  The standard sets specific rules for names. Data is sent in UTF-8 and, unless otherwise specified, in Latin script. A name in another script is transliterated or translated, and a local-script version may be sent alongside it. The PayloadMetadata entity records which transliteration method was used.

  Section 3 of the standard lists what it does not cover: network protocols or the mode of transmission, information security, identification of VASPs, data privacy, storage of payload data, and verification or KYC status. Those are left to the messaging protocol and to each provider.

  ## Who maintains it

  According to [interVASP](https://intervasp.org/), IVMS 101 was developed by the Joint Working Group on interVASP Messaging Standards, formed in December 2019 with the support of the Chamber of Digital Commerce, Global Digital Finance and the International Digital Asset Exchange Association, and released in May 2020. In April 2023, GBBC Digital Finance (GDF), OpenVASP and VASPnet joined forces to maintain and develop it, and the interVASP Standards Working Group (ISWG) now carries that work. The standard's version table gives IVMS 101.2023 as published in August 2023, and interVASP says the ISWG released an update on 4 June 2024.

  The FATF's [12-month review of the virtual asset standards](https://www.fatf-gafi.org/media/fatf/documents/recommendations/12-Month-Review-Revised-FATF-Standards-Virtual-Assets-VASPS.pdf) (June 2020) noted in paragraph 41 that an industry initiative had developed "a first messaging standard which sets a common universal language for the communication of the required originator and beneficiary information between VASPs". In paragraph 65 it called the development of global messaging standards "a first step in ensuring that systems can be interoperable". The EBA's Travel Rule guidelines for the EU do not name a data standard.

  ## Common confusions

  IVMS 101 is not a protocol. Two providers can both "support IVMS 101" and still be unable to exchange data, because they sit on different networks or use different transport and security. That gap is what [Travel Rule interoperability](/glossary/travel-rule-interoperability/) is about. Version also matters: a FAQ published by the [OpenVASP Association](https://www.openvasp.org/trisa-openvasp-faq) in October 2026 notes that many implementations still use IVMS101.2020 variants, even though IVMS101.2023 was released in 2023.

  ## What to check when you compare providers

  Ask which IVMS 101 version the tool sends and accepts, how it maps your customer records into the structured fields, and what it does with names and addresses that do not fit. Our [Travel Rule ranking](/providers/travel-rule/) compares the reviewed providers.
buyer_questions:
  - Which IVMS 101 version do you send and accept, and do you convert between IVMS101.2020 and IVMS 101.2023 payloads?
  - How do you map our customer records, including legal entities, into IVMS 101 name and address fields?
  - How do you handle names in non-Latin scripts, and do you send the local-script name as well as the transliteration?
  - Do you validate incoming IVMS 101 payloads and flag missing or malformed fields before the transfer is released?
  - Which transport protocols carry your IVMS 101 messages, given that the standard itself does not cover transmission?
faq:
  - q: What does IVMS stand for?
    a: interVASP Messaging Standard. IVMS 101 is the data model for the originator and beneficiary information that virtual asset service providers exchange under the Travel Rule.
  - q: Is IVMS 101 a Travel Rule protocol?
    a: No. It defines the data fields and their format. Its scope section says network protocols, information security and identification of VASPs are outside it, so a separate messaging protocol carries the data.
  - q: What is the latest version of IVMS 101?
    a: interVASP presents IVMS 101.2023 as the current data model standard and says the interVASP Standards Working Group released an update on 4 June 2024.
