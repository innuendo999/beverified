definition: IVMS 101, the interVASP Messaging Standard 101, is a common data model for the originator and beneficiary information that virtual asset service providers exchange under the Travel Rule. It defines the fields and how to fill them, not how the message is sent between providers.
seo_description: "IVMS 101 is the common data model for Travel Rule originator and beneficiary data. What it covers, who maintains it, versions and what to ask vendors."
