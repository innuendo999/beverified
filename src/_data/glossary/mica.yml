body: |
  ## What MiCA covers

  [Article 1](https://www.esma.europa.eu/publications-and-data/interactive-single-rulebook/mica/article-1-subject-matter) of Regulation (EU) 2023/1114 says it lays down uniform requirements for the offer to the public and admission to trading of crypto-assets, of asset-referenced tokens and of e-money tokens, and requirements for [crypto-asset service providers](/glossary/crypto-asset-service-provider/). In particular, it sets:

  - transparency and disclosure rules for issuing, offering and admitting crypto-assets to trading;
  - authorisation and supervision rules for CASPs and for issuers of asset-referenced and e-money tokens;
  - protection for holders of crypto-assets and for clients of CASPs;
  - measures against insider dealing, unlawful disclosure of inside information and market manipulation.

  MiCA is meant for crypto-assets that existing EU financial services law does not already regulate. Its recitals say it excludes crypto-assets that qualify as financial instruments under Directive 2014/65/EU (MiFID II), which stay under securities rules.

  ## Key dates

  Under Article 149, Titles III and IV, the rules for asset-referenced tokens and e-money tokens, have applied since 30 June 2024. The rest of the Regulation has applied since 30 December 2024. Article 143(3) let firms already providing crypto services under national law carry on until 1 July 2026 at the latest. ESMA said in [April 2026](https://www.esma.europa.eu/sites/default/files/2026-04/ESMA75-113276571-1679_Statement_on_the_end_of_transitional_periods_under_MiCA.pdf) that after that date any entity providing crypto-asset services to EU clients without a MiCA licence is in breach of EU law.

  ## How MiCA relates to the Travel Rule

  MiCA is about authorisation, conduct and market integrity. The EU [Travel Rule](/glossary/travel-rule/) for crypto sits in a separate law, the [Transfer of Funds Regulation](/glossary/transfer-of-funds-regulation/), Regulation (EU) 2023/1113, which uses MiCA's definition of a CASP. A firm needs to meet both, so a KYC or Travel Rule vendor's "MiCA ready" claim is worth checking against the specific obligations it covers.

  For capital requirements, reverse solicitation, stablecoin rules and how to check the register, read our [MiCA regulation guide](/guide/mica-regulation-guide/). To compare vendors that serve crypto firms, see the [crypto KYC ranking](/providers/crypto/).
buyer_questions:
  - "When you say your product is \"MiCA ready\", which MiCA or TFR obligations does it cover, article by article?"
  - Which EU CASPs authorised under MiCA use your product in production?
  - Does your product support the Travel Rule data required by Regulation (EU) 2023/1113 alongside your onboarding checks?
faq:
  - q: When did MiCA come into force?
    a: MiCA rules for asset-referenced tokens and e-money tokens have applied since 30 June 2024, and the rest of the Regulation since 30 December 2024. The transitional period for firms operating under national law ended on 1 July 2026 at the latest.
  - q: Does MiCA include the Travel Rule?
    a: No. The EU Travel Rule for crypto is in Regulation (EU) 2023/1113, the Transfer of Funds Regulation. It applies to crypto-asset service providers as MiCA defines them.
