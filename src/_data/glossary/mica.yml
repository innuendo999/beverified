term: Markets in Crypto-Assets Regulation
abbr: MiCA
also_known_as: [MiCA, MiCAR, Regulation (EU) 2023/1114]
cluster: standards
definition: The Markets in Crypto-Assets Regulation (MiCA), Regulation (EU) 2023/1114, sets EU-wide rules for offering crypto-assets to the public, issuing asset-referenced and e-money tokens, and authorising and supervising crypto-asset service providers. It has applied in full since 30 December 2024.
seo_description: "MiCA, Regulation (EU) 2023/1114, is the EU rulebook for crypto-asset issuers and service providers. What it covers, key dates and its link to the Travel Rule."
seo_title: "What Is MiCA (Markets in Crypto-Assets Regulation)? | BeVerified"
