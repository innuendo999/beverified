term: Travel Rule
abbr: null
also_known_as: [Crypto Travel Rule, FATF Travel Rule, FATF Recommendation 16]
cluster: crypto
definition: The Travel Rule is the FATF requirement, set out in Recommendation 16, that the provider sending a transfer collects originator and beneficiary information and passes it to the receiving provider. Since 2019 it also covers virtual asset transfers between VASPs, which must send the data immediately and securely.
seo_description: "The Travel Rule makes crypto and payment providers send originator and beneficiary data with each transfer. FATF R.16, the EU TFR and what to ask vendors."
