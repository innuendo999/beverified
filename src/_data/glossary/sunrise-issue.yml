term: Sunrise issue
abbr: null
also_known_as: [Travel Rule sunrise issue, Sunrise problem]
cluster: crypto
definition: The sunrise issue is the gap that appears because countries bring in the Travel Rule at different times. A provider that must send or receive originator and beneficiary data can face a counterparty in a country where the rule is not yet in force, which may not be able to exchange that data.
seo_title: What Is the Travel Rule Sunrise Issue? | BeVerified
seo_description: "The sunrise issue is the Travel Rule gap between countries that apply it and those that do not yet. What FATF, the EU and the FCA say, and what to ask vendors."
capability: null
rankings: [travel-rule]
