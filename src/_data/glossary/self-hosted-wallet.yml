cluster: crypto
definition: A self-hosted wallet is a crypto wallet that the user controls directly, without an exchange or other service provider holding it for them. EU law calls its address a self-hosted address, meaning a distributed ledger address not linked to a crypto-asset service provider or a similar non-EU entity.
seo_description: "A self-hosted wallet is a crypto wallet no provider holds for the user. The EU TFR definition, the EUR 1,000 ownership check and what to ask vendors."
