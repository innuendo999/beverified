# Security incident tracker: one record per incident, newest first.
# Renders /incidents/ and the "Security incidents" block on each review (src/reviews.njk).
# Rules (owner, 2026-11-05): primary sources first (vendor statement, breach notice, regulator, court);
# claims from lawsuits are labelled as allegations; the vendor's own response sits next to each entry;
# same rules for every vendor, including affiliate and paid-link partners.
# Included: data breaches, data exposures, confirmed security incidents, regulatory actions.
# Not included: private lawsuits with no breach behind them (e.g. BIPA consent suits).
# counted: false = shown and noted, not deducted in the score (the reason is in `since`: test systems
# with no personal data, or older than the 24-month window scores use).
# type: breach | security_incident | exposure | credential_exposure | regulatory
# sensitivity: high (ID documents, biometrics, national ID numbers) | medium (contact or account data) | low (no personal data reported)
# status: contained | investigating | disputed | litigation | resolved
checked: '2026-11-05'
items:
- id: relycomply-2026-09
  slug: relycomply
  vendor: RelyComply
  date: '2026-09-16'
  occurred: 'Unauthorised access found 8 Sep 2026; disclosed 16 Sep 2026'
  type: security_incident
  sensitivity: high
  status: contained
  counted: true
  title: Zero-day in a third-party reporting tool led to data removal
  summary: An attacker used a zero-day vulnerability in a third-party application used for internal reporting, then used credentials obtained there to reach systems holding customer data. A forensic investigation that ended on 1 October 2026 confirmed data was removed but could not say which records.
  data: [Identity and contact details, Screening and risk data, Transaction data, Some ID verification records]
  scale: Not publicly disclosed
  response: RelyComply says it took affected systems offline and rebuilt them, reset credentials, retired the application involved, added MFA and monitoring, and reported the incident to South Africa's Information Regulator on 10 September 2026. It says there is no verified evidence of publication or misuse of the data.
  since: Notice last updated 2 November 2026; incident reported as contained, monitoring ongoing.
  sources:
  - title: 'RelyComply cyber incident: what happened and what you can do'
    publisher: RelyComply
    url: https://relycomply.com/relycomply-cyber-incident-what-happened-and-what-you-can-do/
    accessed: '2026-11'
- id: idmerit-2026-02
  slug: idmerit
  vendor: IDMERIT
  date: '2026-02-20'
  occurred: 'Reported 20 Feb 2026'
  type: exposure
  sensitivity: high
  status: disputed
  counted: true
  title: Researchers report an unsecured database linked to IDMERIT; the company disputes it
  summary: Cybernews researchers said they found an unsecured server they believed was tied to IDMERIT, with about 1 billion records containing personal data such as names, dates of birth, addresses and national ID numbers across at least 26 countries. The database was reportedly secured after disclosure.
  data: [Names and dates of birth, Addresses and contact details, National ID numbers]
  scale: About 1 billion records, as reported by Cybernews; not confirmed
  response: IDMERIT says it does not own or store customer data, that its review found no exposure or unauthorised access in its environment, and that the researcher asked for payment. Cybernews says its findings were legitimate.
  since: Disputed; the scope of the exposure has not been confirmed.
  sources:
  - title: IDMerit disputes report of 1B records exposed in unsecured ID verification database
    publisher: Biometric Update
    url: https://www.biometricupdate.com/202602/idmerit-disputes-report-of-1b-records-exposed-in-unsecured-id-verification-database
    accessed: '2026-11'
