  vendor: Sumsub
  date: '2026-02-04'
  occurred: 'Access from Jul 2024; found Jan 2026; disclosed 4 Feb 2026'
  type: security_incident
  sensitivity: medium
  status: contained
  counted: true
  title: Attacker in a support system went unnoticed for 18 months
  summary: An attacker entered a support-related internal environment through a malicious attachment sent via a third-party ticketing platform in July 2024. Sumsub found the activity in a security review in January 2026.
  data: [Names, Some email addresses or phone numbers]
  scale: A limited number of customer accounts, per Sumsub
  response: Sumsub says biometric data, ID document images and payment details were not accessed, that it engaged forensic experts, notified affected customers, and tightened support access controls and monitoring.
