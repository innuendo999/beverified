- id: veriff-2025-11
  slug: veriff
  vendor: Veriff
  date: '2025-12-10'
  occurred: 'Access around 18 Nov 2025; affected people listed 10 Dec 2025; notices from 9 Jan 2026'
  type: breach
  sensitivity: high
  status: litigation
  counted: true
  title: ID images of Total Wireless customers taken from Veriff's systems
  summary: Total Wireless, a Verizon prepaid brand, told customers that an unauthorised party obtained images of the government-issued IDs they gave Veriff for a promotion, and for some people their postal address and date of birth. Total Wireless says its own systems were not affected.
  data: [ID document images, Postal addresses, Dates of birth]
  scale: 8,583 people notified
  response: A Veriff spokesperson attributed the incident to phishing that captured a customer employee's credentials, said customers following its security recommendations were not affected, and urged SSO, IP allowlisting and least-privilege access. Total Wireless says Veriff secured its systems and hired a cybersecurity firm.
  since: Three class actions naming Veriff OÜ and Total Wireless were filed in the Southern District of New York in January 2026; the complaints allege the data was unencrypted. No settlement reported as of July 2026.
  news: /news/veriff-total-wireless-data-breach/
  sources:
  - title: Total Wireless notice of data breach (9 January 2026)
    publisher: Commonwealth of Massachusetts
    url: https://www.mass.gov/doc/2026-36-total-wireless/download
    accessed: '2026-11'
