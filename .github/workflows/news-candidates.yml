name: News candidates

# Daily collection of AML/KYC news candidates. Writes only to the `news-candidates`
# branch (never to main, so it never triggers a deploy). A drafting task reads
# news/candidates.json from that branch, writes one article and opens a PR.
# Spec: docs/news-pipeline.md

on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-candidates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check out the state branch
        run: |
          if git ls-remote --exit-code --heads origin news-candidates; then
            git fetch --depth 1 origin news-candidates
            git worktree add -B news-candidates state origin/news-candidates
          else
            git worktree add --orphan -b news-candidates state
          fi
      - name: Collect
        run: node scripts/news/collect.mjs --state state/news
      - name: Commit and push the state
        working-directory: state
        run: |
          git config user.name "beverified-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "News candidates $(date -u +%F)"
            git push origin news-candidates
          fi
      - name: Summary
        run: cat state/news/latest.md >> "$GITHUB_STEP_SUMMARY"
