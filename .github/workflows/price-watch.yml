name: Price watch

# Daily read of the vendor pricing pages our records cite (KYC cost calculator, Pricing Index, provider finder).
# Writes only to the `price-watch` branch (never to main, so it never triggers a deploy).
# A scheduled Claude task reads price-watch/latest.md once a week and opens a PR for the
# owner when a record needs a change. Spec: docs/price-watch.md

on:
  schedule:
    - cron: "37 5 * * *"   # 05:37 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check out the state branch
        run: |
          if git ls-remote --exit-code --heads origin price-watch; then
            git fetch --depth 1 origin price-watch
            git worktree add -B price-watch state origin/price-watch
          else
            git worktree add --orphan -b price-watch state
          fi
      - name: Watch
        run: node scripts/price-watch/watch.mjs --state state/price-watch
      - name: Commit and push the state
        working-directory: state
        run: |
          git config user.name "beverified-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-watch
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Price watch $(date -u +%F)"
            git push origin price-watch
          fi
      - name: Summary
        run: cat state/price-watch/latest.md >> "$GITHUB_STEP_SUMMARY"
